<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; min-height: 100%; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eef2f6; padding: 10px; box-sizing: border-box; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; align-items: start; }
  .unit {
    border-radius: 16px; padding: 12px 14px 10px; box-sizing: border-box;
    background: rgba(38, 42, 50, 0.6);
    backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 16px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .unit.fault { border-color: rgba(230, 90, 80, 0.75); }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #6fbf73; flex: none; }
  .unit.stale .dot { background: #8a9099; }
  .unit.warn .dot { background: #e0a020; }
  .unit.fault .dot { background: #e65a50; }
  .title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  .rows .k { color: rgba(220,226,232,.72); }
  .rows .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(111,191,115,.18); color: #a9e0ac; }
  .chip.bad { background: rgba(230,90,80,.22); color: #ffb3ac; }
  .chip.warn { background: rgba(224,160,32,.22); color: #f3cd7a; }
  .foot { margin-top: 8px; font-size: 11px; color: rgba(220,226,232,.6); }
  #msg { padding: 24px 12px; text-align: center; font-size: 14px; color: rgba(220,226,232,.8); }
</style>
</head>
<body>
<!--NRGDASH_TEXTS-->
<div id="grid"></div>
<div id="msg" style="display:none"></div>
<script>
function tr(s) { return (window.NRGDASH_TEXTS && window.NRGDASH_TEXTS[s]) || s; }
function fmt(s) { var a = Array.prototype.slice.call(arguments, 1), i = 0; return s.replace(/%[sd]/g, function () { return a[i++]; }); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function unitHtml(u) {
  var cls = 'unit' + (u.fault === true ? ' fault' : (u.filterWarn === true ? ' warn' : '')) + (u.stale ? ' stale' : '');
  var h = '<div class="' + cls + '"><div class="head"><span class="dot"></span><span class="title" title="' + esc(u.label) + '">' + esc(u.label) + '</span></div>';
  if (u.rows && u.rows.length) {
    h += '<div class="rows">' + u.rows.map(function (r) {
      return '<span class="k">' + esc(r.label) + '</span><span class="v">' + esc(r.text) + '</span>';
    }).join('') + '</div>';
  }
  var chips = '';
  if (u.fault === true) { chips += '<span class="chip bad">' + esc(tr('Fault')) + '</span>'; }
  else if (u.fault === false) { chips += '<span class="chip">' + esc(tr('No fault')) + '</span>'; }
  if (u.filterWarn === true) { chips += '<span class="chip warn">' + esc(tr('Filter change due')) + '</span>'; }
  else if (u.filterWarn === false) { chips += '<span class="chip">' + esc(tr('Filter OK')) + '</span>'; }
  if (chips) { h += '<div class="chips">' + chips + '</div>'; }
  if (u.stale) { h += '<div class="foot">' + esc(tr('Data may be outdated')) + '</div>'; }
  else if (u.seenAt) { h += '<div class="foot">' + esc(fmt(tr('As of %s'), new Date(u.seenAt * 1000).toLocaleTimeString())) + '</div>'; }
  return h + '</div>';
}

function handleMessage(data) {
  var p = data;
  if (typeof data === 'string') { try { p = JSON.parse(data); } catch (e) { return; } }
  if (!p) { return; }
  if (p.bg) { document.body.style.background = p.bg; }
  if (p.font) { document.body.style.fontFamily = p.font; }
  var grid = document.getElementById('grid'), msg = document.getElementById('msg');
  if (!p.ok) {
    grid.innerHTML = '';
    msg.textContent = p.error || tr('No data available.');
    msg.style.display = '';
    return;
  }
  msg.style.display = 'none';
  grid.innerHTML = (p.units || []).map(unitHtml).join('');
}
</script>
</body>
</html>
