<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* "Tahoe"-artige Frosted-Glass-Optik (Dietmars Vorbild: Apples aktuelle
     "Liquid Glass"-Formensprache), auf Map uebertragen von hier. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { position: relative; width: 100%; height: 100vh; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node-face { filter: drop-shadow(0 3px 8px rgba(0,0,0,.4)); }

  .label-pill {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; text-align: center;
    font-size: 13px; font-weight: 600; color: #eef2f6; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; box-sizing: border-box;
    background: rgba(38, 42, 50, 0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 16px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .label-pill.small { font-size: 11px; padding: 2px 8px; }
  .label-pill .hub-count { font-size: 9px; font-weight: 500; opacity: .75; }

  #status, #tooltip {
    position: absolute; z-index: 3;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 13px 0 11px; height: 26px; border-radius: 13px;
    background: rgba(38, 42, 50, 0.6);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 16px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
    font-size: 12px; font-weight: 600; color: rgba(220,226,232,.95);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status { left: 8px; bottom: 8px; max-width: calc(100% - 16px); }
  #tooltip {
    display: none; pointer-events: none; height: auto; line-height: 1.5;
    padding: 7px 14px; border-radius: 16px; flex-direction: column; align-items: flex-start;
  }
  #tooltip b { font-weight: 700; }
  #tooltip .tt-sub { opacity: .75; font-size: 10.5px; font-weight: 500; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #4caf50; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 13px; opacity: .75; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <svg id="svg" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gCenter" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#5b6b7a"/>
          <stop offset="100%" stop-color="#2a323c"/>
        </radialGradient>
      </defs>
      <g id="sectors"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="labels"></g>
    </svg>
    <div id="empty" class="empty" style="display:none"></div>
    <div id="status" style="display:none">
      <span id="dot" class="status-dot"></span>
      <span id="summaryText"></span>
    </div>
    <div id="tooltip"></div>
  </div>

  <script>
    var CX = 350, CY = 350;
    var R_TYPE = 190;    // Ring fuer Einzelinstanzen und Cluster-Hubs (z.B. "MeterHub (6)")
    var R_MEMBER = 300;  // Ring fuer einzelne Instanzen INNERHALB eines Clusters
    var CENTER_R = 56;
    var NODE_R = 44;       // Einzelinstanz / Cluster-Hub
    var MEMBER_R = 32;     // Cluster-Mitglied (kleiner, da mehrere pro Sektor)
    // noresponse (EMS 0.11.0): installiert, aber Vertragsfunktion antwortet
    // nicht - eigener Alarmfall, bewusst amber statt rot/grau, damit er sich
    // von "Fehlerstatus" (rot) und "geloescht" (grau) optisch abhebt.
    var STATUS_COLOR = { healthy: '#4caf50', unhealthy: '#e53935', missing: '#78828c', noresponse: '#ff9800' };
    var STATUS_DASH = { healthy: '0', unhealthy: '0', missing: '6,5', noresponse: '3,3' };

    // Anzeigename je Modul-Schluessel - Spiegelbild von MODULE_LABELS in
    // module.php (dort pro Einzelinstanz genutzt, hier zusaetzlich fuer
    // die Cluster-Hub-Beschriftung "MeterHub (6)" gebraucht).
    var MODULE_DISPLAY = {
      goodweet: 'GoodWe ET', inverterhub: 'InverterHub', meterhub: 'MeterHub',
      chargerhub: 'ChargerHub', heishamon: 'HeishaMon', tessie: 'Tessie',
      tibber: 'Tibber Grid Rewards'
    };

    var gradientCache = {};

    function svgEl(tag, attrs) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) { el.setAttribute(k, attrs[k]); }
      return el;
    }

    /**
     * Weicher Glas-Farbverlauf je Grundfarbe statt flachem Fill (Dietmars
     * "Tahoe"-Anregung, hier auf SVG-Radialverlaeufe uebertragen) -
     * Verlauf pro Farbe einmalig anlegen und wiederverwenden, damit die
     * <defs> bei vielen Knoten nicht unnoetig wachsen.
     */
    function glassGradient(defs, hexColor) {
      if (gradientCache[hexColor]) { return gradientCache[hexColor]; }
      var id = 'glass_' + hexColor.replace('#', '');
      var grad = svgEl('radialGradient', { id: id, cx: '32%', cy: '28%', r: '80%' });
      grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': lighten(hexColor, 0.35) }));
      grad.appendChild(svgEl('stop', { offset: '55%', 'stop-color': hexColor }));
      grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': darken(hexColor, 0.28) }));
      defs.appendChild(grad);
      gradientCache[hexColor] = id;
      return id;
    }
    function lighten(hex, amt) { return mixWhite(hex, amt); }
    function darken(hex, amt) { return mixBlack(hex, amt); }
    function mixWhite(hex, amt) {
      var c = hexToRgb(hex);
      return rgbToHex(c.r + (255 - c.r) * amt, c.g + (255 - c.g) * amt, c.b + (255 - c.b) * amt);
    }
    function mixBlack(hex, amt) {
      var c = hexToRgb(hex);
      return rgbToHex(c.r * (1 - amt), c.g * (1 - amt), c.b * (1 - amt));
    }
    function hexToRgb(hex) {
      var v = parseInt(hex.replace('#', ''), 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }
    function rgbToHex(r, g, b) {
      var h = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return '#' + h(r) + h(g) + h(b);
    }

    /**
     * Frosted-Glass-Label als <foreignObject> statt reinem SVG-<text> -
     * lebt in derselben Koordinatenwelt wie die Knoten, skaliert also
     * automatisch mit der SVG-viewBox mit, ohne eigene Bildschirm-Pixel-
     * Umrechnung.
     */
    function addLabelFO(parent, x, y, w, h, text, small, subCountText) {
      var fo = svgEl('foreignObject', { x: x - w / 2, y: y - h / 2, width: w, height: h });
      var div = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
      div.setAttribute('class', small ? 'label-pill small' : 'label-pill');
      var textSpan = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
      textSpan.textContent = text;
      div.appendChild(textSpan);
      if (subCountText) {
        var sub = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
        sub.setAttribute('class', 'hub-count');
        sub.textContent = subCountText;
        div.appendChild(sub);
      }
      fo.appendChild(div);
      parent.appendChild(fo);
      return fo;
    }

    /**
     * Dezente Sektor-Einfaerbung: eine flache, sehr transparente
     * Tortenstueck-Flaeche je Modul-Slot, damit die Gruppierung auch ohne
     * Verbindungslinien sofort erkennbar bleibt (Dietmars eigener
     * Vorschlag, hier aufgegriffen).
     */
    function addSectorTint(sectorsG, angle, halfWidth, color, outerR) {
      var innerR = 66;
      var steps = 10;
      var d = 'M ' + (CX + innerR * Math.cos(angle - halfWidth)) + ' ' + (CY + innerR * Math.sin(angle - halfWidth));
      for (var s = 0; s <= steps; s++) {
        var a = angle - halfWidth + (2 * halfWidth) * (s / steps);
        d += ' L ' + (CX + outerR * Math.cos(a)) + ' ' + (CY + outerR * Math.sin(a));
      }
      for (var s2 = steps; s2 >= 0; s2--) {
        var a2 = angle - halfWidth + (2 * halfWidth) * (s2 / steps);
        d += ' L ' + (CX + innerR * Math.cos(a2)) + ' ' + (CY + innerR * Math.sin(a2));
      }
      d += ' Z';
      sectorsG.appendChild(svgEl('path', { d: d, fill: color, opacity: 0.07 }));
    }

    /**
     * Hover-Tooltip (Muster: Map) - zeigt Bezeichnung, Modul und
     * Status/Instanzzahl beim Ueberfahren eines Knotens.
     */
    function attachTooltip(el, label, sub) {
      var tip = document.getElementById('tooltip');
      el.style.cursor = 'default';
      el.addEventListener('mousemove', function (e) {
        tip.innerHTML = '<b>' + label + '</b><span class="tt-sub">' + sub + '</span>';
        tip.style.left = (e.clientX + 16) + 'px';
        tip.style.top = (e.clientY + 16) + 'px';
        tip.style.display = 'inline-flex';
      });
      el.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    }

    function aggregateStatus(members) {
      if (members.some(function (m) { return m.status === 'noresponse'; })) { return 'noresponse'; }
      if (members.some(function (m) { return m.status === 'unhealthy'; })) { return 'unhealthy'; }
      if (members.some(function (m) { return m.status === 'missing'; })) { return 'missing'; }
      return 'healthy';
    }

    var STATUS_TEXT = { healthy: 'gesund', unhealthy: 'gestört', missing: 'gelöscht', noresponse: 'ohne Antwort' };

    /**
     * Zweistufiges Radial-Layout (Muster: geclusterte Radial-Layouts, z.B.
     * yFiles Radial Layout): EMS im Zentrum, EIN Slot je Partnermodul-Typ
     * auf dem Hauptring. Einzelinstanz-Module haengen direkt am Hauptring;
     * Module mit mehreren Instanzen (MeterHub, ChargerHub, Tessie, ...)
     * bekommen einen Cluster-Hub auf dem Hauptring, dessen Mitglieder
     * lokal in einem eigenen Sektor weiter aussen aufgefaechert werden.
     */
    function renderTopology(d) {
      var defs = document.querySelector('#svg defs');
      var sectorsG = document.getElementById('sectors');
      var edges = document.getElementById('edges');
      var nodesG = document.getElementById('nodes');
      var labelsG = document.getElementById('labels');
      sectorsG.innerHTML = ''; edges.innerHTML = ''; nodesG.innerHTML = ''; labelsG.innerHTML = '';

      // Zentrum (EMS)
      var centerCircle = svgEl('circle', { cx: CX, cy: CY, r: CENTER_R, fill: 'url(#gCenter)', stroke: 'rgba(255,255,255,.25)', 'stroke-width': 2, class: 'node-face' });
      nodesG.appendChild(centerCircle);
      attachTooltip(centerCircle, 'EMS', d.emsLabel || 'Verbund-Koordinator');
      addLabelFO(labelsG, CX, CY, 90, 34, 'EMS');

      var groups = []; var byModule = {};
      d.nodes.forEach(function (node) {
        if (!byModule[node.module]) {
          byModule[node.module] = { module: node.module, members: [] };
          groups.push(byModule[node.module]);
        }
        byModule[node.module].members.push(node);
      });

      var g = groups.length;
      groups.forEach(function (grp, i) {
        var angle = (g > 0) ? (2 * Math.PI * i / g) - Math.PI / 2 : 0;
        var hx = CX + R_TYPE * Math.cos(angle);
        var hy = CY + R_TYPE * Math.sin(angle);
        var isCluster = grp.members.length > 1;
        var hubStatus = isCluster ? aggregateStatus(grp.members) : grp.members[0].status;
        var hubColor = STATUS_COLOR[hubStatus] || STATUS_COLOR.missing;

        addSectorTint(sectorsG, angle, (2 * Math.PI / g) * 0.42, hubColor, isCluster ? R_MEMBER + 40 : R_TYPE + 30);

        edges.appendChild(svgEl('line', {
          x1: CX, y1: CY, x2: hx, y2: hy,
          stroke: hubColor, 'stroke-width': 2, opacity: hubStatus === 'missing' ? 0.5 : 0.85,
          'stroke-dasharray': STATUS_DASH[hubStatus] || '0'
        }));

        var gradId = glassGradient(defs, hubColor);
        var hubCircle = svgEl('circle', { cx: hx, cy: hy, r: NODE_R, fill: 'url(#' + gradId + ')', stroke: hubColor, 'stroke-width': 2, class: 'node-face' });
        nodesG.appendChild(hubCircle);

        var dotY = hy - NODE_R - 10;
        nodesG.appendChild(svgEl('circle', { cx: hx, cy: dotY, r: 5, fill: hubColor }));

        var hubLabelText = isCluster ? (MODULE_DISPLAY[grp.module] || grp.module) : grp.members[0].label;
        addLabelFO(labelsG, hx, hy, 130, isCluster ? 44 : 34, hubLabelText, false, isCluster ? (grp.members.length + ' Instanzen') : null);
        attachTooltip(hubCircle, hubLabelText, isCluster
          ? (grp.members.length + ' Instanzen · Status ' + STATUS_TEXT[hubStatus])
          : ('Status: ' + STATUS_TEXT[hubStatus]));

        if (isCluster) {
          var sectorWidth = (2 * Math.PI / g) * 0.7;
          var n = grp.members.length;
          grp.members.forEach(function (member, j) {
            var mAngle = (n > 1)
              ? (angle - sectorWidth / 2 + sectorWidth * (j / (n - 1)))
              : angle;
            var mx = CX + R_MEMBER * Math.cos(mAngle);
            var my = CY + R_MEMBER * Math.sin(mAngle);
            var mColor = STATUS_COLOR[member.status] || STATUS_COLOR.missing;

            edges.appendChild(svgEl('line', {
              x1: hx, y1: hy, x2: mx, y2: my,
              stroke: mColor, 'stroke-width': 1.5, opacity: member.status === 'missing' ? 0.5 : 0.75,
              'stroke-dasharray': STATUS_DASH[member.status] || '0'
            }));

            var mGradId = glassGradient(defs, mColor);
            var mCircle = svgEl('circle', { cx: mx, cy: my, r: MEMBER_R, fill: 'url(#' + mGradId + ')', stroke: mColor, 'stroke-width': 1.5, class: 'node-face' });
            nodesG.appendChild(mCircle);

            var mDotY = my - MEMBER_R - 8;
            nodesG.appendChild(svgEl('circle', { cx: mx, cy: mDotY, r: 4, fill: mColor }));

            addLabelFO(labelsG, mx, my, 100, 26, member.label, true);
            attachTooltip(mCircle, member.label, 'Status: ' + STATUS_TEXT[member.status]);
          });
        }
      });
    }

    function handleMessage(raw) {
      var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      var empty = document.getElementById('empty');
      var svg = document.getElementById('svg');
      var status = document.getElementById('status');

      if (d && d.bg) { document.body.style.background = d.bg; }
      if (d && d.font) { document.documentElement.style.setProperty('--font', d.font); document.body.style.fontFamily = d.font; }

      if (!d || !d.ok) {
        svg.style.display = 'none';
        status.style.display = 'none';
        empty.style.display = 'flex';
        empty.textContent = (d && d.error) || 'Keine Daten verfügbar.';
        return;
      }
      empty.style.display = 'none';
      svg.style.display = '';
      renderTopology(d);

      status.style.display = 'inline-flex';
      var dot = document.getElementById('dot');
      var allHealthy = d.total > 0 && d.healthy === d.total;
      dot.style.background = allHealthy ? '#4caf50' : (d.healthy > 0 ? '#c9a227' : '#e53935');
      document.getElementById('summaryText').textContent = d.summary || (d.healthy + '/' + d.total + ' Partnerinstanzen gesund');
    }
  </script>
</body>
</html>
