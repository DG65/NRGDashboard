<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* "Tahoe"-artige Frosted-Glass-Optik (Dietmars Vorbild: Apples aktuelle
     "Liquid Glass"-Formensprache), auf Map uebertragen von hier. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { position: relative; width: 100%; height: 100vh; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node-face { filter: drop-shadow(0 3px 8px rgba(0,0,0,.4)); }

  .label-pill {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; text-align: center;
    font-size: 13px; font-weight: 600; color: #eef2f6; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; box-sizing: border-box;
    background: rgba(38, 42, 50, 0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 16px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .label-pill.small { font-size: 11px; padding: 2px 8px; }
  .label-pill .hub-count { font-size: 9px; font-weight: 500; opacity: .75; }

  #status, #tooltip {
    position: absolute; z-index: 3;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 13px 0 11px; height: 26px; border-radius: 13px;
    background: rgba(38, 42, 50, 0.6);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 16px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
    font-size: 12px; font-weight: 600; color: rgba(220,226,232,.95);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status { left: 8px; bottom: 8px; max-width: calc(100% - 16px); }
  #tooltip {
    display: none; pointer-events: none; height: auto; line-height: 1.5;
    padding: 7px 14px; border-radius: 16px; flex-direction: column; align-items: flex-start;
  }
  #tooltip b { font-weight: 700; }
  #tooltip .tt-sub { opacity: .75; font-size: 10.5px; font-weight: 500; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #4caf50; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 13px; opacity: .75; }

  /* Einfuehrungs-Tour (29.08.2026, Dietmar: "eine Tour die bei der ersten
     Benutzung eingeblendet und nur per Haken ausgeblendet werden kann").
     Bewusst KEIN X/Escape zum Wegklicken - nur der Haken-Button am Ende
     jedes Schritts markiert die Tour als gesehen. Modul kennt keine
     --text/--textmuted/--nc-Variablen (anders als NRGDashboardTile) -
     Farben deshalb direkt an der bestehenden Frosted-Glass-Palette
     dieses Moduls ausgerichtet. */
  .tour-overlay {
    position: absolute; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,11,14,0.72);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .tour-overlay.show { display: flex; }
  .tour-card {
    max-width: 340px; width: calc(100% - 48px);
    padding: 18px 20px 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(60,64,72,0.97), rgba(28,30,36,0.97));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    color: #eef2f6;
  }
  .tour-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.2s ease, transform 0.2s ease; }
  .tour-dot.active { background: #6cb4ff; transform: scale(1.3); }
  .tour-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .tour-text { font-size: 12.5px; line-height: 1.5; color: rgba(220,226,232,.8); text-align: center; }
  .tour-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .tour-btn {
    padding: 7px 14px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.14);
    font-family: inherit; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.06); color: #eef2f6;
  }
  .tour-btn:hover { background: rgba(255,255,255,0.12); }
  .tour-btn-ghost { color: rgba(220,226,232,.8); }
  .tour-btn-accent { background: rgba(108,180,255,0.18); border-color: rgba(108,180,255,0.4); }
  .tour-btn-check { background: rgba(76,175,80,0.18); border-color: rgba(76,175,80,0.45); }
  .tour-btn[disabled] { opacity: 0.35; cursor: default; pointer-events: none; }
  /* Tour jederzeit selbst starten (01.09.2026) - siehe JS-Kommentar bei
     restartBtn. */
  /* Position/Groesse korrigiert (01.09.2026) - siehe NRGDashboardTile-
     CSS-Kommentar bei #tourRestartBtn (Kollision mit WebFronts nativem
     Doppelpfeil-Symbol oben rechts, Knopf zu unauffaellig). */
  #tourRestartBtn {
    position: fixed; bottom: 30px; left: 10px; z-index: 950;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4); background: rgba(20,22,26,.92);
    color: #eef2f6; font: inherit; font-size: 19px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: .9; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  #tourRestartBtn:hover { opacity: 1; background: rgba(255,255,255,.22); }
</style>
</head>
<body>
  <button id="tourRestartBtn" title="Einführungs-Tour anzeigen" type="button">?</button>
  <div class="wrap" id="wrap">
    <svg id="svg" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gCenter" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#5b6b7a"/>
          <stop offset="100%" stop-color="#2a323c"/>
        </radialGradient>
      </defs>
      <g id="sectors"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="labels"></g>
    </svg>
    <div id="empty" class="empty" style="display:none"></div>
    <div id="status" style="display:none">
      <span id="dot" class="status-dot"></span>
      <span id="summaryText"></span>
    </div>
    <div id="tooltip"></div>
  </div>

  <!-- Einfuehrungs-Tour (29.08.2026, Dietmar: "eine Tour die bei der ersten
       Benutzung eingeblendet und nur per Haken ausgeblendet werden kann").
       Bewusst KEIN X/Escape zum Wegklicken - nur der Haken-Button am Ende
       jedes Schritts markiert die Tour als gesehen. -->
  <div id="tourOverlay" class="tour-overlay">
    <div class="tour-card">
      <div class="tour-dots" id="tourDots"></div>
      <div class="tour-title" id="tourTitle"></div>
      <div class="tour-text" id="tourText"></div>
      <div class="tour-nav">
        <button type="button" class="tour-btn tour-btn-ghost" id="tourPrev">Zurück</button>
        <button type="button" class="tour-btn tour-btn-accent" id="tourNext">Weiter</button>
        <button type="button" class="tour-btn tour-btn-check" id="tourDone">✓ Verstanden, nicht mehr zeigen</button>
      </div>
    </div>
  </div>

  <script>
    // Knoten-/Kreisgroessen bleiben FEST (immer gleich lesbar, unabhaengig
    // von der Partneranzahl) - skaliert wird stattdessen der ABSTAND
    // zwischen den Knoten (Ringradien + Canvas/viewBox), siehe
    // computeLayout(). Dietmars Wunsch, 10.08.2026: "voll skalierbare
    // Darstellung" - bei 7 Partnern (urspruengliche Fassung) passte das
    // feste 700x700-Raster noch, bei 16 (nach EMS' PVF/LoadForecast/
    // StromGedacht-Ergaenzungen) ueberlappten sich Knoten UND die neuen,
    // textlaengen-abhaengig breiteren Label-Pillen (siehe addLabelFO())
    // massiv.
    var CENTER_R = 56;
    var NODE_R = 44;       // Einzelinstanz / Cluster-Hub
    var MEMBER_R = 32;     // Cluster-Mitglied (kleiner, da mehrere pro Sektor)
    // Mindest-Bogenlaenge (SVG-Einheiten) je Knoten auf seinem Ring - hier
    // wird die Skalierung tatsaechlich hergeleitet: bei mehr Knoten auf
    // einem Ring waechst dessen Radius, damit jeder Knoten weiterhin
    // mindestens so viel Platz um sich hat.
    var MIN_HUB_ARC = 175;
    var MIN_MEMBER_ARC = 115;
    var CANVAS_MARGIN = 150; // Luft fuer die breiteste Label-Pille am aeusseren Rand
    // noresponse (EMS 0.11.0): installiert, aber Vertragsfunktion antwortet
    // nicht - eigener Alarmfall, bewusst amber statt rot/grau, damit er sich
    // von "Fehlerstatus" (rot) und "geloescht" (grau) optisch abhebt.
    var STATUS_COLOR = { healthy: '#4caf50', unhealthy: '#e53935', missing: '#78828c', noresponse: '#ff9800' };
    var STATUS_DASH = { healthy: '0', unhealthy: '0', missing: '6,5', noresponse: '3,3' };

    // Anzeigename je Modul-Schluessel - Spiegelbild von MODULE_LABELS in
    // module.php (dort pro Einzelinstanz genutzt, hier zusaetzlich fuer
    // die Cluster-Hub-Beschriftung "MeterHub (6)" gebraucht).
    var MODULE_DISPLAY = {
      goodweet: 'GoodWe ET', inverterhub: 'InverterHub', meterhub: 'MeterHub',
      chargerhub: 'ChargerHub', heishamon: 'HeishaMon', tessie: 'Tessie',
      tibber: 'Tibber Grid Rewards', PVF: 'PV-Prognose'
    };

    var gradientCache = {};
    var HOOK_PATH = ''; // eigener WebHook-Pfad, aus dem Payload (module.php) - fuer die Tour-Bestaetigung per fetch().

    // Einfuehrungs-Tour bei erster Benutzung (29.08.2026, Dietmar: "eine
    // Tour die bei der ersten Benutzung eingeblendet und nur per Haken
    // ausgeblendet werden kann") - Muster/Wortlaut 1:1 aus NRGDashboardTile
    // uebernommen. TOUR_SHOWN_LOCAL verhindert erneutes Aufpoppen innerhalb
    // derselben Sitzung, bevor die Server-Bestaetigung zurueckkommt.
    var TOUR_SHOWN_LOCAL = false;
    var TOUR_STEP = 0;
    var TOUR_STEPS = [
      { title: 'Rechnet vorher aus, wie sie am besten hinpasst', text: 'Bevor diese Karte zeichnet, probiert sie automatisch alle Drehwinkel durch und wählt den, der die Kachelfläche am besten ausfüllt - jedes installierte Partnermodul erscheint dabei automatisch als eigener Knoten, ohne manuelle Verknüpfung.' },
      { title: 'Frosted-Glass-Optik', text: 'Beschriftungen und Flächen nutzen einen weichen Glas-Look (angelehnt an aktuelle Betriebssystem-Designsprachen) statt flacher Kästen - und leben in derselben Koordinatenwelt wie die Knoten, skalieren also automatisch mit, ohne eigene Pixel-Umrechnung.' },
      { title: 'Knoten bleiben immer gleich groß', text: 'Anders als man erwarten würde, schrumpfen die Knoten nicht mit steigender Modulanzahl - stattdessen wächst der Abstand zwischen ihnen. Die Karte bleibt dadurch bei 3 wie bei 15 Partnern gleich gut lesbar.' },
      { title: 'Lesbare Beschriftungen, egal wie lang', text: 'Kurze Namen wie „WB 1" bleiben kompakt, lange wie „InverterHub WR1 (GoodWe)" weiten die Beschriftung automatisch auf oder brechen zweizeilig um - statt wie sonst üblich einfach abgeschnitten zu werden.' },
      { title: 'Sektor-Einfärbung', text: 'Jede Modul-Kategorie bekommt eine dezente, transparente Tortenstück-Fläche im Hintergrund - die Gruppierung bleibt so auch ohne Verbindungslinien sofort erkennbar.' },
      { title: 'Details per Hover', text: 'Fahren Sie mit der Maus über einen Knoten, um weitere Informationen dazu einzublenden.' }
    ];

    function renderTour() {
      var dots = document.getElementById('tourDots');
      dots.innerHTML = '';
      TOUR_STEPS.forEach(function (_, i) {
        var d = document.createElement('div');
        d.className = 'tour-dot' + (i === TOUR_STEP ? ' active' : '');
        dots.appendChild(d);
      });
      var step = TOUR_STEPS[TOUR_STEP];
      document.getElementById('tourTitle').textContent = step.title;
      document.getElementById('tourText').textContent = step.text;
      var prevBtn = document.getElementById('tourPrev');
      var nextBtn = document.getElementById('tourNext');
      prevBtn.disabled = TOUR_STEP === 0;
      var isLast = TOUR_STEP === TOUR_STEPS.length - 1;
      nextBtn.style.display = isLast ? 'none' : '';
    }

    function showTourOverlay() {
      if (TOUR_SHOWN_LOCAL) { return; }
      TOUR_SHOWN_LOCAL = true;
      TOUR_STEP = 0;
      renderTour();
      document.getElementById('tourOverlay').classList.add('show');
    }

    // Bewusst KEIN X/Escape zum Wegklicken (Dietmar: "nur per Haken
    // ausgeblendet werden kann") - dismissTour() ist der EINZIGE Weg, die
    // Tour zu schliessen, und meldet das per WebHook an die Instanz zurueck.
    function dismissTour() {
      document.getElementById('tourOverlay').classList.remove('show');
      if (HOOK_PATH) {
        fetch(HOOK_PATH + '?dismissTour=1').catch(function () {});
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('tourPrev').addEventListener('click', function () {
        if (TOUR_STEP > 0) { TOUR_STEP--; renderTour(); }
      });
      document.getElementById('tourNext').addEventListener('click', function () {
        if (TOUR_STEP < TOUR_STEPS.length - 1) { TOUR_STEP++; renderTour(); }
      });
      document.getElementById('tourDone').addEventListener('click', dismissTour);
      // Manueller Neustart (01.09.2026, Dietmar: "jedem Gast ermoeglichen
      // die Tour zu starten" - Demo-Instanz teilt sich EINEN Login unter
      // allen Besuchern, TourSeen ist serverseitig geteilter Zustand).
      // Ignoriert TOUR_SHOWN_LOCAL bewusst.
      var restartBtn = document.getElementById('tourRestartBtn');
      if (restartBtn) {
        restartBtn.addEventListener('click', function () {
          TOUR_SHOWN_LOCAL = false;
          showTourOverlay();
        });
      }
    });

    function svgEl(tag, attrs) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) { el.setAttribute(k, attrs[k]); }
      return el;
    }

    /**
     * Weicher Glas-Farbverlauf je Grundfarbe statt flachem Fill (Dietmars
     * "Tahoe"-Anregung, hier auf SVG-Radialverlaeufe uebertragen) -
     * Verlauf pro Farbe einmalig anlegen und wiederverwenden, damit die
     * <defs> bei vielen Knoten nicht unnoetig wachsen.
     */
    function glassGradient(defs, hexColor) {
      if (gradientCache[hexColor]) { return gradientCache[hexColor]; }
      var id = 'glass_' + hexColor.replace('#', '');
      var grad = svgEl('radialGradient', { id: id, cx: '32%', cy: '28%', r: '80%' });
      grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': lighten(hexColor, 0.35) }));
      grad.appendChild(svgEl('stop', { offset: '55%', 'stop-color': hexColor }));
      grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': darken(hexColor, 0.28) }));
      defs.appendChild(grad);
      gradientCache[hexColor] = id;
      return id;
    }
    function lighten(hex, amt) { return mixWhite(hex, amt); }
    function darken(hex, amt) { return mixBlack(hex, amt); }
    function mixWhite(hex, amt) {
      var c = hexToRgb(hex);
      return rgbToHex(c.r + (255 - c.r) * amt, c.g + (255 - c.g) * amt, c.b + (255 - c.b) * amt);
    }
    function mixBlack(hex, amt) {
      var c = hexToRgb(hex);
      return rgbToHex(c.r * (1 - amt), c.g * (1 - amt), c.b * (1 - amt));
    }
    function hexToRgb(hex) {
      var v = parseInt(hex.replace('#', ''), 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }
    function rgbToHex(r, g, b) {
      var h = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return '#' + h(r) + h(g) + h(b);
    }

    /**
     * Frosted-Glass-Label als <foreignObject> statt reinem SVG-<text> -
     * lebt in derselben Koordinatenwelt wie die Knoten, skaliert also
     * automatisch mit der SVG-viewBox mit, ohne eigene Bildschirm-Pixel-
     * Umrechnung.
     */
    // Textbreite vorab messen (Canvas statt DOM-Reflow) - Beschriftungen
    // sollen sich der tatsaechlichen Laenge anpassen statt in einer fest
    // breiten "Pille" abgeschnitten zu werden (Dietmar, 09.08.2026: lange
    // Namen wie "Messung Netzanschluß - Inexogy" oder "InverterHub WR1
    // (GoodWe)" waren komplett unlesbar).
    var _measureCanvas = null;
    function measureTextWidth(text, fontPx) {
      if (!_measureCanvas) { _measureCanvas = document.createElement('canvas'); }
      var ctx = _measureCanvas.getContext('2d');
      ctx.font = '600 ' + fontPx + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      return ctx.measureText(text).width;
    }
    // w/h werden als MINDESTGROESSE behandelt (kurze Namen wie "WB 1"
    // sehen unveraendert aus) - erst bei laengerem Text waechst die Pille;
    // jenseits von maxWidth bricht der Text zweizeilig um (echte Pillenform
    // - volles border-radius - liest sich bei zwei Zeilen schlecht, deshalb
    // dann etwas eckiger).
    function addLabelFO(parent, x, y, w, h, text, small, subCountText) {
      var fontPx = small ? 11 : 13;
      var hPad = small ? 16 : 20; // .label-pill(.small) padding-left+right
      var maxWidth = small ? 170 : 220;
      var needed = measureTextWidth(text, fontPx) + hPad + 4;
      var wraps = needed > maxWidth;
      var width = Math.max(w, Math.min(needed, maxWidth));
      var height = wraps ? h + fontPx * 1.3 : h;
      var fo = svgEl('foreignObject', { x: x - width / 2, y: y - height / 2, width: width, height: height });
      var div = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
      div.setAttribute('class', small ? 'label-pill small' : 'label-pill');
      if (wraps) {
        div.style.whiteSpace = 'normal';
        div.style.wordBreak = 'break-word';
        div.style.borderRadius = '16px';
        div.style.lineHeight = '1.2';
      }
      var textSpan = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
      textSpan.textContent = text;
      div.appendChild(textSpan);
      if (subCountText) {
        var sub = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
        sub.setAttribute('class', 'hub-count');
        sub.textContent = subCountText;
        div.appendChild(sub);
      }
      fo.appendChild(div);
      parent.appendChild(fo);
      return fo;
    }

    /**
     * Dezente Sektor-Einfaerbung: eine flache, sehr transparente
     * Tortenstueck-Flaeche je Modul-Slot, damit die Gruppierung auch ohne
     * Verbindungslinien sofort erkennbar bleibt (Dietmars eigener
     * Vorschlag, hier aufgegriffen).
     */
    function addSectorTint(sectorsG, cx, cy, angle, halfWidth, color, outerR) {
      var innerR = 66;
      var steps = 10;
      var d = 'M ' + (cx + innerR * Math.cos(angle - halfWidth)) + ' ' + (cy + innerR * Math.sin(angle - halfWidth));
      for (var s = 0; s <= steps; s++) {
        var a = angle - halfWidth + (2 * halfWidth) * (s / steps);
        d += ' L ' + (cx + outerR * Math.cos(a)) + ' ' + (cy + outerR * Math.sin(a));
      }
      for (var s2 = steps; s2 >= 0; s2--) {
        var a2 = angle - halfWidth + (2 * halfWidth) * (s2 / steps);
        d += ' L ' + (cx + innerR * Math.cos(a2)) + ' ' + (cy + innerR * Math.sin(a2));
      }
      d += ' Z';
      sectorsG.appendChild(svgEl('path', { d: d, fill: color, opacity: 0.07 }));
    }

    /**
     * Hover-Tooltip (Muster: Map) - zeigt Bezeichnung, Modul und
     * Status/Instanzzahl beim Ueberfahren eines Knotens.
     */
    function attachTooltip(el, label, sub) {
      var tip = document.getElementById('tooltip');
      el.style.cursor = 'default';
      el.addEventListener('mousemove', function (e) {
        tip.innerHTML = '<b>' + label + '</b><span class="tt-sub">' + sub + '</span>';
        tip.style.left = (e.clientX + 16) + 'px';
        tip.style.top = (e.clientY + 16) + 'px';
        tip.style.display = 'inline-flex';
      });
      el.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    }

    function aggregateStatus(members) {
      if (members.some(function (m) { return m.status === 'noresponse'; })) { return 'noresponse'; }
      if (members.some(function (m) { return m.status === 'unhealthy'; })) { return 'unhealthy'; }
      if (members.some(function (m) { return m.status === 'missing'; })) { return 'missing'; }
      return 'healthy';
    }

    var STATUS_TEXT = { healthy: 'gesund', unhealthy: 'gestört', missing: 'gelöscht', noresponse: 'ohne Antwort' };

    /**
     * Zweistufiges Radial-Layout (Muster: geclusterte Radial-Layouts, z.B.
     * yFiles Radial Layout): EMS im Zentrum, EIN Slot je Partnermodul-Typ
     * auf dem Hauptring. Einzelinstanz-Module haengen direkt am Hauptring;
     * Module mit mehreren Instanzen (MeterHub, ChargerHub, Tessie, ...)
     * bekommen einen Cluster-Hub auf dem Hauptring, dessen Mitglieder
     * lokal in einem eigenen Sektor weiter aussen aufgefaechert werden.
     */
    /**
     * Layout VORAB berechnen (kein DOM-Zugriff) - Ringradien wachsen mit
     * der jeweiligen Knotenzahl, damit der Mindestabstand (MIN_HUB_ARC/
     * MIN_MEMBER_ARC) unabhaengig von der Partneranzahl erhalten bleibt.
     * Jeder Cluster bekommt seinen EIGENEN Mitglieder-Radius (nicht einen
     * globalen) - ein Cluster mit vielen Mitgliedern "blueht" dadurch
     * weiter nach aussen auf, ohne die anderen, kleineren Cluster unnoetig
     * mit nach aussen zu ziehen.
     */
    function computeLayout(groups, rotation) {
      rotation = rotation || 0;
      var g = groups.length;
      var rType = Math.max(190, (g * MIN_HUB_ARC) / (2 * Math.PI));
      var rMemberBase = rType + 110;
      var sectorAngle = (g > 0) ? (2 * Math.PI / g) : (2 * Math.PI);
      var sectorWidthMax = sectorAngle * 0.82;

      // Erst alle Positionen RELATIV ZUM URSPRUNG (EMS bei 0,0) bestimmen -
      // die tatsaechliche viewBox/Verschiebung nach CX/CY folgt danach aus
      // der ECHTEN Bounding-Box dieser Positionen (siehe unten), statt
      // pauschal ein Quadrat um den groessten vorkommenden Radius zu legen.
      // Ein einzelner breit auffaechernder Cluster soll nicht in JEDER
      // Richtung Leerraum erzwingen, nur weil ER in EINER Richtung viel
      // Platz braucht.
      var minX = 0, maxX = 0, minY = 0, maxY = 0;
      function extend(x, y, pad) {
        minX = Math.min(minX, x - pad); maxX = Math.max(maxX, x + pad);
        minY = Math.min(minY, y - pad); maxY = Math.max(maxY, y + pad);
      }
      extend(0, 0, CENTER_R + CANVAS_MARGIN * 0.6);

      var hubs = groups.map(function (grp, i) {
        var angle = (g > 0) ? (2 * Math.PI * i / g) - Math.PI / 2 + rotation : rotation;
        var hx = rType * Math.cos(angle), hy = rType * Math.sin(angle);
        var n = grp.members.length;
        var isCluster = n > 1;
        var rMember = rMemberBase, sectorWidth = 0, members = [];

        if (isCluster) {
          var neededArc = (n - 1) * MIN_MEMBER_ARC;
          rMember = Math.max(rMemberBase, neededArc / sectorWidthMax);
          sectorWidth = Math.min(sectorWidthMax, neededArc / rMember);
          for (var j = 0; j < n; j++) {
            var mAngle = (n > 1) ? (angle - sectorWidth / 2 + sectorWidth * (j / (n - 1))) : angle;
            var mx = rMember * Math.cos(mAngle), my = rMember * Math.sin(mAngle);
            members.push({ x: mx, y: my });
            extend(mx, my, MEMBER_R + CANVAS_MARGIN);
          }
        } else {
          extend(hx, hy, NODE_R + CANVAS_MARGIN);
        }
        extend(hx, hy, NODE_R + CANVAS_MARGIN * 0.5);

        return { angle: angle, x: hx, y: hy, isCluster: isCluster, rMember: rMember, sectorWidth: sectorWidth, members: members };
      });

      // Alles um (-minX, -minY) verschieben, damit die Bounding-Box bei
      // (0,0) beginnt - viewBox deckt dann exakt deren Breite/Hoehe ab,
      // kein erzwungenes Quadrat und kein unnoetiger Leerraum.
      var cx = -minX, cy = -minY;
      return { rType: rType, sectorAngle: sectorAngle, hubs: hubs, cx: cx, cy: cy, width: maxX - minX, height: maxY - minY };
    }

    /**
     * Beste Drehrichtung automatisch finden (Dietmar, 10.08.2026: "die
     * Visu soll den groessten Massstab abbilden koennen") - die radiale
     * Anordnung ist bei fester Knotenzahl zwar in ihrer Ausdehnung gleich
     * gross, ihre Bounding-Box aendert je nach Drehwinkel aber Breite/Hoehe
     * UND Seitenverhaeltnis (ein Cluster, der z.B. genau nach oben statt
     * schraeg auffaechert, erzeugt eine andere Box als schraeg nach oben).
     * "preserveAspectRatio=xMidYMid meet" skaliert auf min(containerW/
     * bboxW, containerH/bboxH) - je naeher das Bounding-Box-Seitenverhaeltnis
     * am tatsaechlichen Kachel-Seitenverhaeltnis liegt, desto groesser faellt
     * diese Skalierung aus (kein "Verschnitt" durch Letterboxing). Probiert
     * dafuer einfach alle 10 Grad durch - computeLayout() ist reine
     * Arithmetik ohne DOM-Zugriff, 36 Durchlaeufe sind vernachlaessigbar.
     */
    function findBestRotation(groups, containerW, containerH) {
      var bestRot = 0, bestScale = -1;
      for (var deg = 0; deg < 360; deg += 10) {
        var rot = deg * Math.PI / 180;
        var layout = computeLayout(groups, rot);
        var scale = Math.min(containerW / layout.width, containerH / layout.height);
        if (scale > bestScale) { bestScale = scale; bestRot = rot; }
      }
      return bestRot;
    }

    function renderTopology(d) {
      var defs = document.querySelector('#svg defs');
      var sectorsG = document.getElementById('sectors');
      var edges = document.getElementById('edges');
      var nodesG = document.getElementById('nodes');
      var labelsG = document.getElementById('labels');
      sectorsG.innerHTML = ''; edges.innerHTML = ''; nodesG.innerHTML = ''; labelsG.innerHTML = '';

      var groups = []; var byModule = {};
      d.nodes.forEach(function (node) {
        if (!byModule[node.module]) {
          byModule[node.module] = { module: node.module, members: [] };
          groups.push(byModule[node.module]);
        }
        byModule[node.module].members.push(node);
      });

      // Tatsaechliche Kachelgroesse (nicht die interne SVG-Koordinaten-
      // groesse) - bestimmt, welches Seitenverhaeltnis der Bounding-Box
      // den groessten Massstab ergibt. Fallback 1:1, falls die Kachel noch
      // keine Groesse hat (z.B. erster Aufruf vor dem ersten Layout-Pass).
      var wrapRect = document.getElementById('wrap').getBoundingClientRect();
      var containerW = wrapRect.width || 1, containerH = wrapRect.height || containerW;
      var rotation = findBestRotation(groups, containerW, containerH);

      var layout = computeLayout(groups, rotation);
      var CX = layout.cx, CY = layout.cy;
      document.getElementById('svg').setAttribute('viewBox', '0 0 ' + layout.width + ' ' + layout.height);

      // Zentrum (EMS)
      var centerCircle = svgEl('circle', { cx: CX, cy: CY, r: CENTER_R, fill: 'url(#gCenter)', stroke: 'rgba(255,255,255,.25)', 'stroke-width': 2, class: 'node-face' });
      nodesG.appendChild(centerCircle);
      attachTooltip(centerCircle, 'EMS', d.emsLabel || 'Verbund-Koordinator');
      addLabelFO(labelsG, CX, CY, 90, 34, 'EMS');

      groups.forEach(function (grp, i) {
        var hub = layout.hubs[i];
        var angle = hub.angle;
        var hx = CX + hub.x, hy = CY + hub.y;
        var isCluster = hub.isCluster;
        var hubStatus = isCluster ? aggregateStatus(grp.members) : grp.members[0].status;
        var hubColor = STATUS_COLOR[hubStatus] || STATUS_COLOR.missing;

        addSectorTint(sectorsG, CX, CY, angle, layout.sectorAngle * 0.42, hubColor, isCluster ? hub.rMember + 40 : layout.rType + 30);

        edges.appendChild(svgEl('line', {
          x1: CX, y1: CY, x2: hx, y2: hy,
          stroke: hubColor, 'stroke-width': 2, opacity: hubStatus === 'missing' ? 0.5 : 0.85,
          'stroke-dasharray': STATUS_DASH[hubStatus] || '0'
        }));

        var gradId = glassGradient(defs, hubColor);
        var hubCircle = svgEl('circle', { cx: hx, cy: hy, r: NODE_R, fill: 'url(#' + gradId + ')', stroke: hubColor, 'stroke-width': 2, class: 'node-face' });
        nodesG.appendChild(hubCircle);

        var dotY = hy - NODE_R - 10;
        nodesG.appendChild(svgEl('circle', { cx: hx, cy: dotY, r: 5, fill: hubColor }));

        var hubLabelText = isCluster ? (MODULE_DISPLAY[grp.module] || grp.module) : grp.members[0].label;
        addLabelFO(labelsG, hx, hy, 130, isCluster ? 44 : 34, hubLabelText, false, isCluster ? (grp.members.length + ' Instanzen') : null);
        attachTooltip(hubCircle, hubLabelText, isCluster
          ? (grp.members.length + ' Instanzen · Status ' + STATUS_TEXT[hubStatus])
          : ('Status: ' + STATUS_TEXT[hubStatus]));

        if (isCluster) {
          grp.members.forEach(function (member, j) {
            var mx = CX + hub.members[j].x, my = CY + hub.members[j].y;
            var mColor = STATUS_COLOR[member.status] || STATUS_COLOR.missing;

            edges.appendChild(svgEl('line', {
              x1: hx, y1: hy, x2: mx, y2: my,
              stroke: mColor, 'stroke-width': 1.5, opacity: member.status === 'missing' ? 0.5 : 0.75,
              'stroke-dasharray': STATUS_DASH[member.status] || '0'
            }));

            var mGradId = glassGradient(defs, mColor);
            var mCircle = svgEl('circle', { cx: mx, cy: my, r: MEMBER_R, fill: 'url(#' + mGradId + ')', stroke: mColor, 'stroke-width': 1.5, class: 'node-face' });
            nodesG.appendChild(mCircle);

            var mDotY = my - MEMBER_R - 8;
            nodesG.appendChild(svgEl('circle', { cx: mx, cy: mDotY, r: 4, fill: mColor }));

            addLabelFO(labelsG, mx, my, 100, 26, member.label, true);
            attachTooltip(mCircle, member.label, 'Status: ' + STATUS_TEXT[member.status]);
          });
        }
      });
    }

    function handleMessage(raw) {
      var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      var empty = document.getElementById('empty');
      var svg = document.getElementById('svg');
      var status = document.getElementById('status');

      if (d && d.bg) { document.body.style.background = d.bg; }
      if (d && d.font) { document.documentElement.style.setProperty('--font', d.font); document.body.style.fontFamily = d.font; }
      if (d && d.hookPath) { HOOK_PATH = d.hookPath; }
      if (d && d.showTour) { showTourOverlay(); }

      if (!d || !d.ok) {
        svg.style.display = 'none';
        status.style.display = 'none';
        empty.style.display = 'flex';
        empty.textContent = (d && d.error) || 'Keine Daten verfügbar.';
        return;
      }
      empty.style.display = 'none';
      svg.style.display = '';
      renderTopology(d);

      status.style.display = 'inline-flex';
      var dot = document.getElementById('dot');
      var allHealthy = d.total > 0 && d.healthy === d.total;
      dot.style.background = allHealthy ? '#4caf50' : (d.healthy > 0 ? '#c9a227' : '#e53935');
      document.getElementById('summaryText').textContent = d.summary || (d.healthy + '/' + d.total + ' Partnerinstanzen gesund');
    }
  </script>
</body>
