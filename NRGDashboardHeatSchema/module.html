<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .unit { padding: 10px 12px; }
  .unit-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  svg.schema { width: 100%; height: auto; display: block; }
  /* Bei GENAU einer Waermepumpe (der uebliche Fall) soll die Zeichnung
     die Kachel komplett ausfuellen und mittig sitzen, egal wie die
     Kachel selbst gerade zugeschnitten ist (Dietmar, 16.08.2026: "die
     Darstellung ist nicht in der Kachelmitte ... skaliert nur in
     horizontaler Richtung ... am unteren Kachelrand wird die
     Darstellung ausgeblendet"). "width:100%; height:auto" (oben)
     berechnet die Hoehe NUR aus der Breite - passt das Kachel-
     Seitenverhaeltnis nicht zum viewBox-Seitenverhaeltnis, ragt die
     Zeichnung entweder ueber den unteren Rand hinaus (abgeschnitten,
     #wrap hat overflow-y) oder haengt oben/links statt mittig. "single"
     schaltet stattdessen auf volle Breite UND Hoehe um, das SVG selbst
     regelt dank viewBox + preserveAspectRatio="xMidYMid meet" die
     Skalierung UND Zentrierung in beiden Richtungen. Bei MEHREREN
     Waermepumpen bleibt die bisherige scrollende Stapel-Darstellung
     (mehrere Diagramme untereinander koennen nicht gleichzeitig beide
     Kachel-Dimensionen ausfuellen). */
  #units.single { height: 100%; }
  .unit.fill { padding: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .unit.fill svg.schema { width: 100%; height: 100%; }

  /* Stil-Essenz aus fuenf Referenzbildern (Aquarea-Wiki, Solvis, iDM,
     Bernhard Baptists "Wärmepumpe Visu", OekoFEN/Solar-Visu; mit Dietmar
     am 14.08.2026 destilliert):
     1. Werte in kleinen umrandeten Chips DIREKT an der Leitung, Randfarbe
        = Leitungs-/Temperaturfarbe.
     2. Speicher mit kraeftigem Rot-nach-Blau-Verlauf und sauber
        geschwungener Rohrschlangen-Wicklung.
     3. Pumpen als Kreis+Dreieck, Zustand ueber FUELLFARBE (gruen=laeuft).
     4. Leitungsfarbe = Funktion (rot Vorlauf, blau Ruecklauf, grau
        inaktiv), rechtwinklige Fuehrung.
     5. Grosszuegige Flaeche, Luft zwischen den Elementen.
     Tankgroessen proportional zur REALEN Anlage (Dietmar: 185l WW-Tank
     muss groesser sein als 100l Puffer - Referenzanlagen mit 800-2000l
     Speichern sind kein Massstab fuer seine Verhaeltnisse). */
  /* Hell/Dunkel wie bei den uebrigen Kacheln: Symcon bietet der Kachel
     KEINE Theme-Erkennung an, deshalb setzt der Nutzer "LightTheme" im
     Formular (Darstellung) - identisch zu NRGDashboardMonitor. Alle
     flaechigen Farben liegen als Variablen vor, die Medienfarben (rot
     Vorlauf, blau Ruecklauf, Amber Kaeltemittel) bleiben in beiden
     Themes gleich, damit die Ableselogik identisch bleibt. */
  :root {
    --surface: rgba(255,255,255,.05); --surface-deep: rgba(0,0,0,.42);
    --line: #6f83a3; --draw: #8a9cb8; --ink: #eef2f6; --ink-dim: #93a3bd;
    --ink-unit: #a8b4c8; --pipe-off: #4a556e; --pump-off: #2c3a52;
  }
  body.light {
    --surface: rgba(0,0,0,.035); --surface-deep: rgba(255,255,255,.88);
    --line: #9aa8bd; --draw: #6b7d96; --ink: #1a2536; --ink-dim: #5c6a80;
    --ink-unit: #5c6a80; --pipe-off: #c0cad8; --pump-off: #e4e9f0;
  }
  .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .box-title { font-size: 11px; font-weight: 700; fill: var(--ink); text-anchor: middle; letter-spacing: .4px; }

  .pipe-hot { stroke: #e0503c; }
  .pipe-cold { stroke: #4a90d9; }
  .pipe { fill: none; stroke-width: 5; stroke-linecap: butt; stroke-linejoin: round; }
  .pipe.dim { stroke: var(--pipe-off); }
  .pipe.flowing.pipe-hot { filter: drop-shadow(0 0 3px rgba(224,80,60,.7)); }
  .pipe.flowing.pipe-cold { filter: drop-shadow(0 0 3px rgba(74,144,217,.7)); }

  /* Fluss-Animation: weicher, organischer Wellenverlauf statt mechanischer
     Punktreihe (Dietmar, 16.08.2026) - unregelmaessig lange/kurze Segmente
     statt gleichfoermiger Punkte, leichte Unschaerfe fuer einen weichen statt
     harten Rand. Zweilagig wie zuvor: Basisrohr voll, Wellenlage animiert,
     Richtung folgt der Zeichenrichtung des Pfads.
     --flow-mult (Geschwindigkeit) und --flow-ease (Bewegungsart) sind
     eigene, von der Optik UNABHAENGIGE Variablen (Dietmar, 16.08.2026:
     "einmal so wie die Organische Welle und der Fluessigkeitsglanz
     laeuft, oder ... laufe konstant, du koenntest sogar noch die
     Geschwindigkeit zur Auswahl stellen") - handleMessage() setzt sie
     als CSS Custom Properties auf <html>, damit sich Optik (FlowStyle),
     Bewegungsart (FlowMotion: atmend/konstant) und Geschwindigkeit
     (FlowSpeed) frei miteinander kombinieren lassen, statt fuer jede
     Kombination eine eigene Optionen-Zeile zu brauchen. Jeder Stil
     definiert nur seine EIGENE Basisdauer (unterschiedlicher Charakter:
     Punkte laufen schneller als die breite Fluessigkeits-Schliere),
     skaliert per calc() mit dem gemeinsamen Multiplikator. */
  :root { --flow-mult: 1; --flow-ease: ease-in-out; }
  .pipe-dots {
    fill: none; stroke: var(--dots, rgba(255,255,255,.8)); stroke-width: 3;
    stroke-linecap: round; stroke-dasharray: 1 7 5 9; opacity: 0.85;
    filter: blur(0.5px); animation-name: flowwave;
    animation-duration: calc(2.2s * var(--flow-mult));
    animation-timing-function: var(--flow-ease); animation-iteration-count: infinite;
  }
  @keyframes flowwave { to { stroke-dashoffset: -44; } }
  /* Mehrere Wasserfluss-Darstellungen zur Auswahl (Dietmar, 16.08.2026)
     - ueber die Variable "FlowStyle" (Schalter/Auswahl in der
     aufgezogenen Kachelansicht, siehe module.php) statt Formular-
     Property, gleicher Grund wie bei den Emitter-Schaltern: das
     Aufziehen zeigt nur Instanz-Variablen, kein eigenes HTML. Default
     (keine body-Klasse) bleibt die bisherige organische Welle.
     "flow-dots": die urspruengliche, gleichfoermige Punktreihe vor der
     Welle. "flow-dash": kurze durchgehende Striche, schnellere,
     "technischere" Anmutung. Beide folgen wie die Welle/der
     Fluessigkeitsglanz "--flow-ease" (Dietmar, 16.08.2026: "warum geht
     Atmend weder fuer gleichmaessige Punkte noch fuer fliessende
     Striche? Wenn ich es aktivieren kann, dann sollte es auch
     funktionieren" - zu Recht, ein erster Versuch hatte sie fest auf
     linear verdrahtet, obwohl die Bewegungsart-Auswahl keine
     Einschraenkung auf bestimmte Stile macht). "flow-liquid": breite,
     weiche, glaenzende Schliere statt
     einzelner Punkte/Striche (Dietmar, 16.08.2026: "den Bender Stil" -
     wiederkehrender Wunsch nach einer fluessigeren Wasser-Textur wie in
     einer 3D-Fluidsimulation) - da echte Fluiddynamik im Rahmen von
     reinem SVG/CSS nicht sinnvoll nachbildbar ist, simuliert ein
     breiter, stark verwaschener, gleitender Glanzstreifen ueber der
     farbig gefuellten Basis-Leitung eine fliessende, glaenzende
     Oberflaeche statt einzelner Wassertropfen. */
  body.flow-dots .pipe-dots {
    stroke-dasharray: 0.1 14; opacity: 1; filter: none;
    animation-name: flowdots; animation-duration: calc(1s * var(--flow-mult));
    animation-timing-function: var(--flow-ease); animation-iteration-count: infinite;
  }
  @keyframes flowdots { to { stroke-dashoffset: -28; } }
  body.flow-dash .pipe-dots {
    stroke-dasharray: 6 6; opacity: 0.9; filter: none;
    animation-name: flowdash; animation-duration: calc(0.9s * var(--flow-mult));
    animation-timing-function: var(--flow-ease); animation-iteration-count: infinite;
  }
  @keyframes flowdash { to { stroke-dashoffset: -24; } }
  body.flow-liquid .pipe-dots {
    stroke-width: 5; stroke-dasharray: 26 22; opacity: 0.8;
    filter: blur(2px); animation-name: flowliquid;
    animation-duration: calc(1.9s * var(--flow-mult));
    animation-timing-function: var(--flow-ease); animation-iteration-count: infinite;
  }
  @keyframes flowliquid { to { stroke-dashoffset: -48; } }
  @keyframes fanspin { to { transform: rotate(360deg); } }
  @keyframes pumpspin { to { transform: rotate(360deg); } }

  /* Kaeltemittelleitung: gleiche Optik/Animation wie die Wasserrohre
     (volles Basisrohr + wandernde helle Punkte + Glow), nur in Amber als
     Medium-Kennfarbe (Dietmar, 14.08.2026: "gleiches visuelles Aussehen
     und Animation wie die Wasserleitung"). */
  /* Kuehlbetrieb: der Vorlauf ist die KAELTERE Leitung, der Ruecklauf nur
     leicht waermer - ihn rot zu faerben waere schlicht falsch (Dietmar,
     14.08.2026: "die WP kuehlt"). */
  .pipe-cool-return { stroke: #7d9dc4; }
  .pipe.flowing.pipe-cool-return { filter: drop-shadow(0 0 3px rgba(125,157,196,.7)); }
  .pipe-refr-hot { stroke: #d98a3c; }
  .pipe-refr-cold { stroke: #6e9ab8; }
  .pipe.flowing.pipe-refr-hot { filter: drop-shadow(0 0 3px rgba(217,138,60,.7)); }
  .pipe.flowing.pipe-refr-cold { filter: drop-shadow(0 0 3px rgba(110,154,184,.7)); }

  /* Werte-Chip: dunkle Pille, Randfarbe = Mess-/Leitungsfarbe, Wert in
     Weiss - kleine, praezise Instrumentenanzeige statt frei schwebendem
     Text (Prinzip 1). */
  .chip { fill: var(--surface-deep); stroke-width: 1.5; }
  .chip-text { font: 700 12px/1 -apple-system, sans-serif; fill: var(--ink); text-anchor: middle; }
  .chip-unit { font-weight: 500; font-size: 9.5px; fill: var(--ink-unit); }
  .chip-tag { font-size: 8.5px; font-weight: 600; fill: var(--ink-dim); letter-spacing: .35px; text-transform: uppercase; text-anchor: middle; }

  .tank-outline { fill: none; stroke: var(--draw); stroke-width: 1.5; }
  .tank-label { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  .tank-liters { font-size: 10px; font-weight: 700; fill: rgba(255,255,255,.9); text-anchor: middle; }
  .tank-coil { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1.6; }

  .valve { fill: none; stroke: var(--draw); stroke-width: 1.6; stroke-linejoin: round; }
  .badge { font-size: 9px; font-weight: 700; text-anchor: middle; }
  .tag { font-size: 8.5px; font-weight: 600; fill: var(--ink-dim); letter-spacing: .3px; text-transform: uppercase; text-anchor: middle; }

  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 13px; opacity: .75; color: var(--ink-dim); }
</style>
</head>
<body>
<div id="wrap">
  <div id="empty" class="empty" style="display:none"></div>
  <div id="units"></div>
</div>

<script>
var lastData = null;

// Zeichenfarben fuer inline gesetzte SVG-Attribute. Die CSS-Variablen
// oben decken nur die klassenbasierten Elemente ab; Gehaeuse, Luefter,
// Pumpen und Ventile bekommen ihre Farben als Attribut und brauchen
// deshalb eine JS-Palette. Medienfarben (rot/blau/amber, Temperatur-
// skala) sind bewusst NICHT enthalten - sie gelten in beiden Themes.
var PAL = {};
function setTheme(light) {
  document.body.classList.toggle('light', !!light);
  PAL = light
    ? { draw: '#6b7d96', surface: 'rgba(0,0,0,.035)', deep: 'rgba(255,255,255,.88)', blade: '#7a8ba3', pumpOff: '#e4e9f0', faint: '#8a97ab' }
    : { draw: '#8a9cb8', surface: 'rgba(255,255,255,.05)', deep: 'rgba(0,0,0,.42)', blade: '#9fb0c8', pumpOff: '#2c3a52', faint: '#7b8aa3' };
}
setTheme(false);

function fmtTemp1(v) {
  return (v === null || v === undefined) ? null : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
}
function fmtPower(w) {
  if (w === null || w === undefined) { return null; }
  var a = Math.abs(w);
  return (a >= 1000 ? { v: (w / 1000).toFixed(2).replace('.', ','), u: 'kW' } : { v: String(Math.round(w)), u: 'W' });
}

function el(tag, attrs) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

// Temperatur-Farbskala (15°C blau .. 65°C rot)
function tempColor(c) {
  if (c === null || c === undefined) { return '#8a919c'; }
  var t = Math.max(0, Math.min(1, (c - 15) / 50));
  var a = [74, 144, 217], b = [224, 80, 60];
  var r = Math.round(a[0] + (b[0] - a[0]) * t);
  var g = Math.round(a[1] + (b[1] - a[1]) * t);
  var bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Werte-Chip an der Leitung (Prinzip 1 der Referenz-Essenz): dunkle
// Pille, Randfarbe traegt die Information (Leitungs-/Temperaturfarbe),
// Wert weiss und fett. Optionaler Tag darueber.
function chip(x, y, text, unit, borderColor, tag, tagBelow) {
  var g = el('g', {});
  var label = text + (unit ? ' ' + unit : '');
  var w = Math.max(44, label.length * 6.8 + 14);
  var h = 19;
  g.appendChild(el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: h / 2, class: 'chip', stroke: borderColor || '#6f83a3' }));
  var t = el('text', { x: x, y: y + 4, class: 'chip-text' });
  t.textContent = text;
  if (unit) {
    var u = el('tspan', { class: 'chip-unit', dx: 2 });
    u.textContent = unit;
    t.appendChild(u);
  }
  g.appendChild(t);
  if (tag) {
    // tagBelow: 4 (oben) und 11 (unten) sehen im Code asymmetrisch aus,
    // sind es aber NICHT visuell - SVG-Text haengt an seiner Grundlinie
    // und waechst nach OBEN, ohne Unterlaengen bei Grossbuchstaben. Bei
    // "oberhalb" ist die Grundlinie das unterste Text-Pixel (Abstand zum
    // Chip = 4 direkt). Bei "unterhalb" liegt das oberste sichtbare
    // Pixel um die Schrifthoehe UEBER der Grundlinie, also Richtung Chip -
    // der zusaetzliche Puffer (11 statt 4) gleicht das aus. Faelschlich
    // auf 4/4 vereinheitlicht (14.08.2026), wodurch der Buchstabenkoerper
    // in den Chip hineinragte - am gerenderten getBBox() zurueckgeprueft.
    var tg = el('text', { x: x, y: tagBelow ? (y + h / 2 + 11) : (y - h / 2 - 4), class: 'chip-tag' });
    tg.textContent = tag;
    g.appendChild(tg);
  }
  return g;
}

// Ventil (Kontur-Bowtie). Fuellfarbe nur zur Zustandsanzeige.
function valveSymbol(x, y, r, color, tag, filled) {
  r = r || 7;
  var g = el('g', {});
  g.appendChild(el('path', {
    d: 'M' + (x - r) + ',' + (y - r) + ' L' + (x + r) + ',' + (y + r) + ' L' + (x + r) + ',' + (y - r) + ' L' + (x - r) + ',' + (y + r) + ' Z',
    fill: filled ? color : 'none', 'fill-opacity': filled ? 0.55 : 0,
    stroke: color || PAL.draw, 'stroke-width': 1.6, 'stroke-linejoin': 'round'
  }));
  if (tag) {
    // Ueber dem Ventil statt darunter (Dietmar, 16.08.2026): der Mischer
    // hat inzwischen einen Ruecklauf-Bypass, der genau unter dem Symbol
    // durchlaeuft und die Prozentangabe sonst ueberdeckt.
    var t = el('text', { x: x, y: y - r - 8, class: 'tag', fill: color }); t.textContent = tag; g.appendChild(t);
  }
  return g;
}

// Umwaelzpumpe: Kreis + Richtungsdreieck, Zustand ueber Fuellfarbe
// (Prinzip 3: gruen gefuellt = laeuft, grau = steht - wie die "100%"-
// Pumpe im OekoFEN-Referenzbild; KEIN Pulsieren mehr).
function pumpIcon(x, y, active, dirDeg, r) {
  var g = el('g', {});
  r = r || 10;
  var k = r / 10;
  g.appendChild(el('circle', { cx: x, cy: y, r: r, fill: active ? '#2f9e44' : PAL.pumpOff, stroke: active ? '#69cf7d' : PAL.draw, 'stroke-width': 1.6 }));
  // Laufrad DREHT sich, solange die Pumpe foerdert (Dietmar, 14.08.2026)
  // - die blosse Gruenfaerbung war ihm zu wenig. Translate im Wrapper,
  // Rotation im inneren Element: eine CSS-transform-Animation ersetzt die
  // transform des eigenen Elements, ein Attribut-translate ginge dabei
  // verloren (gleiche Falle wie beim Luefter).
  var wrap = el('g', { transform: 'translate(' + x + ',' + y + ')' });
  var rotor = el('g', {});
  if (active) {
    rotor.style.animation = 'pumpspin 1.1s linear infinite';
    rotor.style.transformOrigin = '0px 0px';
  } else {
    rotor.setAttribute('transform', 'rotate(' + (dirDeg || 0) + ')');
  }
  rotor.appendChild(el('path', {
    d: 'M' + (-4 * k) + ',' + (-5.5 * k) + ' L' + (7 * k) + ',0 L' + (-4 * k) + ',' + (5.5 * k) + ' Z',
    fill: '#ffffff'
  }));
  wrap.appendChild(rotor);
  g.appendChild(wrap);
  return g;
}

// Quadratische Spirale IM UHRZEIGERSINN von aussen nach innen, als
// Punktliste: Start oben links, erste Strecke laeuft nach RECHTS die
// Oberkante entlang (wie in Dietmars Referenzzeichnung) - die linke
// Seite der aeussersten Windung beginnt dadurch erst eine Ganghoehe
// UNTER der Oberkante, dort entsteht die natuerliche Oeffnung, durch
// die die Ruecklauf-Spirale die Flaeche verlassen kann, ohne den
// Vorlauf zu kreuzen.
function squareSpiralPts(left, top, side, gap) {
  var right = left + side, bot = top + side;
  var pts = [[left, top]];
  var x = left, y = top;
  while (right - left > gap && bot - top > gap) {
    x = right; pts.push([x, y]);
    y = bot; pts.push([x, y]);
    x = left; pts.push([x, y]);
    top += gap; y = top; pts.push([x, y]);
    right -= gap; bot -= gap; left += gap;
  }
  return pts;
}
function ptsToPathD(pts) {
  return 'M' + pts[0][0] + ',' + pts[0][1] +
    pts.slice(1).map(function (p) { return ' L' + p[0] + ',' + p[1]; }).join('');
}

// Fussbodenheizung als GEGENSTROM-Doppelspirale (Tichelmann-Prinzip),
// exakt nach Dietmars Inkscape-Referenzzeichnung (16.08.2026,
// gemeinsam praezisiert): die rote Vorlauf-Spirale laeuft von aussen
// nach innen, die blaue Ruecklauf-Spirale laeuft PARALLEL DAZWISCHEN
// verschachtelt wieder von innen nach aussen - Rot und Blau wechseln
// sich als Ringe ab, bis zum Kern, wo beide ineinander uebergehen.
// Die Ruecklauf-Spirale ist um eine halbe Ganghoehe versetzt (gleiches
// gap, Kantenlaenge um gap kleiner), ihre Windungen liegen dadurch
// mittig zwischen den Vorlauf-Windungen. Ihr Pfad wird RUECKWAERTS
// serialisiert, damit die Flussanimation von innen nach aussen
// laeuft (das Wasser kommt aus dem Kern zurueck).
function counterSpiral(left, top, side, gap) {
  var supPts = squareSpiralPts(left, top, side, gap);
  var retPts = squareSpiralPts(left + gap / 2, top + gap / 2, side - gap, gap);
  // Punktlisten statt fertiger Pfad-Strings, damit der Aufrufer sie
  // durch bentPipe() mit gerundeten Ecken zeichnen kann (Dietmar,
  // 17.08.2026: "die Ecken sind mit einem engen Bogen versehen").
  // Ruecklauf-Liste rueckwaerts, damit die Flussanimation von innen
  // nach aussen laeuft.
  return {
    supPts: supPts,
    retPts: retPts.slice().reverse(),
    supEnd: supPts[supPts.length - 1],
    retCore: retPts[retPts.length - 1],
    retExit: retPts[0]
  };
}

// Speicher: kraeftiger Rot-nach-Blau-Verlauf (Prinzip 2), geschwungene
// Rohrschlangen-Wicklung aus weichen Boegen statt Zickzack, Liter-Angabe
// direkt auf der Flaeche. Groesse proportional zum realen Volumen.
var tankGradSeq = 0;
// Speicher nach Dietmars Referenzbild (14.08.2026): abgerundetes
// Rechteck mit doppelter Wandung (aussen Kontur, innen die Wasser-
// flaeche mit kraeftigem Rot-nach-Blau-Verlauf) und einer echten
// Rohrschlange als Federprofil - vorher war es eine Kapsel mit drei
// angedeuteten Boegen.
function tankShape(svg, x, y, w, h, temp, label, liters, opts) {
  opts = opts || {};
  var g = el('g', {});
  var defs = svg.querySelector('defs') || svg.insertBefore(el('defs', {}), svg.firstChild);
  var n = ++tankGradSeq;
  var known = temp !== null && temp !== undefined;
  // Fuellfarben ueberschreibbar: der Puffer (Sekundaerkreislauf im
  // Betrieb) faerbt sich nach Vor-/Ruecklauffarbe statt nach der
  // Temperaturskala - Rot oben/Blau unten im Heizbetrieb, kraeftiges
  // Blau oben/schwaches Blau unten im Kuehlbetrieb (Dietmar, 14.08.2026).
  // Weiter gespreizt als zuvor (+/-14 K): das Referenzbild zeigt einen
  // deutlichen Verlauf von warm oben nach kalt unten, keine Toenung.
  var topC = opts.topColor || (known ? tempColor(temp + 14) : '#3a4358');
  var botC = opts.botColor || (known ? tempColor(temp - 14) : '#2a3348');

  var wgid = 'tw' + n;
  [[wgid, topC, botC]].forEach(function (spec) {
    var grad = el('linearGradient', { id: spec[0], x1: '0', y1: '0', x2: '0', y2: '1' });
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': spec[1] }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': spec[2] }));
    defs.appendChild(grad);
  });

  var left = x - w / 2, top = y;
  var rad = w * 0.22;
  // Aussenwand kraeftiger als die uebrigen Konturen - im Referenzbild
  // ist die Speicherwandung deutlich staerker gezeichnet.
  g.appendChild(el('rect', { x: left, y: top, width: w, height: h, rx: rad, class: 'tank-outline', 'stroke-width': 2.4 }));
  // Wasserflaeche, umlaufend eingerueckt
  var pad = 4;
  g.appendChild(el('rect', {
    x: left + pad, y: top + pad, width: w - 2 * pad, height: h - 2 * pad,
    rx: Math.max(2, rad - pad), fill: 'url(#' + wgid + ')', 'fill-opacity': 0.9
  }));

  // Rohrschlange als Federprofil. NUR fuer Speicher mit Waermetauscher -
  // eine hydraulische Weiche (Puffer) hat keine Wendel, die stand dort
  // seit dem Umbau faelschlich drin (14.08.2026).
  // Die Wendel wird NICHT hier gezeichnet, sondern als Pfad zurueck-
  // gegeben: das Schema zeichnet sie mit derselben pipe()-Funktion wie
  // jede andere Wasserleitung, damit Optik UND Flussanimation
  // uebereinstimmen (Dietmar, 14.08.2026). Nur fuer Speicher mit
  // Waermetauscher - eine hydraulische Weiche hat keine Wendel.
  var ports = null;
  if (opts.coil) {
    // Nach Dietmars Handskizze (14.08.2026): Zulauf faellt rechts in den
    // Speicher, die Wendel laeuft abwaerts, der Ablauf steigt MITTIG
    // durch den Speicher wieder hoch in den Ruecklauf. Zulauf- und
    // Steigleitungs-x gibt das Schema vor, damit sie zu den Ventilen und
    // zur Pumpe passen.
    var cIn = opts.inX;
    var cl = left + 16, cTop = top + h * 0.15, cBot = top + h - pad - 20;
    // Steigleitung genau in der MITTE der Wendel (Dietmars Zeichnung,
    // 14.08.2026) - nicht mehr am Rand.
    var cRise = Math.round((cl + cIn) / 2);
    // Ungerade Segmentzahl: die Wendel endet unten LINKS, von dort laeuft
    // der Ablauf waagerecht zur mittigen Steigleitung.
    // Zielabstand 9,5 bei 4er-Strichstaerke - so passen sichtbar mehr
    // Windungen hinein als vorher (Dietmar, 14.08.2026).
    var segs = Math.max(5, Math.round((cBot - cTop) / 8.5) | 1);
    var step = (cBot - cTop) / segs;
    // Enger Rundungsradius fuer die beiden Uebergaenge zwischen dem
    // geraden Rohrstueck und der Wendel (Dietmar, 15.08.2026) - oben beim
    // Eintritt, unten beim Uebergang ins Steigrohr. Die Zacken der Wendel
    // selbst bleiben scharf, nur diese zwei Stellen werden verrundet.
    var bendR = 3;
    // Oben: vom senkrechten Zulaufstueck (Richtung 0,1) in das erste
    // Wendelsegment (Richtung cl-cIn, step) - Rundung als Quadratbezier
    // mit der Ecke selbst als Kontrollpunkt.
    var d1x = cl - cIn, d1y = step, l1 = Math.sqrt(d1x * d1x + d1y * d1y);
    var topBendEndX = cIn + bendR * d1x / l1, topBendEndY = cTop + bendR * d1y / l1;
    // Die Wendel wird in ZWEI Gruppen aufgeteilt statt als ein einziger
    // Pfad (Dietmar, 15.08.2026: der Uebergang in das senkrechte Steig-
    // rohr sah unschoen aus, weil die Wendel immer HINTER dem Rohr lag).
    // Segmente, die von rechts oben nach links unten laufen, werden NACH
    // dem Steigrohr gezeichnet (also davor gerendert) - wie bei einer
    // echten gewickelten Leitung, die abwechselnd vor und hinter dem
    // geraden Rohr durchtaucht. Die Gegenrichtung bleibt dahinter.
    var backD = 'M' + cIn + ',' + (top - 3) + ' L' + cIn + ',' + (cTop - bendR) +
      ' Q' + cIn + ',' + cTop + ' ' + topBendEndX + ',' + topBendEndY;
    var frontD = '';
    var px = topBendEndX, py = topBendEndY;
    for (var i = 1; i <= segs; i++) {
      var nx = (i % 2 === 1 ? cl : cIn), ny = cTop + i * step;
      var seg = 'M' + px + ',' + py + ' L' + nx + ',' + ny;
      // rechts oben -> links unten: x nimmt ab (nx < px), y nimmt zu.
      if (nx < px) { frontD += ' ' + seg; } else { backD += ' ' + seg; }
      px = nx; py = ny;
    }
    var cEnd = cTop + segs * step;
    // Letztes Wendelstueck von LINKS bis zur MITTE (Dietmar, 15.08.2026):
    // die Windungen enden sonst mitten in der Luft bei (cl, cEnd), ohne
    // dass die Reihe bis zur Steigleitung weitergefuehrt wird. Dieses
    // Teilstueck bekommt dieselbe Neigung (Steigung je Wendelbreite) wie
    // jedes andere Segment, nur ueber die kuerzere Distanz bis cRise -
    // und gehoert zur Wendel selbst (gleiche Farbe/Gradient), nicht zum
    // separaten Ablaufrohr. Laeuft von links nach rechts (nx > px), bleibt
    // also in der "back"-Gruppe.
    var cEnd2 = cEnd + step * (cRise - cl) / (cIn - cl);
    // Unten: von der letzten Wendelrichtung (px,py -> cRise,cEnd2) glatt in
    // das senkrechte Steigrohr (Richtung 0,-1) - gleiche Rundungstechnik.
    var d2x = cRise - px, d2y = cEnd2 - py, l2 = Math.sqrt(d2x * d2x + d2y * d2y);

    var botBendEndY = cEnd2 - bendR;
    backD += ' M' + px + ',' + py + ' L' + botBendStartX + ',' + botBendStartY +
      ' Q' + cRise + ',' + cEnd2 + ' ' + cRise + ',' + botBendEndY;
    ports = {
      coilPathBack: backD,
      coilPathFront: frontD,
      // Ablauf jetzt ein reines Steigrohr, verlaengert bis zum neuen
      // untersten Punkt der Wendel (cRise, cEnd2) - kein eigener Knick
      // mehr, der faelschlich wie ein zusaetzliches Wendelstueck aussah.
      risePath: 'M' + cRise + ',' + botBendEndY + ' L' + cRise + ',' + (top - 3),
      coilTop: cTop, coilBot: cEnd2, topY: top - 3, riserX: cRise,
      // Alternative zum Ablauf oben: die Wendel endet unten mittig (cRise,
      // cEnd2) - wer den Ablauf lieber dort direkt nach AUSSEN fuehrt
      // (kein zusaetzlicher Fuss+Steigrohr-Umweg durch den Tank) nutzt
      // exitX/exitY statt riserX/risePath (Dietmar, 14.08.2026: "die
      // mittlere senkrechte Leitung gibt es auch nicht").
      exitX: cRise, exitY: cEnd2
    };
  }

  // Name + Liter direkt AUF der Tankflaeche (iDM-Referenzmuster) statt
  // unterhalb - Rohrleitungen unter dem Tank koennen die Beschriftung
  // dann nicht mehr anschneiden (real passiert beim Puffer-Ruecklauf).
  // Schriftgroesse an die Speicherbreite koppeln - "WW-Tank" lief bei
  // 50px Breite sonst ueber die Wandung hinaus.
  function fitLabel(text, xx, yy, cls, maxFs) {
    // Faktor 0,70 am gerenderten Text nachgemessen (14.08.2026): mit 0,58
    // geschaetzt war "WW-Tank" 48,3 breit bei 50 Speicherbreite und lag
    // damit auf der Wandung.
    var fs = Math.min(maxFs, (w - 12) / (text.length * 0.70));
    var t = el('text', { x: xx, y: yy, class: cls });
    t.style.fontSize = fs.toFixed(1) + 'px';
    t.textContent = text;
    g.appendChild(t);
    return fs;
  }
  // Bei bewendelten Speichern steigt der Ablauf MITTIG durch den Tank und
  // die Wendel fuellt die Flaeche - die Beschriftung passt dort nur noch
  // einzeilig unter die Wendel (Dietmar, 14.08.2026).
  if (opts.coil) {
    // Bewusst KEINE Beschriftung auf der Speicherflaeche: die Wendel
    // fuellt sie aus, deshalb setzt der Aufrufer den Text in den Sockel
    // des Innengeraets (Dietmar, 14.08.2026).
    void 0;
  } else {
    var usedFs = 10.5;
    if (label) { usedFs = fitLabel(label, x, top + h * 0.13, 'tank-label', 10.5); }
    if (liters) { fitLabel(liters, x, top + h * 0.13 + usedFs + 3, 'tank-liters', 10); }
  }
  svg.appendChild(g);
  return ports;
}

// Aussengeraet nach Panasonics Technikzeichnung (WH-UD09JE5-1, aus dem
// offiziellen Hydraulikschema-PDF, Wunsch Dietmar 14.08.2026): Gehaeuse
// mit horizontalem Lamellengitter ueber die volle Front, grosser
// Luefterkreis HINTER dem Gitter, rechts eine schmale Spalte mit
// Luftschlitzen, kleine Standfuesse. Der Luefter rotiert hinter den
// Lamellen weiter, wenn der Verdichter laeuft.
function outdoorUnit(svg, x, y, w, h, running, fanSpeed) {
  var g = el('g', {});
  var C = PAL.draw;
  // Gehaeuse
  g.appendChild(el('rect', { x: x, y: y, width: w, height: h, rx: 3, fill: PAL.surface, stroke: C, 'stroke-width': 1.5 }));
  // Standfuesse
  var footY = y + h;
  [x + 14, x + w - 22].forEach(function (fx) {
    g.appendChild(el('path', { d: 'M' + fx + ',' + footY + ' l-4,6 h16 l-4,-6 Z', fill: PAL.surface, stroke: C, 'stroke-width': 1.2 }));
  });
  // Luefter (hinter dem Gitter): Kreis + rotierende Blaetter
  var fanCx = x + w * 0.40, fanCy = y + h / 2, fanR = h * 0.38;
  g.appendChild(el('circle', { cx: fanCx, cy: fanCy, r: fanR, fill: 'none', stroke: C, 'stroke-width': 1.4 }));
  // Translate im WRAPPER-Element, Rotation im inneren - eine CSS-
  // transform-Animation ERSETZT die transform des eigenen Elements,
  // eine Attribut-translate am selben Element ginge dabei verloren

  // im Geraet, 14.08.2026).

  var blades = el('g', {});

  var spinning = (typeof fanSpeed === 'number') ? fanSpeed > 0 : running;
  if (spinning) {

      ? Math.max(0.35, Math.min(3.0, 900 / fanSpeed)).toFixed(2)
      : '1.6';
    blades.style.animation = 'fanspin ' + dur + 's linear infinite';
    blades.style.transformOrigin = '0px 0px';

  for (var i = 0; i < 4; i++) {
    blades.appendChild(el('path', { d: 'M0,0 Q' + (fanR * 0.38) + ',' + (-fanR * 0.55) + ' 0,' + (-fanR * 0.85), fill: 'none', stroke: PAL.blade, 'stroke-width': 1.3, transform: 'rotate(' + (i * 90) + ')' }));
  }
  blades.appendChild(el('circle', { cx: 0, cy: 0, r: 2, fill: PAL.blade }));
  bladesWrap.appendChild(blades);
  g.appendChild(bladesWrap);

  var grilleR = x + w * 0.72;
  var lam = '';
  for (var ly = y + 8; ly < y + h - 6; ly += 6) {
    lam += 'M' + (x + 6) + ',' + ly + ' L' + grilleR + ',' + ly + ' ';
  }
  g.appendChild(el('path', { d: lam, fill: 'none', stroke: C, 'stroke-width': 0.8, opacity: 0.75 }));
  // Rechte Spalte: Luftschlitze
  var sl = '';
  for (var sy = y + 16; sy < y + h - 12; sy += 14) {
    sl += 'M' + (grilleR + 8) + ',' + sy + ' L' + (x + w - 8) + ',' + sy + ' ';
  }
  g.appendChild(el('path', { d: sl, fill: 'none', stroke: C, 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
  svg.appendChild(g);
  return g;
}

  var px = x + w / 2, py = y + 28;

  g.appendChild(el('rect', { x: px - 10, y: py - 12, width: 20, height: 14, rx: 1, fill: 'none', stroke: C, 'stroke-width': 1 }));

  g.appendChild(el('path', { d: 'M' + px + ',' + (py + 10) + ' L' + px + ',' + (py + 14), stroke: C, 'stroke-width': 1 }));

function arrowHead(x, y, dir, color) {
  var pts = { r: [[x - 5, y - 4], [x + 5, y], [x - 5, y + 4]], l: [[x + 5, y - 4], [x - 5, y], [x + 5, y + 4]], d: [[x - 4, y - 5], [x, y + 5], [x + 4, y - 5]], u: [[x - 4, y + 5], [x, y - 5], [x + 4, y + 5]] };
  var p = pts[dir] || pts.r;
  return el('path', { d: 'M' + p[0][0] + ',' + p[0][1] + ' L' + p[1][0] + ',' + p[1][1] + ' L' + p[2][0] + ',' + p[2][1] + ' Z', fill: color });

function buildSchema(unit) {
  // Kachelweite Einstellungen (Freitexte je Heizkreis) liegen im Payload,

  // davon, in welcher Reihenfolge sie gezeichnet wurden (Dietmar,
  // 14.08.2026: "Ventile in den Vordergrund ueber die Leitungen").
  var valveLayer = [];
  function drawValve(node) { valveLayer.push(node); return svg.appendChild(node); }
  // Reale Anlagentopologie (Dietmar, 13.08.2026): Splitgeraet, Innengeraet
  // mit fest eingebautem 185l-Brauchwassertank, Heizkreis laeuft ueber
  // einen 100l-Pufferspeicher, dahinter externe Pumpe + Mischventil
  // (2. Steuerplatine, Live-Werte seit HeishaMon contractVersion 1.4)
  // zu Radiatoren/Flaechenheizkoerpern (FBH nur Bad).
  // hasZone2 + die ShowRadiator/ShowFloor-Flags werden HIER vorgezogen
  // (statt erst beim Zeichnen der Heizkreise weiter unten), damit die
  // Canvas-Breite (W) schon VOR dem Erzeugen des <svg>-Elements an die
  // tatsaechlich gezeigten Emitter-Icons angepasst werden kann (Dietmar,
  // 16.08.2026: "wenn keine Fussbodenheizung dargestellt werden muss,
  // koennte man die Darstellung anders skalieren") - ein schmaleres

  // Werte wieder, damit sie nicht doppelt berechnet werden.

    || unit.z2Pump === true
    || (unit.z2MixValvePos !== null && unit.z2MixValvePos !== undefined);
  var z1ShowRadiator = cfg.zone1ShowRadiator !== false, z1ShowFloor = cfg.zone1ShowFloor !== false;
  var z2ShowRadiator = cfg.zone2ShowRadiator !== false, z2ShowFloor = cfg.zone2ShowFloor !== false;
  // Ist fuer einen Kreis WEDER Heizkoerper NOCH Fussbodenheizung gewaehlt,
  // wird der GESAMTE Heizkreis (Mischer, Pumpe, Titel, Chips, Leitungen)
  // uebersprungen statt eines leeren Platzhalter-Kastens (Dietmar,
  // 16.08.2026: "es sollten die kompletten HK nicht mehr dargestellt

  var zone2W = z2Active ? zoneContentWidth(z2ShowRadiator, z2ShowFloor) : 0;
  var W = 829 + Math.max(zone1W, zone2W) + 80, H = 470;
  var svg = el('svg', { class: 'schema', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(el('defs', {}));
  // KEIN eigener Hintergrund: die Kachel soll sich in den Symcon-

  // sichtbarer Kasten in der Kachel (Dietmar, 14.08.2026). Eine vom

  // EMS/SUITE.md festgeschrieben) - 0=standby, 1=heating, 2=cooling,

  var normMode = unit.operatingModeNorm;
  var modeDir = (normMode !== null && normMode !== undefined) ? NORM_DIR[normMode] : undefined;
  // Nur 1/2/4/5 nennen eine Richtung. Bei standby, reinem Warmwasser
  // oder "unbekannt" (-1) sagt der Enum nichts ueber Heizen/Kuehlen -

    if (active) {

  }
  // Baut aus geraden Wegpunkten einen Pfad, bei dem jeder innere Knick

    }
    drawValve(pumpIcon(754, z.y, on, 0));
    // Getrennte Beschriftungen statt einer gemeinsamen Mitte (Dietmar,
    // 16.08.2026): "Mischer" steht mittig ueber dem Ventil (694),
    // "Pumpe" mittig ueber der Pumpe (754) - deckt bei HK2 keine
    // Leitungen, da die Zone-2-Abzweige bei x=645/620 liegen, ausserhalb
    // beider Wortbreiten.
    var mischerTag = el('text', { x: 694, y: z.y - 25, class: 'tag' });
    mischerTag.textContent = 'Mischer';
    svg.appendChild(mischerTag);
    var pumpeTag = el('text', { x: 754, y: z.y - 25, class: 'tag' });
    pumpeTag.textContent = z.pumpKnown ? 'Pumpe' : 'Pumpe (kein Status)';
    svg.appendChild(pumpeTag);
    // Pfeile im Vor-/Ruecklauf: bei HK1 (16.08.2026) und jetzt auch bei
    // HK2 (16.08.2026) entfernt - die Flussanimation (Punkte) zeigt die
    // Richtung bereits.

    // Heizkoerper + Fussbodenheizung als ECHTE gefaerbte Leitung, parallel
    // gespeist (Dietmar, 16.08.2026, nach dem zweiten Referenzbild): beide
    // haengen unabhaengig an derselben Vor-/Ruecklaufschiene statt in
    // Reihe hintereinander. Anschlusshoehen (z.y oben, z.retY unten)
    // bleiben exakt wie beim Kasten zuvor. Linke Kante des ersten Icons
    // bei x=829, flucht mit dem Vorlauf-Ankunftspunkt.
    var iconTop = z.y, iconBot = z.retY, iconGap = 24;
    var radW = 110;
    var curX = 829;
    // Anfangspunkte des Ruecklaufs aus JEDEM gezeichneten Emitter-Icon -
    // werden weiter unten je EINZELN mit einer eigenen Ruecklaufleitung
    // zum Puffer verbunden (Dietmar, 16.08.2026: "verbinde die
    // Ruecklaufleitungen aus den Radiatoren mit den Ruecklaufleitungen
    // die in den Puffer gehen ... Bogen statt Knick"), statt unverbunden
    // zu enden. Eine Liste statt einer einzelnen Variable (Dietmar,
    // 16.08.2026: "Rücklauf verlässt den Heizkörper unten rechts und
    // geht direkt senkrecht runter zur Sammelleitung") - bei Heizkoerper
    // UND Fussbodenheizung gleichzeitig ueberschrieb bisher das zuletzt
    // gezeichnete Icon den Ruecklauf-Anschluss des vorherigen, der
    // dadurch unsichtbar unverbunden blieb.
    var radReturnLeads = [];
    // iconTypes ist nie leer: der ganze Kreis wird oben per z.active
    // uebersprungen, wenn weder Heizkoerper noch Fussbodenheizung
    // gewaehlt ist - kein Platzhalter-Kasten mehr noetig.
    var iconTypes = [];
    if (z.showRadiator) { iconTypes.push('radiator'); }
    if (z.showFloor) { iconTypes.push('floor'); }
    {
      iconTypes.forEach(function (t, i) {
        if (i > 0) {
          // Beide Icons haengen PARALLEL an derselben Vor-/Ruecklauf-
          // schiene, nicht hintereinander in Reihe - die Zuleitungen
          // selbst zeichnet jedes Icon durchgehend ab dem Mischer (675)
          // bzw. bis zur Sammelstelle (620), hier nur den Abstand
          // vorruecken.
          curX += iconGap;
        }
        if (t === 'radiator') {
          // Heizkoerper nach Dietmars Inkscape-Skizze (16.08.2026, "sieht
          // schon wesentlich besser aus... kein doppelter Rahmen... den
          // Fluessigkeitsstrom nicht vergessen"): EIN einfacher Rahmen,
          // 8 schmalere Rippen mit mehr Abstand, UND - das war der
          // fehlende Teil - eine obere rote Sammelleitung (verteilt auf
          // alle Rippen) und eine untere blaue Sammelleitung (sammelt von
          // allen Rippen), damit der Fluss sichtbar durch jede Rippe
          // laeuft statt nur dekorativ gefuellt zu sein.
          // Untere Sammelleitung 10px nach oben (Dietmar, 16.08.2026) -
          // der Heizkoerper wird dadurch 10px niedriger, die obere Kante
          // (peakY) bleibt unveraendert.
          var peakY = iconTop - 95, connectY = iconTop - 25;
          // Radiator 30px nach links, Steig-/Fallleitung zusaetzlich
          // eigenstaendig verschoben (Dietmar, 16.08.2026), damit beide
          // sichtbar AUSSERHALB der Kontur liegen statt darauf: rote
          // Steigleitung -40px gesamt (10px weiter als der Radiator ->
          // 20px Abstand zur Kontur statt vorher 10px), blaue Fallleitung
          // nur -20px gesamt (10px weniger als der Radiator -> ebenfalls
          // 20px Abstand, nur auf der anderen Seite).
          var boxL = curX + 10 - 30, boxR = curX + radW - 10 - 30;
          svg.appendChild(el('rect', { x: curX - 30, y: peakY - 8, width: radW, height: (connectY - peakY) + 16, rx: 4, class: 'box', fill: 'none' }));
          var fgid = 'radfill' + z.n + unit.id;
          var manifoldH = 8;
          var finTop = peakY + manifoldH, finBot = connectY - manifoldH;
          var fgr = el('linearGradient', { id: fgid, gradientUnits: 'userSpaceOnUse', x1: 0, y1: finTop, x2: 0, y2: finBot });
          var fs0 = el('stop', { offset: '0%' }); fs0.setAttribute('stop-color', SUPC);
          var fs1 = el('stop', { offset: '100%' }); fs1.setAttribute('stop-color', RETC);
          fgr.appendChild(fs0); fgr.appendChild(fs1);
          svg.querySelector('defs').appendChild(fgr);
          // Sammelleitungen als ECHTE Leitung statt gefuellter Balken
          // (Dietmar, 16.08.2026: "Vom Fluessigkeitsstrom sehe ich noch
          // nichts") - erst als pipe() gezeichnet bekommen sie die
          // wandernden Punkte, die den Fluss ueberall sonst im Schema
          // anzeigen; vorher waren Sammelleitungen UND Rippen nur
          // statisch gefuellte Rechtecke ohne Animation.
          svg.appendChild(pipe('M' + boxL + ',' + (peakY + manifoldH / 2) + ' L' + boxR + ',' + (peakY + manifoldH / 2), SUP, on, null, manifoldH));
          svg.appendChild(pipe('M' + boxL + ',' + (connectY - manifoldH / 2) + ' L' + boxR + ',' + (connectY - manifoldH / 2), RET, on, null, manifoldH));
          var finCount = 8, finGap = (boxR - boxL) / finCount, finW = finGap * 0.42;
          for (var fi = 0; fi < finCount; fi++) {
            var fx = boxL + fi * finGap + finGap / 2;
            svg.appendChild(pipe('M' + fx + ',' + finTop + ' L' + fx + ',' + finBot, 'pipe-hot', on, 'url(#' + fgid + ')', finW));
          }
          // Zulauf: steigt AUSSEN links am Kasten hoch, biegt oben in die
          // rote Sammelleitung ein. Ablauf: verlaesst die blaue
          // Sammelleitung rechts, faellt zur Schiene.
          // Beginnt bei x=675 (Mischer) statt erst bei der Steigleitung -
          // der Uebergang vom Mischer-Ausgang in die Steigleitung wird
          // dadurch TEIL desselben gerundeten Pfads statt einer scharfen
          // Ecke zwischen zwei getrennten Leitungen.
          svg.appendChild(bentPipe([[675, z.y], [boxL - 20, iconTop], [boxL - 20, peakY + manifoldH / 2], [boxL, peakY + manifoldH / 2]], SUP, on));
          radReturnLeads.push([[boxR, connectY - manifoldH / 2], [boxR + 20, connectY - manifoldH / 2], [boxR + 20, iconBot]]);
          curX += radW;
        } else if (t === 'floor') {
          // Fussbodenheizung als Gegenstrom-Doppelspirale nach Dietmars
          // Referenzzeichnung (16.08.2026) - siehe counterSpiral().
          // Vertikale Ausdehnung exakt nach Vorgabe (Dietmar,
          // 17.08.2026): Unterkante auf der Ruecklaufhoehe (iconBot),
          // Oberkante etwa auf der Oberkante des Heizkoerpers (dessen
          // obere Sammelleitung liegt bei iconTop-95). Ganghoehe so
          // gewaehlt, dass drei Vorlauf-Windungen entstehen ("du hast
          // eine Windung zuviel"). Loest nebenbei die vorherige Enge
          // zum Heizkoerper eines eventuellen zweiten Kreises: die
          // Spirale endet jetzt AUF der eigenen Ruecklaufschiene statt
          // 30px darunter.
          // Ganghoehe 36 -> ZWEI Vorlauf-Windungen (Dietmar, 17.08.2026:
          // "es ist noch eine Windung weniger"); der Ruecklauf liegt um
          // die halbe Ganghoehe versetzt, dadurch ist der Abstand
          // zwischen ALLEN benachbarten Linien identisch 18px (Dietmar:
          // "alle Abstaende zwischen den Linien muessen identisch sein").
          var fTop = iconTop - 95, fSide = iconBot - fTop, fGap = 36;
          var fLeft = curX + 16;
          var cs = counterSpiral(fLeft, fTop, fSide, fGap);
          // Vorlauf: von der Schiene (iconTop) kurz vor der Spirale
          // senkrecht hoch zur Oberkante, dort oben links in die
          // aeusserste Windung einbiegen (Dietmars Zeichnung: "die
          // Vorlaufleitung steigt senkrecht hoch und tritt oben links
          // ein").
          // Ab dem Mischer (675) durchgehend gezeichnet - laeuft bei
          // gezeigtem Heizkoerper unter diesem hindurch weiter zur
          // Spirale (wie in Dietmars Zeichnung, wo der Vorlauf-Trunk
          // unterhalb des Heizkoerpers bis zur Spirale durchlaeuft).
          svg.appendChild(bentPipe([[675, iconTop], [fLeft - 14, iconTop], [fLeft - 14, fTop], [fLeft, fTop]], SUP, on));
          // Mit gerundeten Ecken gezeichnet (Dietmar, 17.08.2026: "die
          // Ecken sind mit einem engen Bogen versehen").
          svg.appendChild(bentPipe(cs.supPts, SUP, on, 7));
          svg.appendChild(bentPipe(cs.retPts, RET, on, 7));
          // Kern-Uebergang: Ende der Vorlauf-Spirale mit dem inneren
          // Ende der Ruecklauf-Spirale verbinden - hier geht der
          // Vorlauf in den Ruecklauf ueber.
          svg.appendChild(bentPipe([cs.supEnd, cs.retCore], RET, on, 4));
          // Ruecklauf-Austritt: die aeusserste blaue Windung verlaesst
          // die Spirale oben links durch die natuerliche Oeffnung der
          // Vorlauf-Spirale (deren linke Seite beginnt erst eine
          // Ganghoehe tiefer - kein Kreuzen), laeuft kurz nach links
          // und faellt dann senkrecht zur Ruecklauf-Sammelleitung
          // (Dietmars Zeichnung).
          radReturnLeads.push([[cs.retExit[0], cs.retExit[1]], [fLeft - 7, cs.retExit[1]], [fLeft - 7, iconBot]]);
          curX += 16 + fSide + 16;
        }
      });
    }
    // "HEIZKREIS N" mittig UEBER Mischer (694) + Pumpe (754) statt ueber
    // der ganzen Icon-Gruppe (Dietmar, 16.08.2026) - x=745 ist deren
    // Mittelpunkt. Ueberdeckt weder Mischer/Pumpe-Beschriftung (25px
    // darunter) noch den Heizkoerper (der beginnt erst bei x=830+).
    var hkCX = (694 + 754) / 2;
    var rt = el('text', { x: hkCX, y: z.y - 53, class: 'box-title' });
    rt.textContent = hasZone2 ? ('HEIZKREIS ' + z.n) : 'HEIZKREIS';
    svg.appendChild(rt);
    if (z.caption) {
      var rc = el('text', { x: hkCX, y: z.y - 39, class: 'tag' });
      rc.textContent = z.caption;
      svg.appendChild(rc);
    }
    // z.temp (HeishaMon z1/z2WaterTempID) ist die Ruecklauftemperatur der
    // Zone, keine allgemeine Kreis-Temperatur - deshalb DIREKT auf der
    // Ruecklaufleitung platziert (wie die uebrigen Vor-/Ruecklauf-Chips
    // im Schema), nicht mehr unter dem ganzen Icon-Block (Dietmar,
    // 16.08.2026: "die 18° sollen vermutlich der Ruecklauf sein" +
    // "der Ruecklauf Chip auf der Ruecklaufleitung darunter").
    if (z.temp !== null && z.temp !== undefined) {
      // Zone 1: ihr eigener Ruecklauf (retY=192) IST bereits die
      // gemeinsame Sammelleitung, der Chip sitzt mittig zwischen Puffer
      // und Vorlauf direkt darauf (Dietmar, 16.08.2026). Zone 2: Chip
      // sitzt auf der eigenen Ruecklaufleitung direkt unter der Pumpe
      // (x=754), statt auf der Steigleitung (Dietmar, 16.08.2026: "auf
      // die Ruecklaufleitung des HK 2 direkt unter die Pumpe").
      var retChipX = z.retY === 192 ? (PUF_RIGHT + z.vorlaufX) / 2 : 754;
      var retChipY = z.retY;
      drawValve(chip(retChipX, retChipY, fmtTemp1(z.temp), '°C', tempColor(z.temp), null));
    }

    // Ruecklauf des Kreises verlaesst den Kasten an der LINKEN Seite (wie
    // der Vorlauf) auf z.retY = eigene Vorlaufhoehe + 50. Bei Zone 1
    // deckt sich das mit der gemeinsamen Sammelhoehe (192) - eine einzige
    // gerade Strecke reicht, die Leitung geht dadurch direkt senkrecht
    // vom Emitter-Anschluss zur Sammelleitung (Dietmar, 16.08.2026:
    // "Ruecklauf verlaesst den Heizkoerper unten rechts und geht direkt
    // senkrecht runter zur Sammelleitung"). Bei Zone 2 (retY=372) muss
    // die Leitung erst zur Sammelhoehe hochsteigen - dieser Knick wird
    // MIT der Austrittsstrecke zu einem gerundeten Pfad zusammengefasst
    // statt als scharfe Ecke aufeinanderzutreffen (Dietmar, 16.08.2026).
    // Die Steigleitung liegt bei x=620, zwischen der Vorlauf-Steigleitung
    // (645) und dem Puffer (PUF_RIGHT=595).
    //
    // JEDES Emitter-Icon bekommt seine EIGENE komplette Ruecklaufleitung
    // (Dietmar, 16.08.2026: bei Heizkoerper UND Fussbodenheizung
    // gleichzeitig ueberschrieb bisher das zuletzt gezeichnete Icon den
    // Anschluss des vorherigen - der blieb dadurch unsichtbar in der
    // Luft haengen) statt nur eine gemeinsame, zuletzt gewonnene Leitung.
    var leads = radReturnLeads.length ? radReturnLeads : [[[829, z.retY]]];
    leads.forEach(function (lead) {
      var retPts = lead.concat([[620, z.retY]]);
      if (z.retY !== 192) { retPts.push([620, 192]); }
      svg.appendChild(bentPipe(retPts, RET, on));
    });
  });

  // Ventile ans Ende der Zeichenreihenfolge verschieben, damit sie ueber
  // JEDER Leitung liegen, auch ueber solchen, die erst danach im Code
  // gezeichnet werden.
  valveLayer.forEach(function (v) { svg.appendChild(v); });
  // viewBox-Zuschnitt auf den tatsaechlichen Inhalt passiert NICHT hier
  // (getBBox() liefert an einem noch nicht ins Dokument eingehaengten
  // <svg> nur Nullen), sondern in handleMessage(), NACHDEM dieses
  // Element wirklich im DOM haengt - siehe dort.
  return svg;
}

function buildBasicCard(unit) {
  var box = document.createElement('div');
  box.style.cssText = 'padding:14px 16px;border-radius:4px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font-size:12px;';
  var pw = fmtPower(unit.power);
  box.innerHTML = 'Keine Anlagenschema-Daten (Pumpen/Ventile/Durchfluss) verfügbar - nur Basiswerte.' +
    (pw ? '<div style="margin-top:6px;font-weight:700">Leistung: ' + pw.v + ' ' + pw.u + '</div>' : '');
  return box;
}

function handleMessage(raw) {
  var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
  lastData = d;
  var empty = document.getElementById('empty');
  var unitsEl = document.getElementById('units');
  setTheme(d && d.lightTheme);
  // Wasserfluss-Darstellung (siehe ".pipe-dots"-Varianten in <style>):
  // 0/fehlend = organische Welle, 1 = Punkte, 2 = Striche, 3 = Fluessigkeitsglanz.
  var FLOW_CLASSES = ['', 'flow-dots', 'flow-dash', 'flow-liquid'];
  FLOW_CLASSES.forEach(function (c) { if (c) { document.body.classList.remove(c); } });
  var flowClass = FLOW_CLASSES[(d && d.flowStyle) || 0];
  if (flowClass) { document.body.classList.add(flowClass); }
  // Bewegungsart (0 = atmend/ease-in-out, 1 = konstant/linear) und
  // Geschwindigkeit (0 = langsam, 1 = normal, 2 = schnell) sind von der
  // Optik UNABHAENGIGE CSS Custom Properties (Dietmar, 16.08.2026: "du
  // koenntest sogar noch die Geschwindigkeit zur Auswahl stellen") -
  // gelten fuer ALLE vier Optik-Stile (siehe <style>), keine Ausnahme
  // mehr fuer Punkte/Striche (Dietmar, 16.08.2026: "wenn ich es
  // aktivieren kann, dann sollte es auch funktionieren"). FLOW_SPEED_MULT:
  // kleiner Multiplikator = kuerzere Dauer = schnellere Bewegung.
  var root = document.documentElement;
  var flowMotion = (d && d.flowMotion != null) ? d.flowMotion : 0;
  root.style.setProperty('--flow-ease', flowMotion === 1 ? 'linear' : 'ease-in-out');
  var FLOW_SPEED_MULT = [1.6, 1, 0.55];
  var flowSpeed = (d && d.flowSpeed != null) ? d.flowSpeed : 1;
  root.style.setProperty('--flow-mult', FLOW_SPEED_MULT[flowSpeed] || 1);
  if (d && d.bg) { document.body.style.background = d.bg; }
  if (d && d.font) { document.body.style.fontFamily = d.font; }

  if (!d || !d.ok) {
    unitsEl.style.display = 'none';
    empty.style.display = 'flex';
    empty.textContent = (d && d.error) || 'Keine Daten verfügbar.';
    return;
  }
  empty.style.display = 'none';
  unitsEl.style.display = '';
  unitsEl.innerHTML = '';

  // Zeigt schon eine Quelle das volle Schema, sind die Basiswert-Karten
  // der uebrigen Quellen reine Dopplung: HeishaMon und WPHub berichten
  // ueber DIESELBE physische Waermepumpe, WPHub aber ohne Pumpen-/Ventil-
  // /Durchflussdaten (Cloud-API). Nur wenn es GAR kein Schema gibt,
  // bleiben die Basiswerte als einzige Information stehen.
  var units = d.units || [];
  var anySchema = units.some(function (u) { return u.hasPipeSchema; });
  if (anySchema) { units = units.filter(function (u) { return u.hasPipeSchema; }); }

  // Bei genau einer Waermepumpe MIT Rohrschema soll die Zeichnung die
  // ganze Kachel ausfuellen und mittig sitzen statt nur in der Breite
  // zu skalieren (siehe ".unit.fill" in <style>, Dietmar, 16.08.2026).
  var single = units.length === 1 && units[0].hasPipeSchema;
  unitsEl.classList.toggle('single', single);

  units.forEach(function (unit) {
    var row = document.createElement('div');
    row.className = 'unit' + (single ? ' fill' : '');
    // KEIN eigener Titel: die Kachel traegt in IP-Symcon bereits ihren
    // Instanznamen in der Kopfzeile, ein zweiter Titel im Inhalt
    // ueberlagert diesen optisch (Dietmar, 14.08.2026). Der Geraetename
    // wird nur bei MEHREREN Waermepumpen zur Unterscheidung gebraucht.
    if (units.length > 1) {
      var title = document.createElement('div');
      title.className = 'unit-title';
      title.textContent = unit.label;
      row.appendChild(title);
    }
    row.appendChild(unit.hasPipeSchema ? buildSchema(unit) : buildBasicCard(unit));
    unitsEl.appendChild(row);
    // viewBox auf den TATSAECHLICH gezeichneten Inhalt zuschneiden statt
    // auf die pauschale Layout-Leinwand (0..W, 0..H) zu vertrauen
    // (Dietmar, 16.08.2026: "ist noch immer nicht die Kachelmitte" +
    // "der Betriebsmodus sollte vielleicht auf einer festen Hoehe
    // stehen"). Die Layout-Koordinaten (W/H) sind eine grosszuegige
    // Leinwand fuer die Platzierung, kein exaktes Mass fuer den
    // untersten/obersten gezeichneten Punkt - je nach Konfiguration
    // (Heizkoerper/Fussboden, ein/zwei Kreise) bleibt unten mehr oder
    // weniger Luft. Mit preserveAspectRatio="xMidYMid meet" zentriert
    // der Browser die LEINWAND, nicht den Inhalt - blieb die Leinwand
    // groesser als der Inhalt, sass die Zeichnung sichtbar aus der
    // Mitte gerueckt. getBBox() braucht dafuer ein bereits im DOM
    // haengendes Element, deshalb hier statt in buildSchema().
    var schemaSvg = row.querySelector('svg.schema');
    if (schemaSvg) {
      var bbox = schemaSvg.getBBox();
      if (bbox.width > 0 && bbox.height > 0) {
        var pad = 12;
        schemaSvg.setAttribute('viewBox',
          Math.floor(bbox.x - pad) + ' ' + Math.floor(bbox.y - pad) + ' ' +
          Math.ceil(bbox.width + pad * 2) + ' ' + Math.ceil(bbox.height + pad * 2));
      }
    }
  });
}

</script>
</body>
</html>
