<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .unit { padding: 10px 12px; }
  .unit-title { font-size: 13px; font-weight: 700; color: #eef2f6; margin-bottom: 4px; }
  svg.schema { width: 100%; height: auto; display: block; }

  /* Stil-Essenz aus fuenf Referenzbildern (Aquarea-Wiki, Solvis, iDM,
     Bernhard Baptists "Wärmepumpe Visu", OekoFEN/Solar-Visu; mit Dietmar
     am 14.08.2026 destilliert):
     1. Werte in kleinen umrandeten Chips DIREKT an der Leitung, Randfarbe
        = Leitungs-/Temperaturfarbe.
     2. Speicher mit kraeftigem Rot-nach-Blau-Verlauf und sauber
        geschwungener Rohrschlangen-Wicklung.
     3. Pumpen als Kreis+Dreieck, Zustand ueber FUELLFARBE (gruen=laeuft).
     4. Leitungsfarbe = Funktion (rot Vorlauf, blau Ruecklauf, grau
        inaktiv), rechtwinklige Fuehrung.
     5. Grosszuegige Flaeche, Luft zwischen den Elementen.
     Tankgroessen proportional zur REALEN Anlage (Dietmar: 185l WW-Tank
     muss groesser sein als 100l Puffer - Referenzanlagen mit 800-2000l
     Speichern sind kein Massstab fuer seine Verhaeltnisse). */
  .schema-bg { fill: #101a2c; }
  .box { fill: #16233a; stroke: #6f83a3; stroke-width: 1.5; }
  .box-title { font-size: 11px; font-weight: 700; fill: #eef2f6; text-anchor: middle; letter-spacing: .4px; }

  .pipe-hot { stroke: #e0503c; }
  .pipe-cold { stroke: #4a90d9; }
  .pipe { fill: none; stroke-width: 5; stroke-linecap: butt; stroke-linejoin: round; }
  .pipe.dim { stroke: #39435a; }
  .pipe.flowing.pipe-hot { filter: drop-shadow(0 0 3px rgba(224,80,60,.7)); }
  .pipe.flowing.pipe-cold { filter: drop-shadow(0 0 3px rgba(74,144,217,.7)); }

  /* Fluss-Animation: helle Punkte wandern ueber dem durchgezogenen Rohr
     (zweilagig: Basisrohr voll, Punktlage animiert) - Richtung folgt der
     Zeichenrichtung des Pfads. */
  .pipe-dots { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0.1 14; animation: flowdots 1s linear infinite; }
  @keyframes flowdots { to { stroke-dashoffset: -28.2; } }
  @keyframes fanspin { to { transform: rotate(360deg); } }

  /* Kaeltemittelleitung: gestrichelt in Amber (klar als anderes Medium
     vom Wasser unterscheidbar), Strichelung WANDERT bei laufendem
     Verdichter (Dietmar, 14.08.2026: "eigentlich fliesst doch das Gas
     auch") - Richtung folgt der Zeichenrichtung des Pfads. */
  .refr { fill: none; stroke: #c9a04a; stroke-width: 3; stroke-dasharray: 3 6; stroke-linecap: round; }
  .refr.still { stroke: #7b8aa3; }
  .refr.flowing { animation: refrflow 0.7s linear infinite; }
  @keyframes refrflow { to { stroke-dashoffset: -18; } }

  /* Werte-Chip: dunkle Pille, Randfarbe = Mess-/Leitungsfarbe, Wert in
     Weiss - kleine, praezise Instrumentenanzeige statt frei schwebendem
     Text (Prinzip 1). */
  .chip { fill: #0d1626; stroke-width: 1.5; }
  .chip-text { font: 700 12px/1 -apple-system, sans-serif; fill: #eef2f6; text-anchor: middle; }
  .chip-unit { font-weight: 500; font-size: 9.5px; fill: #a8b4c8; }
  .chip-tag { font-size: 8.5px; font-weight: 600; fill: #93a3bd; letter-spacing: .35px; text-transform: uppercase; text-anchor: middle; }

  .tank-outline { fill: none; stroke: #8a9cb8; stroke-width: 1.5; }
  .tank-label { font-size: 10.5px; font-weight: 700; fill: #eef2f6; text-anchor: middle; }
  .tank-liters { font-size: 10px; font-weight: 700; fill: rgba(255,255,255,.9); text-anchor: middle; }
  .tank-coil { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1.6; }

  .valve { fill: none; stroke: #8a9cb8; stroke-width: 1.6; stroke-linejoin: round; }
  .badge { font-size: 9px; font-weight: 700; text-anchor: middle; }
  .tag { font-size: 8.5px; font-weight: 600; fill: #93a3bd; letter-spacing: .3px; text-transform: uppercase; text-anchor: middle; }

  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 13px; opacity: .75; color: #ccc; }
</style>
</head>
<body>
<div id="wrap">
  <div id="empty" class="empty" style="display:none"></div>
  <div id="units"></div>
</div>

<script>
var lastData = null;

function fmtTemp1(v) {
  return (v === null || v === undefined) ? null : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
}
function fmtPower(w) {
  if (w === null || w === undefined) { return null; }
  var a = Math.abs(w);
  return (a >= 1000 ? { v: (w / 1000).toFixed(2).replace('.', ','), u: 'kW' } : { v: String(Math.round(w)), u: 'W' });
}

function el(tag, attrs) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

// Temperatur-Farbskala (15°C blau .. 65°C rot)
function tempColor(c) {
  if (c === null || c === undefined) { return '#8a919c'; }
  var t = Math.max(0, Math.min(1, (c - 15) / 50));
  var a = [74, 144, 217], b = [224, 80, 60];
  var r = Math.round(a[0] + (b[0] - a[0]) * t);
  var g = Math.round(a[1] + (b[1] - a[1]) * t);
  var bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Werte-Chip an der Leitung (Prinzip 1 der Referenz-Essenz): dunkle
// Pille, Randfarbe traegt die Information (Leitungs-/Temperaturfarbe),
// Wert weiss und fett. Optionaler Tag darueber.
function chip(x, y, text, unit, borderColor, tag) {
  var g = el('g', {});
  var label = text + (unit ? ' ' + unit : '');
  var w = Math.max(44, label.length * 6.8 + 14);
  var h = 19;
  g.appendChild(el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: h / 2, class: 'chip', stroke: borderColor || '#6f83a3' }));
  var t = el('text', { x: x, y: y + 4, class: 'chip-text' });
  t.textContent = text;
  if (unit) {
    var u = el('tspan', { class: 'chip-unit', dx: 2 });
    u.textContent = unit;
    t.appendChild(u);
  }
  g.appendChild(t);
  if (tag) {
    var tg = el('text', { x: x, y: y - h / 2 - 4, class: 'chip-tag' });
    tg.textContent = tag;
    g.appendChild(tg);
  }
  return g;
}

// Ventil (Kontur-Bowtie). Fuellfarbe nur zur Zustandsanzeige.
function valveSymbol(x, y, r, color, tag, filled) {
  r = r || 7;
  var g = el('g', {});
  g.appendChild(el('path', {
    d: 'M' + (x - r) + ',' + (y - r) + ' L' + (x + r) + ',' + (y + r) + ' L' + (x + r) + ',' + (y - r) + ' L' + (x - r) + ',' + (y + r) + ' Z',
    fill: filled ? color : 'none', 'fill-opacity': filled ? 0.55 : 0,
    stroke: color || '#8a9cb8', 'stroke-width': 1.6, 'stroke-linejoin': 'round'
  }));
  if (tag) {
    var t = el('text', { x: x, y: y + r + 14, class: 'tag', fill: color }); t.textContent = tag; g.appendChild(t);
  }
  return g;
}

// Umwaelzpumpe: Kreis + Richtungsdreieck, Zustand ueber Fuellfarbe
// (Prinzip 3: gruen gefuellt = laeuft, grau = steht - wie die "100%"-
// Pumpe im OekoFEN-Referenzbild; KEIN Pulsieren mehr).
function pumpIcon(x, y, active, dirDeg) {
  var g = el('g', {});
  g.appendChild(el('circle', { cx: x, cy: y, r: 10, fill: active ? '#2f9e44' : '#243149', stroke: active ? '#69cf7d' : '#8a9cb8', 'stroke-width': 1.6 }));
  var tri = el('path', { d: 'M-4,-5.5 L7,0 L-4,5.5 Z', fill: '#ffffff', transform: 'translate(' + x + ',' + y + ') rotate(' + (dirDeg || 0) + ')' });
  g.appendChild(tri);
  return g;
}

// Speicher: kraeftiger Rot-nach-Blau-Verlauf (Prinzip 2), geschwungene
// Rohrschlangen-Wicklung aus weichen Boegen statt Zickzack, Liter-Angabe
// direkt auf der Flaeche. Groesse proportional zum realen Volumen.
var tankGradSeq = 0;
function tankShape(svg, x, y, w, h, temp, label, liters) {
  var g = el('g', {});
  var defs = svg.querySelector('defs') || svg.insertBefore(el('defs', {}), svg.firstChild);
  var gid = 'tg' + (++tankGradSeq);
  var grad = el('linearGradient', { id: gid, x1: '0', y1: '0', x2: '0', y2: '1' });
  var topC = temp !== null && temp !== undefined ? tempColor(temp + 8) : '#3a4358';
  var botC = temp !== null && temp !== undefined ? tempColor(temp - 8) : '#2a3348';
  grad.appendChild(el('stop', { offset: '0%', 'stop-color': topC }));
  grad.appendChild(el('stop', { offset: '100%', 'stop-color': botC }));
  defs.appendChild(grad);

  // Beide Kappen-Boegen mit sweep=0 (gegen den Uhrzeigersinn): unterer
  // Bogen woelbt nach unten, oberer nach oben. sweep=1 am oberen Bogen
  // liess den Deckel nach INNEN klappen - der Tank sah aus wie eine
  // Muschel (real gefunden im Preview, 14.08.2026).
  var r = w / 2;
  var d = 'M' + (x - r) + ',' + (y + r) + ' L' + (x - r) + ',' + (y + h - r)
    + ' A' + r + ',' + r + ' 0 0 0 ' + (x + r) + ',' + (y + h - r)
    + ' L' + (x + r) + ',' + (y + r)
    + ' A' + r + ',' + r + ' 0 0 0 ' + (x - r) + ',' + (y + r) + ' Z';
  g.appendChild(el('path', { d: d, fill: 'url(#' + gid + ')' }));
  g.appendChild(el('path', { d: d, class: 'tank-outline' }));

  // Wicklung: weiche, uebereinanderliegende Boegen im unteren Drittel
  var coilTop = y + h * 0.5;
  var cw = r * 1.15;
  var cd = '';
  for (var ci = 0; ci < 3; ci++) {
    var cy2 = coilTop + ci * 9;
    cd += 'M' + (x - cw) + ',' + cy2
      + ' C' + (x - cw * 0.5) + ',' + (cy2 + 8) + ' ' + (x + cw * 0.5) + ',' + (cy2 + 8) + ' ' + (x + cw) + ',' + cy2 + ' ';
  }
  g.appendChild(el('path', { d: cd, class: 'tank-coil' }));

  // Name + Liter direkt AUF der Tankflaeche (iDM-Referenzmuster) statt
  // unterhalb - Rohrleitungen unter dem Tank koennen die Beschriftung
  // dann nicht mehr anschneiden (real passiert beim Puffer-Ruecklauf).
  if (label) {
    var lt = el('text', { x: x, y: y + h * 0.3, class: 'tank-label' }); lt.textContent = label; g.appendChild(lt);
  }
  if (liters) {
    var lt2 = el('text', { x: x, y: y + h * 0.3 + 13, class: 'tank-liters' }); lt2.textContent = liters; g.appendChild(lt2);
  }
  svg.appendChild(g);
  return g;
}

// Aussengeraet nach Panasonics Technikzeichnung (WH-UD09JE5-1, aus dem
// offiziellen Hydraulikschema-PDF, Wunsch Dietmar 14.08.2026): Gehaeuse
// mit horizontalem Lamellengitter ueber die volle Front, grosser
// Luefterkreis HINTER dem Gitter, rechts eine schmale Spalte mit
// Luftschlitzen, kleine Standfuesse. Der Luefter rotiert hinter den
// Lamellen weiter, wenn der Verdichter laeuft.
function outdoorUnit(svg, x, y, w, h, running, fanSpeed) {
  var g = el('g', {});
  var C = '#8a9cb8';
  // Gehaeuse
  g.appendChild(el('rect', { x: x, y: y, width: w, height: h, rx: 3, fill: '#16233a', stroke: C, 'stroke-width': 1.5 }));
  // Standfuesse
  var footY = y + h;
  [x + 14, x + w - 22].forEach(function (fx) {
    g.appendChild(el('path', { d: 'M' + fx + ',' + footY + ' l-4,6 h16 l-4,-6 Z', fill: '#16233a', stroke: C, 'stroke-width': 1.2 }));
  });
  // Luefter (hinter dem Gitter): Kreis + rotierende Blaetter
  var fanCx = x + w * 0.40, fanCy = y + h / 2, fanR = h * 0.38;
  g.appendChild(el('circle', { cx: fanCx, cy: fanCy, r: fanR, fill: 'none', stroke: C, 'stroke-width': 1.4 }));
  // Translate im WRAPPER-Element, Rotation im inneren - eine CSS-
  // transform-Animation ERSETZT die transform des eigenen Elements,
  // eine Attribut-translate am selben Element ginge dabei verloren
  // (real passiert: Blaetter rotierten oben links am Ursprung statt
  // im Geraet, 14.08.2026).
  var bladesWrap = el('g', { transform: 'translate(' + fanCx + ',' + fanCy + ')' });
  var blades = el('g', {});
  // fanSpeed = echte Lueferdrehzahl (HeishaMon contractVersion 1.5,
  // fan1SpeedID) - Rotationstempo proportional; ohne den Wert (aeltere
  // Vertragsversion) Fallback auf laufender-Verdichter mit Fixtempo.
  var spinning = (typeof fanSpeed === 'number') ? fanSpeed > 0 : running;
  if (spinning) {
    var dur = (typeof fanSpeed === 'number' && fanSpeed > 0)
      ? Math.max(0.35, Math.min(3.0, 900 / fanSpeed)).toFixed(2)
      : '1.6';
    blades.style.animation = 'fanspin ' + dur + 's linear infinite';
    blades.style.transformOrigin = '0px 0px';
  }
  for (var i = 0; i < 4; i++) {
    blades.appendChild(el('path', { d: 'M0,0 Q' + (fanR * 0.38) + ',' + (-fanR * 0.55) + ' 0,' + (-fanR * 0.85), fill: 'none', stroke: '#9fb0c8', 'stroke-width': 1.3, transform: 'rotate(' + (i * 90) + ')' }));
  }
  blades.appendChild(el('circle', { cx: 0, cy: 0, r: 2, fill: '#9fb0c8' }));
  bladesWrap.appendChild(blades);
  g.appendChild(bladesWrap);
  // Lamellengitter ueber dem Lueferbereich (linke ~72% der Front)
  var grilleR = x + w * 0.72;
  var lam = '';
  for (var ly = y + 8; ly < y + h - 6; ly += 6) {
    lam += 'M' + (x + 6) + ',' + ly + ' L' + grilleR + ',' + ly + ' ';
  }
  g.appendChild(el('path', { d: lam, fill: 'none', stroke: C, 'stroke-width': 0.8, opacity: 0.75 }));
  // Rechte Spalte: Luftschlitze
  var sl = '';
  for (var sy = y + 16; sy < y + h - 12; sy += 14) {
    sl += 'M' + (grilleR + 8) + ',' + sy + ' L' + (x + w - 8) + ',' + sy + ' ';
  }
  g.appendChild(el('path', { d: sl, fill: 'none', stroke: C, 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
  svg.appendChild(g);
  return g;
}

function arrowHead(x, y, dir, color) {
  var pts = { r: [[x - 5, y - 4], [x + 5, y], [x - 5, y + 4]], l: [[x + 5, y - 4], [x - 5, y], [x + 5, y + 4]], d: [[x - 4, y - 5], [x, y + 5], [x + 4, y - 5]], u: [[x - 4, y + 5], [x, y - 5], [x + 4, y + 5]] };
  var p = pts[dir] || pts.r;
  return el('path', { d: 'M' + p[0][0] + ',' + p[0][1] + ' L' + p[1][0] + ',' + p[1][1] + ' L' + p[2][0] + ',' + p[2][1] + ' Z', fill: color });
}

function buildSchema(unit) {
  // Reale Anlagentopologie (Dietmar, 13.08.2026): Splitgeraet, Innengeraet
  // mit fest eingebautem 185l-Brauchwassertank, Heizkreis laeuft ueber
  // einen 100l-Pufferspeicher, dahinter externe Pumpe + Mischventil
  // (2. Steuerplatine, Live-Werte seit HeishaMon contractVersion 1.4)
  // zu Radiatoren/Flaechenheizkoerpern (FBH nur Bad).
  var W = 1000, H = 430;
  var svg = el('svg', { class: 'schema', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(el('defs', {}));
  svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, class: 'schema-bg' }));

  var running = (unit.compressorFreq || 0) > 0;
  var toDhw = unit.threeWayValve === 1;
  var toRoom = unit.threeWayValve === 0 || unit.threeWayValve === null;
  var HOT = '#e0503c', COLD = '#4a90d9';

  // Rohr zweilagig: Basisrohr voll durchgezogen in Funktionsfarbe (grau
  // wenn inaktiv), darueber bei aktivem Fluss wandernde helle Punkte.
  function pipe(d, cls, active) {
    var g = el('g', {});
    g.appendChild(el('path', { d: d, class: 'pipe ' + (active ? cls + ' flowing' : 'dim') }));
    if (active) { g.appendChild(el('path', { d: d, class: 'pipe-dots' })); }
    return g;
  }
  function refrigerantLine(d, active) {
    return el('path', { d: d, class: 'refr ' + (active ? 'flowing' : 'still') });
  }

  // ── Aussengeraet (Panasonic-Technikzeichnungs-Optik) ─────────
  var at = el('text', { x: 100, y: 112, class: 'box-title' }); at.textContent = 'AUSSENGERÄT'; svg.appendChild(at);
  outdoorUnit(svg, 35, 122, 130, 110, running, unit.fanSpeed);
  if (unit.fanSpeed !== null && unit.fanSpeed !== undefined) {
    svg.appendChild(chip(100, 310, String(Math.round(unit.fanSpeed)), 'U/min', unit.fanSpeed > 0 ? '#69cf7d' : '#6f83a3', 'Lüfter'));
  }
  svg.appendChild(chip(100, 260, unit.compressorFreq !== null && unit.compressorFreq !== undefined ? String(Math.round(unit.compressorFreq)) : '–', 'Hz', running ? '#69cf7d' : '#6f83a3', 'Verdichter'));
  var pw = fmtPower(unit.power);
  if (pw) { svg.appendChild(chip(100, 88, pw.v, pw.u, '#6f83a3', 'Leistung')); }
  if (unit.defrosting) {
    svg.appendChild(el('rect', { x: 40, y: 274, width: 120, height: 15, rx: 3, fill: '#4a90d9' }));
    var db = el('text', { x: 100, y: 285, class: 'badge', fill: '#0a1220' }); db.textContent = 'ABTAUBETRIEB'; svg.appendChild(db);
  }

  // Kaeltemittelleitungen zum Innengeraet
  // Heissgas hin (oben), Fluessigkeit zurueck (unten - Zeichenrichtung
  // umgekehrt, damit die wandernde Strichelung zuruecklaeuft).
  svg.appendChild(refrigerantLine('M165,160 L230,160', running));
  svg.appendChild(refrigerantLine('M230,200 L165,200', running));
  if (unit.dischargeTemp !== null && unit.dischargeTemp !== undefined) {
    svg.appendChild(chip(195, 138, fmtTemp1(unit.dischargeTemp), '°C', tempColor(unit.dischargeTemp), 'Heissgas'));
  }

  // ── Innengeraet: Kombi-Hydromodul WH-ADC0309J3E5 ─────────────
  // Leitungsfuehrung nach Panasonics OFFIZIELLEM Hydraulikschema fuer
  // exakt diese Geraetekombination (PDF von Dietmar, 14.08.2026,
  // WH-ADC0309J3E5 + WH-UD09JE5-1): Der WW-Tank sitzt IM Innengeraet
  // (All-in-One), der Puffer PAW-BTANK100L ist eine hydraulische Weiche
  // mit 4 Anschluessen (primaer links vom Innengeraet, sekundaer rechts
  // zum Heizkreis), die externe Pumpe (H14) sitzt sekundaerseitig NACH
  // dem Puffer, und die Sanitaerseite (Kaltwasser rein / Warmwasser zur
  // Zapfstelle H22) gehoert mit ins Bild.
  svg.appendChild(el('rect', { x: 230, y: 80, width: 210, height: 280, rx: 4, class: 'box' }));
  var it = el('text', { x: 335, y: 100, class: 'box-title' }); it.textContent = 'INNENGERÄT'; svg.appendChild(it);
  var it2 = el('text', { x: 335, y: 113, class: 'tag' }); it2.textContent = 'Kombi-Hydromodul'; svg.appendChild(it2);

  // 3-Wege-Ventil (Umschaltung Heizen/WW)
  svg.appendChild(valveSymbol(270, 145, 7, toDhw ? '#e0b93c' : HOT, toDhw ? 'WW' : 'RAUM', true));
  var twoWayOpen = unit.twoWayValve !== false;
  svg.appendChild(valveSymbol(270, 192, 7, twoWayOpen ? COLD : '#6f83a3', twoWayOpen ? 'AUF' : 'ZU', twoWayOpen));

  if (unit.mainOutletTemp !== null && unit.mainOutletTemp !== undefined) {
    svg.appendChild(chip(380, 136, fmtTemp1(unit.mainOutletTemp), '°C', HOT, 'Vorlauf'));
  }
  if (unit.mainInletTemp !== null && unit.mainInletTemp !== undefined) {
    svg.appendChild(chip(380, 195, fmtTemp1(unit.mainInletTemp), '°C', COLD, 'Rücklauf'));
  }
  // Spreizung (Vorlauf - Ruecklauf) zwischen den beiden Chips - die
  // eigentlich interessante Betriebskennzahl (Dietmars Frage, 14.08.2026:
  // "Gibt es zwischen Vor- und Ruecklauf Temperatur Unterschiede die man
  // darstellen koennte?").
  var haveVLRL = unit.mainOutletTemp !== null && unit.mainOutletTemp !== undefined
    && unit.mainInletTemp !== null && unit.mainInletTemp !== undefined;
  if (haveVLRL) {
    var dT = unit.mainOutletTemp - unit.mainInletTemp;
    svg.appendChild(chip(380, 162, 'ΔT ' + fmtTemp1(dT), 'K', '#e0b93c', null));
  }
  // interne Pumpe + Messwerte
  svg.appendChild(pumpIcon(270, 232, running, 0));
  if (unit.pumpSpeed !== null && unit.pumpSpeed !== undefined) {
    svg.appendChild(chip(330, 232, String(Math.round(unit.pumpSpeed)), 'U/min', running ? '#69cf7d' : '#6f83a3', null));
  }
  if (unit.pumpFlow !== null && unit.pumpFlow !== undefined) {
    svg.appendChild(chip(400, 232, fmtTemp1(unit.pumpFlow), 'l/min', running ? '#69cf7d' : '#6f83a3', null));
  }

  // Integrierter WW-Tank (185l) unten im Geraet
  svg.appendChild(pipe('M263,145 L246,145 L246,295 L307,295', 'pipe-hot', running && toDhw));
  tankShape(svg, 333, 255, 52, 92, unit.dhwTemp, 'WW-Tank', '185 l');
  if (unit.dhwTemp !== null && unit.dhwTemp !== undefined) {
    svg.appendChild(chip(400, 330, fmtTemp1(unit.dhwTemp), '°C', tempColor(unit.dhwTemp), null));
  }

  // Sanitaerseite (Panasonic H21/H22): Kaltwasser von unten in den Tank,
  // Warmwasser zur Zapfstelle - duenne, statische Leitungen (ob gerade
  // gezapft wird, ist nicht messbar).
  svg.appendChild(el('path', { d: 'M333,400 L333,349', fill: 'none', stroke: '#7cc4ee', 'stroke-width': 3 }));
  var kwTag = el('text', { x: 333, y: 414, class: 'tag' }); kwTag.textContent = 'Kaltwasser'; svg.appendChild(kwTag);
  svg.appendChild(el('path', { d: 'M359,270 L480,270 L480,300', fill: 'none', stroke: '#e58c7a', 'stroke-width': 3 }));
  // Zapfstellen-Symbol (Duschkopf)
  svg.appendChild(el('path', { d: 'M480,300 L480,308 M470,312 L490,312 M473,318 L473,324 M480,318 L480,326 M487,318 L487,324', fill: 'none', stroke: '#7cc4ee', 'stroke-width': 2, 'stroke-linecap': 'round' }));
  var zTag = el('text', { x: 480, y: 340, class: 'tag' }); zTag.textContent = 'Warmwasser'; svg.appendChild(zTag);

  // ── Puffer als hydraulische Weiche (PAW-BTANK100L) ───────────
  // Primaerseite links (Innengeraet), Sekundaerseite rechts (Heizkreis).
  var pumpKnown = unit.extPump !== null && unit.extPump !== undefined;
  var pumpOn = pumpKnown ? !!unit.extPump : (running && toRoom);
  svg.appendChild(pipe('M440,120 L546,120', 'pipe-hot', running && toRoom));
  // Thermische Heizleistung aus Spreizung x Durchfluss (P = m*c*dT,
  // Wasser ~4,186 kJ/kgK) - Referenzvorbild Aquarea-Wiki "Leistung
  // therm.". Nur bei realem Umlauf (Durchfluss > 0) angezeigt, sonst
  // waere die Rechnung Rauschen.
  if (haveVLRL && unit.pumpFlow !== null && unit.pumpFlow !== undefined && unit.pumpFlow > 0) {
    var pTh = (unit.pumpFlow / 60) * 4.186 * (unit.mainOutletTemp - unit.mainInletTemp);
    svg.appendChild(chip(493, 95, (Math.round(pTh * 100) / 100).toFixed(2).replace('.', ','), 'kW', HOT, 'therm. Leistung'));
  }
  if (running && toRoom) { svg.appendChild(arrowHead(495, 120, 'r', HOT)); }
  svg.appendChild(pipe('M546,170 L440,170', 'pipe-cold', running && toRoom));
  if (running && toRoom) { svg.appendChild(arrowHead(495, 170, 'l', COLD)); }
  tankShape(svg, 570, 95, 48, 100, unit.bufferTemp, 'Puffer', '100 l');
  if (unit.bufferTemp !== null && unit.bufferTemp !== undefined) {
    svg.appendChild(chip(570, 75, fmtTemp1(unit.bufferTemp), '°C', tempColor(unit.bufferTemp), null));
  }
  // Ausdehnungsgefaess (H6) am primaeren Ruecklauf
  svg.appendChild(el('path', { d: 'M480,170 L480,196', fill: 'none', stroke: '#7b8aa3', 'stroke-width': 2 }));
  svg.appendChild(el('circle', { cx: 480, cy: 205, r: 9, fill: 'none', stroke: '#7b8aa3', 'stroke-width': 1.5 }));
  svg.appendChild(el('path', { d: 'M471,205 A9,9 0 0 0 489,205', fill: '#7b8aa3', 'fill-opacity': 0.4 }));
  var adgTag = el('text', { x: 480, y: 228, class: 'tag' }); adgTag.textContent = 'ADG'; svg.appendChild(adgTag);

  // ── Sekundaerkreis: Puffer -> Mischer -> ext. Pumpe -> Heizkreis ──
  svg.appendChild(pipe('M594,120 L636,120', 'pipe-hot', pumpOn));
  var mv = unit.extMixingValve;
  if (mv === 2) {
    svg.appendChild(valveSymbol(650, 120, 7, HOT, 'öffnet', true));
  } else if (mv === 1) {
    svg.appendChild(valveSymbol(650, 120, 7, COLD, 'schließt', true));
  } else if (mv === 0) {
    svg.appendChild(valveSymbol(650, 120, 7, '#8a9cb8', 'steht', false));
  } else {
    svg.appendChild(valveSymbol(650, 120, 7, '#8a9cb8', null, false));
  }
  svg.appendChild(pipe('M664,120 L696,120', 'pipe-hot', pumpOn));
  svg.appendChild(pumpIcon(710, 120, pumpOn, 0));
  var extTag = el('text', { x: 690, y: 95, class: 'tag' }); extTag.textContent = 'Mischer + ext. Pumpe'; svg.appendChild(extTag);
  svg.appendChild(pipe('M720,120 L790,120', 'pipe-hot', pumpOn));
  if (pumpOn) { svg.appendChild(arrowHead(760, 120, 'r', HOT)); }

  // ── Heizkreis ────────────────────────────────────────────────
  svg.appendChild(el('rect', { x: 790, y: 85, width: 180, height: 100, rx: 4, class: 'box' }));
  var rt = el('text', { x: 880, y: 107, class: 'box-title' }); rt.textContent = 'HEIZKREIS'; svg.appendChild(rt);
  var rt2 = el('text', { x: 880, y: 124, class: 'tag' }); rt2.textContent = 'Radiatoren + Flächenheizk.'; svg.appendChild(rt2);
  var rt3 = el('text', { x: 880, y: 137, class: 'tag' }); rt3.textContent = 'FBH nur Bad'; svg.appendChild(rt3);
  if (unit.z1WaterTemp !== null && unit.z1WaterTemp !== undefined) {
    svg.appendChild(chip(880, 162, fmtTemp1(unit.z1WaterTemp), '°C', tempColor(unit.z1WaterTemp), null));
  }

  // Sekundaerer Ruecklauf: Heizkreis -> Puffer (rechts unten)
  svg.appendChild(pipe('M880,185 L880,240 L620,240 L620,170 L594,170', 'pipe-cold', pumpOn));
  if (pumpOn) { svg.appendChild(arrowHead(740, 240, 'l', COLD)); }

  return svg;
}

function buildBasicCard(unit) {
  var box = document.createElement('div');
  box.style.cssText = 'padding:14px 16px;border-radius:4px;background:#16233a;border:1.5px solid #6f83a3;color:#eef2f6;font-size:12px;';
  var pw = fmtPower(unit.power);
  box.innerHTML = 'Keine Anlagenschema-Daten (Pumpen/Ventile/Durchfluss) verfügbar - nur Basiswerte.' +
    (pw ? '<div style="margin-top:6px;font-weight:700">Leistung: ' + pw.v + ' ' + pw.u + '</div>' : '');
  return box;
}

function handleMessage(raw) {
  var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
  lastData = d;
  var empty = document.getElementById('empty');
  var unitsEl = document.getElementById('units');
  if (d && d.bg) { document.body.style.background = d.bg; }
  if (d && d.font) { document.body.style.fontFamily = d.font; }

  if (!d || !d.ok) {
    unitsEl.style.display = 'none';
    empty.style.display = 'flex';
    empty.textContent = (d && d.error) || 'Keine Daten verfügbar.';
    return;
  }
  empty.style.display = 'none';
  unitsEl.style.display = '';
  unitsEl.innerHTML = '';

  (d.units || []).forEach(function (unit) {
    var row = document.createElement('div');
    row.className = 'unit';
    var title = document.createElement('div');
    title.className = 'unit-title';
    title.textContent = unit.label;
    row.appendChild(title);
    if (unit.hasPipeSchema) {
      row.appendChild(buildSchema(unit));
    } else {
      row.appendChild(buildBasicCard(unit));
    }
    unitsEl.appendChild(row);
  });
}
</script>
