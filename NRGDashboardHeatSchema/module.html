<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .unit { padding: 10px 12px; }
  .unit-title { font-size: 13px; font-weight: 700; color: #eef2f6; margin-bottom: 4px; }
  svg.schema { width: 100%; height: auto; display: block; }

  /* Dunkles Navy-Blau-Bedienpanel statt Fast-Schwarz, Rohre mit dezentem
     Leuchten (Referenz: Bernhard Baptists "Wärmepumpe Visu"-Video,
     14.08.2026 - Dietmars klare Ansage: "das hätte ich sehr viel lieber"
     als der vorherige, flachere Entwurf). */
  .schema-bg { fill: #101a2c; }
  .box { fill: #16233a; stroke: #6f83a3; stroke-width: 1.5; }
  .box-title { font-size: 11px; font-weight: 700; fill: #eef2f6; text-anchor: middle; }

  .pipe-hot { stroke: #e0503c; }
  .pipe-cold { stroke: #4a90d9; }
  .pipe { fill: none; stroke-width: 4; stroke-linecap: butt; }
  .pipe.dim { stroke: #3a4358; }
  .pipe.flowing.pipe-hot { filter: drop-shadow(0 0 3px rgba(224,80,60,.8)); }
  .pipe.flowing.pipe-cold { filter: drop-shadow(0 0 3px rgba(74,144,217,.8)); }

  /* Fluss-Animation: kurze helle Chevrons laufen ueber das durchgezogene
     Rohr, Richtung ergibt sich allein aus der Zeichenrichtung des
     jeweiligen Pfad-d (Start=stromaufwaerts), kein manuelles Umdrehen
     noetig. */
  .pipe.flowing { stroke-dasharray: 3 10; animation: flowdash 0.9s linear infinite; }
  @keyframes flowdash { to { stroke-dashoffset: -26; } }

  @keyframes fanspin { to { transform: rotate(360deg); } }
  @keyframes pumpspin { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .val { font: 700 12px/1 -apple-system, sans-serif; paint-order: stroke; stroke: #0a1220; stroke-width: 3px; stroke-linejoin: round; }
  .tag { font-size: 8.5px; font-weight: 600; fill: #93a3bd; letter-spacing: .3px; text-transform: uppercase; paint-order: stroke; stroke: #0a1220; stroke-width: 3px; stroke-linejoin: round; }

  .tank-outline { fill: none; stroke: #8a9cb8; stroke-width: 1.5; }
  .tank-label { font-size: 10.5px; font-weight: 700; fill: #eef2f6; text-anchor: middle; }
  .tank-coil { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.2; }

  .valve { fill: none; stroke: #8a9cb8; stroke-width: 1.5; }
  .valve-fill { stroke: none; }

  /* Anfuehrungspfeil einheitlich gelb/amber (Referenz-Vorbild) - die
     Zahl selbst bleibt temperaturfarbig, nur der Zeiger ist neutral. */
  .callout { stroke: #e0b93c; }
  .callout-dot { fill: #e0b93c; }

  .divider { stroke: #4a4f57; stroke-width: 1; stroke-dasharray: 5 4; }
  .badge { font-size: 9px; font-weight: 700; text-anchor: middle; }

  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 13px; opacity: .75; color: #ccc; }
</style>
</head>
<body>
<div id="wrap">
  <div id="empty" class="empty" style="display:none"></div>
  <div id="units"></div>
</div>

<script>
var lastData = null;

function fmtTemp1(v) {
  return (v === null || v === undefined) ? null : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
}
function fmtPower(w) {
  if (w === null || w === undefined) { return null; }
  var a = Math.abs(w);
  return (a >= 1000 ? { v: (w / 1000).toFixed(2).replace('.', ','), u: 'kW' } : { v: String(Math.round(w)), u: 'W' });
}

function el(tag, attrs) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

// Temperatur-Farbskala (15°C blau .. 65°C rot) - jeder Messwert ist damit
// auch ohne Ablesen der Zahl grob als kalt/warm/heiss erkennbar.
function tempColor(c) {
  if (c === null || c === undefined) { return '#8a919c'; }
  var t = Math.max(0, Math.min(1, (c - 15) / 50));
  var a = [61, 127, 196], b = [217, 79, 60];
  var r = Math.round(a[0] + (b[0] - a[0]) * t);
  var g = Math.round(a[1] + (b[1] - a[1]) * t);
  var bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Wert direkt am Rohr/Bauteil, ohne Chip-Hintergrund - reiner fetter Text
// mit dunklem Konturstrich fuer Lesbarkeit vor Rohren/Linien (Referenz-
// Vorbild: aquarea.smallsolutions.de).
function valueText(x, y, text, unit, color, tag) {
  var g = el('g', {});
  if (tag) {
    var tg = el('text', { x: x, y: y - 12, class: 'tag', 'text-anchor': 'middle' }); tg.textContent = tag; g.appendChild(tg);
  }
  var vt = el('text', { x: x, y: y, class: 'val', 'text-anchor': 'middle', fill: color || '#eef2f6' });
  vt.textContent = text + (unit ? ' ' + unit : '');
  g.appendChild(vt);
  return g;
}

// Wert mit Anfuehrungslinie: Text steht frei im offenen Raum, ein duenner
// Strich mit Punkt zeigt auf die tatsaechliche Messstelle am Rohr/Bauteil
// (Referenz-Vorbild: Bernhard Baptists "Wärmepumpe Visu"-Video sowie die
// Solvis-Anlage aus der Symcon-Community, 13.08.2026 - beide platzieren
// Werte so, statt sie auf die Leitung zu schreiben). (px,py) = Messpunkt,
// (lx,ly) = Position der Beschriftung.
function calloutValue(px, py, lx, ly, text, unit, color, tag) {
  var g = el('g', {});
  g.appendChild(el('circle', { cx: px, cy: py, r: 2.5, class: 'callout-dot' }));
  g.appendChild(el('line', { x1: px, y1: py, x2: lx, y2: ly - 3, class: 'callout', 'stroke-width': 1.2 }));
  g.appendChild(valueText(lx, ly, text, unit, color, tag));
  return g;
}

// Ventil-Symbol (Schmetterling/Bowtie) - Standard-Fliessbildsymbol,
// Kontur wie die Rohre/Kaesten, Fuellung zeigt den Zustand.
function valveSymbol(x, y, color, tag) {
  var g = el('g', {});
  g.appendChild(el('circle', { cx: x, cy: y, r: 10, fill: '#14171a', class: 'valve' }));
  g.appendChild(el('path', { d: 'M' + (x - 6) + ',' + (y - 5) + ' L' + (x + 6) + ',' + (y + 5) + ' L' + (x + 6) + ',' + (y - 5) + ' L' + (x - 6) + ',' + (y + 5) + ' Z', fill: color, class: 'valve-fill' }));
  if (tag) {
    var t = el('text', { x: x, y: y + 23, class: 'tag', 'text-anchor': 'middle', fill: color }); t.textContent = tag; g.appendChild(t);
  }
  return g;
}

// Grosser, fetter Messwert DIREKT auf der Tankflaeche (Referenz-Vorbild:
// iDM-Anlagenschema aus der Symcon-Community, 13.08.2026) - der Tank ist
// breit genug, eine Anfuehrungslinie waere hier ueberfluessig, anders als
// bei duennen Rohrabschnitten (siehe calloutValue()).
function tankReadout(x, y, text) {
  var t = el('text', { x: x, y: y + 4, class: 'val', 'text-anchor': 'middle', fill: '#fff', style: 'font-size:15px' });
  t.textContent = text + ' °C';
  return t;
}

var tankGradSeq = 0;
// Hoher Tank mit echtem Temperatur-Verlauf (warm oben, kuehler unten) -
// Referenz-Vorbild zeigt eine reale Schichtung; wir haben nur EINEN
// Messpunkt, bilden die Schichtung deshalb symmetrisch um diesen Wert ab
// (±6°C) statt flach einzufaerben - liest sich auf Anhieb als Speicher,
// nicht als bunte Kapsel.
function tankShape(svg, x, y, w, h, temp, label) {
  var g = el('g', {});
  var defs = svg.querySelector('defs') || svg.insertBefore(el('defs', {}), svg.firstChild);
  var gid = 'tg' + (++tankGradSeq);
  var grad = el('linearGradient', { id: gid, x1: '0', y1: '0', x2: '0', y2: '1' });
  var topC = temp !== null && temp !== undefined ? tempColor(temp + 6) : '#3a3f47';
  var botC = temp !== null && temp !== undefined ? tempColor(temp - 6) : '#3a3f47';
  grad.appendChild(el('stop', { offset: '0%', 'stop-color': topC }));
  grad.appendChild(el('stop', { offset: '100%', 'stop-color': botC }));
  defs.appendChild(grad);

  var r = w / 2;
  var d = 'M' + (x - r) + ',' + (y + r) + ' L' + (x - r) + ',' + (y + h - r)
    + ' A' + r + ',' + r + ' 0 0 0 ' + (x + r) + ',' + (y + h - r)
    + ' L' + (x + r) + ',' + (y + r)
    + ' A' + r + ',' + r + ' 0 0 0 ' + (x - r) + ',' + (y + r) + ' Z';
  g.appendChild(el('path', { d: d, fill: 'url(#' + gid + ')', 'fill-opacity': 0.85 }));
  g.appendChild(el('ellipse', { cx: x, cy: y + r, rx: r, ry: r * 0.42, class: 'tank-outline' }));
  g.appendChild(el('path', { d: 'M' + (x - r) + ',' + (y + r) + ' L' + (x - r) + ',' + (y + h - r) + ' M' + (x + r) + ',' + (y + r) + ' L' + (x + r) + ',' + (y + h - r), class: 'tank-outline' }));
  g.appendChild(el('ellipse', { cx: x, cy: y + h - r, rx: r, ry: r * 0.42, class: 'tank-outline', fill: 'none' }));
  // Waermetauscher-Spule (Referenz-Vorbild: "Wärmepumpe Visu"-Video,
  // 14.08.2026) - reines Schmuckdetail, kein eigener Messwert, macht den
  // Zylinder aber sofort als Speicher statt beliebiger Kapsel erkennbar.
  var coilY = y + h * 0.62, coilW = r * 1.3, coilSteps = 4, coilStep = (coilW * 2) / coilSteps;
  var cd = 'M' + (x - coilW) + ',' + coilY;
  for (var ci = 0; ci < coilSteps; ci++) {
    cd += ' L' + (x - coilW + coilStep * (ci + 0.5)) + ',' + (coilY + (ci % 2 === 0 ? 7 : -7));
  }
  cd += ' L' + (x + coilW) + ',' + coilY;
  g.appendChild(el('path', { d: cd, class: 'tank-coil' }));
  if (label) {
    var lt = el('text', { x: x, y: y + h + 16, class: 'tank-label' }); lt.textContent = label; g.appendChild(lt);
  }
  svg.appendChild(g);
  return g;
}

// Aussengeraet-Luefter (Referenz-Vorbild: Wolf-/Airsole-Anlagenschemata
// zeigen die Aussentaeinheit als Geraet MIT Luefter, nicht als abstrakte
// Spule) - dreht sich per CSS-Animation nur, wenn der Verdichter laeuft.
function fanIcon(x, y, r, running) {
  var g = el('g', { transform: 'translate(' + x + ',' + y + ')' });
  g.appendChild(el('circle', { cx: 0, cy: 0, r: r, fill: 'none', stroke: '#8a919c', 'stroke-width': 1.5 }));
  var blades = el('g', {});
  if (running) { blades.style.animation = 'fanspin 1.6s linear infinite'; blades.style.transformOrigin = '0px 0px'; }
  for (var i = 0; i < 4; i++) {
    blades.appendChild(el('path', { d: 'M0,0 Q' + (r * 0.35) + ',' + (-r * 0.55) + ' 0,' + (-r * 0.85), fill: 'none', stroke: '#8a919c', 'stroke-width': 1.3, transform: 'rotate(' + (i * 90) + ')' }));
  }
  g.appendChild(blades);
  return g;
}

// Umwaelzpumpe (Referenz-Vorbild: Kreis mit Richtungsdreieck, Standard-
// Fliessbildsymbol - statt der zuvor verwendeten Duesen-/Trichterform).
// Pulsiert dezent, wenn die Pumpe tatsaechlich foerdert.
function pumpIcon(x, y, color, active) {
  var g = el('g', {});
  g.appendChild(el('circle', { cx: x, cy: y, r: 9, fill: '#14171a', stroke: color || '#aab2bc', 'stroke-width': 1.5 }));
  var tri = el('path', { d: 'M' + (x - 4) + ',' + (y - 5) + ' L' + (x + 6) + ',' + y + ' L' + (x - 4) + ',' + (y + 5) + ' Z', fill: color || '#aab2bc' });
  if (active) { tri.style.animation = 'pumpspin 1s ease-in-out infinite'; }
  g.appendChild(tri);
  return g;
}

function arrowHead(x, y, dir, color) {
  // dir: 'r','l','u','d'
  var pts = { r: [[x - 5, y - 4], [x + 5, y], [x - 5, y + 4]], l: [[x + 5, y - 4], [x - 5, y], [x + 5, y + 4]], d: [[x - 4, y - 5], [x, y + 5], [x + 4, y - 5]], u: [[x - 4, y + 5], [x, y - 5], [x + 4, y + 5]] };
  var p = pts[dir] || pts.r;
  return el('path', { d: 'M' + p[0][0] + ',' + p[0][1] + ' L' + p[1][0] + ',' + p[1][1] + ' L' + p[2][0] + ',' + p[2][1] + ' Z', fill: color });
}

function buildSchema(unit) {
  // Reale Anlagentopologie (Dietmar, 13.08.2026 - nicht aus dem Vertrag
  // ableitbar, nur durch Nachfragen bekannt): Splitgeraet (Aussen-/
  // Innengeraet getrennt ueber Kaeltemittel), Innengeraet hat den 185l-
  // Brauchwassertank fest eingebaut. Der Heizkreis-Zweig geht NICHT direkt
  // zu den Heizkoerpern, sondern erst in einen 100l-Pufferspeicher; von
  // dort bedient eine EXTERNE Pumpe+Mischventil (kein HeishaMon-Messwert
  // dafuer, rein statisch dargestellt) den eigentlichen Heizkreis
  // (Radiatoren/Flaechenheizkoerper ueberall, Fussbodenheizung nur im
  // Bad). Fruehere Fassung zeigte Heizkreis/Warmwasser als gleichrangige
  // Y-Verzweigung direkt ab Innengeraet - technisch falsch.
  var W = 900, H = 330;
  var svg = el('svg', { class: 'schema', viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.appendChild(el('defs', {}));
  svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, class: 'schema-bg' }));

  var running = (unit.compressorFreq || 0) > 0;
  var toDhw = unit.threeWayValve === 1;
  var toRoom = unit.threeWayValve === 0 || unit.threeWayValve === null;
  var HOT = '#e0503c', COLD = '#4a90d9';

  function pipe(d, cls, active) {
    return el('path', { d: d, class: 'pipe ' + (active ? cls + ' flowing' : 'dim') });
  }
  function refrigerantLine(d) {
    return el('path', { d: d, fill: 'none', stroke: '#8a919c', 'stroke-width': 3, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round' });
  }

  // Aussengeraet (Kompressor/Kaeltekreis)
  svg.appendChild(el('rect', { x: 20, y: 100, width: 100, height: 90, rx: 3, class: 'box' }));
  var at = el('text', { x: 70, y: 116, class: 'box-title' }); at.textContent = 'AUSSENGERÄT'; svg.appendChild(at);
  svg.appendChild(fanIcon(70, 148, 26, running));
  var freqColor = running ? '#eef2f6' : '#6a6f77';
  svg.appendChild(valueText(70, 175, unit.compressorFreq !== null && unit.compressorFreq !== undefined ? String(Math.round(unit.compressorFreq)) : '–', 'Hz', freqColor, running ? 'Verdichter' : 'Verdichter (steht)'));
  if (unit.defrosting) {
    svg.appendChild(el('rect', { x: 20, y: 83, width: 100, height: 14, class: 'box', stroke: '#3d7fc4' }));
    var db = el('text', { x: 70, y: 93, class: 'badge', fill: '#3d7fc4' }); db.textContent = 'ABTAUBETRIEB'; svg.appendChild(db);
  }
  var pw = fmtPower(unit.power);
  if (pw) { svg.appendChild(valueText(70, 97, pw.v, pw.u, '#eef2f6', 'Leistung')); }

  // Kaeltemittelleitung Aussen- -> Innengeraet (gestrichelt, kein Wasser)
  svg.appendChild(refrigerantLine('M120,135 L165,135'));
  svg.appendChild(refrigerantLine('M120,165 L165,165'));
  if (unit.dischargeTemp !== null && unit.dischargeTemp !== undefined) {
    svg.appendChild(calloutValue(142, 135, 142, 55, fmtTemp1(unit.dischargeTemp), '°C', tempColor(unit.dischargeTemp), 'Heissgas'));
  }

  // Innengeraet (Hydraulikmodul: 3-Wege-Ventil, 2-Wege-Ventil, interne
  // Pumpe, Ein-/Austrittstemperatur, 185l-Brauchwassertank fest eingebaut)
  svg.appendChild(el('rect', { x: 165, y: 70, width: 170, height: 160, rx: 3, class: 'box' }));
  var it = el('text', { x: 250, y: 86, class: 'box-title' }); it.textContent = 'INNENGERÄT'; svg.appendChild(it);
  svg.appendChild(valveSymbol(200, 112, toDhw ? '#e0b93c' : HOT, toDhw ? 'WW' : 'RAUM'));
  var twoWayOpen = unit.twoWayValve !== false;
  svg.appendChild(valveSymbol(200, 160, twoWayOpen ? COLD : '#6a6f77', twoWayOpen ? 'AUF' : 'ZU'));
  if (unit.mainOutletTemp !== null && unit.mainOutletTemp !== undefined) {
    svg.appendChild(valueText(295, 108, fmtTemp1(unit.mainOutletTemp), '°C', HOT, 'Vorlauf'));
  }
  if (unit.mainInletTemp !== null && unit.mainInletTemp !== undefined) {
    svg.appendChild(valueText(295, 160, fmtTemp1(unit.mainInletTemp), '°C', COLD, 'Rücklauf'));
  }
  // x=235/300 statt der Ventilspalte (x=200) - dort verlaeuft die
  // WW-Zweigleitung senkrecht durch den Kasten und schnitt den Text
  // ("14,5 /min" statt "14,5 l/min") - real gefunden, 13.08.2026.
  if (unit.pumpFlow !== null && unit.pumpFlow !== undefined) {
    svg.appendChild(valueText(235, 218, (Math.round(unit.pumpFlow * 10) / 10).toFixed(1).replace('.', ','), 'l/min', '#eef2f6', 'Pumpe'));
  }
  if (unit.pumpSpeed !== null && unit.pumpSpeed !== undefined) {
    svg.appendChild(valueText(300, 218, String(Math.round(unit.pumpSpeed)), 'U/min', '#eef2f6', null));
  } else if (unit.pumpDuty !== null && unit.pumpDuty !== undefined) {
    svg.appendChild(valueText(300, 218, String(Math.round(unit.pumpDuty)), '%', '#eef2f6', null));
  }

  // 185l-Brauchwassertank, fest im Innengeraet - Zweig zweigt UNTEN vom
  // Innengeraet ab, nicht gleichrangig neben dem Heizkreis (der ist ein
  // eigener, weiter entfernter Kreislauf über den Puffer).
  svg.appendChild(pipe('M200,122 L200,250 L165,250', 'pipe-hot', running && toDhw));
  tankShape(svg, 120, 200, 42, 95, unit.dhwTemp, 'WW-Tank 185 l');
  if (unit.dhwTemp !== null && unit.dhwTemp !== undefined) {
    svg.appendChild(tankReadout(120, 200 + 95 / 2, fmtTemp1(unit.dhwTemp)));
  }

  // Heizungszweig vom Innengeraet direkt in den 100l-Pufferspeicher
  // (INLINE, keine Y-Verzweigung zu den Heizkoerpern - Dietmars Korrektur,
  // 13.08.2026: "Der Heizkreislauf geht in einen 100 ltr. Pufferspeicher").
  svg.appendChild(pipe('M335,105 L400,105', 'pipe-hot', running && toRoom));
  if (running && toRoom) { svg.appendChild(arrowHead(370, 105, 'r', HOT)); }
  tankShape(svg, 420, 45, 46, 130, unit.bufferTemp, 'Puffer 100 l');
  if (unit.bufferTemp !== null && unit.bufferTemp !== undefined) {
    svg.appendChild(tankReadout(420, 45 + 130 / 2, fmtTemp1(unit.bufferTemp)));
  }

  // Externe Pumpe + Mischventil an der 2. Steuerplatine - seit HeishaMon
  // contractVersion 1.4 (13.08.2026) echte Live-Werte (extPump/
  // extMixingValve), vorher nur statisches Symbol ohne Werte. extMixingValve
  // ist eine STELLRICHTUNG (0=Aus/1=Zu/2=Auf), KEINE Position - deshalb als
  // Text "schließt"/"öffnet"/"steht" statt Fuellstand dargestellt.
  var pumpKnown = unit.extPump !== null && unit.extPump !== undefined;
  var pumpOn = pumpKnown ? unit.extPump : null;
  svg.appendChild(pipe('M454,105 L500,105', 'pipe-hot', running && toRoom));
  svg.appendChild(pumpIcon(478, 105, pumpKnown ? (pumpOn ? HOT : '#6a6f77') : '#aab2bc', pumpKnown ? pumpOn : running));
  if (pumpKnown) {
    svg.appendChild(valueText(478, 80, pumpOn ? 'EIN' : 'AUS', null, pumpOn ? HOT : '#6a6f77', 'Pumpe'));
  }
  svg.appendChild(el('circle', { cx: 520, cy: 105, r: 9, class: 'valve', fill: '#14171a' }));
  var mv = unit.extMixingValve;
  if (mv === 2) {
    svg.appendChild(arrowHead(520, 105, 'u', HOT));
  } else if (mv === 1) {
    svg.appendChild(arrowHead(520, 105, 'd', COLD));
  } else if (mv === 0) {
    svg.appendChild(el('circle', { cx: 520, cy: 105, r: 2.5, fill: '#aab2bc' }));
  } else {
    svg.appendChild(el('path', { d: 'M514,100 L526,110 M526,100 L514,110', stroke: '#aab2bc', 'stroke-width': 1.5 }));
  }
  var mixTag = el('text', { x: 500, y: 128, class: 'tag', 'text-anchor': 'middle' }); mixTag.textContent = 'Externe Pumpe + Mischer'; svg.appendChild(mixTag);
  if (mv !== null && mv !== undefined) {
    var mvText = mv === 2 ? 'öffnet' : (mv === 1 ? 'schließt' : 'steht');
    svg.appendChild(valueText(520, 80, mvText, null, mv === 2 ? HOT : (mv === 1 ? COLD : '#aab2bc'), 'Mischer'));
  }
  svg.appendChild(pipe('M529,105 L570,105', 'pipe-hot', running && toRoom));
  if (running && toRoom) { svg.appendChild(arrowHead(550, 105, 'r', HOT)); }

  // Heizkreis: Radiatoren/Flaechenheizkoerper ueberall, FBH nur im Bad
  // (Dietmars genaue Angabe) - ein Bauteil, keine Zonentrennung, da
  // hydraulisch EIN gemeinsamer Kreis.
  svg.appendChild(el('rect', { x: 570, y: 65, width: 160, height: 80, rx: 3, class: 'box' }));
  var rt = el('text', { x: 650, y: 82, class: 'box-title' }); rt.textContent = 'HEIZKREIS'; svg.appendChild(rt);
  var rt2 = el('text', { x: 650, y: 97, class: 'tag', 'text-anchor': 'middle' }); rt2.textContent = 'Radiatoren + Flächenheizk.'; svg.appendChild(rt2);
  var rt3 = el('text', { x: 650, y: 109, class: 'tag', 'text-anchor': 'middle' }); rt3.textContent = 'FBH nur Bad'; svg.appendChild(rt3);
  if (unit.z1WaterTemp !== null && unit.z1WaterTemp !== undefined) {
    svg.appendChild(valueText(650, 130, fmtTemp1(unit.z1WaterTemp), '°C', tempColor(unit.z1WaterTemp), null));
  }

  // Ruecklauf: Heizkreis -> (durch Puffer) -> Innengeraet
  var TRUNK_Y = 200;
  svg.appendChild(pipe('M650,145 L650,' + TRUNK_Y + ' L437,' + TRUNK_Y, 'pipe-cold', running && toRoom));
  svg.appendChild(pipe('M437,' + TRUNK_Y + ' L437,165', 'pipe-cold', running && toRoom));
  svg.appendChild(pipe('M437,' + TRUNK_Y + ' L200,' + TRUNK_Y + ' L200,230', 'pipe-cold', running && toRoom));
  if (running && toRoom) { svg.appendChild(arrowHead(320, TRUNK_Y, 'l', COLD)); }

  return svg;
}

function buildBasicCard(unit) {
  var box = document.createElement('div');
  box.style.cssText = 'padding:14px 16px;border-radius:4px;background:#16233a;border:1.5px solid #6f83a3;color:#eef2f6;font-size:12px;';
  var pw = fmtPower(unit.power);
  box.innerHTML = 'Keine Anlagenschema-Daten (Pumpen/Ventile/Durchfluss) verfügbar - nur Basiswerte.' +
    (pw ? '<div style="margin-top:6px;font-weight:700">Leistung: ' + pw.v + ' ' + pw.u + '</div>' : '');
  return box;
}

function handleMessage(raw) {
  var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
  lastData = d;
  var empty = document.getElementById('empty');
  var unitsEl = document.getElementById('units');
  if (d && d.bg) { document.body.style.background = d.bg; }
  if (d && d.font) { document.body.style.fontFamily = d.font; }

  if (!d || !d.ok) {
    unitsEl.style.display = 'none';
    empty.style.display = 'flex';
    empty.textContent = (d && d.error) || 'Keine Daten verfügbar.';
    return;
  }
  empty.style.display = 'none';
  unitsEl.style.display = '';
  unitsEl.innerHTML = '';

  (d.units || []).forEach(function (unit) {
    var row = document.createElement('div');
    row.className = 'unit';
    var title = document.createElement('div');
    title.className = 'unit-title';
    title.textContent = unit.label;
    row.appendChild(title);
    if (unit.hasPipeSchema) {
      row.appendChild(buildSchema(unit));
    } else {
      row.appendChild(buildBasicCard(unit));
    }
    unitsEl.appendChild(row);
  });
}
</script>
</body>
