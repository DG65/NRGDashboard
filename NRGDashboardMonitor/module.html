<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Steuerleiste + Reiter 1:1 nach Verbund-Konvention (InverterHubMonitor/
     InverterHubEnergy) - "Wer eine Kachel mit Datumssteuerung baut, bedient
     sich identisch". Klassen/Layout hier bewusst gleich benannt. */
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { position: relative; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; padding: 52px 12px 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  #body { display: flex; flex: 1 1 auto; min-height: 0; gap: 10px; margin-top: 8px; }
  #tabs { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; padding-top: 2px; }
  button.tab { font: inherit; font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer; opacity: .6; }
  button.tab:hover:not(:disabled) { opacity: .85; background: rgba(127,135,145,.10); }
  button.tab.active { opacity: 1; background: rgba(127,135,145,.16); border-color: rgba(127,135,145,.35); }
  button.tab:disabled { opacity: .3; cursor: default; }
  #chartcol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
  button.nav { font: inherit; font-size: 14px; line-height: 1; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.nav:disabled { opacity: .35; cursor: default; }
  #quick { display: flex; gap: 4px; }
  button.qday { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.qday:hover:not(:disabled) { background: rgba(127,135,145,.22); }
  button.qday.active { background: rgba(127,135,145,.30); border-color: rgba(127,135,145,.55); }
  button.qday:disabled { opacity: .35; cursor: default; }
  input.pick, select.sel { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  select.sel:disabled { opacity: .35; cursor: default; }
  select.sel { padding-right: 26px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239aa4b0'/></svg>"); background-repeat: no-repeat; background-position: right 9px center; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 160px; position: relative; }
  /* Zwei eigene, per JS gesteuerte Tooltip-"Schilder" fuer die Bilanz-
     Tagesansicht (Dietmar, 31.07.2026) - ECharts' eingebaute Tooltip-
     Komponenten aktivieren sich nur einzeln je nach gehoverter Achse,
     auch mit gekoppeltem axisPointer nicht zuverlaessig gleichzeitig;
     diese beiden Divs werden stattdessen direkt per Mousemove befuellt
     und positioniert (siehe balanceHoverMove()). */
  .balTip { position: absolute; pointer-events: none; z-index: 10; background: rgba(30,32,36,0.92); color: #e8e8e8; border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.4); display: none; white-space: nowrap; }
  .empty { font-size: 13px; padding: 28px 10px; text-align: center; opacity: .7; }
  /* Eigene Legende statt der eingebauten von ECharts/Highcharts - beide
     Bibliotheken feuern bei Klicks auf ihre native Legende ein Ereignis,
     das sich nicht zuverlaessig von einem rein programmatisch (beim
     Wiederherstellen der Sichtbarkeit) ausgeloesten Zustand unterscheiden
     laesst. Eigene Legende = volle Kontrolle, kein Ereignis-Ratespiel. */
  /* Abstand "Erzeugung" -> Legende auf die gleiche Groesse gebracht wie
     Chart -> "Erzeugung" (Dietmar, 31.07.2026 - vorher zog die negative
     margin die Legende zu dicht an die Beschriftung heran). */
  /* Immer eine Zeile (Dietmar, 31.07.2026) - bei zu wenig Platz lieber
     horizontal scrollen als umbrechen. */
  #legendRow { display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px 14px; padding: 0; margin-top: 20px; font-size: 11px; overflow-x: auto; }
  .legItem { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; opacity: 1; user-select: none; flex: none; white-space: nowrap; }
  .legItem.off { opacity: .35; }
  /* Plastischere Werteflaechen mit Glanzlicht statt flacher Farbflaeche
     (Dietmar, 31.07.2026) - box-shadow fuer Tiefe/Kontur, ::after fuer
     einen kleinen radialen Glanzpunkt oben links (wie ein Glasperlen-
     Highlight). Funktioniert unabhaengig von der per Inline-style
     gesetzten Hintergrundfarbe/dem Farbverlauf, da beides separate
     Ebenen sind (box-shadow/::after ueberschreiben "background" nicht). */
  .legItem .dot, .lblwrap .dot {
    position: relative; overflow: hidden;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 2px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.35);
  }
  .legItem .dot::after, .lblwrap .dot::after {
    content: ''; position: absolute; top: 8%; left: 12%; width: 55%; height: 45%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%);
    border-radius: inherit; pointer-events: none;
  }
  .legItem .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* Bilanz-Zusammenfassung (neuer Reiter, Dietmars SEMS-Vorbild-Screenshots,
     30.07.2026) - zwei Spalten Verbrauch/Erzeugung, eigene Steuerflaechen-
     Optik statt GoodWe-Farben (Dietmars ausdruecklicher Wunsch). */
  #balancePanel { flex: 0 0 auto; padding-top: 6px; font-size: 12px; }
  /* Kopf, Tabelle und Quote sitzen als ein zusammenhaengender, inhaltsbreiter
     Block mittig unter den Charts (Dietmar, 31.07.2026: Quote und "Bilanz"-
     Kopf sollen sich an die Tabelle anpassen, nicht die volle Kachelbreite
     nutzen). */
  .balWrap { width: fit-content; margin: 0 auto; }
  .balHead { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 700; opacity: .85; padding: 4px 2px; user-select: none; }
  .balHead .car { transition: transform .15s; }
  .balHead.collapsed .car { transform: rotate(-90deg); }
  .balBody.collapsed { display: none; }
  /* Buendig-Versuch mit Legende (space-between/alignBalanceBlocks) wieder
     rueckgaengig gemacht (Dietmar, 31.07.2026) - stattdessen Abstand
     zwischen den beiden Tabellenbloecken um 10px vergroessert (40->50). */
  /* EIN gemeinsames Grid statt zwei unabhaengiger Spalten-Grids (Dietmar,
     31.07.2026: "Die Zeilen sind nicht auf gleicher Hoehe, ich wuensche
     mir hier mehr Praezision") - zwei unabhaengige Grids sizen ihre
     Zeilen unabhaengig voneinander, kleinste Unterschiede (z.B. Quote-
     Zeile ohne Punkt-Icon) verschieben dann die Hoehe. Jetzt bilden
     pairRow()-Aufrufe (siehe renderBilanzPanel) EINE Grid-Zeile mit
     7 Spalten: Label/Luecke/Wert links, Zwischenraum, Label/Luecke/Wert
     rechts - dieselbe Grid-Zeile hoehe fuer beide Seiten ist damit
     durch die Grid-Engine selbst garantiert, nicht mehr nur angenaehert.
     55px-Zwischenraum ist die mittlere Spalte statt eines Flex-Gaps. */
  /* Feste statt "auto" Spaltenbreiten fuer Label/Wert (Dietmar, 31.07.2026:
     "die Leerspalte in der Tabelle sitzt nicht mittig") - "auto" sizt
     Spalte 1 (linke Labels) und Spalte 5 (rechte Labels) unabhaengig
     voneinander nach ihrem jeweils LAENGSTEN Inhalt; da linke und rechte
     Labels unterschiedlich lang sind (z.B. "Batterieentladung" links vs.
     "Direktverbrauchsquote" rechts), war die 55px-Luecke dadurch nicht
     die optische Mitte der Tabelle. Feste, gespiegelte Breiten erzwingen
     echte Symmetrie unabhaengig vom Textinhalt.
     .lbl darf trotzdem ueberlaufen (kein overflow:hidden), falls ein
     Label die feste Breite doch sprengt. */
  .balBody { display: grid; grid-template-columns: 120px 50px 70px 45px 120px 50px 70px; justify-content: center; align-items: center; padding: 4px 2px 8px; }
  .balRow { display: contents; }
  .balRow > * { padding: 3px 0; border-bottom: 1px solid transparent; }
  .balRow.total > * { border-bottom: none; font-weight: 700; }
  .lblwrap { display: flex; align-items: center; gap: 7px; opacity: .85; }
  .lblwrap .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .balRow .val { text-align: right; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="bar">
      <select id="type" class="sel">
        <option value="day">Tag (Verlauf)</option>
        <option value="week">Woche (Energie)</option>
        <option value="month">Monat (Energie)</option>
        <option value="year">Jahr (Energie)</option>
        <option value="all">Gesamt (Energie)</option>
        <option value="custom">Benutzerdefiniert</option>
      </select>
      <button id="prev" class="nav" title="Zurück">&#9664;</button>
      <span id="periodLabel" class="pick" style="display:none; cursor:default;"></span>
      <input id="pick" class="pick" type="date">
      <input id="pickTo" class="pick" type="date" style="display:none">
      <button id="next" class="nav" title="Vor">&#9654;</button>
      <span id="quick"></span>
    </div>
    <div id="body">
      <div id="tabs">
        <button class="tab active" data-tab="solar">PV & Einstrahlung</button>
        <button class="tab" data-tab="mpp">MPP-Tracker</button>
        <button class="tab" data-tab="battery">Batterie</button>
        <button class="tab" data-tab="price">Strompreis</button>
        <button class="tab" data-tab="flow">Energiebilanz</button>
        <button class="tab" data-tab="balance">Bilanz</button>
      </div>
      <div id="chartcol">
        <div id="chart"></div>
        <div id="legendRow"></div>
        <div id="balancePanel" style="display:none"></div>
      </div>
    </div>
  </div>

  <script>/*__ECHARTS_JS__*/</script>
  <script>
    // idx=1 statt 0, weil days[0] jetzt "morgen" ist (nur beim Strompreis-
    // Reiter befuellt, siehe module.php::buildPayload()) - der Default beim
    // Oeffnen der Kachel bleibt "heute" (Dietmars Wunsch, 28.07.2026:
    // "morgen" per Vor-Navigation erreichbar machen, ohne den Standard-
    // Einstieg fuer die anderen Reiter zu verschieben).
    var lastData = null, chart = null, chartEngine = null, idx = 1, curTab = 'solar';
    // Energiebilanz (Sankey) fuer Woche/Monat/Jahr/Gesamt/Benutzerdefiniert -
    // per requestAction() nachgeforderte Ergebnisse, keyed "start_end"
    // (Unix-Sekunden), damit ein einmal geladener Zeitraum nicht bei jedem
    // Tab-/Reiterwechsel erneut angefordert wird. flowPendingKey verhindert
    // doppelte Anfragen, waehrend eine Antwort noch aussteht.
    var flowCache = {}, flowPendingKey = null;
    // Neuer "Bilanz"-Reiter (Dietmars SEMS-Vorbild-Screenshots, 30.07.2026) -
    // eigener Reiter NEBEN dem bestehenden Sankey "Energiebilanz" (Dietmars
    // ausdrueckliche Entscheidung). Gleiches Nachforder-/Cache-Muster wie
    // flowCache oben, eigener Key-Namensraum ("balance_<granularity>_<start>_<end>").
    var balanceCache = {}, balancePendingKey = null;
    // Ein-/Ausklappen der Bilanz-Tabelle ist zurueck (Dietmar, 31.07.2026:
    // "waere es von Vorteil, wenn man die Bilanztabelle komprimieren und
    // die Charts gleichzeitig expandieren koennte") - diesmal bewusst OHNE
    // Hoehen-Sperre fuer #chart: #chart (flex:1 1 auto) und #balancePanel
    // sind Geschwister in #chartcol, .balBody.collapsed (display:none)
    // gibt den Platz frei, den sich #chart dann von selbst zurueckholt -
    // genau das war beim vorigen (inzwischen entfernten) Anlauf noch
    // UNERWUENSCHT, jetzt ist es der Zweck der Funktion.
    var balancePanelCollapsed = false;
    var balanceChartLocked = false;
    function lockChartHeightOnce() {
      if (balanceChartLocked) { return; }
      var elC = document.getElementById('chart');
      var h = elC.getBoundingClientRect().height;
      if (h > 40) {
        elC.style.flex = '0 0 ' + h + 'px';
        balanceChartLocked = true;
      }
    }
    function unlockChartHeight() {
      document.getElementById('chart').style.flex = '';
      balanceChartLocked = false;
    }
    // Eigene Farbpalette (Dietmars Wunsch: "die Steuerflaechen moechte ich
    // unsere nehmen" - NICHT die GoodWe-SEMS-Farben kopieren). Solar/Batterie/
    // Netz greifen die bereits im Sankey etablierten Farben dieses Moduls
    // wieder auf (COL_SOLAR/COL_BAT/COL_GRID aus module.php), Netzbezug/
    // Batterieentladung bekommen zwei neue, aber stimmige Toene.
    // Exakte Farben von Dietmar vorgegeben (31.07.2026, SEMS-Referenz).
    // Reihenfolge bestimmt zugleich die Stapel-Position in den Charts
    // (seriesFor() reicht BALANCE_SERIES-Filter direkt an die Chart-Serien
    // durch). Die Weisung "Batterieladung auf Hoehe Netzbezug,
    // Netzeinspeisung auf Hoehe Batterieentladung" (Dietmar, 31.07.2026)
    // galt NUR fuer den Bilanz-Tabellenblock unten (dort schon so
    // angeordnet, siehe row()-Aufrufe in renderBilanzPanel) - NICHT fuer
    // die Chart-Stapelreihenfolge, das war ein Missverstaendnis meinerseits
    // und wieder auf die urspruengliche Reihenfolge zurueckgesetzt.
    var BALANCE_SERIES = [
      { key: 'netzbezug',         name: 'Netzbezug',         color: '#FF2600', panel: 'v' },
      { key: 'batterieentladung', name: 'Batterieentladung', color: '#FF9300', panel: 'v' },
      { key: 'direktverbrauch',   name: 'Direktverbrauch',   color: '#4F8F00', panel: 'both' },
      { key: 'batterieladung',    name: 'Batterieladung',    color: '#945200', panel: 'e' },
      { key: 'netzeinspeisung',   name: 'Netzeinspeisung',   color: '#FFFB00', panel: 'e' }
    ];
    // Plastischere Chart-Flaechen statt flacher Einheitsfarbe (Dietmar,
    // 31.07.2026: "Koennte man die Chartflaechen etwas plastischer
    // darstellen? Vielleicht auch mit Glanzlichtern?") - je Serie ein
    // vertikaler Verlauf von einem aufgehellten Ton oben zur Grundfarbe
    // unten, wie ein leicht glaenzendes Glas/Kunststoff-Band. amt=0..1
    // steuert, wie stark Richtung Weiss aufgehellt wird.
    function balanceLighten(hex, amt) {
      var c = hex.replace('#', '');
      var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
      r = Math.min(255, Math.round(r + (255 - r) * amt));
      g = Math.min(255, Math.round(g + (255 - g) * amt));
      b = Math.min(255, Math.round(b + (255 - b) * amt));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    // Echtes Glanzlicht statt reinem Verlauf (Dietmar, 31.07.2026: "Diese
    // Chartflaechen koennen keine Glanzlichter bekommen?") - ein simpler
    // 2-Stopp-Verlauf (hell oben, Grundfarbe unten) wirkt eher wie eine
    // gleichmaessige Schattierung; ein Glanzlicht braucht eine klar
    // abgegrenzte helle Zone, die schnell wieder abklingt. Vier Stopps:
    // hell, hell (Zone haelt kurz), schneller Abfall, Grundfarbe.
    function balanceGlossyStops(color) {
      var hi = balanceLighten(color, 0.65);
      var mid = balanceLighten(color, 0.12);
      return [[0, hi], [0.16, hi], [0.4, mid], [1, color]];
    }
    var curView = 'day';
    // Anker-Datum fuer Woche/Monat/Jahr (irgendein Tag INNERHALB des
    // gewuenschten Zeitraums - bewusst kein natives type=week/month-Feld,
    // die sind browserseitig zu uneinheitlich; Vor/Zurueck verschiebt den
    // Anker um die passende Einheit). Benutzerdefiniert nutzt customFrom/To.
    var viewRef = new Date();
    var customFrom = null, customTo = null;
    var libs = { hc: 0, hcSankey: 0, ec: 0 };
    var MPPT_COLORS = ['#e53935', '#43a047', '#1e88e5', '#fb8c00'];
    // Zarte Gitterlinien-Farbe fuer Zeit- und linke Achse (Dietmars Wunsch,
    // 28.07.2026) - in beiden Engines identisch verwendet.
    var GRID_COLOR = 'rgba(255,255,255,.09)';
    // Zoom in allen Charts (Dietmars Wunsch, 28.07.2026) - 'inside' fuer
    // Mausrad/Pinch/Ziehen direkt in der Zeichenflaeche, zusaetzlich ein
    // schmaler sichtbarer Slider unten als "Legende" fuer den Zoom-Zustand
    // (Dietmars Nachtrag: der Zoom soll erkennbar/bedienbar sein, nicht nur
    // per Mausrad blind). xAxisIndex/yAxisIndex bewusst nicht gesetzt -
    // ECharts' Default ist die erste x-Achse (bei uns immer die Zeitachse),
    // die y-Achse bleibt dabei unangetastet.
    var DATA_ZOOM_INSIDE = [
      { type: 'inside', filterMode: 'none' },
      { type: 'slider', filterMode: 'none', height: 14, bottom: 4, borderColor: GRID_COLOR, fillerColor: 'rgba(255,255,255,.12)', handleStyle: { color: '#888' }, textStyle: { color: '#888' }, dataBackground: { lineStyle: { color: GRID_COLOR }, areaStyle: { color: GRID_COLOR } } }
    ];

    // Legenden-Sichtbarkeit je Kurvenname - bleibt ueber Reiter-/Tageswechsel
    // UND ueber ein Neuladen der Kachel erhalten (localStorage), Muster:
    // InverterHubMonitor. Namensraum je Instanz (uid), damit mehrere
    // NRGDashboardMonitor-Kacheln sich nicht gegenseitig beeinflussen.
    var vis = {}, visKey = null, visLoaded = false;
    function isVisible(name) { return vis[name] !== false; }
    function loadVis() {
      if (visLoaded) { return; }
      visLoaded = true;
      try { var s = localStorage.getItem(visKey); if (s) { vis = JSON.parse(s) || {}; } } catch (e) {}
    }
    function saveVis() { try { localStorage.setItem(visKey, JSON.stringify(vis)); } catch (e) {} }
    function setVisible(name, on) { vis[name] = on; saveVis(); }

    // Highcharts wird bewusst wie in der aktuell installierten InverterHub-
    // Kachel behandelt: vom CDN nachgeladen, NICHT eingebettet (Lizenz - eine
    // Redistribution mit dem Modul wäre bei Highcharts nicht abgedeckt, siehe
    // README). Nur wer diese Engine explizit wählt, braucht dafür Internet-
    // zugriff und eine eigene gültige Highcharts-Lizenz. ECharts (Standard)
    // ist lokal eingebettet (Apache-2.0) und braucht beides nicht.
    function addScript(src, cb) { var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = function () { cb && cb(); }; document.head.appendChild(s); }
    function ensureHighcharts(cb) {
      if (typeof Highcharts !== 'undefined' && Highcharts.seriesTypes && Highcharts.seriesTypes.line) { libs.hc = 2; return cb(); }
      if (libs.hc === 1) { return setTimeout(function () { ensureHighcharts(cb); }, 80); }
      libs.hc = 1; addScript('https://code.highcharts.com/highcharts.js', function () { libs.hc = 2; cb(); });
    }

    // Fix (31.07.2026): ECharts war bisher IMMER lokal eingebettet (~618KB),
    // sobald diese Engine gewaehlt war - zusammen mit dem restlichen
    // Tage-Fenster-Payload (WINDOW_DAYS Tage x mehrere Serien) hat das live
    // bei Dietmar "Output-Buffer exceeds Limit (1048576 bytes)" ausgeloest.
    // Gleiches Muster wie ensureHighcharts() jetzt auch fuer ECharts: per
    // CDN nachladen statt einbetten - Highcharts laeuft nachweislich schon
    // ueber ein CDN in dieser Umgebung, dieselbe Netzwerk-Erreichbarkeit
    // gilt also auch hier.
    function ensureECharts(cb) {
      if (typeof echarts !== 'undefined') { libs.ec = 2; return cb(); }
      if (libs.ec === 1) { return setTimeout(function () { ensureECharts(cb); }, 80); }
      libs.ec = 1;
      addScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', function () { libs.ec = 2; cb(); });
    }

    // Energiebilanz-Reiter (Sankey) braucht zusaetzlich das Highcharts-
    // Sankey-Modul - eigenes Nachladen wie bei ensureHighcharts, aber erst
    // NACH dem Kern, da das Modul auf Highcharts aufsetzt.
    function ensureHighchartsSankey(cb) {
      ensureHighcharts(function () {
        if (Highcharts.seriesTypes && Highcharts.seriesTypes.sankey) { return cb(); }
        if (libs.hcSankey === 1) { return setTimeout(function () { ensureHighchartsSankey(cb); }, 80); }
        libs.hcSankey = 1;
        addScript('https://code.highcharts.com/modules/sankey.js', function () { libs.hcSankey = 2; cb(); });
      });
    }

    function fmtDate(d) {
      var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }

    function syncNav() {
      var days = (lastData && lastData.days) || [];
      document.getElementById('bar').style.visibility = 'visible';

      var pick = document.getElementById('pick'), pickTo = document.getElementById('pickTo'), quick = document.getElementById('quick');
      quick.innerHTML = '';

      if (curView === 'day') {
        pick.style.display = ''; pickTo.style.display = 'none';
        document.getElementById('prev').disabled = (idx >= days.length - 1);
        document.getElementById('next').disabled = (idx <= 0);
        var d = days[idx];
        if (d) { pick.value = d.id; }
        var labels = [['Vorgestern', 2], ['Gestern', 1], ['Heute', 0]];
        labels.forEach(function (l) {
          var target = days.findIndex(function (d) { return d.id === fmtDate(new Date(Date.now() - l[1] * 86400000)); });
          var btn = document.createElement('button');
          btn.className = 'qday' + (target === idx ? ' active' : '');
          btn.textContent = l[0];
          btn.disabled = (target < 0) || !days[target] || !days[target].hasData;
          btn.onclick = function () { idx = target; render(); };
          quick.appendChild(btn);
        });
        return;
      }

      if (curView === 'custom') {
        pick.style.display = ''; pickTo.style.display = '';
        document.getElementById('prev').disabled = true;
        document.getElementById('next').disabled = true;
        if (customFrom) { pick.value = customFrom; }
        if (customTo) { pickTo.value = customTo; }
        return;
      }

      pickTo.style.display = 'none';
      var periodLabel = document.getElementById('periodLabel');
      if (curView === 'all') {
        pick.style.display = 'none'; periodLabel.style.display = 'none';
        document.getElementById('prev').disabled = true;
        document.getElementById('next').disabled = true;
        return;
      }
      // Woche/Monat/Jahr: statt eines vollen Datums (das die eigentlich
      // gemeinte Einheit - Kalenderwoche/Monat/Jahr - eher verschleiert
      // als zeigt) einen dazu passenden Text anzeigen (Dietmars Wunsch,
      // 28.07.2026: "KW vor das Datum" bzw. Monat/Jahr sollen selbst
      // sichtbar sein). Vor/Zurück deckt die Navigation bereits vollständig
      // ab, ein natives Datumsfeld ist hier nicht mehr nötig.
      pick.style.display = 'none';
      periodLabel.style.display = '';
      document.getElementById('prev').disabled = false;
      document.getElementById('next').disabled = false;
      if (curView === 'week') {
        periodLabel.textContent = 'KW ' + isoWeekNumber(viewRef) + ', ' + viewRef.getFullYear();
      } else if (curView === 'month') {
        periodLabel.textContent = MONTH_NAMES_FULL[viewRef.getMonth()] + ' ' + viewRef.getFullYear();
      } else if (curView === 'year') {
        periodLabel.textContent = String(viewRef.getFullYear());
      }
    }

    function isoWeekNumber(date) {
      var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      var dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      var firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      var diff = (d - firstThursday) / 86400000;
      return 1 + Math.round(diff / 7);
    }

    function shiftViewRef(dir) {
      var r = new Date(viewRef);
      if (curView === 'week') { r.setDate(r.getDate() + dir * 7); }
      else if (curView === 'month') { r.setMonth(r.getMonth() + dir); }
      else if (curView === 'year') { r.setFullYear(r.getFullYear() + dir); }
      viewRef = r;
    }

    function startOfWeek(date) {
      var r = new Date(date);
      var wd = (r.getDay() + 6) % 7; // Montag=0
      r.setDate(r.getDate() - wd);
      return r;
    }

    // Periodengrenzen (Unix-Sekunden) fuer die aktuelle Ansicht - fuer die
    // Energiebilanz (Sankey) bei Woche/Monat/Jahr/Gesamt/Benutzerdefiniert,
    // damit requestAction('flowPeriod', ...) die echten Grenzen bekommt
    // statt der Tage-Buckets, die die Balkenansichten nutzen.
    function flowPeriodBounds() {
      var startD, endD;
      if (curView === 'week') {
        startD = startOfWeek(viewRef);
        endD = new Date(startD); endD.setDate(endD.getDate() + 7);
      } else if (curView === 'month') {
        startD = new Date(viewRef.getFullYear(), viewRef.getMonth(), 1);
        endD = new Date(viewRef.getFullYear(), viewRef.getMonth() + 1, 1);
      } else if (curView === 'year') {
        startD = new Date(viewRef.getFullYear(), 0, 1);
        endD = new Date(viewRef.getFullYear() + 1, 0, 1);
      } else if (curView === 'all') {
        startD = new Date(0);
        endD = new Date();
      } else if (curView === 'custom' && customFrom && customTo) {
        startD = new Date(customFrom + 'T00:00:00');
        endD = new Date(customTo + 'T00:00:00'); endD.setDate(endD.getDate() + 1);
      } else {
        return null;
      }
      return { start: Math.floor(startD.getTime() / 1000), end: Math.floor(endD.getTime() / 1000) };
    }

    // Baut Kategorien+Reihen fuer die Energie-Ansichten (Woche/Monat/Jahr/
    // Gesamt/Benutzerdefiniert) aus den vom Backend gelieferten Tages-kWh-
    // Karten (lastData.energy) - EIN Archivdurchlauf pro Serie liefert alle
    // Ansichten, hier wird nur noch clientseitig gruppiert.
    function energySeriesFor(tab) {
      if (tab === 'mpp') {
        var keys = lastData.mpptKeys || [];
        return keys.map(function (k, i) {
          return { name: 'MPPT ' + k, color: MPPT_COLORS[i % MPPT_COLORS.length], map: (lastData.energy && lastData.energy.mppt && lastData.energy.mppt[k]) || {} };
        });
      }
      if (tab === 'battery') {
        return [{ name: 'Batterie-Leistung', color: '#43a047', map: (lastData.energy && lastData.energy.bat) || {} }];
      }
      // solar - spiegelt die drei Linien der Tagesansicht (Dietmar,
      // 28.07.2026: "Woche zeigt nur PV-Erzeugung, Einstrahlung/PV
      // erwartet fehlen"). Reihenfolge links nach rechts (Dietmars Wunsch,
      // 28.07.2026): PV erwartet, PV-Erzeugung, Einstrahlung.
      var solarSeries = [];
      if (lastData.hasModel) {
        solarSeries.push({ name: 'PV erwartet', color: '#e57373', map: (lastData.energy && lastData.energy.expected) || {} });
      }
      solarSeries.push({ name: 'PV-Erzeugung', color: '#e53935', map: (lastData.energy && lastData.energy.pv) || {} });
      if (lastData.hasIrr) {
        solarSeries.push({ name: 'Einstrahlung', color: '#fbc02d', map: (lastData.energy && lastData.energy.irr) || {} });
      }
      return solarSeries;
    }

    var MONTH_NAMES = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    var MONTH_NAMES_FULL = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    var WEEKDAY_NAMES = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

    var WEEKDAY_NAMES_FULL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

    function buildEnergyRows(tab) {
      var seriesDefs = energySeriesFor(tab);
      var categories = [];
      var fullLabels = []; // volle Beschriftung je Kategorie, fuer den Tooltip
      var dateLists = []; // je Kategorie: Liste von 'Y-m-d', die dort einfliessen
      if (curView === 'week') {
        var ws = startOfWeek(viewRef);
        for (var i = 0; i < 7; i++) {
          var dt = new Date(ws); dt.setDate(ws.getDate() + i);
          categories.push(WEEKDAY_NAMES[i] + ' ' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2));
          fullLabels.push(WEEKDAY_NAMES_FULL[i] + ', ' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2) + '.' + dt.getFullYear());
          dateLists.push([fmtDate(dt)]);
        }
      } else if (curView === 'month') {
        var y = viewRef.getFullYear(), m = viewRef.getMonth();
        var last = new Date(y, m + 1, 0).getDate();
        for (var day = 1; day <= last; day++) {
          categories.push(String(day));
          fullLabels.push(day + '. ' + MONTH_NAMES_FULL[m] + ' ' + y);
          dateLists.push([fmtDate(new Date(y, m, day))]);
        }
      } else if (curView === 'year') {
        var yy = viewRef.getFullYear();
        for (var mo = 0; mo < 12; mo++) {
          categories.push(MONTH_NAMES[mo]);
          fullLabels.push(MONTH_NAMES_FULL[mo] + ' ' + yy);
          var lastD = new Date(yy, mo + 1, 0).getDate();
          var list = [];
          for (var dd = 1; dd <= lastD; dd++) { list.push(fmtDate(new Date(yy, mo, dd))); }
          dateLists.push(list);
        }
      } else if (curView === 'all') {
        var thisYear = new Date().getFullYear();
        for (var k = 4; k >= 0; k--) {
          var yr = thisYear - k;
          categories.push(String(yr));
          fullLabels.push(String(yr));
          var l2 = [];
          for (var mm = 0; mm < 12; mm++) {
            var lastDd = new Date(yr, mm + 1, 0).getDate();
            for (var d2 = 1; d2 <= lastDd; d2++) { l2.push(fmtDate(new Date(yr, mm, d2))); }
          }
          dateLists.push(l2);
        }
      } else if (curView === 'custom' && customFrom && customTo) {
        var from = new Date(customFrom + 'T00:00:00'), to = new Date(customTo + 'T00:00:00');
        for (var cd = new Date(from); cd <= to; cd.setDate(cd.getDate() + 1)) {
          categories.push(('0' + cd.getDate()).slice(-2) + '.' + ('0' + (cd.getMonth() + 1)).slice(-2));
          fullLabels.push(('0' + cd.getDate()).slice(-2) + '.' + ('0' + (cd.getMonth() + 1)).slice(-2) + '.' + cd.getFullYear());
          dateLists.push([fmtDate(cd)]);
        }
      }
      var series = seriesDefs.map(function (s) {
        var data = dateLists.map(function (dl) {
          var sum = 0, any = false;
          dl.forEach(function (ds) { if (s.map[ds] !== undefined) { sum += s.map[ds]; any = true; } });
          return any ? Math.round(sum * 100) / 100 : null;
        });
        return { name: s.name, color: s.color, data: data };
      });
      return { categories: categories, fullLabels: fullLabels, series: series };
    }

    function sizeChart() {
      if (!chart) { return; }
      if (chartEngine === 'highcharts') { chart.reflow(); } else { chart.resize(); }
    }

    function destroyChart() {
      if (chart) { try { if (chartEngine === 'highcharts') { chart.destroy(); } else { chart.dispose(); } } catch (e) {} }
      chart = null; chartEngine = null;
      var el = document.getElementById('chart'); if (el) { el.innerHTML = ''; }
      var lr = document.getElementById('legendRow'); if (lr) { lr.innerHTML = ''; }
    }

    // Je Reiter: Serien + Achsenbeschriftungen. "right"=true nutzt die rechte
    // Achse (nur bei zwei verschiedenen Einheiten in einem Reiter noetig).
    function toKw(pts) { return (pts || []).map(function (p) { return [p[0], p[1] / 1000]; }); }

    function buildSeries(tab, d) {
      if (tab === 'mpp') {
        // Linke Achse in kW statt W (Dietmars Wunsch, 28.07.2026, analog
        // zum Solar-Reiter).
        var keys = lastData.mpptKeys || [];
        var series = [];
        keys.forEach(function (k, i) {
          var color = MPPT_COLORS[i % MPPT_COLORS.length];
          series.push({ name: 'MPPT ' + k, data: toKw(d.mppt && d.mppt[k]), axis: 0, color: color, dashed: false });
          // "PV erwartet" je Strang (Dietmars Wunsch, 28.07.2026, analog zur
          // Gesamt-Erwartungskurve im Solar-Reiter) - nur wenn das Backend
          // eine belastbare Generator-zu-Strang-Zuordnung liefern konnte
          // (hasMpptModel). Die Kurvenform ist je Strang identisch zur
          // bereits vorhandenen Gesamt-Erwartungskurve d.expected (gleiche
          // Einstrahlung/PR/Temperaturableitung, nur ein anderer kWp-Anteil)
          // - statt einer kompletten eigenen Zeitreihe je Strang schickt das
          // Backend nur den skalaren Anteil (mpptShare) und wir skalieren
          // d.expected hier clientseitig. Eine volle Zeitreihe je Strang
          // ueber alle vorgehaltenen Tage hat den Ausgabepuffer gesprengt
          // ("Output-Buffer exceeds Limit", live gefunden 28.07.2026).
          var share = lastData.mpptShare && lastData.mpptShare[k];
          if (lastData.hasMpptModel && share && d.expected && d.expected.length) {
            var scaled = d.expected.map(function (p) { return [p[0], p[1] * share]; });
            series.push({ name: 'MPPT ' + k + ' erwartet', data: toKw(scaled), axis: 0, color: color, dashed: true });
          }
        });
        return series;
      }
      if (tab === 'battery') {
        // Linke Achse in kW statt W (Dietmars Wunsch, 28.07.2026, analog
        // Solar/MPP-Tracker).
        var series = [{ name: 'Batterie-Leistung', data: toKw(d.bat), axis: 0, color: '#43a047', dashed: false }];
        if (lastData.hasSoc) {
          series.push({ name: 'Batterie-SOC', data: d.soc, axis: 1, color: '#9575cd', dashed: false });
        }
        return series;
      }
      // solar (Standard) - linke Achse in kW statt W (Dietmars Wunsch,
      // 27.07.2026), Einstrahlung (rechte Achse, W/m²) bleibt unveraendert.
      var series = [{ name: 'PV-Erzeugung', data: toKw(d.pv), axis: 0, color: '#e53935', dashed: false }];
      if (lastData.hasIrr) {
        series.push({ name: 'Einstrahlung', data: d.irr, axis: 1, color: '#fbc02d', dashed: false });
      }
      if (lastData.hasModel && d.expected && d.expected.length) {
        series.push({ name: 'PV erwartet', data: toKw(d.expected), axis: 0, color: '#e57373', dashed: true });
      }
      return series;
    }

    // Eigene, von uns kontrollierte Legende statt der eingebauten Klick-
    // Ereignisse von ECharts/Highcharts (siehe CSS-Kommentar #legendRow) -
    // ein Klick schaltet direkt vis[name] um und rendert neu, kein
    // Ereignis-Umweg ueber die Chart-Bibliothek.
    function renderLegend(tab, allNames) {
      var row = document.getElementById('legendRow');
      row.innerHTML = '';
      // Frueher fuer 'price' fest auf "Strompreis" begrenzt - jetzt kann der
      // Reiter auch "Netzbezug" enthalten, deshalb einfach die tatsaechliche
      // Serienliste uebernehmen (Dietmars Wunsch, 28.07.2026).
      var items = allNames;
      items.forEach(function (it) {
        var el = document.createElement('span');
        el.className = 'legItem' + (isVisible(it.name) ? '' : ' off');
        el.innerHTML = '<span class="dot" style="background:' + it.color + '"></span>' + it.name;
        el.onclick = function () { setVisible(it.name, !isVisible(it.name)); render(); };
        row.appendChild(el);
      });
    }

    function axisConfig(tab) {
      // Linke Achse (kW) in 1-kW-Schritten (Dietmars Wunsch, 28.07.2026,
      // analog zum Solar-Reiter).
      if (tab === 'mpp') { return { leftName: 'kW', rightName: '', showRight: false, leftInterval: 1 }; }
      // Linke Achse (kW) in 1-kW-Schritten wie bei Solar/MPP-Tracker; rechte
      // Achse (SOC) fest 0-100%, nicht dynamisch skaliert (Dietmars Wunsch,
      // 28.07.2026 - ein SOC-Verlauf, der z.B. nur 40-60% abdeckt, soll die
      // Achse nicht künstlich strecken).
      if (tab === 'battery') { return { leftName: 'kW', rightName: '%', showRight: !!lastData.hasSoc, leftInterval: 1, rightMin: 0, rightMax: 100 }; }
      // Linke Achse (kW) in 1-kW-Schritten (Dietmars Wunsch, 27.07.2026).
      return { leftName: 'kW', rightName: 'W/m²', showRight: !!lastData.hasIrr, leftInterval: 1 };
    }

    // x-Achsen-Bereich je Reiter (Tag-Ansicht): Solar/MPP-Tracker zeigen nur
    // Sonnenaufgang-1h bis Sonnenuntergang+1h, Batterie IMMER den vollen
    // Kalendertag 0-24 Uhr - auch am heutigen Tag, wo die Daten nur bis
    // "jetzt" reichen (sonst schneidet die x-Achse an der aktuellen Uhrzeit
    // ab statt den Tag vollstaendig zu zeigen, Dietmars Wunsch, 28.07.2026).
    function xAxisRange(tab, d) {
      if (!d) { return null; }
      if ((tab === 'solar' || tab === 'mpp') && d.sunStart) { return { min: d.sunStart, max: d.sunEnd }; }
      if ((tab === 'battery' || tab === 'price') && d.dayStart) { return { min: d.dayStart, max: d.dayEnd }; }
      return null;
    }

    // Preiskurve (Intervalle [start,end,price], keine gleichmaessigen 5-Min-
    // Punkte wie die anderen Reiter): EIN Punkt je Slot in der SLOT-MITTE
    // (nicht am Slot-Anfang) + step:'middle'/'center' - das laesst ECharts/
    // Highcharts die Stufe automatisch symmetrisch um jeden Punkt zeichnen
    // (bis zur Mitte zum Nachbarn), deckungsgleich mit den echten Slot-
    // Grenzen, SOFERN alle Slots gleich lang sind (bei uns immer der Fall -
    // entweder durchgehend stuendlich oder durchgehend viertelstuendlich).
    // Vorherige Fassung schickte Start- UND Endpunkt jedes Slots einzeln -
    // an jeder Slot-Grenze lagen dadurch ZWEI Punkte auf demselben
    // Zeitstempel mit unterschiedlichem Preis, worauf der Tooltip beim
    // Hovern nahe der Grenze mal den einen, mal den anderen zeigte
    // (Dietmars Fund, 28.07.2026: "faengt im 15-Min-Intervall, zeigt 2
    // Strompreise"). Mit gleichmaessig in der Mitte verteilten Punkten faellt
    // die Naechster-Punkt-Grenze der Tooltip-Erkennung exakt auf die echte
    // Slot-Grenze - jede Hover-Position im Slot trifft eindeutig diesen einen
    // Punkt. slotStart/slotEnd bleiben als Zusatzfelder erhalten, damit der
    // Tooltip die tatsaechliche Slot-Startzeit (nicht die Slot-Mitte)
    // anzeigen kann.
    function priceStepPoints(d) {
      return ((d && d.price) || []).map(function (slot) {
        var center = slot[0] + (slot[1] - slot[0]) / 2;
        return { value: [center, slot[2]], slotStart: slot[0], slotEnd: slot[1] };
      });
    }

    // Highcharts erwartet Punkte als {x,y,...}, nicht ECharts' {value:[x,y]}
    // - gleiche slotStart/slotEnd-Zusatzfelder, nur andere Punktform.
    function priceStepPointsHC(d) {
      return priceStepPoints(d).map(function (p) {
        return { x: p.value[0], y: p.value[1], slotStart: p.slotStart, slotEnd: p.slotEnd };
      });
    }

    function fmtHM(ms) {
      var dt = new Date(ms);
      return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
    }

    // Findet den Preis-Slot, der einen Zeitpunkt enthaelt - ueber Zeitraum-
    // Enthaltensein, NICHT ueber exakte Punkt-Gleichheit: Strompreis-Slots
    // sind haeufig STUENDLICH, Netzbezugs-Balken dagegen immer 15-Minuten-
    // Buckets (siehe SlotEnergyBars()). Ein reiner Hover-Punkt-Abgleich
    // (beide Serien treffen bei diesem x) funktioniert deshalb nur, wenn
    // zufaellig auch der Strompreis viertelstuendlich aufgeloest ist -
    // dieser Suchweg funktioniert immer, unabhaengig von der Preis-
    // Aufloesung (Dietmars Wunsch, 28.07.2026: "Kosten" je Netzbezugs-Slot).
    function priceSlotAt(d, ms) {
      if (!d || !d.price) { return null; }
      for (var i = 0; i < d.price.length; i++) {
        if (ms >= d.price[i][0] && ms < d.price[i][1]) { return d.price[i]; }
      }
      return null;
    }

    function renderECharts(el, tab, d) {
      if (chart && chartEngine !== 'echarts') { destroyChart(); }
      if (!chart) {
        // el.innerHTML NUR hier leeren (ein evtl. vorheriger "Keine Daten"-
        // Text) und NUR beim echten Neuanlegen - ein Leeren VOR jedem
        // Wiederverwenden des bestehenden chart-Objekts (frueher in
        // render()) hat dessen internen Canvas aus dem DOM gerissen, ohne
        // die ECharts-Instanz zu entsorgen: setOption() lief danach gegen
        // einen abgehaengten Canvas ins Leere (leerer Wrapper-Div ohne
        // sichtbaren Inhalt) - live beim Bau der Energie-Ansichten
        // gefunden (Balken blieben unsichtbar, obwohl die Daten korrekt
        // in chart.getOption() ankamen).
        el.innerHTML = '';
        // devicePixelRatio explizit setzen - ohne dieses Feld faellt ECharts'
        // Canvas-Renderer auf 1 zurueck, wenn der Browser es nicht von sich
        // aus erkennt, wodurch duenne Linien auf Retina-Displays verwaschen
        // und dadurch optisch dicker wirken als in Highcharts' SVG-Rendering
        // (Dietmars Vergleichsscreenshot, 28.07.2026: ECharts-Linien wirkten
        // deutlich kraeftiger als bei Highcharts, obwohl beide dieselbe
        // lineStyle.width nutzen).
        chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 });
        chartEngine = 'echarts';
      }
      var ax = axisConfig(tab);
      // Strompreis: rechte Achse (ct/kWh), Netzbezug (falls vorhanden) als
      // Balken auf der linken Achse (kWh) - analog zu InverterHubMonitors
      // Strompreis-Reiter (Dietmars Wunsch, 28.07.2026, deren Vorbild).
      var allSeries = (tab === 'price')
        ? [{ name: 'Strompreis', data: priceStepPoints(d), color: '#ffb300', axis: 1, dashed: false, step: 'middle' }]
          .concat((lastData.hasGrid && d && d.gridDraw && d.gridDraw.length)
            ? [{ name: 'Netzbezug', data: d.gridDraw, color: '#4aa3e0', axis: 0, bar: true }] : [])
        : buildSeries(tab, d);
      renderLegend(tab, allSeries.map(function (s) { return { name: s.name, color: s.color }; }));
      // Ausgeblendete Serien werden nicht mitgeschickt, statt sie nur
      // ueber legend.selected zu verstecken - dadurch entfaellt jede
      // Abhaengigkeit von ECharts' eigenem, teils synthetisch feuerndem
      // Legenden-Ereignis (siehe README, frueherer Anlauf mit
      // legendselectchanged/suppressLegendEvent). Eigene Legende oben
      // steuert vis[] direkt.
      var visSeries = allSeries.filter(function (s) { return isVisible(s.name); });
      var series = visSeries.map(function (s) {
        if (s.bar) {
          return { name: s.name, type: 'bar', data: s.data, yAxisIndex: s.axis, color: s.color, itemStyle: { opacity: 0.55 }, barMaxWidth: 14 };
        }
        return { name: s.name, type: 'line', showSymbol: false, step: s.step === 'middle' ? 'middle' : (s.step ? 'end' : false), data: s.data, yAxisIndex: s.axis, color: s.color, lineStyle: Object.assign({ width: 0.7 }, s.dashed ? { type: 'dashed' } : {}) };
      });
      // Strompreis, aktueller Tag: rote vertikale Linie fuer "jetzt"
      // (Dietmars Wunsch, 28.07.2026) - an die erste sichtbare Serie
      // gehaengt, NICHT an eine leere Hilfsserie: eine markLine ohne
      // eigene Werte-Bandbreite (Hilfsserie mit nur einem Nullwert) haengt
      // sich sonst an DEREN Werteumfang und bleibt ein paar Pixel hoher
      // Strich statt ueber die volle Diagrammhoehe zu reichen (live so
      // vorgefunden).
      if (tab === 'price' && d && d.id === fmtDate(new Date()) && series.length > 0) {
        series[0].markLine = { symbol: 'none', silent: true, label: { show: false }, lineStyle: { color: '#ff5252', width: 2, type: 'solid' }, data: [{ xAxis: Date.now() }] };
      }
      chart.setOption({
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        // bottom:32 statt 12 - bei 12 wurden die Uhrzeit-Beschriftungen der
        // x-Achse unten abgeschnitten (Dietmar, 28.07.2026).
        // bottom:52 statt 32 - Platz fuer den Zoom-Slider unter der
        // Zeitachsen-Beschriftung (Dietmars Wunsch, 28.07.2026).
        grid: { left: 46, right: (ax.showRight || tab === 'price') ? 46 : 12, top: 28, bottom: 52 },
        legend: { show: false },
        // Dunkler Tooltip passend zu Highcharts (dessen useHTML-Tooltip vom
        // Browser/OS automatisch dunkel dargestellt wird) - ECharts' Tooltip
        // ist standardmaessig hell und wirkte dadurch im Vergleich fremd
        // (Dietmars Screenshot-Vergleich, 28.07.2026).
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(30,32,36,0.92)',
          borderWidth: 0,
          textStyle: { color: '#e8e8e8' },
          extraCssText: 'box-shadow:0 2px 10px rgba(0,0,0,.4);',
          // Werte im Tooltip auf 2 Nachkommastellen begrenzen (Dietmars
          // Wunsch, 28.07.2026) statt der vollen Fliesskomma-Genauigkeit.
          // Strompreis-Reiter: eigener Zweig, da der Datenpunkt in der Mitte
          // des Slots liegt (siehe priceStepPoints()) - der Tooltip soll

    function renderBalance(el, balance) {

    function renderBalanceDayHighcharts(el, curve, totals) {

    function balanceNearestIndex(refArr, ts) {

    function balanceIsZero(v) { return Math.abs(v) < 0.005; }
    function balancePanelHtml(curve, idx, panelKey, title) {

      if (!list.length) { return ''; }

      list.forEach(function (s) {
        var arr = curve[s.key] || [];
        var pt = arr[idx];
        if (pt && ts === null) { ts = pt[0]; }
        var v = pt ? pt[1] : 0;
        if (balanceIsZero(v)) { return; }

      var b = bars[idx];

    // Positioniert ein Schild seitlich vom Zeiger ausweichend (nie darueber,

    function balancePositionTip(tipEl, x, containerW, top, bottom) {

    function balanceHoverAt(chartEl, tipV, tipE, x, y, toValueFn, mode, curve, bars) {

        if (!refArr || !refArr.length) { hideBoth(); return; }

      if (htmlE) { tipE.innerHTML = htmlE; tipE.style.display = 'block'; balancePositionTip(tipE, x, w, h * 0.50, h * 0.96); } else { tipE.style.display = 'none'; }

      function hide() { tips.tipV.style.display = 'none'; tips.tipE.style.display = 'none'; }

    function balanceWireHoverHighcharts(chartEl, chartInst) {

        ],
        yAxis: [
          { gridIndex: 0, type: 'value', name: 'kWh', nameLocation: 'middle', nameGap: 28, nameTextStyle: { color: '#9aa4b0', fontSize: 12, fontWeight: 600 }, splitLine: { lineStyle: { color: GRID_COLOR } } },
          { gridIndex: 1, type: 'value', name: 'kWh', nameLocation: 'middle', nameGap: 28, nameTextStyle: { color: '#9aa4b0', fontSize: 12, fontWeight: 600 }, splitLine: { lineStyle: { color: GRID_COLOR } } }
        ],
        series: seriesFor('v', 'v').concat(seriesFor('e', 'e'))
      }, true);

      chart.__balCurve = null;
      chart.__balBars = bars;
      chart.__balMode = 'bars';
      balanceWireHover(el, chart);

      var totals = { netzbezug: 0, batterieentladung: 0, direktverbrauch: 0, batterieladung: 0, netzeinspeisung: 0 };
      bars.forEach(function (b) {
        Object.keys(totals).forEach(function (k) { totals[k] += (b[k] || 0); });
      });
      var labelPrefix = (granularity === 'month') ? 'Monat' : (granularity === 'year') ? 'Jahr' : 'Gesamt';
      renderBilanzPanel(totals, labelPrefix + 'sverbrauch', labelPrefix + 'sertrag');
    }

    function renderBilanzPanel(totals, verbrauchLabel, ertragLabel) {
      var panel = document.getElementById('balancePanel');
      var verbrauch = (totals.netzbezug || 0) + (totals.batterieentladung || 0) + (totals.direktverbrauch || 0);
      var ertrag = (totals.direktverbrauch || 0) + (totals.batterieladung || 0) + (totals.netzeinspeisung || 0);
      var quote = verbrauch > 0 ? Math.round((totals.direktverbrauch || 0) / verbrauch * 100) : 0;
      // Autarkiequote: Anteil des Verbrauchs, der OHNE Netzbezug gedeckt
      // wurde (Direktverbrauch + Batterieentladung), Dietmar 31.07.2026.
      var autarkie = verbrauch > 0 ? Math.round(((totals.direktverbrauch || 0) + (totals.batterieentladung || 0)) / verbrauch * 100) : 0;
      function kwh(val) { return val.toFixed(2).replace('.', ',') + ' kWh'; }
      // Eine Grid-Zeile bildet IMMER beide Seiten zugleich ab (Dietmar,
      // 31.07.2026: "ich wuensche mir hier mehr Praezision" - zwei
      // unabhaengige Spalten-Grids garantierten keine exakt gleiche
      // Zeilenhoehe). label==null -> leere Haelfte (z.B. hinter
      // "Direktverbrauch" soll nichts stehen).
      function half(label, color, valText) {
        if (label == null) { return '<span class="lblwrap"></span><span></span><span class="val"></span>'; }
        var dot = color ? '<span class="dot" style="background:' + color + '"></span>' : '';
        return '<span class="lblwrap">' + dot + '<span class="lbl">' + label + '</span></span><span></span><span class="val">' + valText + '</span>';
      }
      function pairRow(leftLabel, leftColor, leftValText, rightLabel, rightColor, rightValText, cls) {
        return '<div class="balRow' + (cls ? ' ' + cls : '') + '">'
          + half(leftLabel, leftColor, leftValText)
          + '<span class="balSpacer"></span>'
          + half(rightLabel, rightColor, rightValText)
          + '</div>';
      }
      // Zwei ECHTE Spalten (Verbrauch links, Erzeugung rechts), nicht ein
      // reihenweise fuellendes Grid (Fix, 31.07.2026 - Dietmars Screenshot-
      // Anmerkung: "Tagesertrag" landete durch das reihenweise Grid mitten
      // in der linken statt am Kopf der rechten Spalte). Jede Gruppe ist
      // jetzt ein eigener Flex-Block, die Reihenfolge bleibt so erhalten,
      // egal wie breit die Kachel gerade ist.
      // Farben aus BALANCE_SERIES (einzige Quelle, gleiche Farben wie im
      // Chart) statt hier ein zweites Mal hart zu kodieren.
      var col = {};
      BALANCE_SERIES.forEach(function (s) { col[s.key] = s.color; });
      // Summen-Icons dreifarbig, exakt nach Dietmars Vorgabe (31.07.2026):
      // Tagesverbrauch = Netzbezug+Batterieentladung+Direktverbrauch,
      // Tagesertrag = Batterieladung+Netzeinspeisung+Direktverbrauch.
      var gradV = 'linear-gradient(135deg,' + col.netzbezug + ',' + col.batterieentladung + ',' + col.direktverbrauch + ')';
      var gradE = 'linear-gradient(135deg,' + col.batterieladung + ',' + col.netzeinspeisung + ',' + col.direktverbrauch + ')';
      // Ein-/Ausklappen wieder da (Dietmar, 31.07.2026, siehe Kommentar bei
      // balancePanelCollapsed oben) - Klick auf den Kopf blendet die
      // Tabelle aus, #chart waechst dann von selbst in den freien Platz.
      panel.innerHTML =
        '<div class="balWrap">'
        + '<div class="balHead" id="balHeadToggle"><span class="car">▼</span> Bilanz</div>'
        + '<div class="balBody' + (balancePanelCollapsed ? ' collapsed' : '') + '" id="balBodyRows">'
        + pairRow(verbrauchLabel, gradV, kwh(verbrauch), ertragLabel, gradE, kwh(ertrag), 'total')
        + pairRow('Netzbezug', col.netzbezug, kwh(totals.netzbezug || 0), 'Batterieladung', col.batterieladung, kwh(totals.batterieladung || 0))
        + pairRow('Batterieentladung', col.batterieentladung, kwh(totals.batterieentladung || 0), 'Netzeinspeisung', col.netzeinspeisung, kwh(totals.netzeinspeisung || 0))
        + pairRow('Direktverbrauch', col.direktverbrauch, kwh(totals.direktverbrauch || 0), null, null, null)
        + pairRow('Autarkiequote', null, autarkie + ' %', 'Direktverbrauchsquote', null, quote + ' %', 'quote')
        + '</div>'
        + '</div>';
      var head = document.getElementById('balHeadToggle');
      head.classList.toggle('collapsed', balancePanelCollapsed);
      head.onclick = function () {
        balancePanelCollapsed = !balancePanelCollapsed;
        document.getElementById('balBodyRows').classList.toggle('collapsed', balancePanelCollapsed);
        head.classList.toggle('collapsed', balancePanelCollapsed);
        // Keine Hoehen-Sperre mehr fuer #chart - es soll sich den frei
        // werdenden bzw. wieder benoetigten Platz von selbst zurueckholen.
      };
    }

    // Energiebilanz (Sankey) - Datengrundlage kommt fertig berechnet von
    // InverterHubEnergy::IHUBNRG_GetFlow() (Verbund-Vertrag, 28.07.2026:
    // nodes/links/totalIn/hasData, Farben je Node bereits enthalten) - wir
    // zeichnen nur, keine eigene Zaehler-Differenzbildung/Doppelzaehlungs-
    // Vermeidung noetig, die bleibt komplett bei InverterHub. Prozentangaben
    // im Tooltip immer relativ zu totalIn (= Solar + Netzbezug, ohne
    // Batterie als interner Transfer - exakt wie in deren eigener Kachel).
    function sankeyLookups(flow) {
      var label = {}, color = {}, incoming = {}, outgoing = {};
      (flow.nodes || []).forEach(function (n) { label[n.key] = n.label; color[n.key] = n.color; incoming[n.key] = 0; outgoing[n.key] = 0; });
      (flow.links || []).forEach(function (l) {
        outgoing[l.from] = (outgoing[l.from] || 0) + l.value;
        incoming[l.to] = (incoming[l.to] || 0) + l.value;
      });
      return { label: label, color: color, incoming: incoming, outgoing: outgoing };
    }

    // Reihenfolge der Knoten der LETZTEN Spalte (Verbraucher/Netzeinspeisung)
    // von oben nach unten umgedreht - beide Engines stapeln Knoten in
    // Array-Reihenfolge, InverterHubEnergy liefert sie aber in der
    // "natuerlichen" Reihenfolge 1,2,3,4,5 (Dietmars Wunsch, 28.07.2026:
    // 5,4,3,2,1 von oben nach unten). Andere Spalten (Solar/Netzbezug,
    // Batterie) bleiben unangetastet.
    // Dietmars persoenliche Wunsch-Reihenfolge der letzten Spalte (Verbraucher/
    // Netzeinspeisung), von oben nach unten (28.07.2026) - eine feste Liste
    // NUR fuer diese Installation, kein Verbund-Standard: Verbrauchernamen
    // sind pro Anlage frei benannt (InverterHubEnergy-Konfiguration), andere
    // Installationen haben andere/keine dieser Labels. Ein hier unbekanntes
    // Label faellt einfach ans Ende (in unveraenderter relativer Reihenfolge),
    // bricht also nirgends.
    // "Wärmepumoe" (ohne "p") ist bewusst kein Tippfehler hier im Code,
    // sondern deckt sich mit dem exakten Verbrauchernamen in Dietmars
    // InverterHubEnergy-Konfiguration (live geprueft, 29.07.2026 - die
    // Sortierung griff vorher nicht, weil "Wärmepumpe" dort nicht vorkam).
    // Wird der Verbraucher dort umbenannt, muss diese Liste mitgezogen
    // werden.
    var SANKEY_SINK_ORDER = ['Wärmepumoe', 'Klimaanlage', 'Sonstiger Verbrauch', 'Netzeinspeisung', 'WB 1', 'WB 2'];

    function sankeyNodesTopDown(flow) {
      var maxColumn = Math.max.apply(null, (flow.nodes || []).map(function (n) { return n.column; }).concat([0]));
      var head = (flow.nodes || []).filter(function (n) { return n.column !== maxColumn; });
      var lastCol = (flow.nodes || []).filter(function (n) { return n.column === maxColumn; });
      var rank = function (n) {
        var i = SANKEY_SINK_ORDER.indexOf(n.label);
        return i === -1 ? SANKEY_SINK_ORDER.length : i;
      };
      lastCol = lastCol.map(function (n, i) { return { n: n, i: i }; })
        .sort(function (a, b) { return (rank(a.n) - rank(b.n)) || (a.i - b.i); })
        .map(function (x) { return x.n; });
      return head.concat(lastCol);
    }

    function renderSankeyECharts(el, flow) {
      if (chart && chartEngine !== 'echarts') { destroyChart(); }
      if (!chart) { el.innerHTML = ''; chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 }); chartEngine = 'echarts'; }
      var lk = sankeyLookups(flow);
      var totalIn = flow.totalIn || 0;
      // Beschriftung der letzten Spalte NACH LINKS INS Diagramm statt nach
      // rechts DARUEBER HINAUS (ECharts' Default) - bei vielen Verbrauchern
      // liefen die Labels sonst rechts aus dem Diagramm heraus/ueberlappten
      // sich, und das Diagramm musste zusaetzlichen Rand dafuer reservieren.
      // Highcharts platziert von sich aus einwaerts, das hier ist das
      // ECharts-Pendant dazu (Dietmars Wunsch, 28.07.2026).
      var maxColumn = Math.max.apply(null, (flow.nodes || []).map(function (n) { return n.column; }).concat([0]));
      var nodes = sankeyNodesTopDown(flow).map(function (n) {
        var isLast = n.column === maxColumn;
        return { name: n.key, depth: n.column, itemStyle: { color: n.color }, label: isLast ? { position: 'insideLeft' } : {} };
      });
      var links = (flow.links || []).map(function (l) { return { source: l.from, target: l.to, value: l.value }; });
      chart.setOption({
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(30,32,36,0.92)', borderWidth: 0, textStyle: { color: '#e8e8e8' },
          extraCssText: 'box-shadow:0 2px 10px rgba(0,0,0,.4);',
          formatter: function (p) {
            if (p.dataType === 'edge') {
              var pctE = totalIn > 0 ? (p.value / totalIn * 100) : 0;
              return (lk.label[p.data.source] || p.data.source) + ' → ' + (lk.label[p.data.target] || p.data.target)
                + ': <b>' + Number(p.value).toFixed(2) + ' kWh</b> (' + pctE.toFixed(0) + ' %)';
            }
            var key = p.data.name;
            var v = Math.max(lk.incoming[key] || 0, lk.outgoing[key] || 0);
            var pctN = totalIn > 0 ? (v / totalIn * 100) : 0;
            var extra = (lk.incoming[key] > 0.0001 && lk.outgoing[key] > 0.0001)
              ? '<br/>eingespeist ' + lk.incoming[key].toFixed(2) + ' kWh / entnommen ' + lk.outgoing[key].toFixed(2) + ' kWh' : '';
            return '<b>' + (lk.label[key] || key) + '</b>: ' + v.toFixed(2) + ' kWh (' + pctN.toFixed(0) + ' %)' + extra;
          }
        },
        series: [{
          type: 'sankey',
          data: nodes,
          links: links,
          emphasis: { focus: 'adjacency' },
          label: { color: '#e8e8e8', formatter: function (p) { return lk.label[p.name] || p.name; } },
          lineStyle: { color: 'gradient', opacity: 0.42, curveness: 0.5 },
          // layoutIterations:0 - ECharts' Standard (32 Iterationen) sortiert
          // Knoten zur Kreuzungsminimierung eigenmaechtig um und ignoriert
          // damit unsere Reihenfolge im data-Array (live geprueft: identische
          // SANKEY_SINK_ORDER-Sortierung im Array, trotzdem andere sichtbare
          // Reihenfolge). Mit 0 Iterationen bleibt die Array-Reihenfolge
          // massgeblich (Dietmars Wunsch, 28.07.2026: feste eigene Reihen-
          // folge statt automatischer Kreuzungsminimierung).
          layoutIterations: 0,
          nodeWidth: 16, nodeGap: 14, draggable: false
        }]
      }, true);
    }

    function renderSankeyHighcharts(el, flow) {
      if (chart && chartEngine !== 'highcharts') { destroyChart(); }
      var lk = sankeyLookups(flow);
      var totalIn = flow.totalIn || 0;
      // Verlaufsfarbe je Link (Quellknoten- zu Zielknoten-Farbe), analog zu
      // ECharts' lineStyle.color:'gradient' - Highcharts baut das nicht von
      // sich aus, deshalb je Link ein eigener linearGradient auf Basis der
      // ohnehin bekannten Knotenfarben (Dietmars Wunsch, 28.07.2026: HC an
      // die ECharts-Optik angleichen).
      var data = (flow.links || []).map(function (l) {
        return {
          from: l.from, to: l.to, weight: l.value,
          color: {
            linearGradient: { x1: 0, y1: 0, x2: 1, y2: 0 },
            stops: [[0, lk.color[l.from] || '#888'], [1, lk.color[l.to] || '#888']]
          }
        };
      });
      // Beschriftung der letzten Spalte nach LINKS INS Diagramm statt nach
      // rechts darueber hinaus - Highcharts' Standard fuer die rechte Spalte
      // ist "Label rechts vom Knoten", das lief bei vielen Verbrauchern
      // ebenso aus dem Diagramm heraus wie zuvor bei ECharts (Dietmars
      // Wunsch, 28.07.2026, dasselbe Vorgehen wie dort: align:'right'/
      // negatives x schiebt den Text an die linke Kante des Knotens, ins
      // Diagramm hinein statt hinaus, das Diagramm kann dadurch die volle
      // Breite nutzen statt Rand fuer ueberlaufende Labels zu reservieren).
      var maxColumnHC = Math.max.apply(null, (flow.nodes || []).map(function (n) { return n.column; }).concat([0]));
      // Highcharts zentriert einen Knoten, der als einziger in seiner Spalte
      // steht (bei uns: der Batterie-Puffer, Spalte 1), standardmaessig
      // vertikal - ECharts packt von oben. offset:'0%' erzwingt dieselbe
      // Oben-Anordnung (Dietmars Wunsch, 28.07.2026: "Batterie oben statt
      // mittig, das sieht viel geordneter aus"). Nur fuer Ein-Knoten-Spalten,
      // bei mehreren Knoten in einer Spalte wuerden alle auf denselben
      // Offset springen und sich ueberlappen.
      var countByColumn = {};
      (flow.nodes || []).forEach(function (n) { countByColumn[n.column] = (countByColumn[n.column] || 0) + 1; });
      var buildNodesCfg = function (topOffsets) {
        return sankeyNodesTopDown(flow).map(function (n) {
          var cfg = { id: n.key, name: n.label, color: n.color, column: n.column };
          if (n.column === maxColumnHC) { cfg.dataLabels = { align: 'right', x: -8 }; }
          if (topOffsets && topOffsets[n.key] !== undefined) { cfg.offset = topOffsets[n.key]; }
          return cfg;
        });
      };
      // Highcharts' "offset" ist ein ABSOLUTER Pixel-Versatz relativ zur
      // automatisch berechneten (gewichtsbasiert zentrierten) Position,
      // keine feste Prozentangabe - je nach Datenlage ist der noetige Wert
      // fuer "ganz oben" jedes Mal anders. Deshalb zweistufig: einmal
      // unsichtbar (unangehaengtes Div, keine sichtbare Zwischen-Stufe)
      // rendern, die natuerliche nodeY-Position des Ein-Knoten-Spalten-
      // Knotens (bei uns: Batterie) messen, dann den finalen, sichtbaren
      // Chart mit offset=-gemesseneY neu aufbauen - der Knoten landet damit
      // exakt bei y=0 (ganz oben), unabhaengig von den tatsaechlichen
      // Energiewerten des Tages (Dietmars Wunsch, 28.07.2026: "Batterie
      // oben statt mittig, sieht viel geordneter aus").
      var measureEl = document.createElement('div');
      measureEl.style.cssText = 'position:absolute; visibility:hidden; pointer-events:none; width:' + el.clientWidth + 'px; height:' + el.clientHeight + 'px;';
      document.body.appendChild(measureEl);
      var probeChart = Highcharts.chart(measureEl, { chart: { animation: false }, title: { text: null }, credits: { enabled: false }, series: [{ type: 'sankey', data: data, nodes: buildNodesCfg(null), animation: false }] });
      var topOffsets = {};
      probeChart.series[0].nodes.forEach(function (n) {
        if (countByColumn[n.column] === 1) { topOffsets[n.id] = -n.nodeY; }
      });
      // Feste Wunsch-Reihenfolge der letzten Spalte (SANKEY_SINK_ORDER, s.o.)
      // von oben nach unten - Highcharts bestimmt die vertikale Reihenfolge
      // ueber einen eigenen, gewichtsbasierten Layout-Algorithmus und
      // ignoriert dafuer die Reihenfolge im nodes-Array komplett (live
      // geprueft: identisches Ergebnis mit und ohne Array-Umkehr). Deshalb
      // hier stattdessen die gemessenen Knotenhoehen in der GEWUENSCHTEN
      // Reihenfolge neu gestapelt (eigener nodePadding-Abstand von 14px,
      // gleicher Wert wie unten in der Serienoption), verankert an der
      // natuerlichen oberen Blockkante.
      var lastNodes = probeChart.series[0].nodes.filter(function (n) { return n.column === maxColumnHC; });
      if (lastNodes.length > 1) {
        var blockTop = Math.min.apply(null, lastNodes.map(function (n) { return n.nodeY; }));
        var rankHC = function (n) {
          var i = SANKEY_SINK_ORDER.indexOf(n.name);
          return i === -1 ? SANKEY_SINK_ORDER.length : i;
        };
        var ordered = lastNodes.map(function (n, i) { return { n: n, i: i }; })
          .sort(function (a, b) { return (rankHC(a.n) - rankHC(b.n)) || (a.i - b.i); })
          .map(function (x) { return x.n; });
        var y = blockTop;
        ordered.forEach(function (n) {
          topOffsets[n.id] = y - n.nodeY;
          y += n.shapeArgs.height + 14;
        });
      }
      probeChart.destroy();
      document.body.removeChild(measureEl);
      var nodesCfg = buildNodesCfg(topOffsets);
      chart = Highcharts.chart(el, {
        chart: { backgroundColor: 'transparent', spacingRight: 8, style: lastData.font ? { fontFamily: lastData.font } : {} },
        title: { text: null },
        credits: { enabled: false },
        tooltip: {
          useHTML: true,
          backgroundColor: 'rgba(30,32,36,0.92)', borderWidth: 0, style: { color: '#e8e8e8' },
          formatter: function () {
            if (this.point.isNode) {
              var key = this.point.id;
              var v = Math.max(lk.incoming[key] || 0, lk.outgoing[key] || 0);
              var pctN = totalIn > 0 ? (v / totalIn * 100) : 0;
              var extra = (lk.incoming[key] > 0.0001 && lk.outgoing[key] > 0.0001)
                ? '<br/>eingespeist ' + lk.incoming[key].toFixed(2) + ' kWh / entnommen ' + lk.outgoing[key].toFixed(2) + ' kWh' : '';
              return '<b>' + this.point.name + '</b>: ' + v.toFixed(2) + ' kWh (' + pctN.toFixed(0) + ' %)' + extra;
            }
            var pctE = totalIn > 0 ? (this.point.weight / totalIn * 100) : 0;
            return this.point.fromNode.name + ' → ' + this.point.toNode.name + ': <b>' + Number(this.point.weight).toFixed(2) + ' kWh</b> (' + pctE.toFixed(0) + ' %)';
          }
        },
        // nodeWidth/nodePadding/linkOpacity/curveFactor an ECharts'
        // nodeWidth:16/nodeGap:14/opacity:0.42/curveness:0.5 angeglichen -
        // Highcharts' eigene Defaults wirkten dagegen breiter/klobiger
        // (Dietmars Vergleich, 28.07.2026). borderWidth:0 entfernt die
        // dicken hellen Umrandungen der Knoten, die ECharts von Haus aus
        // nicht zeichnet.
        series: [{
          type: 'sankey',
          data: data,
          nodes: nodesCfg,
          nodeWidth: 16,
          nodePadding: 14,
          borderWidth: 0,
          dataLabels: { color: '#e8e8e8', style: { textOutline: 'none', fontWeight: 'normal' } },
          linkOpacity: 0.42,
          curveFactor: 0.5,
          animation: false
        }]
      });
      chartEngine = 'highcharts';
    }

    function render() {
      syncNav();
      var el = document.getElementById('chart');
      if (curTab !== 'balance') { document.getElementById('balancePanel').style.display = 'none'; }

      if (curTab === 'price' && lastData.days && lastData.days[idx] && (!lastData.days[idx].price || !lastData.days[idx].price.length)) {
        destroyChart();
        el.innerHTML = '<div class="empty">Keine Preiskurve verfügbar - Tibber Grid Rewards-Instanz wählen oder installieren</div>';
        return;
      }

      if (curTab === 'mpp' && (!lastData.mpptKeys || !lastData.mpptKeys.length)) {
        destroyChart();
        el.innerHTML = '<div class="empty">Keine MPPT-Stränge gefunden - InverterHubMonitor-Instanz mit Diagnose-Daten installieren</div>';
        return;
      }
      if (curTab === 'battery' && !lastData.hasBat && !lastData.hasSoc) {
        destroyChart();
        el.innerHTML = '<div class="empty">Keine Batterie-Variable gefunden - im Formular „Datenquelle“ wählen oder InverterHub installieren</div>';
        return;
      }
      if (curTab === 'balance') {
        document.getElementById('balancePanel').style.display = '';
        if (!lastData.hasEnergyFlow) {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Keine InverterHubEnergy-Instanz gefunden - im Formular „Datenquelle“ wählen oder InverterHubEnergy installieren</div>';
          return;
        }
        if (curView === 'custom' && (!customFrom || !customTo)) {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
          return;
        }
        var balBounds, balGran;
        if (curView === 'day') {
          var balDay = (lastData.days || [])[idx];
          if (!balDay) { destroyChart(); el.innerHTML = '<div class="empty">Kein Tag ausgewählt</div>'; return; }
          balBounds = { start: Math.floor(balDay.dayStart / 1000), end: Math.floor(balDay.dayEnd / 1000) };
          balGran = 'day';
        } else {
          balBounds = flowPeriodBounds();
          balGran = (curView === 'week') ? 'month' : curView; // Woche hat keine eigene Bilanz-Granularitaet - Tagesbalken wie Monat
          if (!balBounds) { destroyChart(); el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>'; return; }
        }
        var balKey = 'balance_' + balGran + '_' + balBounds.start + '_' + balBounds.end;
        if (balanceCache[balKey] !== undefined) {
          renderBalance(el, balanceCache[balKey]);
        } else {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Lade Bilanz…</div>';
          if (balancePendingKey !== balKey) {
            balancePendingKey = balKey;
            requestAction('balancePeriod', JSON.stringify({ key: balKey, granularity: balGran, start: balBounds.start, end: balBounds.end }));
          }
        }
        return;
      }
      if (curTab === 'flow') {
        if (!lastData.hasEnergyFlow) {
          destroyChart();
          el.innerHTML = '<div class="empty">Keine InverterHubEnergy-Instanz gefunden - im Formular „Datenquelle“ wählen oder InverterHubEnergy installieren</div>';
          return;
        }
        var flowObj = null;
        if (curView === 'day') {
          // Tag: die passende Kurve liegt bereits im vorab gelieferten
          // Tage-Fenster (siehe module.php::buildPayload()), kein Nachladen
          // noetig.
          var flowDay = (lastData.days || [])[idx];
          flowObj = flowDay ? flowDay.flow : null;
        } else {
          // Woche/Monat/Jahr/Gesamt/Benutzerdefiniert: das Tage-Fenster
          // deckt nur WINDOW_DAYS Tage ab - ein Sankey fuer z.B. "dieses
          // Jahr" braucht einen frischen Archivdurchlauf mit den echten
          // Periodengrenzen, live ueber requestAction() nachgefordert
          // (Dietmars Wunsch, 28.07.2026: Energiebilanz auch fuer laengere
          // Zeitraeume waehlbar, nicht nur Tag).
          var bounds = flowPeriodBounds();
          if (!bounds) {
            destroyChart();
            el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
            return;
          }
          var key = bounds.start + '_' + bounds.end;
          if (flowCache[key] !== undefined) {
            flowObj = flowCache[key];
          } else {
            destroyChart();
            el.innerHTML = '<div class="empty">Lade Energiebilanz…</div>';
            if (flowPendingKey !== key) {
              flowPendingKey = key;
              requestAction('flowPeriod', JSON.stringify(bounds));
            }
            return;
          }
        }
        if (!flowObj || !flowObj.hasData) {
          destroyChart();
          el.innerHTML = '<div class="empty">Keine Energiedaten für diesen Zeitraum</div>';
          return;
        }
        var legendRowEl = document.getElementById('legendRow'); if (legendRowEl) { legendRowEl.innerHTML = ''; }
        var wantEngineFlow = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
        if (wantEngineFlow === 'highcharts') {
          ensureHighchartsSankey(function () { el.innerHTML = ''; renderSankeyHighcharts(el, flowObj); });
        } else {
          // KEIN el.innerHTML-Reset hier - renderSankeyECharts() leert/
          // erstellt intern nur beim tatsaechlichen Neuanlegen (siehe
          // Kommentar bei renderECharts() weiter oben: externes Leeren VOR
          // jeder Wiederverwendung reisst den Canvas ab, setOption() liefe
          // danach ins Leere).
          ensureECharts(function () { renderSankeyECharts(el, flowObj); setTimeout(sizeChart, 60); });
        }
        return;
      }

      // Energie-Ansichten (Woche/Monat/Jahr/Gesamt/Benutzerdefiniert) -
      // Balken statt Verlaufslinie, aus den vorab gelieferten Tages-kWh-
      // Karten gruppiert (siehe buildEnergyRows()), kein erneuter
      // Archivzugriff je Ansichtswechsel.
      if (curView !== 'day') {
        if (curView === 'custom' && (!customFrom || !customTo)) {
          destroyChart();
          el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
          return;
        }
        var wantEngineBar = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
        if (wantEngineBar === 'highcharts') {
          ensureHighcharts(function () { el.innerHTML = ''; renderBarHighcharts(el, curTab); });
        } else {
          ensureECharts(function () { renderBarECharts(el, curTab); setTimeout(sizeChart, 60); });
        }
        return;
      }

      var days = (lastData && lastData.days) || [];
      var d = days[idx];
      if (!d || !d.hasData) {
        destroyChart();
        el.innerHTML = '<div class="empty">Keine Archivdaten für diesen Tag</div>';
        return;
      }
      var wantEngine = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
      if (wantEngine === 'highcharts') {
        ensureHighcharts(function () { el.innerHTML = ''; renderHighcharts(el, curTab, d); });
      } else {
        ensureECharts(function () { renderECharts(el, curTab, d); setTimeout(sizeChart, 60); });
      }
    }

    function handleMessage(raw) {
      var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!d || !d.ok) { return; }
      // Antwort auf requestAction('flowPeriod', ...) - siehe module.php::
      // RequestAction() - NICHT die volle Nutzlast, nur das nachgeforderte
      // Energiebilanz-Ergebnis fuer einen Zeitraum. In flowCache ablegen und
      // bei Bedarf neu rendern, statt lastData zu ueberschreiben.
      if (d.type === 'flowUpdate') {
        flowCache[d.start + '_' + d.end] = d.flow;
        flowPendingKey = null;
        if (curTab === 'flow') { render(); }
        return;
      }
      // Antwort auf requestAction('balancePeriod', ...) - neuer "Bilanz"-
      // Reiter (30.07.2026), gleiches Nachforder-/Cache-Muster wie flowUpdate.
      if (d.type === 'balanceUpdate') {
        balanceCache[d.key] = d.balance;
        balancePendingKey = null;
        if (curTab === 'balance') { render(); }
        return;
      }
      lastData = d;
      visKey = 'nrgdashmon_vis_' + (d.uid || 'x');
      loadVis();
      if (d.bg) { document.body.style.background = d.bg; }
      // Erster Aufruf kommt aus einem <script>-Block direkt beim Laden der
      // Kachel, bevor das Layout sicher fertig ist (WebFront-Rahmen/Flex-
      // Boxen noch nicht final vermessen) - echarts.init() auf einem noch
      // 0x0 grossen Container liefert eine leere Zeichenflaeche, die ein
      // spaeteres resize() nicht zuverlaessig repariert. Deshalb den ersten
      // Render-Aufruf einen Frame verzoegern.
      requestAnimationFrame(function () { render(); });
    }

    document.getElementById('prev').onclick = function () {
      if (curView === 'day') {
        var days = (lastData && lastData.days) || [];
        if (idx < days.length - 1) { idx++; render(); }
      } else if (curView === 'week' || curView === 'month' || curView === 'year') {
        shiftViewRef(-1); render();
      }
    };
    document.getElementById('next').onclick = function () {
      if (curView === 'day') {
        if (idx > 0) { idx--; render(); }
      } else if (curView === 'week' || curView === 'month' || curView === 'year') {
        shiftViewRef(1); render();
      }
    };
    document.getElementById('pick').onchange = function (e) {
      if (curView === 'day') {
        var days = (lastData && lastData.days) || [];
        var i = days.findIndex(function (d) { return d.id === e.target.value; });
        if (i >= 0) { idx = i; render(); }
      } else if (curView === 'custom') {
        customFrom = e.target.value; render();
      } else if (e.target.value) {
        viewRef = new Date(e.target.value + 'T00:00:00'); render();
      }
    };
    document.getElementById('pickTo').onchange = function (e) {
      customTo = e.target.value; render();
    };
    document.getElementById('type').onchange = function (e) {
      curView = e.target.value;
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (btn) {
      btn.onclick = function () {
        if (btn.disabled) { return; }
        var leavingBalance = (curTab === 'balance' && btn.getAttribute('data-tab') !== 'balance');
        curTab = btn.getAttribute('data-tab');
        if (leavingBalance) { unlockChartHeight(); }
        Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (b) { b.classList.toggle('active', b === btn); });
        // Batterie UND Strompreis haben keine Energie-Ansichten (Woche/
        // Monat/Jahr/Gesamt/Benutzerdefiniert) - die Auswahl ist dort ohne
        // Wirkung, deshalb gesperrt und fest auf "Tag" gesetzt (Dietmars
        // Wunsch, 28.07.2026). Energiebilanz (Sankey) dagegen kann seit
        // 28.07.2026 auch fuer diese Zeitraeume dargestellt werden (per
        // requestAction() nachgeforderte Grenzen, siehe flowPeriodBounds()),
        // deshalb hier NICHT gesperrt.
        var dayOnly = (curTab === 'battery' || curTab === 'price');
        var typeSel = document.getElementById('type');
        typeSel.disabled = dayOnly;
        if (dayOnly && curView !== 'day') {
          curView = 'day';
          typeSel.value = 'day';
        }
        render();
      };
    });
    window.addEventListener('resize', function () { if (chart) { setTimeout(sizeChart, 60); } });
  </script>
</body>
</html>
