<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Steuerleiste/Legende/Grundgeruest 1:1 aus NRGDashboardPVMonitor
     uebernommen (Dietmar, 18.08.2026: "alles Grundlegende ... praezise
     analog bauen") - selbe Klassennamen, selbe Farben/Radien. padding-
     top:52px ist reservierter Platz fuer Symcons eigene Kachel-Titelzeile
     (Instanzname) - die Kachel zeichnet bewusst KEINE eigene Ueberschrift.
  */
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { position: relative; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; padding: 52px 12px 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  button.nav { font: inherit; font-size: 14px; line-height: 1; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.nav:hover:not(:disabled) { background: rgba(127,135,145,.22); }
  button.nav:disabled { opacity: .35; cursor: default; }
  #quick { display: flex; gap: 4px; }
  button.qday { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.qday:hover:not(:disabled) { background: rgba(127,135,145,.22); }
  button.qday.active { background: rgba(127,135,145,.30); border-color: rgba(127,135,145,.55); }
  button.qday:disabled { opacity: .35; cursor: default; }
  input.pick, select.sel { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  select.sel:disabled { opacity: .35; cursor: default; }
  select.sel { padding-right: 26px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239aa4b0'/></svg>"); background-repeat: no-repeat; background-position: right 9px center; }
  /* Reiterleiste 1:1 aus NRGDashboardPVMonitor (Dietmar, 18.09.2026: "der Wechsel
     soll exakt analog zum PV Monitor erfolgen, auch das Menue") */
  #body { display: flex; flex: 1 1 auto; min-height: 0; gap: 10px; margin-top: 8px; position: relative; }
  /* Reiterleiste als OVERLAY ueber dem stehenden Diagramm (Dietmar,
     27.08.2026: "Waehrend der Animation macht das Diagramm keine gute
     Figur und zappelt am rechten Rand rum. Wie waere es, wenn die Leiste
     sich ueber das stehende Diagramm schieben wuerde?") - #tabs ist
     absolut positioniert und nimmt KEINEN Layoutplatz mehr ein, das
     Diagramm behaelt beim Ein-/Ausblenden exakt seine Groesse (kein
     Resize, kein Zappeln). Nur der schmale Pfeil-Knopf bleibt im
     Layoutfluss. Milchglas-Optik (backdrop-filter) macht die Leiste auf
     hellem wie dunklem Kachelhintergrund lesbar, ohne das Diagramm
     dahinter ganz zu verdecken.
     Animation (Dietmars Wunsch nach etwas "modernem/hippem"): federnder
     Einschub mit Overshoot (cubic-bezier laeuft kurz uebers Ziel hinaus
     und schwingt zurueck) + gestaffeltes Einfliegen der einzelnen
     Reiter (jeder Knopf 30ms nach seinem Vorgaenger, transition-delay
     je nth-child) - beim Schliessen ohne Staffelung, damit es knackig
     zugeht. */
  /* position:relative + hoher z-index am Wrapper: im WebFront zeichneten
     sich Chart-Elemente (Achsenbeschriftung) UEBER das Panel und schluckten
     dessen Klicks (Dietmars Screenshot, 27.08.2026 - die Achsenzahlen
     standen scharf VOR dem Panel, also lag das Chart in einer hoeheren
     Stapelebene als unser z-index 20). Der Wrapper bildet jetzt selbst
     einen Stapelkontext weit oberhalb der Chart-Bibliotheken; #tabs
     ankert damit auch an ihm statt an #body (left:30px bleibt optisch
     gleich, der Wrapper sitzt am linken Rand von #body). */
  /* position:absolute statt Flex-Spalte (Dietmar, 28.08.2026: "die
     Diagramme stehen nicht mittig in der Kachel") - die schmale
     Pfeil-Spalte hat #chartcol um ~34px nach rechts geschoben, die
     symmetrischen 58/58-Plotraender waren dadurch in der KACHEL nicht
     mittig. Jetzt schwebt auch der Pfeil-Knopf ueber dem Diagramm
     (oben links, dort liegt nur leere Flaeche ueber der Y-Achse),
     #chartcol nimmt die volle Kachelbreite ein. */
  /* top:-35px hebt den Pfeil-Knopf auf die Hoehe der Zeitsteuerungszeile
     (#bar, 30px hoch, sitzt 8px Body-Abstand darueber; 24px Knopf mittig
     = -(8+30)+3) - Dietmar, 28.08.2026: "der Pfeil ... muss auf genau
     die gleiche Hoehe der Zeitsteuerungszeile". Die Reiterleiste wandert
     MIT dem Pfeil nach oben (Dietmars Nachtrag: "die Reiterleiste musst
     Du exakt wie der Pfeilbutton verschieben") - sie haengt am selben
     Wrapper und beginnt wieder auf Pfeilhoehe (#tabs top:0), wie vor
     der Verschiebung; damit stimmt auch der Einsaug-Ursprung der
     Animation wieder exakt mit dem Knopf ueberein. */
  /* top:-30px statt -35px (01.09.2026, Dietmar: "der Pfeil kommt oben
     links unter die Titelzeile der Kachel, so dass ich den Pfeil nicht
     mehr erreiche. Ich denke 5px sollten reichen.") - in manchen Kontexten
     (z.B. Demo-/Vorstellungs-Instanz mit sichtbarer Instanz-Titelzeile
     ueber der Kachel) ragte der Pfeil-Knopf 5px zu weit nach oben unter
     diese Titelzeile. */
  #tabsWrap { display: flex; flex-direction: column; perspective: 700px; position: absolute; left: 0; top: -30px; z-index: 900; }
  /* Deckender Grund (Dietmar, 27.08.2026: "zu latent") - fast opak,
     Farbe folgt dem Theme (body.light kommt aus handleMessage/lightTheme,
     dieselbe manuelle Theme-Angabe wie ueberall in der Kachel). */
  /* VOLL deckender Grund (Dietmar, 27.08.2026: selbst bei 97% war "noch
     immer sehr viel des darunter liegenden Diagramms sichtbar") - solide
     Farbe statt rgba, backdrop-filter damit ueberfluessig und entfernt. */
  #tabs { display: flex; flex-direction: column; gap: 4px; position: absolute; left: 30px; top: 0; z-index: 901; padding: 8px; border-radius: 12px; background: #26292e; border: 1px solid rgba(127,135,145,.30); box-shadow: 0 8px 28px rgba(0,0,0,.35); transform-origin: left center; }
  body.light #tabs { background: #f2f4f7; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
  #tabsWrap.collapsed #tabs { pointer-events: none; visibility: hidden; }
  /* Vier waehlbare Animationsstile (Dietmar, 27.08.2026: "Mache doch
     alle 4") - data-anim am #tabsWrap kommt aus der Doppelpfeil-Variable
     TabAnimation (Payload-Feld tabAnim). Gemeinsames Prinzip: visibility
     schaltet verzoegert (nach Ende der Ausblend-Transition), damit die
     Animation durchlaeuft und das Panel danach trotzdem aus Tab-Fokus/
     Screenreader verschwindet. */
  /* 0 "spring": federnder Einschub mit Overshoot + gestaffelt einfliegende Reiter. */
  [data-anim="spring"] #tabs { transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .22s ease, visibility 0s linear 0s; }
  [data-anim="spring"].collapsed #tabs { transform: translateX(-24px) scale(.92); opacity: 0; transition: transform .25s ease-in, opacity .18s ease-in, visibility 0s linear .25s; }
  [data-anim="spring"] #tabs .tab { transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  [data-anim="spring"].collapsed #tabs .tab { transform: translateX(-14px); opacity: 0; transition: none; }
  /* 1 "flip": Reiter klappen nacheinander wie Karten aus der Tiefe auf (3D). */
  [data-anim="flip"] #tabs { transition: opacity .2s ease, visibility 0s linear 0s; }
  [data-anim="flip"].collapsed #tabs { opacity: 0; transition: opacity .25s ease .18s, visibility 0s linear .43s; }
  [data-anim="flip"] #tabs .tab { transform-origin: left center; transition: transform .45s cubic-bezier(.34,1.4,.64,1), opacity .3s ease; }
  [data-anim="flip"].collapsed #tabs .tab { transform: rotateY(-88deg); opacity: 0; transition: transform .25s ease-in, opacity .2s ease-in; }
  /* 2 "scale": Panel waechst aus dem Pfeil-Knopf heraus (Kontextmenue-Stil). */
  /* "Fluessig durch den Pfeil" (Dietmars vierte Fassung, 27.08.2026:
     "als wenn der Pfeil Button eine Oeffnung waere und das Panel wie
     etwas fluessiges sich durch die kleine Oeffnung hindurch quetschen
     muss") - Choreografie in Fluessigkeits-Phasen, Ursprung am Knopf:
     1. tropfenklein an der Oeffnung (scale ~0, kreisrund),
     2. ein DUENNER, flachgedrueckter Strahl schiesst horizontal heraus
        (X waechst stark, Y bleibt winzig - das ist das "Durchquetschen"),
     3. der Strahl blaeht sich vertikal auf, schwappt ueber (Y-Overshoot),
     4. wabbelt kurz nach und setzt sich; border-radius laeuft von rund
        (Tropfen) zu eckig (Panel) mit. Schliessen: umgekehrt - Panel
        wird erst flachgedrueckt, dann als duenner Strahl in die Oeffnung
        gesaugt (forwards haelt den Endzustand, bis .collapsed greift). */
  /* Ecke-fuer-Ecke-Einsaugen (Dietmars finaler Ablauf, 27.08.2026):
     "Zuerst spitzt sich die linke obere Ecke zu und wird in den Pfeil
     gezogen. Zu diesem Zeitpunkt stehen die anderen 3 Ecken noch an
     ihrem urspruenglichen Ort. danach wird die zum Pfeil naechstliegende
     Ecke eingezogen und dann die naechste und zum Schluss die Letzte
     Ecke." Umsetzung als animierte clip-path-Polygon-Maske mit 6
     Punkten (Ecken + 2 Zwischenpunkte an der oberen/linken Kante, die
     das ZUSPITZEN der linken oberen Ecke formen). Reihenfolge beim
     Schliessen: 1. TL-Spitze bildet sich (Nachbarpunkte kneifen zur
     Ecke, die anderen 3 Ecken stehen UNVERAENDERT), 2. die
     naechstliegende Ecke (oben rechts) wandert zur Saugstelle, 3. dann
     unten links, 4. zuletzt unten rechts. Ein leichter Scale zum
     Pfeil-Ursprung verkauft die Zugbewegung des Inhalts, Deckkraft
     faellt erst ganz am Ende. Oeffnen = exakt rueckwaerts (die zuletzt
     eingesogene Ecke kommt zuerst wieder heraus). */
  /* Simulierte Fassung, maximaler Drall (Dietmar, 28.08.2026: "der
     drall / bogen muss noch staerker werden"): gleiche Physik-Simulation

     Pfeil-Knopf, Spiral-Einfall, viskose Daempfung, semi-implizite
     Euler-Integration, Einfang am Loch, Oeffnen = Zeitumkehr), Drall
     v_t 130 -> 200 bei Daempfung .8 -> 1.2 - der Parameter-Sweep hat
     gezeigt: 200 ist das MAXIMUM, bei dem das Loch noch alle Ecken
     einfaengt; ab ~280 entkommen die fernen Ecken der Gravitation
     (echte Physik: zu viel Drehimpuls = keine Einfangbahn mehr), und
     die hoehere Daempfung ist noetig, um den zusaetzlichen Drehimpuls
     abzubauen. Einfangzeiten: TL sofort, TR ~23%, BL ~50%, BR ~91%.
     Uebrige Parameter: G=4e7, Feder k=18, Softening 9, Einfangradius
     10. Keyframes PROGRAMMATISCH erzeugt - Generator anpassen, nicht
     Zahlen von Hand verbiegen. */

  [data-anim="scale"] #tabs { transform-origin: -18px 12px; }
  [data-anim="scale"]:not(.collapsed) #tabs { animation: cornerSuckOut .5s linear; }
  [data-anim="scale"].collapsed #tabs { transform: scale(.12); opacity: 0; animation: cornerSuckIn .45s linear forwards; transition: visibility 0s linear .45s; }
  /* 3 "blur": Panel materialisiert sich aus der Unschaerfe. */
  [data-anim="blur"] #tabs { transition: filter .35s ease, transform .35s ease, opacity .25s ease, visibility 0s linear 0s; }
  [data-anim="blur"].collapsed #tabs { filter: blur(14px); transform: scale(1.06); opacity: 0; transition: filter .28s ease-in, transform .28s ease-in, opacity .22s ease-in, visibility 0s linear .28s; }
  /* Gestaffelte Verzoegerungen (spring + flip nutzen sie beim Oeffnen). */
  [data-anim="spring"] #tabs .tab:nth-child(1), [data-anim="flip"] #tabs .tab:nth-child(1) { transition-delay: .03s; }
  [data-anim="spring"] #tabs .tab:nth-child(2), [data-anim="flip"] #tabs .tab:nth-child(2) { transition-delay: .06s; }
  [data-anim="spring"] #tabs .tab:nth-child(3), [data-anim="flip"] #tabs .tab:nth-child(3) { transition-delay: .09s; }
  [data-anim="spring"] #tabs .tab:nth-child(4), [data-anim="flip"] #tabs .tab:nth-child(4) { transition-delay: .12s; }
  [data-anim="spring"] #tabs .tab:nth-child(5), [data-anim="flip"] #tabs .tab:nth-child(5) { transition-delay: .15s; }
  [data-anim="spring"] #tabs .tab:nth-child(6), [data-anim="flip"] #tabs .tab:nth-child(6) { transition-delay: .18s; }
  [data-anim="spring"] #tabs .tab:nth-child(7), [data-anim="flip"] #tabs .tab:nth-child(7) { transition-delay: .21s; }
  [data-anim="spring"] #tabs .tab:nth-child(8), [data-anim="flip"] #tabs .tab:nth-child(8) { transition-delay: .24s; }
  [data-anim="spring"].collapsed #tabs .tab, [data-anim="flip"].collapsed #tabs .tab { transition-delay: 0s; }
  #tabsToggle { font: inherit; font-size: 12px; line-height: 1; width: 24px; height: 24px; padding: 0; border-radius: 6px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; opacity: .7; flex: 0 0 auto; margin-bottom: 4px; transition: transform .38s cubic-bezier(.34,1.56,.64,1); }

  button.tab { font: inherit; font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer; opacity: .6; }
  button.tab:hover:not(:disabled) { opacity: .85; background: rgba(127,135,145,.10); }
  button.tab.active { opacity: 1; background: rgba(127,135,145,.16); border-color: rgba(127,135,145,.35); }
  button.tab:disabled { opacity: .3; cursor: default; }
  /* Automatische Reiter-Sichtbarkeit (Dietmar, 28.08.2026): Reiter OHNE
     Datenquelle werden komplett ausgeblendet (.tabHidden); Reiter mit
     Quelle und aktuellen Daten leicht gruen (.tabOk), Reiter mit Quelle
     aber ohne aktuelle Daten leicht rot (.tabWarn) - "auf diese Art und
     Weise wird auch deutlich was derzeit schief laeuft". Zustaende
     werden bei jedem Payload je Reiter neu bewertet (updateTabStates()). */
  button.tab.tabHidden { display: none; }
  button.tab.tabOk { color: #a8d5ac; }
  button.tab.tabWarn { color: #e6a9a9; }

  /* Einfuehrungs-Tour bei erster Benutzung (28.08.2026), Muster 1:1 aus
     NRGDashboardPVMonitor - siehe module.php::ProcessHookData()/ResetTour()
     und handleMessage()/showTourOverlay() weiter unten. Keine CSS-Variablen
     in diesem Modul (siehe restlicher Block oben) - Farben direkt an den
     dunklen Grundton dieser Kachel angepasst. */
  .tour-overlay {
    position: absolute; inset: 0; z-index: 950; display: none;
    align-items: center; justify-content: center;

  <!-- Heizkurven-Reiter (18.09.2026) - Zwei-Punkt-Editor je Heizkreis/Modus,
       siehe renderCurvePanel()/wireCurveDrag() weiter unten. Zone-/Modus-
       Unterreiter werden nur fuer tatsaechlich vorhandene Kombinationen
       gezeigt (curve.zones.z1.heat === null etc. bleibt komplett weg, statt
       eine leere/erfundene Kurve anzuzeigen). -->
  <div id="curvePanel">
    <div id="curveSubTabs"></div>
    <div id="curveMain">
      <div id="curveSvgWrap">
        <svg id="curveSvg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="curveShift">
        <div class="shEnd" id="curveShiftMax">+5</div>
        <input id="curveShiftRange" type="range" min="-5" max="5" step="1" value="0" orient="vertical">
        <div class="shEnd" id="curveShiftMin">-5</div>
        <div id="curveShiftVal">0 K</div>
        <div id="curveShiftNote"></div>
      </div>
    </div>
    <div id="curveActions">
      <button id="curveSaveBtn" class="curveSave" type="button" disabled>Übernehmen</button>
      <span id="curveStatus"></span>
    </div>
  </div>
  <!-- Seite "Bedienung" (18.09.2026) - Fluesterbetrieb, Leistungsbetrieb,
       Urlaub, Notbetrieb, Warmwasser-Soll ueber den HeishaMon-Vertrag 1.14
       (HEISHA_GetOperations/HEISHA_SetOperation). Kacheln nur fuer Werte,
       die die Anlage tatsaechlich meldet. -->
  <div id="opsPanel">
    <div id="opsBanner">Notbetrieb aktiv - die Anlage heizt elektrisch mit dem Heizstab.</div>
    <div id="opsGrid"></div>
  </div>
    </div>
  </div>
  <!-- Einfuehrungs-Tour (28.08.2026, Dietmar: "eine Tour die bei der ersten
       Benutzung eingeblendet und nur per Haken ausgeblendet werden kann").
       Bewusst KEIN X/Escape zum Wegklicken - nur der Haken-Button am Ende
       jedes Schritts markiert die Tour als gesehen. -->
  <div id="tourOverlay" class="tour-overlay">
    <div class="tour-card">
      <div class="tour-dots" id="tourDots"></div>
      <div class="tour-title" id="tourTitle"></div>
      <div class="tour-text" id="tourText"></div>
      <div class="tour-nav">
        <button type="button" class="tour-btn tour-btn-ghost" id="tourPrev">Zurück</button>
        <button type="button" class="tour-btn tour-btn-accent" id="tourNext">Weiter</button>
        <button type="button" class="tour-btn tour-btn-check" id="tourDone">✓ Verstanden, nicht mehr zeigen</button>
      </div>
    </div>
  </div>
</div>
<script>
  var lastData = null, chart = null, chartEngine = null, idx = 0;
  var curView = 'day';
  var viewRef = new Date();
  var customFrom = null, customTo = null;

  // Heizkurven-Reiter (18.09.2026) - eigener Top-Level-Zustand, unabhaengig
  // von curView/idx des Verlauf-Reiters. curveDraft haelt die gerade per
  // Drag bearbeiteten (noch nicht uebernommenen) Werte; null = zeigt den
  // zuletzt vom Backend gelieferten Stand unveraendert.
  var curTop = 'verlauf';
  var curveCache = null, curvePending = false, curveSaving = false;
  var curveZone = 'z1', curveMode = 'heat';
  var curveDraft = null;
  var curveDragIdx = null; // 0=low-Punkt, 1=high-Punkt, waehrend eines Drags
  var curveStatusText = '';

  // Theme-Handling 1:1 NRGDashboardPVMonitor::isLightTheme()/themeLabelColor()/
  // themeAxisStyle() - Symcon bietet einer Kachel KEINEN Weg, das aktuelle
  // Hell/Dunkel-Theme zu erkennen, deshalb die Property "LightTheme".
  var GRID_COLOR = 'rgba(128,128,128,.28)';
  function isLightTheme() { return !!(lastData && lastData.lightTheme); }
  function themeLabelColor() { return isLightTheme() ? '#333' : '#9aa4b0'; }
  // Leeres Objekt im Dunkelmodus statt explizitem Grauton (Monitor-Befund,
  // 1.8.2026: ein gesetztes axisLabel-Objekt liess dort die Zeitachsen-
  // Beschriftung verschwinden) - nur im Hellmodus wird eine Farbe gesetzt.
  function themeAxisStyle() { return isLightTheme() ? { color: '#333' } : {}; }

  // Zoom in allen Charts (1:1 NRGDashboardPVMonitor::DATA_ZOOM_INSIDE) -
  // Mausrad/Pinch/Ziehen auf der Zeit-/Kategorieachse, sichtbarer Slider.
  var DATA_ZOOM_INSIDE = [
    { type: 'inside', filterMode: 'none' },
    { type: 'slider', filterMode: 'none', height: 14, bottom: 4, borderColor: GRID_COLOR, fillerColor: 'rgba(255,255,255,.12)', handleStyle: { color: '#888' }, textStyle: { color: '#888' }, dataBackground: { lineStyle: { color: GRID_COLOR }, areaStyle: { color: GRID_COLOR } } }
  ];

  // Legenden-Sichtbarkeit je Kurvenname - bleibt ueber Ansichtswechsel UND
  // ueber ein Neuladen der Kachel erhalten (localStorage), 1:1 Muster
  // NRGDashboardPVMonitor. Namensraum je Instanz (uid).
  var vis = {}, visKey = null, visLoaded = false;
  function isVisible(name) { return vis[name] !== false; }
  function loadVis() {
    if (visLoaded) { return; }
    visLoaded = true;
    try { var s = localStorage.getItem(visKey); if (s) { vis = JSON.parse(s) || {}; } } catch (e) {}
  }
  function saveVis() { try { localStorage.setItem(visKey, JSON.stringify(vis)); } catch (e) {} }
  function setVisible(name, on) { vis[name] = on; saveVis(); }

  function addScript(src, cb) {
    var s = document.createElement('script');
    s.src = src; s.onload = cb; s.onerror = function () { cb && cb(); };
    document.head.appendChild(s);
  }
  // Highcharts wird wie in NRGDashboardPVMonitor vom CDN nachgeladen, NICHT
  // eingebettet (Lizenz - eine Redistribution mit dem Modul waere bei
  // Highcharts nicht abgedeckt). Nur wer diese Engine explizit waehlt,
  // braucht dafuer Internetzugriff und eine eigene gueltige Lizenz.
  var libs = { hc: 0, ec: 0 };
  function ensureHighcharts(cb) {
    if (typeof Highcharts !== 'undefined' && Highcharts.seriesTypes && Highcharts.seriesTypes.line) { libs.hc = 2; return cb(); }
    if (libs.hc === 1) { return setTimeout(function () { ensureHighcharts(cb); }, 80); }
    libs.hc = 1; addScript('https://code.highcharts.com/highcharts.js', function () { libs.hc = 2; cb(); });
  }
  // ECharts per CDN nachladen statt lokal einbetten (Dietmar/NRGDashboardPVMonitor-
  // Erfahrung, 31.07.2026: eingebettetes ECharts (~618KB) + Zeitreihen-Nutzlast
  // hat live "Output-Buffer exceeds Limit" ausgeloest).
  function ensureECharts(cb) {
    if (typeof echarts !== 'undefined') { libs.ec = 2; return cb(); }
    if (libs.ec === 1) { return setTimeout(function () { ensureECharts(cb); }, 80); }
    libs.ec = 1;
    addScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', function () { libs.ec = 2; cb(); });
  }

  function fmtDate(d) {
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function renderKpi(kpi) {
    var rows = [
      ['copCurrent', 'COP aktuell', ''],
      ['dailyAz', 'Tages-AZ', ''],
      ['operationsHours', 'Betriebsstd.', 'h'],
      ['compressorStarts', 'Starts', ''],
      ['avgRuntimeMin', 'Ø Laufzeit', 'min']
    ];
    var el = document.getElementById('kpiRow');
    el.innerHTML = '';
    if (!kpi) { return; }
    rows.forEach(function (r) {
      var v = kpi[r[0]];
      if (v === null || v === undefined) { return; }
      var box = document.createElement('div');
      box.className = 'kpi';
      var val = document.createElement('div');
      val.className = 'val';
      val.textContent = (typeof v === 'number' ? v.toLocaleString('de-DE') : v) + (r[2] ? ' ' + r[2] : '');
      var lbl = document.createElement('div');
      lbl.className = 'lbl'; lbl.textContent = r[1];
      box.appendChild(val); box.appendChild(lbl);
      el.appendChild(box);
    });
    // kWh (Strom/Waerme) haengen am aktuellen Zeitfenster, nicht am kpi-
    // Objekt - Tag: aus dem gerade gezeigten Tag (days[idx]), sonst: Summe
    // der sichtbaren Balken der aktuellen Energie-Ansicht.
    var kwh = currentKwhTotals();
    if (kwh) {
      [['electric', 'kWh Strom'], ['thermal', 'kWh Wärme']].forEach(function (r) {
        var v = kwh[r[0]];
        if (v === null || v === undefined) { return; }
        var box = document.createElement('div');
        box.className = 'kpi';
        var val = document.createElement('div');
        val.className = 'val'; val.textContent = v.toLocaleString('de-DE', { maximumFractionDigits: 1 });
        var lbl = document.createElement('div');
        lbl.className = 'lbl'; lbl.textContent = r[1];
        box.appendChild(val); box.appendChild(lbl);
        el.appendChild(box);
      });
    }
  }

  function currentKwhTotals() {
    if (!lastData) { return null; }
    if (curView === 'day') {
      var d = (lastData.days || [])[idx];
      return d ? { electric: d.electricEnergyKwh, thermal: d.thermalEnergyKwh } : null;
    }
    var rows = buildEnergyRows();
    var sum = { electric: null, thermal: null };
    rows.series.forEach(function (s) {
      var key = (s.name === 'El. Energie') ? 'electric' : (s.name === 'Therm. Energie' ? 'thermal' : null);
      if (!key) { return; }
      var total = 0, any = false;
      s.data.forEach(function (v) { if (v !== null && v !== undefined) { total += v; any = true; } });
      sum[key] = any ? Math.round(total * 100) / 100 : null;
    });
    return sum;
  }

  // Eigene, von uns kontrollierte Legende statt der eingebauten Klick-
  // Ereignisse von ECharts/Highcharts - 1:1 Muster NRGDashboardPVMonitor
  // (beide Bibliotheken feuern bei Klicks auf ihre native Legende ein
  // Ereignis, das sich nicht zuverlaessig von einem rein programmatisch
  // ausgeloesten Zustand unterscheiden laesst).
  function renderLegend(items) {
    var row = document.getElementById('legendRow');
    row.innerHTML = '';
    items.forEach(function (it) {
      var el = document.createElement('span');
      el.className = 'legItem' + (isVisible(it.name) ? '' : ' off');
      el.innerHTML = '<span class="dot" style="background:' + it.color + '"></span>' + it.name;
      el.onclick = function () { setVisible(it.name, !isVisible(it.name)); render(); };
      row.appendChild(el);
    });
  }

  function seriesOrEmpty(pts) { return Array.isArray(pts) ? pts : []; }

  function daySeriesFor(d) {
    var series = [];
    if (lastData.hasElectric) { series.push({ name: 'El. Leistung', data: seriesOrEmpty(d.electricPower), axis: 0, color: '#E8823C' }); }
    if (lastData.hasThermal) { series.push({ name: 'Therm. Leistung', data: seriesOrEmpty(d.thermalPower), axis: 0, color: '#E0503C' }); }
    if (lastData.hasFlowTemps) {
      series.push({ name: 'Vorlauf', data: seriesOrEmpty(d.mainOutletTemp), axis: 1, color: '#e0503c', dashed: true });
      series.push({ name: 'Rücklauf', data: seriesOrEmpty(d.mainInletTemp), axis: 1, color: '#4a90d9', dashed: true });
    }
    // smooth (23.09.2026, Dietmar: "waere als Bezier oder als schoen
    // geschwungene Linie wesentlich huebscher") - nur die Aussentemperatur,
    // nicht El./Therm. Leistung oder Vorlauf/Ruecklauf: dort sind die
    // scharfen Kanten (Start/Stopp der Waermepumpe) die eigentliche
    // Information, eine geglaettete Kurve wuerde sie verwischen.
    if (lastData.hasOutsideTemp) { series.push({ name: 'Außentemp.', data: seriesOrEmpty(d.outsideTemp), axis: 1, color: '#5FCB6B', dotted: true, smooth: true }); }
    return series;
  }

  function destroyChart() {
    if (chart) { try { if (chartEngine === 'highcharts') { chart.destroy(); } else { chart.dispose(); } } catch (e) {} }
    chart = null; chartEngine = null;
    var el = document.getElementById('chart'); if (el) { el.innerHTML = ''; }
    var lr = document.getElementById('legendRow'); if (lr) { lr.innerHTML = ''; }
  }

  function sizeChart() {
    if (!chart) { return; }
    if (chartEngine === 'highcharts') { chart.reflow(); } else { chart.resize(); }
  }

  function renderECharts(el, d) {
    if (chart && chartEngine !== 'echarts') { destroyChart(); }
    if (!chart) {
      el.innerHTML = '';
      chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 });
      chartEngine = 'echarts';
    }
    var allSeries = daySeriesFor(d);
    renderLegend(allSeries.map(function (s) { return { name: s.name, color: s.color }; }));
    var visSeries = allSeries.filter(function (s) { return isVisible(s.name); });
    var markAreas = seriesOrEmpty(d.defrostEpisodes).map(function (ep) {
      return [{ xAxis: ep[0] }, { xAxis: ep[1] }];
    });
    var series = visSeries.map(function (s, i) {
      var line = {
        name: s.name, type: 'line', showSymbol: false, data: s.data, yAxisIndex: s.axis, color: s.color,
        smooth: !!s.smooth,
        lineStyle: Object.assign({ width: 0.7 }, s.dashed ? { type: 'dashed' } : (s.dotted ? { type: 'dotted' } : {}))
      };
      if (i === 0 && markAreas.length) {
        line.markArea = { itemStyle: { color: 'rgba(74,163,224,.18)' }, data: markAreas };
      }
      return line;
    });
    chart.setOption({
      backgroundColor: 'transparent',
      textStyle: lastData.font ? { fontFamily: lastData.font } : {},
      grid: { left: 46, right: 46, top: 20, bottom: 52 },
      legend: { show: false },
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(30,32,36,0.92)', borderWidth: 0, textStyle: { color: '#e8e8e8' },
        extraCssText: 'box-shadow:0 2px 10px rgba(0,0,0,.4);',
        formatter: function (params) {
          return params.map(function (p, i) {
            var v = (p.value && p.value[1] !== undefined) ? p.value[1] : p.value;
            var head = i === 0 ? '<div style="font-weight:600;margin-bottom:2px">' + new Date(p.value[0]).toLocaleString('de-DE') + '</div>' : '';
            return head + '<div>' + p.marker + ' ' + p.seriesName + ': <b>' + (v === null || v === undefined ? '–' : Number(v).toFixed(2)) + '</b></div>';
          }).join('');
        }
      },
      xAxis: { type: 'time', min: d.dayStart, max: d.dayEnd, splitLine: { show: true, lineStyle: { color: GRID_COLOR } }, minInterval: 3600 * 1000, maxInterval: 3600 * 1000, axisLabel: themeAxisStyle() },
      yAxis: [
        { type: 'value', name: 'W', position: 'left', nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: true, lineStyle: { color: GRID_COLOR } } },
        { type: 'value', name: '°C', position: 'right', show: lastData.hasFlowTemps || lastData.hasOutsideTemp, nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: false } }
      ],
      dataZoom: DATA_ZOOM_INSIDE,
      series: series
    }, true);
  }

  function renderHighcharts(el, d) {
    if (chart && chartEngine !== 'highcharts') { destroyChart(); }
    var allSeries = daySeriesFor(d);
    renderLegend(allSeries.map(function (s) { return { name: s.name, color: s.color }; }));
    var visSeries = allSeries.filter(function (s) { return isVisible(s.name); });
    var plotBands = seriesOrEmpty(d.defrostEpisodes).map(function (ep) {
      return { from: ep[0], to: ep[1], color: 'rgba(74,163,224,.18)' };
    });
    chart = Highcharts.chart(el, {
      time: { useUTC: false },
      chart: { backgroundColor: 'transparent', alignTicks: false, zoomType: 'x', style: lastData.font ? { fontFamily: lastData.font } : {} },
      title: { text: null },
      xAxis: { type: 'datetime', min: d.dayStart, max: d.dayEnd, plotBands: plotBands, labels: { style: themeAxisStyle() }, crosshair: { color: 'rgba(255,255,255,.08)' } },
      yAxis: [
        { title: { text: 'W', style: themeAxisStyle() }, labels: { style: themeAxisStyle() } },
        { title: { text: '°C', style: themeAxisStyle() }, labels: { style: themeAxisStyle() }, opposite: true, visible: lastData.hasFlowTemps || lastData.hasOutsideTemp }
      ],
      legend: { enabled: false },
      credits: { enabled: false },
      tooltip: {
        shared: true, useHTML: true,
        formatter: function () {
          // Highcharts.dateFormat() ist eine GLOBALE Funktion und ignoriert
          // das chart-eigene "time: { useUTC: false }" oben - Zeiten im
          // Tooltip landen dadurch 2 Stunden (CEST-Offset) neben der
          // Achsenposition (Muster/Fund: NRGDashboardPVMonitor, Dietmar
          // 28.07.2026, hier 27.08.2026 wiedergefunden). Deshalb natives
          // JS-Datum statt Highcharts-API.
          var dt = new Date(this.x);
          var p2 = function (n) { return ('0' + n).slice(-2); };
          var lines = ['<b>' + p2(dt.getDate()) + '.' + p2(dt.getMonth() + 1) + '.' + dt.getFullYear() + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes()) + '</b>'];
          this.points.forEach(function (p) {
            lines.push('<div><span style="color:' + p.color + '">●</span> ' + p.series.name + ': <b>' + (p.y === null || p.y === undefined ? '–' : Number(p.y).toFixed(2)) + '</b></div>');
          });
          return lines.join('');
        }
      },
      series: visSeries.map(function (s) {
        return {
          // smooth (23.09.2026) - Highcharts kennt kein "smooth"-Flag auf
          // einem "line"-Series, sondern einen eigenen Serientyp "spline".
          name: s.name, type: s.smooth ? 'spline' : 'line', data: s.data, color: s.color, yAxis: s.axis,
          dashStyle: s.dashed ? 'Dash' : (s.dotted ? 'Dot' : 'Solid'), marker: { enabled: false }, lineWidth: 1.4
        };
      })
    });
    chartEngine = 'highcharts';
  }

  // Woche/Monat/Jahr/Gesamt/Benutzerdefiniert - Kategorien+Reihen aus den
  // vom Backend gelieferten Tages-kWh-Karten (lastData.energy), 1:1 Muster
  // NRGDashboardPVMonitor::buildEnergyRows()/energySeriesFor(): EIN
  // Archivdurchlauf pro Serie liefert alle Ansichten, hier wird nur noch
  // clientseitig gruppiert.
  var MONTH_NAMES = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  var MONTH_NAMES_FULL = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var WEEKDAY_NAMES = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  var WEEKDAY_NAMES_FULL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

  function startOfWeek(date) {
    var r = new Date(date);
    var wd = (r.getDay() + 6) % 7; // Montag=0
    r.setDate(r.getDate() - wd);
    return r;
  }
  function isoWeekNumber(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var dayNum = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    var diff = (d - firstThursday) / 86400000;
    return 1 + Math.round(diff / 7);
  }
  function shiftViewRef(dir) {
    var r = new Date(viewRef);
    if (curView === 'week') { r.setDate(r.getDate() + dir * 7); }
    else if (curView === 'month') { r.setMonth(r.getMonth() + dir); }
    else if (curView === 'year') { r.setFullYear(r.getFullYear() + dir); }
    viewRef = r;
  }

  function energySeriesFor() {
    var series = [];
    if (lastData.hasElectric) { series.push({ name: 'El. Energie', color: '#E8823C', map: (lastData.energy && lastData.energy.electric) || {} }); }
    if (lastData.hasThermal) { series.push({ name: 'Therm. Energie', color: '#E0503C', map: (lastData.energy && lastData.energy.thermal) || {} }); }
    return series;
  }

  function buildEnergyRows() {
    var seriesDefs = energySeriesFor();
    var categories = [], fullLabels = [], dateLists = [];
    if (curView === 'week') {
      var ws = startOfWeek(viewRef);
      for (var i = 0; i < 7; i++) {
        var dt = new Date(ws); dt.setDate(ws.getDate() + i);
        categories.push(WEEKDAY_NAMES[i] + ' ' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2));
        fullLabels.push(WEEKDAY_NAMES_FULL[i] + ', ' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2) + '.' + dt.getFullYear());
        dateLists.push([fmtDate(dt)]);
      }
    } else if (curView === 'month') {
      var y = viewRef.getFullYear(), m = viewRef.getMonth();
      var last = new Date(y, m + 1, 0).getDate();
      for (var day = 1; day <= last; day++) {
        categories.push(String(day));
        fullLabels.push(day + '. ' + MONTH_NAMES_FULL[m] + ' ' + y);
        dateLists.push([fmtDate(new Date(y, m, day))]);
      }
    } else if (curView === 'year') {
      var yy = viewRef.getFullYear();
      for (var mo = 0; mo < 12; mo++) {
        categories.push(MONTH_NAMES[mo]);
        fullLabels.push(MONTH_NAMES_FULL[mo] + ' ' + yy);
        var lastD = new Date(yy, mo + 1, 0).getDate();
        var list = [];
        for (var dd = 1; dd <= lastD; dd++) { list.push(fmtDate(new Date(yy, mo, dd))); }
        dateLists.push(list);
      }
    } else if (curView === 'all') {
      var thisYear = new Date().getFullYear();
      for (var k = 4; k >= 0; k--) {
        var yr = thisYear - k;
        categories.push(String(yr));
        fullLabels.push(String(yr));
        var l2 = [];
        for (var mm = 0; mm < 12; mm++) {
          var lastDd = new Date(yr, mm + 1, 0).getDate();
          for (var d2 = 1; d2 <= lastDd; d2++) { l2.push(fmtDate(new Date(yr, mm, d2))); }
        }
        dateLists.push(l2);
      }
    } else if (curView === 'custom' && customFrom && customTo) {
      var from = new Date(customFrom + 'T00:00:00'), to = new Date(customTo + 'T00:00:00');
      for (var cd = new Date(from); cd <= to; cd.setDate(cd.getDate() + 1)) {
        categories.push(('0' + cd.getDate()).slice(-2) + '.' + ('0' + (cd.getMonth() + 1)).slice(-2));
        fullLabels.push(('0' + cd.getDate()).slice(-2) + '.' + ('0' + (cd.getMonth() + 1)).slice(-2) + '.' + cd.getFullYear());
        dateLists.push([fmtDate(cd)]);
      }
    }
    var series = seriesDefs.map(function (s) {
      var data = dateLists.map(function (dl) {
        var sum = 0, any = false;
        dl.forEach(function (ds) { if (s.map[ds] !== undefined) { sum += s.map[ds]; any = true; } });
        return any ? Math.round(sum * 100) / 100 : null;
      });
      return { name: s.name, color: s.color, data: data };
    });
    return { categories: categories, fullLabels: fullLabels, series: series };
  }

  function renderBarECharts(el) {
    if (chart && chartEngine !== 'echarts') { destroyChart(); }
    if (!chart) { el.innerHTML = ''; chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 }); chartEngine = 'echarts'; }
    var rows = buildEnergyRows();
    renderLegend(rows.series.map(function (s) { return { name: s.name, color: s.color }; }));
    var visSeries = rows.series.filter(function (s) { return isVisible(s.name); });
    chart.setOption({
      backgroundColor: 'transparent',
      textStyle: lastData.font ? { fontFamily: lastData.font } : {},
      grid: { left: 46, right: 12, top: 20, bottom: 60 },
      legend: { show: false },
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(30,32,36,0.92)', borderWidth: 0, textStyle: { color: '#e8e8e8' },
        extraCssText: 'box-shadow:0 2px 10px rgba(0,0,0,.4);',
        formatter: function (params) {
          var idx = params[0] ? params[0].dataIndex : 0;
          var head = '<div style="font-weight:600;margin-bottom:2px">' + (rows.fullLabels[idx] || rows.categories[idx]) + '</div>';
          return head + params.map(function (p) {
            return '<div>' + p.marker + ' ' + p.seriesName + ': <b>' + (p.value === null || p.value === undefined ? '–' : Number(p.value).toFixed(2)) + ' kWh</b></div>';
          }).join('');
        }
      },
      xAxis: { type: 'category', data: rows.categories, axisLabel: { rotate: rows.categories.length > 12 ? 45 : 0, color: isLightTheme() ? '#333' : undefined } },
      yAxis: [{ type: 'value', name: 'kWh', nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle() }],
      dataZoom: DATA_ZOOM_INSIDE,
      series: visSeries.map(function (s) { return { name: s.name, type: 'bar', data: s.data, color: s.color }; })
    }, true);
  }

  function renderBarHighcharts(el) {
    if (chart && chartEngine !== 'highcharts') { destroyChart(); }
    var rows = buildEnergyRows();
    renderLegend(rows.series.map(function (s) { return { name: s.name, color: s.color }; }));
    var visSeries = rows.series.filter(function (s) { return isVisible(s.name); });
    chart = Highcharts.chart(el, {
      time: { useUTC: false },
      chart: { backgroundColor: 'transparent', alignTicks: false, zoomType: 'x', style: lastData.font ? { fontFamily: lastData.font } : {} },
      title: { text: null },
      xAxis: { categories: rows.categories, labels: { rotation: rows.categories.length > 12 ? -45 : 0, style: themeAxisStyle() }, crosshair: { color: 'rgba(255,255,255,.08)' } },
      yAxis: [{ title: { text: 'kWh', style: themeAxisStyle() }, labels: { style: themeAxisStyle() } }],
      legend: { enabled: false },
      credits: { enabled: false },
      tooltip: {
        shared: true, useHTML: true,
        formatter: function () {
          var idx = this.points ? this.points[0].point.index : this.point.index;
          var lines = ['<b>' + (rows.fullLabels[idx] || rows.categories[idx]) + '</b>'];
          (this.points || [this]).forEach(function (p) {
            lines.push('<div><span style="color:' + p.color + '">●</span> ' + p.series.name + ': <b>' + (p.y === null || p.y === undefined ? '–' : Number(p.y).toFixed(2)) + ' kWh</b></div>');
          });
          return lines.join('');
        }
      },
      series: visSeries.map(function (s) { return { name: s.name, type: 'column', data: s.data, color: s.color }; })
    });
    chartEngine = 'highcharts';
  }

  function syncNav() {
    var days = (lastData && lastData.days) || [];
    document.getElementById('bar').style.visibility = 'visible';

    var pick = document.getElementById('pick'), pickTo = document.getElementById('pickTo'), quick = document.getElementById('quick');
    quick.innerHTML = '';

    if (curView === 'day') {
      pick.style.display = ''; pickTo.style.display = 'none';
      document.getElementById('periodLabel').style.display = 'none';
      document.getElementById('prev').disabled = (idx >= days.length - 1);
      document.getElementById('next').disabled = (idx <= 0);
      var d = days[idx];
      if (d) { pick.value = d.id; }
      var labels = [['Vorgestern', 2], ['Gestern', 1], ['Heute', 0]];
      labels.forEach(function (l) {
        // setDate() statt Date.now() - l[1]*86400000: rechnet ueber
        // Kalendertage (DST-sicher), eine feste Millisekundenzahl kann
        // rund um die Sommer-/Winterzeit-Umstellung auf den falschen Tag
        // fallen (Verbund-DST-Audit, 27.08.2026).
        var refDate = new Date();
        refDate.setHours(0, 0, 0, 0);
        refDate.setDate(refDate.getDate() - l[1]);
        var target = days.findIndex(function (d) { return d.id === fmtDate(refDate); });
        var btn = document.createElement('button');
        btn.className = 'qday' + (target === idx ? ' active' : '');
        btn.textContent = l[0];
        btn.disabled = (target < 0) || !days[target] || !days[target].hasData;
        btn.onclick = function () { idx = target; render(); };
        quick.appendChild(btn);
      });
      return;
    }

    if (curView === 'custom') {
      pick.style.display = ''; pickTo.style.display = '';
      document.getElementById('periodLabel').style.display = 'none';
      document.getElementById('prev').disabled = true;
      document.getElementById('next').disabled = true;
      if (customFrom) { pick.value = customFrom; }
      if (customTo) { pickTo.value = customTo; }
      return;
    }

    pickTo.style.display = 'none';
    var periodLabel = document.getElementById('periodLabel');
    if (curView === 'all') {
      pick.style.display = 'none'; periodLabel.style.display = 'none';
      document.getElementById('prev').disabled = true;
      document.getElementById('next').disabled = true;
      return;
    }
    // Woche/Monat/Jahr: statt eines vollen Datums einen dazu passenden
    // Text anzeigen (KW/Monat/Jahr) - Vor/Zurueck deckt die Navigation
    // bereits vollstaendig ab.
    pick.style.display = 'none';
    periodLabel.style.display = '';
    document.getElementById('prev').disabled = false;
    document.getElementById('next').disabled = false;
    if (curView === 'week') {
      periodLabel.textContent = 'KW ' + isoWeekNumber(viewRef) + ', ' + viewRef.getFullYear();
    } else if (curView === 'month') {
      periodLabel.textContent = MONTH_NAMES_FULL[viewRef.getMonth()] + ' ' + viewRef.getFullYear();
    } else if (curView === 'year') {
      periodLabel.textContent = String(viewRef.getFullYear());
    }
  }

  // Reiterleiste 1:1 nach NRGDashboardPVMonitor (Dietmar, 18.09.2026: "der
  // Wechsel soll exakt analog zum PV Monitor erfolgen, auch das Menue") -
  // einklappbare Seitenleiste (Pfeil-Knopf, Animationsstil aus der
  // Instanzvariable TabAnimation), Diagrammtitel aus dem aktiven Reiter,
  // Reiter ohne Datenquelle komplett ausgeblendet (.tabHidden), mit Quelle
  // und Daten leicht gruen (.tabOk), mit Quelle ohne Daten leicht rot
  // (.tabWarn).
  var tabsCollapsedKey = null;
  function applyTabsCollapsed(collapsed) {
    document.getElementById('tabsWrap').classList.toggle('collapsed', collapsed);
  }
  function setTabsCollapsed(collapsed) {
    applyTabsCollapsed(collapsed);
    try { if (tabsCollapsedKey) { localStorage.setItem(tabsCollapsedKey, collapsed ? '1' : '0'); } } catch (e) {}
  }
  function loadTabsCollapsed(uid) {
    tabsCollapsedKey = 'nrgdashwpmon_tabs_' + uid;
    var collapsed = false;
    try { collapsed = localStorage.getItem(tabsCollapsedKey) === '1'; } catch (e) {}
    applyTabsCollapsed(collapsed);
  }
  document.getElementById('tabsToggle').onclick = function () {
    setTabsCollapsed(!document.getElementById('tabsWrap').classList.contains('collapsed'));
  };
  function updateChartTitle() {
    var el = document.getElementById('chartTitle');
    if (!el) { return; }
    var active = document.querySelector('button.tab.active');
    var t = active ? active.textContent : '';
    if (curTop === 'heizkurven') {
      var zn = (curveZone === 'z2') ? 'Heizkreis 2' : 'Heizkreis 1';
      var mn = (curveMode === 'cool') ? 'Kühlen' : 'Heizen';
      t += ' - ' + zn + ' (' + mn + ')';
    }
    el.textContent = t;
  }
  function updateTabStates() {
    if (!lastData) { return; }
    var today = (lastData.days || [])[0];
    var src = { verlauf: true, heizkurven: !!lastData.hasHeatingCurve, bedienung: !!lastData.hasOperations };
    var data = { verlauf: !!(today && today.hasData), heizkurven: !!curveCache, bedienung: !!opsCache };
    Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (btn) {
      var t = btn.getAttribute('data-tab');
      var hidden = !src[t];
      btn.classList.toggle('tabHidden', hidden);
      btn.classList.toggle('tabOk', !hidden && !!data[t]);
      btn.classList.toggle('tabWarn', !hidden && !data[t] && t === 'verlauf');
      if (t === 'bedienung') { btn.classList.toggle('tabAlert', !!(opsCache && opsCache.emergencyHeater && opsCache.emergencyHeater.value > 0)); }
    });
    if (!src[curTop]) { setTopTab('verlauf'); }
    updateChartTitle();
  }
  function setTopTab(tab) {
    curTop = tab;
    Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    var verlaufEls = ['staleHint', 'kpiRow', 'chart', 'legendRow', 'empty'];
    verlaufEls.forEach(function (id) {
      document.getElementById(id).style.display = (tab === 'verlauf') ? '' : 'none';
    });
    // Zeitsteuerung nur im Verlauf-Reiter; der Pfeil-Knopf wandert mit nach
    // oben, wenn #bar verschwindet (wie im PVMonitor beim Jahresvergleich).
    document.getElementById('bar').style.display = (tab === 'verlauf') ? '' : 'none';
    document.getElementById('tabsWrap').style.top = (tab === 'verlauf') ? '' : '0px';
    document.getElementById('curvePanel').style.display = (tab === 'heizkurven') ? 'flex' : 'none';
    document.getElementById('opsPanel').style.display = (tab === 'bedienung') ? 'flex' : 'none';
    updateChartTitle();
    if (tab === 'heizkurven') { renderCurvePanel(); }
    else if (tab === 'bedienung') { renderOps(); }
    else { render(); }
  }
  Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (b) {
    b.onclick = function () {
      if (b.classList.contains('tabHidden')) { return; }
      setTopTab(b.getAttribute('data-tab'));
      // Menue blendet nach jeder Auswahl automatisch aus (Dietmar,
      // 18.09.2026) - der Pfeil-Knopf holt es wieder zurueck.
      setTabsCollapsed(true);
    };
  });

  // -- Heizkurven-Editor (18.09.2026) -----------------------------------
  // Zwei-Punkt-Modell je Zone/Modus (Vertrag HEISHA_GetHeatingCurve/
  // HEISHA_SetHeatingCurve, verbundweit mit HeishaMon/WPHub abgestimmt):
  // {outsideLowC,outsideHighC} -> {targetLowC,targetHighC}. Eigenes SVG
  // statt Highcharts/ECharts - beide Bibliotheken bieten kein eingebautes
  // Ziehen von Datenpunkten. Die Zeichenflaeche folgt der tatsaechlichen
  // Kachelgroesse (viewBox = Pixelmasse), damit das Diagramm den Platz
  // nutzt wie die Verlaufsdiagramme statt als kleines Bild zu stehen.
  // Aussentemperatur +45 .. -25 °C (Dietmar, 18.09.2026: damit auch Kuehlen
  // dargestellt werden kann). Vorlauftemperatur je Modus: Heizen 15..65 °C,
  // Kuehlen 0..40 °C (Kuehl-Vorlauf liegt typisch bei 5..25 °C).
  var CURVE_X_MIN = -25, CURVE_X_MAX = 45;
  var CURVE_Y_MIN = 15, CURVE_Y_MAX = 65;
  function curveApplyRangeY(y) { return y; }
  function curveApplyRange() {
    if (curveMode === 'cool') { CURVE_Y_MIN = 0; CURVE_Y_MAX = 40; }
    else { CURVE_Y_MIN = 15; CURVE_Y_MAX = 65; }
  }
  var CURVE_PAD_L = 76, CURVE_PAD_R = 24, CURVE_PAD_T = 24, CURVE_PAD_B = 46;
  var CURVE_W = 800, CURVE_H = 420;

  function curveXToPx(x) {
    var w = CURVE_W - CURVE_PAD_L - CURVE_PAD_R;
    // Achse gespiegelt (Dietmar, 18.09.2026): warme Aussentemperaturen links,
    // kalte rechts.
    return CURVE_PAD_L + (CURVE_X_MAX - x) / (CURVE_X_MAX - CURVE_X_MIN) * w;
  }
  function curveYToPx(y) {
    var h = CURVE_H - CURVE_PAD_T - CURVE_PAD_B;
    return CURVE_PAD_T + h - (y - CURVE_Y_MIN) / (CURVE_Y_MAX - CURVE_Y_MIN) * h;
  }
  function curvePxToX(px) {
    var w = CURVE_W - CURVE_PAD_L - CURVE_PAD_R;
    var x = CURVE_X_MAX - (px - CURVE_PAD_L) / w * (CURVE_X_MAX - CURVE_X_MIN);
    return Math.max(CURVE_X_MIN, Math.min(CURVE_X_MAX, Math.round(x)));
  }
  function curvePxToY(py) {
    var h = CURVE_H - CURVE_PAD_T - CURVE_PAD_B;
    var y = CURVE_Y_MIN + (CURVE_PAD_T + h - py) / h * (CURVE_Y_MAX - CURVE_Y_MIN);
    return Math.max(CURVE_Y_MIN, Math.min(CURVE_Y_MAX, Math.round(y)));
  }
  function curveSvgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  // Verfuegbare Zone/Modus-Kombinationen aus curveCache - eine Kombination
  // mit null bleibt komplett weg (HeishaMons Prinzip: nichts vortaeuschen,
  // was die Anlage nicht liefert).
  function curveAvailableCombos() {
    var out = [];
    ['z1', 'z2'].forEach(function (z) {
      var zoneData = curveCache && curveCache.zones && curveCache.zones[z];
      if (!zoneData) { return; }
      ['heat', 'cool'].forEach(function (m) {
        if (zoneData[m]) { out.push(z + '_' + m); }
      });
    });
    return out;
  }

  function renderCurveSubTabs() {
    var row = document.getElementById('curveSubTabs');
    row.innerHTML = '';
    var combos = curveAvailableCombos();
    if (!combos.length) { return; }
    if (combos.indexOf(curveZone + '_' + curveMode) < 0) {
      var first = combos[0].split('_');
      curveZone = first[0]; curveMode = first[1];
    }
    var zones = combos.map(function (c) { return c.split('_')[0]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var modes = combos.map(function (c) { return c.split('_')[1]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    function group(items, isActive, label, onPick) {
      var g = document.createElement('div'); g.className = 'ycSubTabs';
      items.forEach(function (it) {
        var b = document.createElement('button'); b.className = isActive(it) ? 'active' : '';
        b.textContent = label(it);
        b.onclick = function () { onPick(it); };
        g.appendChild(b);
      });
      row.appendChild(g);
    }
    if (zones.length > 1) {
      group(zones, function (z) { return z === curveZone; }, function (z) { return z === 'z1' ? 'Heizkreis 1' : 'Heizkreis 2'; },
        function (z) { curveZone = z; curveDraft = null; curveStatusText = ''; updateChartTitle(); renderCurvePanel(); });
    }
    if (modes.length > 1) {
      group(modes, function (m) { return m === curveMode; }, function (m) { return m === 'heat' ? 'Heizen' : 'Kühlen'; },
        function (m) { curveMode = m; curveDraft = null; curveStatusText = ''; updateChartTitle(); renderCurvePanel(); });
    }
  }

  // Gesendeter, noch nicht von der Waermepumpe zurueckgemeldeter Stand -
  // HeishaMon quittiert Set-Befehle nicht, der neue Wert kommt erst mit dem
  // naechsten Datenzyklus zurueck. Bis dahin zeigt der Editor den gesendeten
  // Stand statt auf die alten Werte zurueckzuspringen (das wirkte, als waere
  // nichts uebertragen worden).
  var curveSent = null, curvePollTimer = null;
  function curveValuesEqual(a, b) {
    return !!a && !!b && a.outsideLowC === b.outsideLowC && a.outsideHighC === b.outsideHighC
      && a.targetLowC === b.targetLowC && a.targetHighC === b.targetHighC;
  }
  function curveCachedValues(zone, mode) {
    var zd = curveCache && curveCache.zones && curveCache.zones[zone];
    return (zd && zd[mode]) ? zd[mode] : null;
  }
  function curvePollAfterSave() {
    if (curvePollTimer) { clearTimeout(curvePollTimer); }
    curvePollTimer = setTimeout(function () {
      if (!curveSent) { return; }
      curvePending = true;
      requestAction('heatingCurveLoad', '{}');
    }, 4000);
  }
  // -- Verschiebung ("Heizanforderung verschieben", HeishaMon 1.14) ---------
  // Senkrechter Regler RECHTS neben dem Diagramm. Nur im Modus 'shift'
  // (-5..+5) und nur fuer Heizen - im Direktmodus ist derselbe Wert eine
  // Vorlauf-Solltemperatur, dort wird bewusst nichts gesendet. Die
  // Verschiebung aendert NICHT die beiden Ankerpunkte, sondern wird von der
  // Anlage additiv aufgeschlagen: das Diagramm zeigt sie als gestrichelte,
  // parallel verschobene Linie ueber der eingestellten Kurve.
  var curveShiftDraft = null, curveShiftSent = null, curveShiftPollTimer = null;
  function curveShiftInfo() {
    var zd = curveCache && curveCache.zones && curveCache.zones[curveZone];
    return (zd && zd.shift && zd.shift.heat) ? zd.shift.heat : null;
  }
  function curveShiftValue() {
    if (curveShiftDraft !== null) { return curveShiftDraft; }
    if (curveShiftSent && curveShiftSent.zone === curveZone) { return curveShiftSent.val; }
    var info = curveShiftInfo();
    return (info && info.mode === 'shift' && typeof info.valueC === 'number') ? info.valueC : 0;
  }
  function curveShiftPoll() {
    if (curveShiftPollTimer) { clearTimeout(curveShiftPollTimer); }
    curveShiftPollTimer = setTimeout(function () {
      if (!curveShiftSent) { return; }
      curvePending = true;
      requestAction('heatingCurveLoad', '{}');
    }, 3000);
  }
  function renderCurveShift() {
    var box = document.getElementById('curveShift');
    var range = document.getElementById('curveShiftRange');
    var note = document.getElementById('curveShiftNote');
    var info = curveShiftInfo();
    var usable = curveMode === 'heat' && info && info.mode === 'shift';
    if (!usable) {
      // Statt eines wirkungslosen Reglers ein ehrlicher Hinweis, WARUM es
      // ihn nicht gibt (nur wenn die Anlage ueberhaupt etwas dazu meldet).
      box.style.display = 'none';
      return;
    }
    box.style.display = 'flex';
    // Reglerhoehe an den Plotbereich des Diagramms anpassen.
    var plotH = CURVE_H - CURVE_PAD_T - CURVE_PAD_B;
    box.style.marginTop = (CURVE_PAD_T - 20) + 'px';
    range.style.height = Math.max(120, plotH - 44) + 'px';
    range.style.flex = '0 0 auto';
    var v = curveShiftValue();
    range.value = String(v);
    range.disabled = !!curveShiftSent && !curveShiftSentDone;
    document.getElementById('curveShiftVal').textContent = (v > 0 ? '+' : '') + v + ' K';
    var txt = 'Kurve parallel verschieben';
    if (curveCache && curveCache.boardRulesActive) { txt += '. Regeln auf der Platine können den Wert überschreiben.'; }
    note.textContent = txt;
  }
  var curveShiftSentDone = true;

  function curveCurrentValues() {
    if (curveDraft) { return curveDraft; }
    if (curveSent && curveSent.zone === curveZone && curveSent.mode === curveMode) { return curveSent.vals; }
    var zoneData = curveCache && curveCache.zones && curveCache.zones[curveZone];
    return (zoneData && zoneData[curveMode]) ? zoneData[curveMode] : null;
  }

  function curveFitSize() {
    var wrap = document.getElementById('curveSvgWrap');
    var col = document.getElementById('chartcol');
    var w = Math.max(320, wrap.clientWidth || 640);
    // Hoehe: was #chartcol nach Titel/Unterreitern/Aktionen uebrig laesst.
    var used = 0;
    ['chartTitle', 'curveSubTabs', 'curveActions'].forEach(function (id) {
      var el = document.getElementById(id); if (el) { used += el.offsetHeight + 10; }
    });
    var h = Math.max(220, (col.clientHeight || 520) - used - 44);
    CURVE_W = Math.round(w); CURVE_H = Math.round(Math.min(h, w * 0.75));
    var svg = document.getElementById('curveSvg');
    svg.setAttribute('viewBox', '0 0 ' + CURVE_W + ' ' + CURVE_H);
    svg.setAttribute('width', CURVE_W); svg.setAttribute('height', CURVE_H);
  }

  function drawCurveSvg() {
    var svg = document.getElementById('curveSvg');
    svg.innerHTML = '';
    var vals = curveCurrentValues();
    if (!vals) { return; }
    curveApplyRange();
    curveFitSize();
    var isLight = isLightTheme();
    var axisColor = isLight ? '#333' : 'rgba(226,232,240,.65)';
    var gridColor = isLight ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.08)';
    var gridStrong = isLight ? 'rgba(0,0,0,.22)' : 'rgba(255,255,255,.20)';
    var isCool = curveMode === 'cool';
    var lineColor = isCool ? '#4aa3e0' : '#ef9a3d';
    var plotL = CURVE_PAD_L, plotR = CURVE_W - CURVE_PAD_R, plotT = CURVE_PAD_T, plotB = CURVE_H - CURVE_PAD_B;

    var defs = curveSvgEl('defs', {});
    var grad = curveSvgEl('linearGradient', { id: 'curveGrad', x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(curveSvgEl('stop', { offset: '0%', 'stop-color': lineColor, 'stop-opacity': .32 }));
    grad.appendChild(curveSvgEl('stop', { offset: '100%', 'stop-color': lineColor, 'stop-opacity': .02 }));
    defs.appendChild(grad);
    svg.appendChild(defs);

    // Feines Gitter alle 5 °C, kraeftigere Linien alle 10 °C mit Beschriftung.
    for (var gx = CURVE_X_MIN; gx <= CURVE_X_MAX; gx += 5) {
      var strongX = (gx % 10 === 0);
      svg.appendChild(curveSvgEl('line', { x1: curveXToPx(gx), y1: plotT, x2: curveXToPx(gx), y2: plotB, stroke: strongX ? gridStrong : gridColor, 'stroke-width': 1, 'stroke-dasharray': strongX ? '' : '3 4' }));
      if (strongX) {
        var lx = curveSvgEl('text', { x: curveXToPx(gx), y: plotB + 18, fill: axisColor, 'font-size': 12, 'text-anchor': 'middle' });
        lx.textContent = gx + ' °C';
        svg.appendChild(lx);
      }
    }
    for (var gy = CURVE_Y_MIN; gy <= CURVE_Y_MAX; gy += 5) {
      var strongY = (gy % 10 === 0);
      svg.appendChild(curveSvgEl('line', { x1: plotL, y1: curveYToPx(gy), x2: plotR, y2: curveYToPx(gy), stroke: strongY ? gridStrong : gridColor, 'stroke-width': 1, 'stroke-dasharray': strongY ? '' : '3 4' }));
      if (strongY) {
        var ly = curveSvgEl('text', { x: plotL - 10, y: curveYToPx(gy) + 4, fill: axisColor, 'font-size': 12, 'text-anchor': 'end' });
        ly.textContent = gy + ' °C';
        svg.appendChild(ly);
      }
    }
    // Achsentitel.
    var tx = curveSvgEl('text', { x: (plotL + plotR) / 2, y: CURVE_H - 6, fill: axisColor, 'font-size': 12, 'font-weight': 600, 'text-anchor': 'middle', opacity: .85 });
    tx.textContent = 'Außentemperatur';
    svg.appendChild(tx);
    var ty = curveSvgEl('text', { x: 16, y: (plotT + plotB) / 2, fill: axisColor, 'font-size': 12, 'font-weight': 600, 'text-anchor': 'middle', opacity: .85, transform: 'rotate(-90 16 ' + ((plotT + plotB) / 2) + ')' });
    ty.textContent = 'Vorlauftemperatur';
    svg.appendChild(ty);

    // Kurve: Punkte nach Aussentemperatur sortiert (links = warm), Linie bis
    // an den Diagrammrand verlaengert (gleiche Steigung) - zeigt, dass die
    // Anlage ausserhalb der Ankerpunkte fortsetzt; Verlauf zwischen den
    // Punkten kraeftig, Verlaengerung gestrichelt.
    // Zuordnung laut HeishaMon-Firmware/Beispiel (SET16): Vorlauf HOCH gehoert
    // zu Aussentemperatur TIEF (kalter Tag = hoher Vorlauf), Vorlauf TIEF zu

    // steht hier einfach immer eine leere Kachel"). Gleiche
    // typeof-Weiche wie in NRGDashboardPVMonitor.

      else { delete opsSent[d.name]; opsStatus[d.name] = 'Nicht gesendet - HeishaMon lehnt ab (Wert außerhalb des Bereichs, MQTT-Gateway getrennt oder HeishaMon zu alt).'; }

        if (ci && ci.mode === 'shift' && ci.valueC === curveShiftSent.val) {

          curveSent.tries += 1;
          if (curveSent.tries < 6) {
            curveStatusText = 'Gesendet - warte auf Rückmeldung der Wärmepumpe (' + curveSent.tries + '/6)…';
            curvePollAfterSave();
          } else {
            curveSent = null;
            curveStatusText = 'Die Wärmepumpe meldet noch die alten Werte - Übernahme nicht bestätigt (Gateway/MQTT prüfen).';
          }
        }
      }
      if (curTop === 'heizkurven') { renderCurvePanel(); }
      return;
    }
    if (d && d.ok && d.type === 'heatingCurveSaved') {
      curveCache = d.curve; curveSaving = false;
      if (d.saved && curveLastReq) {
        curveSent = { zone: curveLastReq.zone, mode: curveLastReq.mode, vals: curveLastReq.vals, tries: 0 };
        curveDraft = null;
        curvePollAfterSave();
      }
      // "Gesendet" statt "Übernommen" (Dietmars Verbund-Grundsatz "keine
      // erfundene Bestätigung"): HeishaMon quittiert per MQTT nicht, ob die
      // Waermepumpe den Set-Befehl tatsaechlich angenommen hat - true heisst
      // hier nur "Zone/Modus vorhanden, Werte plausibel, Nachricht raus"
      // (HeishaMon-Sitzung, 18.09.2026). Werte oben zeigen nach dem Neuladen
      // ohnehin den zuletzt gelesenen Ist-Stand, keine Behauptung noetig.
      curveStatusText = d.saved ? 'Gesendet - warte auf Rückmeldung der Wärmepumpe…' : 'Nicht gesendet - HeishaMon lehnt den Befehl ab (Zone/Modus nicht aktiv, MQTT-Gateway getrennt oder HeishaMon zu alt).';
      if (curTop === 'heizkurven') { renderCurvePanel(); }
      return;
    }
    if (!d || !d.ok) {
      var emptyEl = document.getElementById('empty');
      emptyEl.style.display = '';
      emptyEl.textContent = (d && d.error) ? d.error : 'Keine Daten.';
      document.getElementById('kpiRow').innerHTML = '';
      document.getElementById('chart').innerHTML = '';
      document.getElementById('legendRow').innerHTML = '';
      return;
    }
    lastData = d;
    visKey = 'nrgdashwpmon_vis_' + (d.uid || 'x');
    loadVis();
    if (d.bg) { document.body.style.background = d.bg; }
    if (d.hookPath) { HOOK_PATH = d.hookPath; }
    if (d.showTour) { showTourOverlay(); }
    // Heizkurven-Reiter nur zeigen, wenn das Backend eine Quelle mit
    // geprueftem Lese-/Schreibweg gefunden hat (v1: nur HeishaMon, siehe
    // module.php::HeatingCurveAvailable()) - faellt die Quelle weg, waehrend
    // der Reiter gerade aktiv ist, zurueck auf "Verlauf" statt eine leere
    // Ansicht stehen zu lassen.
    loadTabsCollapsed(d.uid || 'x');
    // Animationsstil + Theme-Klasse fuer die Reiterleiste (wie PVMonitor).
    document.getElementById('tabsWrap').setAttribute('data-anim', ['spring', 'flip', 'scale', 'blur'][d.tabAnim || 0] || 'spring');
    document.body.classList.toggle('light', !!d.lightTheme);
    updateTabStates();
    if (d.hasOperations && !opsPending) { opsPending = true; requestAction('operationsLoad', '{}'); }
    // Erster Aufruf kommt aus einem <script>-Block direkt beim Laden der
    // Kachel, bevor das Layout sicher fertig ist - echarts.init() auf
    // einem noch 0x0 grossen Container liefert eine leere Zeichenflaeche,
    // die ein spaeteres resize() nicht zuverlaessig repariert. Deshalb den
    // ersten Render-Aufruf einen Frame verzoegern (1:1 NRGDashboardPVMonitor).
    requestAnimationFrame(function () { render(); });
  }

  document.getElementById('prev').onclick = function () {
    if (curView === 'day') {
      var days = (lastData && lastData.days) || [];
      if (idx < days.length - 1) { idx++; render(); }
    } else if (curView === 'week' || curView === 'month' || curView === 'year') {
      shiftViewRef(-1); render();
    }
  };
  document.getElementById('next').onclick = function () {
    if (curView === 'day') {
      if (idx > 0) { idx--; render(); }
    } else if (curView === 'week' || curView === 'month' || curView === 'year') {
      shiftViewRef(1); render();
    }
  };
  document.getElementById('pick').onchange = function (e) {
    if (curView === 'day') {
      var days = (lastData && lastData.days) || [];
      var i = days.findIndex(function (d) { return d.id === e.target.value; });
      if (i >= 0) { idx = i; render(); }
    } else if (curView === 'custom') {
      customFrom = e.target.value; render();
    } else if (e.target.value) {
      viewRef = new Date(e.target.value + 'T00:00:00'); render();
    }
  };
  document.getElementById('pickTo').onchange = function (e) {
    customTo = e.target.value; render();
  };
  document.getElementById('type').onchange = function (e) {
    curView = e.target.value;
    render();
  };
  window.addEventListener('resize', function () { if (chart) { setTimeout(sizeChart, 60); } });

  // Einfuehrungs-Tour bei erster Benutzung (28.08.2026), Muster 1:1 aus
  // NRGDashboardPVMonitor - siehe module.php::ProcessHookData()/ResetTour().
  // Jeder Schritt beschreibt ein ECHTES, im Code vorhandenes Detail dieses
  // Moduls (keine erfundenen/generischen Punkte).
  var HOOK_PATH = null;
  var TOUR_SHOWN_LOCAL = false;
  var TOUR_STEP = 0;
  var TOUR_STEPS = [
    {
      title: 'Diese Kurve verrät, wann Ihre Wärmepumpe abtaut',
      text: 'Im Tages-Diagramm markiert eine blaue Fläche automatisch jede Abtauphase des Verdichters – die kurzen Einbrüche bei elektrischer Leistung und Vorlauftemperatur bekommen damit sofort eine Erklärung, statt wie ein Aussetzer auszusehen. Kein 08/15-Monitoring zeigt das.'
    },
    {
      title: 'Fehlt eine Kennzahl, wird sie ausgeblendet – nicht auf Null gelogen',
      text: 'Ob COP, Außentemperatur, Verdichterstarts oder Betriebsstunden angezeigt werden, hängt davon ab, was Ihre HeishaMon- oder WPHub-Installation tatsächlich liefert. Fehlt ein Feld, verschwindet nur die betroffene Kennzahl bzw. Kurve – es erscheint nie eine erfundene Nullanzeige.'
    },
    {
      title: 'Gemessener COP hat immer Vorrang vor geschätztem',
      text: 'Liefert Ihre Wärmepumpe einen echten gemessenen COP, wird der angezeigt. Nur wenn dieser fehlt, springt die Kachel auf eine grobe Schätzung um – eine geschönte Kennzahl wird nie stillschweigend als „gemessen“ ausgegeben. Bei einer reinen WPHub-Anlage ohne HeishaMon fehlt der COP grundsätzlich ganz (auch keine Schätzung) – der Comfort-Cloud-API von Panasonic fehlt dafür schlicht die nötige Durchfluss-/Wassermengen-Information, das ist kein Fehler dieser Kachel.'
    },
    {
      title: 'Bei WPHub zählt der echte Tageszähler, nicht die Hochrechnung',
      text: 'Panasonic-Wärmepumpen über WPHub liefern keine Momentanleistung, dafür aber einen täglich um Mitternacht zurückspringenden Energiezähler direkt aus der Comfort Cloud. Ist der vorhanden, nutzt die Kachel ihn bevorzugt – nur ohne ihn (z. B. bei HeishaMon) wird die El.-Energie aus der Leistungskurve hochgerechnet.'
    },
    {
      title: 'Woche, Monat, Jahr, Gesamt – alles ohne Nachladen',
      text: 'Ein einziger Archivdurchlauf beim Öffnen deckt Tages-, Wochen-, Monats-, Jahres-, Gesamt- und Benutzerdefiniert-Ansicht ab. Beim Umschalten oder Blättern zwischen den Zeiträumen wird nichts erneut vom Archiv nachgeladen – alles rechnet direkt im Browser.'
    },
    {
      title: 'Vorlauf, Rücklauf und Außentemperatur auf eigener Achse',
      text: 'Elektrische und thermische Leistung laufen in Watt auf der linken Achse, Vorlauf-/Rücklauftemperatur und Außentemperatur gestrichelt bzw. gepunktet auf einer eigenen °C-Achse rechts – klar getrennt, aber im selben Diagramm vergleichbar.'
    },
    {
      title: 'ECharts oder Highcharts – Sie entscheiden',
      text: 'Unter „Darstellung“ lässt sich die Zeichen-Engine umstellen. ECharts kommt ohne eigene Lizenz aus, Highcharts benötigt eine eigene gültige Lizenz für die Nutzung – beide werden bei Bedarf vom Internet nachgeladen, nicht im Modul eingebettet.'
    },
    {
      title: 'Auch außerhalb des Dashboards nutzbar',
      text: 'Diese Kachel läuft zusätzlich als eigenständige Webseite über einen automatisch registrierten WebHook (Adresse im Dokumentations-Panel) – ideal für IPSView oder einen beliebigen Browser-Tab, mit automatischer Aktualisierung alle 30 Sekunden.'
    }
  ];

  function renderTour() {
    var dots = document.getElementById('tourDots');
    dots.innerHTML = '';
    TOUR_STEPS.forEach(function (_, i) {
      var d = document.createElement('div');
      d.className = 'tour-dot' + (i === TOUR_STEP ? ' active' : '');
      dots.appendChild(d);
    });
    var step = TOUR_STEPS[TOUR_STEP];
    document.getElementById('tourTitle').textContent = step.title;
    document.getElementById('tourText').textContent = step.text;
    var prevBtn = document.getElementById('tourPrev');
    var nextBtn = document.getElementById('tourNext');
    prevBtn.disabled = TOUR_STEP === 0;
    var isLast = TOUR_STEP === TOUR_STEPS.length - 1;
    nextBtn.style.display = isLast ? 'none' : '';
  }

  function showTourOverlay() {
    if (TOUR_SHOWN_LOCAL) { return; }
    TOUR_SHOWN_LOCAL = true;
    TOUR_STEP = 0;
    renderTour();
    document.getElementById('tourOverlay').classList.add('show');
  }

  function dismissTour() {
    document.getElementById('tourOverlay').classList.remove('show');
    if (HOOK_PATH) {
      fetch(HOOK_PATH + '?dismissTour=1').catch(function () {});
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('tourPrev').addEventListener('click', function () {
      if (TOUR_STEP > 0) { TOUR_STEP--; renderTour(); }
    });
    document.getElementById('tourNext').addEventListener('click', function () {
      if (TOUR_STEP < TOUR_STEPS.length - 1) { TOUR_STEP++; renderTour(); }
    });
    document.getElementById('tourDone').addEventListener('click', dismissTour);
    // Manueller Neustart (01.09.2026, Dietmar: "jedem Gast ermoeglichen
    // die Tour zu starten" - Demo-Instanz teilt sich EINEN Login unter
    // allen Besuchern, TourSeen ist serverseitig geteilter Zustand).
    // Ignoriert TOUR_SHOWN_LOCAL bewusst.
    var restartBtn = document.getElementById('tourRestartBtn');
    if (restartBtn) {
      restartBtn.addEventListener('click', function () {
        TOUR_SHOWN_LOCAL = false;
        showTourOverlay();
      });
    }
  });
</script>
