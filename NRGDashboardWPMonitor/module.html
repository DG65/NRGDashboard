<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Bar/Grundgeruest UND Theme-Handling 1:1 aus NRGDashboardPVMonitor
     uebernommen (Dietmar, 17.08.2026: "Orientiere Dich bitte visuell an
     die andere Monitoring Kachel") - selbe Klassennamen, selbe Farben/
     Radien, kein eigenes "Kartenlook" erfunden. padding-top:52px ist KEIN
     Zufallswert, sondern reservierter Platz fuer Symcons eigene
     Kachel-Titelzeile (Instanzname) - die Kachel zeichnet bewusst KEINE
     eigene Ueberschrift (Cross-Session-Befund CometWiFi/HeishaMon-
     Schema-Sitzung: das Aufziehen zeigt zwar nur Instanz-Variablen, aber
     die NICHT aufgezogene Standardkachel bekommt ihren Titel von Symcon
     selbst darueber montiert).
  */
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { position: relative; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; padding: 52px 12px 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  button.nav { font: inherit; font-size: 14px; line-height: 1; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.nav:hover { background: rgba(127,135,145,.22); }
  button.qday { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.qday:hover { background: rgba(127,135,145,.22); }
  button.qday.active { background: rgba(127,135,145,.30); border-color: rgba(127,135,145,.55); }
  input.pick { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  select.pick { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  /* Kennzahlen-Kopfzeile: bewusst OHNE Karten-/Kastenoptik (Monitor kennt
     dieses Muster nirgends - dort stehen Zusammenfassungszahlen als
     schlichter Text, siehe z.B. ".ycSum"), nur Zahl fett + Label gedimmt
     darunter, wie eine kleine Kennzahlenzeile statt eigens erfundener
     Kacheln. */
  #kpiRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; margin-bottom: 10px; font-size: 12px; }
  .kpi { flex: 0 0 auto; text-align: center; opacity: .92; }
  .kpi .val { font-size: 17px; font-weight: 700; line-height: 1.1; }
  .kpi .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; opacity: .65; margin-top: 1px; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 160px; position: relative; }
  .empty { font-size: 13px; padding: 28px 10px; text-align: center; opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <div id="bar">
    <select id="type" class="pick">
      <option value="day">Tag (Verlauf)</option>
      <option value="week">Woche (Energie)</option>
      <option value="month">Monat (Energie)</option>
      <option value="year">Jahr (Energie)</option>
    </select>
    <button id="prev" class="nav" title="Zurück">&#9664;</button>
    <input id="pick" class="pick" type="date">
    <button id="next" class="nav" title="Weiter">&#9654;</button>
    <button id="today" class="qday">Heute</button>
  </div>
  <div id="kpiRow"></div>
  <div id="chart"></div>
  <div id="empty" class="empty" style="display:none"></div>
</div>
<script>
  var lastData = null;
  var curDay = null; // { start, end } in Sekunden (lokale Tagesgrenzen)
  var curType = 'day'; // day | week | month | year - wie NRGDashboardPVMonitor's #type-Select
  var curPeriod = null; // { type, start, end } in Sekunden, fuer Woche/Monat/Jahr
  var chart = null;
  var ecReady = false;

  // Theme-Handling 1:1 NRGDashboardPVMonitor::isLightTheme()/themeLabelColor()/
  // themeAxisStyle() (Dietmar, 31.07.2026 dort: Symcon bietet einer Kachel
  // KEINEN Weg, das aktuelle Hell/Dunkel-Theme zu erkennen - deshalb die
  // Property "LightTheme", nicht prefers-color-scheme). GRID_COLOR bleibt
  // bewusst der bereits theme-neutrale Grauton.
  var GRID_COLOR = 'rgba(128,128,128,.28)';
  function isLightTheme() { return !!(lastData && lastData.lightTheme); }
  function themeLabelColor() { return isLightTheme() ? '#333' : '#9aa4b0'; }
  // Leeres Objekt im Dunkelmodus statt explizitem Grauton (Monitor-Befund,
  // 1.8.2026: ein gesetztes axisLabel-Objekt liess dort die Zeitachsen-
  // Beschriftung verschwinden) - nur im Hellmodus wird eine Farbe gesetzt.
  function themeAxisStyle() { return isLightTheme() ? { color: '#333' } : {}; }

  function addScript(src, cb) {
    var s = document.createElement('script');
    s.src = src; s.onload = cb; s.onerror = function () { cb && cb(); };
    document.head.appendChild(s);
  }
  // ECharts per CDN nachladen statt lokal einbetten (Dietmar/NRGDashboardPVMonitor-
  // Erfahrung, 31.07.2026: eingebettetes ECharts (~618KB) + Zeitreihen-Nutzlast
  // hat live "Output-Buffer exceeds Limit" ausgeloest) - dieselbe Loesung hier
  // uebernommen, statt denselben Fehler erneut zu bauen.
  function ensureECharts(cb) {
    if (typeof echarts !== 'undefined') { ecReady = true; return cb(); }
    if (ecReady === 'loading') { return setTimeout(function () { ensureECharts(cb); }, 80); }
    ecReady = 'loading';
    addScript('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js', function () { ecReady = true; cb(); });
  }

  function toDateInputValue(tsSec) {
    var d = new Date(tsSec * 1000);
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function renderKpi(kpi) {
    var rows = [
      ['copCurrent', 'COP aktuell', ''],
      ['dailyAz', 'Tages-AZ', ''],
      ['operationsHours', 'Betriebsstd.', 'h'],
      ['compressorStarts', 'Starts', ''],
      ['avgRuntimeMin', 'Ø Laufzeit', 'min']
    ];
    var el = document.getElementById('kpiRow');
    el.innerHTML = '';
    if (!kpi) { return; }
    rows.forEach(function (r) {
      var v = kpi[r[0]];
      if (v === null || v === undefined) { return; }
      var box = document.createElement('div');
      box.className = 'kpi';
      var val = document.createElement('div');
      val.className = 'val';
      val.textContent = (typeof v === 'number' ? v.toLocaleString('de-DE') : v) + (r[2] ? ' ' + r[2] : '');
      var lbl = document.createElement('div');
      lbl.className = 'lbl'; lbl.textContent = r[1];
      box.appendChild(val); box.appendChild(lbl);
      el.appendChild(box);
    });
    // kWh (Strom/Waerme) haengen am jeweiligen Zeitfenster-Datensatz, nicht
    // am kpi-Objekt (siehe module.php::BuildDay()/BuildPeriod()) - separat
    // angehaengt, je nach aktueller Ansicht.
    var kwhSource = (curType === 'day') ? (lastData && lastData.day) : (lastData && lastData.period);
    if (kwhSource) {
      [['electricEnergyKwh', 'kWh Strom'], ['thermalEnergyKwh', 'kWh Wärme']].forEach(function (r) {
        var v = kwhSource[r[0]];
        if (v === null || v === undefined) { return; }
        var box = document.createElement('div');
        box.className = 'kpi';
        var val = document.createElement('div');
        val.className = 'val'; val.textContent = v.toLocaleString('de-DE', { maximumFractionDigits: 1 });
        var lbl = document.createElement('div');
        lbl.className = 'lbl'; lbl.textContent = r[1];
        box.appendChild(val); box.appendChild(lbl);
        el.appendChild(box);
      });
    }
  }

  function seriesOrEmpty(pts) { return Array.isArray(pts) ? pts : []; }

  function renderChart(day) {
    if (!day) { return; }
    ensureECharts(function () {
      var el = document.getElementById('chart');
      if (!chart) { chart = echarts.init(el, null, { renderer: 'svg' }); }
      var markAreas = seriesOrEmpty(day.defrostEpisodes).map(function (ep) {
        return [{ xAxis: ep[0] }, { xAxis: ep[1] }];
      });
      var axisLbl = { axisLabel: themeAxisStyle() };
      var option = {
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        grid: { left: 46, right: 46, top: 28, bottom: 34 },
        legend: { top: 0, textStyle: { color: themeLabelColor(), fontSize: 11 } },
        tooltip: { trigger: 'axis' },
        xAxis: Object.assign({ type: 'time', min: day.start, max: day.end,
          splitLine: { show: false }, axisLine: { lineStyle: { color: GRID_COLOR } } }, axisLbl),
        yAxis: [
          Object.assign({ type: 'value', name: 'W', position: 'left',
            splitLine: { lineStyle: { color: GRID_COLOR } } }, axisLbl),
          Object.assign({ type: 'value', name: '°C', position: 'right',
            splitLine: { show: false } }, axisLbl)
        ],
        dataZoom: [{ type: 'inside' }, { type: 'slider', height: 14, bottom: 6 }],
        series: [
          { name: 'El. Leistung', type: 'line', showSymbol: false, yAxisIndex: 0, data: seriesOrEmpty(day.electricPower), color: '#E8823C',
            markArea: markAreas.length ? { itemStyle: { color: 'rgba(74,163,224,.18)' }, data: markAreas } : undefined },
          { name: 'Therm. Leistung', type: 'line', showSymbol: false, yAxisIndex: 0, data: seriesOrEmpty(day.thermalPower), color: '#E0503C' },
          { name: 'Vorlauf', type: 'line', showSymbol: false, yAxisIndex: 1, data: seriesOrEmpty(day.mainOutletTemp), color: '#e0503c', lineStyle: { type: 'dashed' } },
          { name: 'Rücklauf', type: 'line', showSymbol: false, yAxisIndex: 1, data: seriesOrEmpty(day.mainInletTemp), color: '#4a90d9', lineStyle: { type: 'dashed' } },
          { name: 'Außentemp.', type: 'line', showSymbol: false, yAxisIndex: 1, data: seriesOrEmpty(day.outsideTemp), color: '#5FCB6B', lineStyle: { type: 'dotted' } }
        ]
      };
      chart.setOption(option, true);
    });
  }

  function loadDay(startSec, endSec) {
    curDay = { start: startSec, end: endSec };
    document.getElementById('pick').value = toDateInputValue(startSec);
    requestAction('dayWindow', JSON.stringify({ start: startSec, end: endSec }));
  }

  // Zeitraum-Grenzen (lokal) fuer Woche/Monat/Jahr, ausgehend von einem
  // beliebigen Zeitpunkt innerhalb des Zeitraums - analog zur Tagesgrenze,
  // die module.php per mktime() bildet, hier clientseitig fuer die
  // Navigation (der Server bekommt am Ende ohnehin nur start/end in
  // Sekunden, keine Kalenderlogik).
  function weekRange(sec) {
    var d = new Date(sec * 1000);
    var day = (d.getDay() + 6) % 7; // 0 = Montag
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
    return { start: Math.floor(start.getTime() / 1000), end: Math.floor(end.getTime() / 1000) };
  }
  function monthRange(sec) {
    var d = new Date(sec * 1000);
    var start = new Date(d.getFullYear(), d.getMonth(), 1);
    var end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return { start: Math.floor(start.getTime() / 1000), end: Math.floor(end.getTime() / 1000) };
  }
  function yearRange(sec) {
    var d = new Date(sec * 1000);
    var start = new Date(d.getFullYear(), 0, 1);
    var end = new Date(d.getFullYear() + 1, 0, 1);
    return { start: Math.floor(start.getTime() / 1000), end: Math.floor(end.getTime() / 1000) };
  }
  function rangeFor(type, sec) {
    if (type === 'week') { return weekRange(sec); }
    if (type === 'month') { return monthRange(sec); }
    if (type === 'year') { return yearRange(sec); }
    var s = sec - (sec % 86400);
    return { start: s, end: s + 86400 };
  }

  function loadPeriod(type, sec) {
    var r = rangeFor(type, sec);
    curPeriod = { type: type, start: r.start, end: r.end };
    document.getElementById('pick').value = toDateInputValue(r.start);
    requestAction('periodWindow', JSON.stringify({ type: type, start: r.start, end: r.end }));
  }

  function shiftPeriod(dir) {
    if (curType === 'day') {
      if (!curDay) { return; }
      loadDay(curDay.start + dir * 86400, curDay.end + dir * 86400);
      return;
    }
    if (!curPeriod) { return; }
    var mid = curPeriod.start + 86400; // ein Tag hinein, um Monats-/Jahresgrenzen sauber zu treffen
    if (curType === 'week') { loadPeriod('week', mid + dir * 7 * 86400); return; }
    if (curType === 'month') {
      var d = new Date(curPeriod.start * 1000);
      var next = new Date(d.getFullYear(), d.getMonth() + dir, 15);
      loadPeriod('month', Math.floor(next.getTime() / 1000));
      return;
    }
    if (curType === 'year') {
      var dy = new Date(curPeriod.start * 1000);
      var nexty = new Date(dy.getFullYear() + dir, 5, 15);
      loadPeriod('year', Math.floor(nexty.getTime() / 1000));
    }
  }

  document.getElementById('type').addEventListener('change', function (ev) {
    curType = ev.target.value;
    var anchor = curDay ? curDay.start : (curPeriod ? curPeriod.start : Math.floor(Date.now() / 1000));
    if (curType === 'day') { loadDay(anchor - (anchor % 86400), anchor - (anchor % 86400) + 86400); }
    else { loadPeriod(curType, anchor); }
  });
  document.getElementById('prev').addEventListener('click', function () { shiftPeriod(-1); });
  document.getElementById('next').addEventListener('click', function () { shiftPeriod(1); });
  document.getElementById('today').addEventListener('click', function () {
    var now = Math.floor(Date.now() / 1000);
    if (curType === 'day') { loadDay(now - (now % 86400), now - (now % 86400) + 86400); }
    else { loadPeriod(curType, now); }
  });
  document.getElementById('pick').addEventListener('change', function (ev) {
    var v = ev.target.value; // YYYY-MM-DD
    if (!v) { return; }
    var parts = v.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var startSec = Math.floor(d.getTime() / 1000);
    if (curType === 'day') { loadDay(startSec, startSec + 86400); }
    else { loadPeriod(curType, startSec); }
  });

  function renderBars(period) {
    if (!period) { return; }
    ensureECharts(function () {
      var el = document.getElementById('chart');
      if (!chart) { chart = echarts.init(el, null, { renderer: 'svg' }); }
      var buckets = seriesOrEmpty(period.buckets);
      var cats = buckets.map(function (b) {
        if (period.type === 'year') { return b.label.slice(5, 7) + '/' + b.label.slice(2, 4); }
        return b.label.slice(8, 10) + '.' + b.label.slice(5, 7) + '.';
      });
      var axisLbl = { axisLabel: themeAxisStyle() };
      var option = {
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        grid: { left: 46, right: 16, top: 28, bottom: 34 },
        legend: { top: 0, textStyle: { color: themeLabelColor(), fontSize: 11 } },
        tooltip: { trigger: 'axis' },
        xAxis: Object.assign({ type: 'category', data: cats,
          axisLine: { lineStyle: { color: GRID_COLOR } } }, axisLbl),
        yAxis: Object.assign({ type: 'value', name: 'kWh',
          splitLine: { lineStyle: { color: GRID_COLOR } } }, axisLbl),
        dataZoom: (period.type !== 'year' && cats.length > 31) ? [{ type: 'inside' }, { type: 'slider', height: 14, bottom: 6 }] : undefined,
        series: [
          { name: 'El. Energie', type: 'bar', data: buckets.map(function (b) { return b.electric; }), color: '#E8823C' },
          { name: 'Therm. Energie', type: 'bar', data: buckets.map(function (b) { return b.thermal; }), color: '#E0503C' }
        ]
      };
      chart.setOption(option, true);
    });
  }

  function handleMessage(raw) {
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (d && d.type === 'dayUpdate') {
      if (d.day) {
        lastData.day = d.day;
        curDay = { start: Math.floor(d.day.start / 1000), end: Math.floor(d.day.end / 1000) };
        document.getElementById('pick').value = toDateInputValue(curDay.start);
        renderKpi(lastData.kpi);
        renderChart(d.day);
      }
      return;
    }
    if (d && d.type === 'periodUpdate') {
      if (d.period) {
        lastData.period = d.period;
        curPeriod = { type: d.period.type, start: Math.floor(d.period.start / 1000), end: Math.floor(d.period.end / 1000) };
        document.getElementById('pick').value = toDateInputValue(curPeriod.start);
        renderKpi(lastData.kpi);
        renderBars(d.period);
      }
      return;
    }
    lastData = d;
    var emptyEl = document.getElementById('empty');
    if (!d || !d.ok) {
      emptyEl.style.display = '';
      emptyEl.textContent = (d && d.error) ? d.error : 'Keine Daten.';
      document.getElementById('kpiRow').innerHTML = '';
      document.getElementById('chart').innerHTML = '';
      return;
    }
    emptyEl.style.display = 'none';
    if (d.bg) { document.body.style.background = d.bg; }
    renderKpi(d.kpi);
    if (d.day) {
      curDay = { start: Math.floor(d.day.start / 1000), end: Math.floor(d.day.end / 1000) };
      document.getElementById('pick').value = toDateInputValue(curDay.start);
      renderChart(d.day);
    }
  }

  window.addEventListener('resize', function () { if (chart) { chart.resize(); } });
</script>
</body>
</html>
