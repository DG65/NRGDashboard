<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Steuerleiste + Reiter 1:1 nach Verbund-Konvention (InverterHubMonitor/
     InverterHubEnergy) - "Wer eine Kachel mit Datumssteuerung baut, bedient
     sich identisch". Klassen/Layout hier bewusst gleich benannt. */
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { position: relative; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; padding: 52px 12px 10px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  #body { display: flex; flex: 1 1 auto; min-height: 0; gap: 10px; margin-top: 8px; }
  #tabs { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; padding-top: 2px; }
  button.tab { font: inherit; font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: inherit; cursor: pointer; opacity: .6; }
  button.tab:hover:not(:disabled) { opacity: .85; background: rgba(127,135,145,.10); }
  button.tab.active { opacity: 1; background: rgba(127,135,145,.16); border-color: rgba(127,135,145,.35); }
  button.tab:disabled { opacity: .3; cursor: default; }
  #chartcol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
  button.nav { font: inherit; font-size: 14px; line-height: 1; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.nav:disabled { opacity: .35; cursor: default; }
  #quick { display: flex; gap: 4px; }
  button.qday { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  button.qday:hover:not(:disabled) { background: rgba(127,135,145,.22); }
  button.qday.active { background: rgba(127,135,145,.30); border-color: rgba(127,135,145,.55); }
  button.qday:disabled { opacity: .35; cursor: default; }
  input.pick, select.sel { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(127,135,145,.35); background: rgba(127,135,145,.12); color: inherit; cursor: pointer; }
  select.sel:disabled { opacity: .35; cursor: default; }
  select.sel { padding-right: 26px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239aa4b0'/></svg>"); background-repeat: no-repeat; background-position: right 9px center; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 160px; position: relative; }
  /* Zwei eigene, per JS gesteuerte Tooltip-"Schilder" fuer die Bilanz-
     Tagesansicht (Dietmar, 31.07.2026) - ECharts' eingebaute Tooltip-
     Komponenten aktivieren sich nur einzeln je nach gehoverter Achse,
     auch mit gekoppeltem axisPointer nicht zuverlaessig gleichzeitig;
     diese beiden Divs werden stattdessen direkt per Mousemove befuellt
     und positioniert (siehe balanceHoverMove()). */
  .balTip { position: absolute; pointer-events: none; z-index: 10; background: rgba(30,32,36,0.92); color: #e8e8e8; border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.4); display: none; white-space: nowrap; }
  .empty { font-size: 13px; padding: 28px 10px; text-align: center; opacity: .7; }
  /* Eigene Legende statt der eingebauten von ECharts/Highcharts - beide
     Bibliotheken feuern bei Klicks auf ihre native Legende ein Ereignis,
     das sich nicht zuverlaessig von einem rein programmatisch (beim
     Wiederherstellen der Sichtbarkeit) ausgeloesten Zustand unterscheiden
     laesst. Eigene Legende = volle Kontrolle, kein Ereignis-Ratespiel. */
  /* Abstand "Erzeugung" -> Legende auf die gleiche Groesse gebracht wie
     Chart -> "Erzeugung" (Dietmar, 31.07.2026 - vorher zog die negative
     margin die Legende zu dicht an die Beschriftung heran). */
  /* Immer eine Zeile (Dietmar, 31.07.2026) - bei zu wenig Platz lieber
     horizontal scrollen als umbrechen. */
  #legendRow { display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px 14px; padding: 0; margin-top: 20px; font-size: 11px; overflow-x: auto; }
  /* Tagesplan-Reiter (20.08.2026): eigene, NICHT interaktive Farbschluessel-
     Zeile fuer die EMS_OP_*-Hintergrundbaender (markArea/plotBands) -
     getrennt von #legendRow, weil ein Klick hier keine echte Chart-Serie
     hat, die sich ein-/ausblenden liesse (waere ein irrefuehrender Klick-
     Koeder, wenn er wie die echte Legende aussaehe, aber nichts taete). */
  #planKeyRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; padding: 0; margin-top: 6px; font-size: 11px; opacity: .85; }
  #planKeyRow .legItem { cursor: default; }
  /* StromGedacht-Netzampel (21.08.2026, relayed ueber die StromGedacht-
     Sitzung; 22.08.2026 auf Dietmars Feedback hin auf einen echten Chart
     umgestellt - eigene ECharts/Highcharts-Instanz mit demselben Zeitraster
     und denselben Grid-Raendern wie das Tagesplan-Diagramm, damit Laenge und
     Netzlinien exakt zusammenpassen, statt einer unabhaengigen Flexbox-
     Zeitleiste). Segmente kommen als markArea/plotBands aus renderAmpelChart. */
  .ampelStrip { height: 34px; margin: 4px 0 4px; }
  /* Netzampel-Reiter: EIN Tag je Ansicht mit Heute/Morgen-Navigation
     (dieselbe tagesplanDay-Leiste wie beim Tagesplan-Reiter, Dietmars
     Wunsch 22.08.2026: "wie beim Strompreis mit heute und morgen" statt
     beider Tage untereinander). */
  #netzampelPanel { padding-top: 6px; }
  #netzampelPanel .ampelStrip { height: 70px; }
  /* Jahresvergleich kann auf viele Jahre anwachsen (Dietmar, 31.07.2026:
     "Wohin werden die weiteren Jahre geschrieben?") - die einzeilige,
     horizontal scrollende Legende (siehe #legendRow oben, urspruenglich
     fuer die Bilanz-Legende gedacht) waere hier mit 15+ Jahren + Mittelwert
     + Erwartung unbrauchbar. Fuer diesen Reiter stattdessen normal
     umbrechen lassen (mehrzeilig, kein Scrollen). */
  #legendRow.legendWrap { flex-wrap: wrap; overflow-x: visible; }
  .legItem { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; opacity: 1; user-select: none; flex: none; white-space: nowrap; }
  .legItem.off { opacity: .35; }
  /* Plastischere Werteflaechen mit Glanzlicht statt flacher Farbflaeche
     (Dietmar, 31.07.2026) - box-shadow fuer Tiefe/Kontur, ::after fuer
     einen kleinen radialen Glanzpunkt oben links (wie ein Glasperlen-
     Highlight). Funktioniert unabhaengig von der per Inline-style
     gesetzten Hintergrundfarbe/dem Farbverlauf, da beides separate
     Ebenen sind (box-shadow/::after ueberschreiben "background" nicht). */
  .legItem .dot, .lblwrap .dot {
    position: relative; overflow: hidden;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -1px 2px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.35);
  }
  .legItem .dot::after, .lblwrap .dot::after {
    content: ''; position: absolute; top: 8%; left: 12%; width: 55%; height: 45%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%);
    border-radius: inherit; pointer-events: none;
  }
  .legItem .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* Bilanz-Zusammenfassung (neuer Reiter, Dietmars SEMS-Vorbild-Screenshots,
     30.07.2026) - zwei Spalten Verbrauch/Erzeugung, eigene Steuerflaechen-
     Optik statt GoodWe-Farben (Dietmars ausdruecklicher Wunsch). */
  #balancePanel { flex: 0 0 auto; padding-top: 6px; font-size: 12px; }
  /* Kopf, Tabelle und Quote sitzen als ein zusammenhaengender, inhaltsbreiter
     Block mittig unter den Charts (Dietmar, 31.07.2026: Quote und "Bilanz"-
     Kopf sollen sich an die Tabelle anpassen, nicht die volle Kachelbreite
     nutzen). */
  .balWrap { width: fit-content; margin: 0 auto; }
  .balHead { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 700; opacity: .85; padding: 4px 2px; user-select: none; }
  .balHead .car { transition: transform .15s; }
  .balHead.collapsed .car { transform: rotate(-90deg); }
  .balBody.collapsed { display: none; }
  /* Buendig-Versuch mit Legende (space-between/alignBalanceBlocks) wieder
     rueckgaengig gemacht (Dietmar, 31.07.2026) - stattdessen Abstand
     zwischen den beiden Tabellenbloecken um 10px vergroessert (40->50). */
  /* EIN gemeinsames Grid statt zwei unabhaengiger Spalten-Grids (Dietmar,
     31.07.2026: "Die Zeilen sind nicht auf gleicher Hoehe, ich wuensche
     mir hier mehr Praezision") - zwei unabhaengige Grids sizen ihre
     Zeilen unabhaengig voneinander, kleinste Unterschiede (z.B. Quote-
     Zeile ohne Punkt-Icon) verschieben dann die Hoehe. Jetzt bilden
     pairRow()-Aufrufe (siehe renderBilanzPanel) EINE Grid-Zeile mit
     7 Spalten: Label/Luecke/Wert links, Zwischenraum, Label/Luecke/Wert
     rechts - dieselbe Grid-Zeile hoehe fuer beide Seiten ist damit
     durch die Grid-Engine selbst garantiert, nicht mehr nur angenaehert.
     55px-Zwischenraum ist die mittlere Spalte statt eines Flex-Gaps. */
  /* Feste statt "auto" Spaltenbreiten fuer Label/Wert (Dietmar, 31.07.2026:
     "die Leerspalte in der Tabelle sitzt nicht mittig") - "auto" sizt
     Spalte 1 (linke Labels) und Spalte 5 (rechte Labels) unabhaengig
     voneinander nach ihrem jeweils LAENGSTEN Inhalt; da linke und rechte
     Labels unterschiedlich lang sind (z.B. "Batterieentladung" links vs.
     "Direktverbrauchsquote" rechts), war die 55px-Luecke dadurch nicht
     die optische Mitte der Tabelle. Feste, gespiegelte Breiten erzwingen
     echte Symmetrie unabhaengig vom Textinhalt.
     .lbl darf trotzdem ueberlaufen (kein overflow:hidden), falls ein
     Label die feste Breite doch sprengt. */
  .balBody { display: grid; grid-template-columns: 120px 50px 70px 45px 120px 50px 70px; justify-content: center; align-items: center; padding: 4px 2px 8px; }
  .balRow { display: contents; }
  .balRow > * { padding: 3px 0; border-bottom: 1px solid transparent; }
  .balRow.total > * { border-bottom: none; font-weight: 700; }
  .lblwrap { display: flex; align-items: center; gap: 7px; opacity: .85; }
  .lblwrap .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .balRow .val { text-align: right; font-weight: 700; white-space: nowrap; }

  /* Jahresvergleich (SMA-Sunny-Portal-Vorbild, Dietmar, 31.07.2026):
     Unter-Reiter "Gesamtertrag"/"Spezifischer Anlagenertrag" + Tabelle
     (Jahre als Zeilen, Monate als Spalten) + Dialog fuer die "erwartete
     Leistung" (spezifischer Jahresertrag x Anlagenleistung x Monatsanteil -
     Prognose hat dafuer noch kein eigenes Konzept, siehe Klaerung 31.07.2026,
     deshalb hier). */
  #yearComparePanel { flex: 0 0 auto; padding-top: 6px; font-size: 12px; }
  .ycSubTabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
  .ycSubTabs button { background: none; border: 1px solid rgba(127,135,145,.35); color: inherit; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; opacity: .75; }
  .ycSubTabs button.active { opacity: 1; font-weight: 700; border-color: rgba(127,135,145,.7); }
  .ycSubTabs button:disabled { opacity: .3; cursor: default; }
  .ycHint { text-align: center; opacity: .7; margin-bottom: 8px; }
  .ycTableWrap { overflow-x: auto; }
  .ycTable { border-collapse: collapse; width: 100%; font-size: 11px; white-space: nowrap; }
  .ycTable th, .ycTable td { padding: 3px 8px; text-align: right; }
  .ycTable th:first-child, .ycTable td:first-child { text-align: left; }
  .ycTable thead th { border-bottom: 1px solid rgba(127,135,145,.35); opacity: .8; }
  .ycTable tbody tr.ycTotal td { border-top: 1px solid rgba(127,135,145,.35); font-weight: 700; }
  .ycTable tbody tr.ycExpected td { font-style: italic; opacity: .8; }
  .ycFoot { text-align: center; margin-top: 8px; }
  .ycFoot button { background: none; border: 1px solid rgba(127,135,145,.35); color: inherit; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; margin: 0 4px; }
  /* position:fixed statt absolute (Dietmar, 31.07.2026: "Dialog muss so
     gross sein, dass man alles sieht ohne zu scrollen") - als absolute
     Ueberlagerung nur INNERHALB von #yearComparePanel war die verfuegbare
     Hoehe auf die (oft knappe) Kachelhoehe begrenzt; fixed nutzt die volle
     Fensterhoehe des Tiles. max-height/overflow bleiben als reine
     Sicherheitsbremse fuer sehr kleine Fenster, nicht als Regelfall. */
  .ycOverlay { position: fixed; inset: 0; background: rgba(20,21,24,.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; box-sizing: border-box; }
  .ycDialog { background: #24262b; border-radius: 8px; padding: 16px 20px; width: min(94%, 620px); max-height: 96vh; overflow-y: auto; font-size: 12px; }
  .ycDialog h3 { margin: 0 0 10px; font-size: 14px; }
  .ycRow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .ycRow label { flex: 1 1 auto; }
  .ycRow input[type="number"] { width: 90px; }
  .ycMonthGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .ycMonthGrid div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ycMonthGrid input { width: 100%; text-align: center; }
  .ycSum { text-align: right; opacity: .8; margin: 4px 0; }
  .ycSum.bad { color: #ff8a80; }
  .ycDialogFoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="bar">
      <select id="type" class="sel">
        <option value="day">Tag (Verlauf)</option>
        <option value="week">Woche (Energie)</option>
        <option value="month">Monat (Energie)</option>
        <option value="year">Jahr (Energie)</option>
        <option value="all">Gesamt (Energie)</option>
        <option value="custom">Benutzerdefiniert</option>
      </select>
      <button id="prev" class="nav" title="Zurück">&#9664;</button>
      <span id="periodLabel" class="pick" style="display:none; cursor:default;"></span>
      <input id="pick" class="pick" type="date">
      <input id="pickTo" class="pick" type="date" style="display:none">
      <button id="next" class="nav" title="Vor">&#9654;</button>
      <span id="quick"></span>
    </div>
    <div id="body">
      <div id="tabs">
        <button class="tab active" data-tab="solar">PV & Einstrahlung</button>
        <button class="tab" data-tab="mpp">MPP-Tracker</button>
        <button class="tab" data-tab="battery">Batterie</button>
        <button class="tab" data-tab="price">Strompreis</button>
        <button class="tab" data-tab="flow">Energiebilanz</button>
        <button class="tab" data-tab="balance">Bilanz</button>
        <button class="tab" data-tab="yearcompare">Jahresvergleich</button>
        <button class="tab" data-tab="tagesplan">Tagesplan</button>
        <button class="tab" data-tab="netzampel">Netzampel</button>
      </div>
      <div id="chartcol">
        <div id="chart"></div>
        <div id="priceUnitRow" class="ycSubTabs" style="display:none">
          <button data-unit="kwh">kWh</button>
          <button data-unit="kw">Ø kW</button>
        </div>
        <div id="ampelStrip" class="ampelStrip" style="display:none"></div>
        <div id="legendRow"></div>
        <div id="planKeyRow" style="display:none"></div>
        <div id="balancePanel" style="display:none"></div>
        <div id="yearComparePanel" style="display:none"></div>
        <div id="netzampelPanel" style="display:none"></div>
      </div>
    </div>
  </div>

  <script>/*__ECHARTS_JS__*/</script>
  <script>
    // idx=1 statt 0, weil days[0] jetzt "morgen" ist (nur beim Strompreis-
    // Reiter befuellt, siehe module.php::buildPayload()) - der Default beim
    // Oeffnen der Kachel bleibt "heute" (Dietmars Wunsch, 28.07.2026:
    // "morgen" per Vor-Navigation erreichbar machen, ohne den Standard-
    // Einstieg fuer die anderen Reiter zu verschieben).
    var lastData = null, chart = null, chartEngine = null, idx = 1, curTab = 'solar';
    // Tagesplan-Reiter (Dietmar, 21.08.2026: "jeden der beiden Tage
    // einzeln sehen" statt beide Tage in einem Chart) - eigene, simple
    // 0/1-Navigation (0=heute, 1=morgen), unabhaengig von curView/idx der
    // uebrigen Reiter, da EMS keine Tagesplan-Historie vorhaelt.
    var tagesplanDay = 0;
    // Energiebilanz (Sankey) fuer Woche/Monat/Jahr/Gesamt/Benutzerdefiniert -
    // per requestAction() nachgeforderte Ergebnisse, keyed "start_end"
    // (Unix-Sekunden), damit ein einmal geladener Zeitraum nicht bei jedem
    // Tab-/Reiterwechsel erneut angefordert wird. flowPendingKey verhindert
    // doppelte Anfragen, waehrend eine Antwort noch aussteht.
    var flowCache = {}, flowPendingKey = null;
    // Neuer "Bilanz"-Reiter (Dietmars SEMS-Vorbild-Screenshots, 30.07.2026) -
    // eigener Reiter NEBEN dem bestehenden Sankey "Energiebilanz" (Dietmars
    // ausdrueckliche Entscheidung). Gleiches Nachforder-/Cache-Muster wie
    // flowCache oben, eigener Key-Namensraum ("balance_<granularity>_<start>_<end>").
    var balanceCache = {}, balancePendingKey = null;
    // Jahresvergleich (SMA-Sunny-Portal-Vorbild, Dietmar, 31.07.2026) - kein
    // Zeitraum-Parameter noetig (immer "seit Inbetriebnahme"), deshalb reicht
    // ein einzelner Cache-Slot statt eines Keys wie bei balanceCache.
    var yearCompareCache = null, yearComparePending = false, yearCompareSub = 'total';
    // Tagesplan-Reiter (Dietmar, 21.08.2026: "Laden benoetigt sehr lange") -
    // gleiches Nachforder-Muster wie yearCompareCache: PVF_/LFC_GetForecast()
    // koennen intern sehr teuer sein (bis zu LFC_LookbackDays Kandidatentage),
    // deshalb NICHT mehr Teil des Haupt-Payloads, sondern erst per
    // requestAction('dayPlanLoad') geholt, wenn der Reiter tatsaechlich
    // geoeffnet wird. Kein Zeitraum-Parameter noetig (immer heute+morgen).
    var dayPlanCache = null, dayPlanPending = false;
    // StromGedacht-Netzampel (21.08.2026) - gleiches Nachforder-Muster,
    // eigener Cache/Ident, da unabhaengig von EMS ladbar (auch nutzbar,
    // wenn kein EMS installiert ist).
    var stromgedachtCache = null, stromgedachtPending = false;
    function ensureStromGedacht() {
      if (stromgedachtCache || stromgedachtPending) { return; }
      stromgedachtPending = true;
      requestAction('stromgedachtLoad', '{}');
    }
    // Strompreis-Reiter: Netzbezug wahlweise als Energie (kWh je 15-Min-
    // Balken) oder als Durchschnittsleistung (kW) anzeigen (Dietmars
    // Wunsch, 07.08.2026). Umrechnung ist ein simpler Faktor 4, weil
    // SlotEnergyBars() im Backend IMMER auf feste 15-Minuten-Buckets
    // aggregiert (kWh / 0.25h = kW) - keine zusaetzliche Backend-Abfrage
    // noetig. Kosten (kWh x ct/kWh) rechnen intern IMMER mit der echten
    // kWh, unabhaengig vom Anzeige-Modus.
    var priceUnitKw = false;
    var GRID_KWH_TO_KW = 4;
    // Ein-/Ausklappen der Bilanz-Tabelle ist zurueck (Dietmar, 31.07.2026:
    // "waere es von Vorteil, wenn man die Bilanztabelle komprimieren und
    // die Charts gleichzeitig expandieren koennte") - diesmal bewusst OHNE
    // Hoehen-Sperre fuer #chart: #chart (flex:1 1 auto) und #balancePanel
    // sind Geschwister in #chartcol, .balBody.collapsed (display:none)
    // gibt den Platz frei, den sich #chart dann von selbst zurueckholt -
    // genau das war beim vorigen (inzwischen entfernten) Anlauf noch
    // UNERWUENSCHT, jetzt ist es der Zweck der Funktion.
    var balancePanelCollapsed = false;
    var balanceChartLocked = false;
    function lockChartHeightOnce() {
      if (balanceChartLocked) { return; }
      var elC = document.getElementById('chart');
      var h = elC.getBoundingClientRect().height;
      if (h > 40) {
        elC.style.flex = '0 0 ' + h + 'px';
        balanceChartLocked = true;
      }
    }
    function unlockChartHeight() {
      document.getElementById('chart').style.flex = '';
      balanceChartLocked = false;
    }
    // Eigene Farbpalette (Dietmars Wunsch: "die Steuerflaechen moechte ich
    // unsere nehmen" - NICHT die GoodWe-SEMS-Farben kopieren). Solar/Batterie/
    // Netz greifen die bereits im Sankey etablierten Farben dieses Moduls
    // wieder auf (COL_SOLAR/COL_BAT/COL_GRID aus module.php), Netzbezug/
    // Batterieentladung bekommen zwei neue, aber stimmige Toene.
    // Exakte Farben von Dietmar vorgegeben (31.07.2026, SEMS-Referenz).
    // Reihenfolge bestimmt zugleich die Stapel-Position in den Charts
    // (seriesFor() reicht BALANCE_SERIES-Filter direkt an die Chart-Serien
    // durch). Die Weisung "Batterieladung auf Hoehe Netzbezug,
    // Netzeinspeisung auf Hoehe Batterieentladung" (Dietmar, 31.07.2026)
    // galt NUR fuer den Bilanz-Tabellenblock unten (dort schon so
    // angeordnet, siehe row()-Aufrufe in renderBilanzPanel) - NICHT fuer
    // die Chart-Stapelreihenfolge, das war ein Missverstaendnis meinerseits
    // und wieder auf die urspruengliche Reihenfolge zurueckgesetzt.
    var BALANCE_SERIES = [
      { key: 'netzbezug',         name: 'Netzbezug',         color: '#FF2600', panel: 'v' },
      { key: 'batterieentladung', name: 'Batterieentladung', color: '#FF9300', panel: 'v' },
      { key: 'direktverbrauch',   name: 'Direktverbrauch',   color: '#4F8F00', panel: 'both' },
      { key: 'batterieladung',    name: 'Batterieladung',    color: '#945200', panel: 'e' },
      { key: 'netzeinspeisung',   name: 'Netzeinspeisung',   color: '#FFFB00', panel: 'e' }
    ];
    // Plastischere Chart-Flaechen statt flacher Einheitsfarbe (Dietmar,
    // 31.07.2026: "Koennte man die Chartflaechen etwas plastischer
    // darstellen? Vielleicht auch mit Glanzlichtern?") - je Serie ein
    // vertikaler Verlauf von einem aufgehellten Ton oben zur Grundfarbe

    function isoWeekNumber(date) {

    var MONTH_NAMES = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

    function buildEnergyRows(tab) {

    // Je Reiter: Serien + Achsenbeschriftungen. "right"=true nutzt die rechte

    function buildSeries(tab, d) {
      if (tab === 'mpp') {
        // Linke Achse in kW statt W (Dietmars Wunsch, 28.07.2026, analog
        // zum Solar-Reiter).
        var keys = lastData.mpptKeys || [];
        var series = [];
        keys.forEach(function (k, i) {
          var color = MPPT_COLORS[i % MPPT_COLORS.length];
          series.push({ name: 'MPPT ' + k, data: toKw(d.mppt && d.mppt[k]), axis: 0, color: color, dashed: false });
          // "PV erwartet" je Strang (Dietmars Wunsch, 28.07.2026, analog zur
          // Gesamt-Erwartungskurve im Solar-Reiter) - nur wenn das Backend
          // eine belastbare Generator-zu-Strang-Zuordnung liefern konnte
          // (hasMpptModel). Die Kurvenform ist je Strang identisch zur
          // bereits vorhandenen Gesamt-Erwartungskurve d.expected (gleiche

          if (lastData.hasMpptModel && share && d.expected && d.expected.length) {
            var scaled = d.expected.map(function (p) { return [p[0], p[1] * share]; });
            series.push({ name: 'MPPT ' + k + ' erwartet', data: toKw(scaled), axis: 0, color: color, dashed: true });
          }

        return series;
      }
      if (tab === 'battery') {
        // Linke Achse in kW statt W (Dietmars Wunsch, 28.07.2026, analog
        // Solar/MPP-Tracker).
        var series = [{ name: 'Batterie-Leistung', data: toKw(d.bat), axis: 0, color: '#43a047', dashed: false }];
        if (lastData.hasSoc) {
          series.push({ name: 'Batterie-SOC', data: d.soc, axis: 1, color: '#9575cd', dashed: false });
        }
        return series;
      }
      // solar (Standard) - linke Achse in kW statt W (Dietmars Wunsch,
      // 27.07.2026), Einstrahlung (rechte Achse, W/m²) bleibt unveraendert.
      var series = [{ name: 'PV-Erzeugung', data: toKw(d.pv), axis: 0, color: '#e53935', dashed: false }];
      if (lastData.hasIrr) {
        series.push({ name: 'Einstrahlung', data: d.irr, axis: 1, color: '#fbc02d', dashed: false });
      }
      if (lastData.hasModel && d.expected && d.expected.length) {
        series.push({ name: 'PV erwartet', data: toKw(d.expected), axis: 0, color: '#e57373', dashed: true });
      }
      return series;
    }

    // Eigene, von uns kontrollierte Legende statt der eingebauten Klick-
    // Ereignisse von ECharts/Highcharts (siehe CSS-Kommentar #legendRow) -
    // ein Klick schaltet direkt vis[name] um und rendert neu, kein
    // Ereignis-Umweg ueber die Chart-Bibliothek.
    function renderLegend(tab, allNames) {
      var row = document.getElementById('legendRow');
      row.innerHTML = '';
      // Frueher fuer 'price' fest auf "Strompreis" begrenzt - jetzt kann der
      // Reiter auch "Netzbezug" enthalten, deshalb einfach die tatsaechliche
      // Serienliste uebernehmen (Dietmars Wunsch, 28.07.2026).
      var items = allNames;
      items.forEach(function (it) {
        var el = document.createElement('span');
        el.className = 'legItem' + (isVisible(it.name) ? '' : ' off');
        el.innerHTML = '<span class="dot" style="background:' + it.color + '"></span>' + it.name;
        el.onclick = function () { setVisible(it.name, !isVisible(it.name)); render(); };
        row.appendChild(el);
      });
    }

    function axisConfig(tab) {
      // Linke Achse (kW) in 1-kW-Schritten (Dietmars Wunsch, 28.07.2026,
      // analog zum Solar-Reiter).
      if (tab === 'mpp') { return { leftName: 'kW', rightName: '', showRight: false, leftInterval: 1 }; }
      // Linke Achse (kW) in 1-kW-Schritten wie bei Solar/MPP-Tracker; rechte
      // Achse (SOC) fest 0-100%, nicht dynamisch skaliert (Dietmars Wunsch,
      // 28.07.2026 - ein SOC-Verlauf, der z.B. nur 40-60% abdeckt, soll die
      // Achse nicht künstlich strecken).
      if (tab === 'battery') { return { leftName: 'kW', rightName: '%', showRight: !!lastData.hasSoc, leftInterval: 1, rightMin: 0, rightMax: 100 }; }
      // Linke Achse (kW) in 1-kW-Schritten (Dietmars Wunsch, 27.07.2026).
      return { leftName: 'kW', rightName: 'W/m²', showRight: !!lastData.hasIrr, leftInterval: 1 };
    }

    // x-Achsen-Bereich je Reiter (Tag-Ansicht): Solar/MPP-Tracker zeigen nur
    // Sonnenaufgang-1h bis Sonnenuntergang+1h, Batterie IMMER den vollen
    // Kalendertag 0-24 Uhr - auch am heutigen Tag, wo die Daten nur bis
    // "jetzt" reichen (sonst schneidet die x-Achse an der aktuellen Uhrzeit
    // ab statt den Tag vollstaendig zu zeigen, Dietmars Wunsch, 28.07.2026).
    function xAxisRange(tab, d) {
      if (!d) { return null; }
      if ((tab === 'solar' || tab === 'mpp') && d.sunStart) { return { min: d.sunStart, max: d.sunEnd }; }
      if ((tab === 'battery' || tab === 'price') && d.dayStart) { return { min: d.dayStart, max: d.dayEnd }; }
      return null;
    }

    // Preiskurve (Intervalle [start,end,price], keine gleichmaessigen 5-Min-
    // Punkte wie die anderen Reiter): EIN Punkt je Slot in der SLOT-MITTE
    // (nicht am Slot-Anfang) + step:'middle'/'center' - das laesst ECharts/
    // Highcharts die Stufe automatisch symmetrisch um jeden Punkt zeichnen
    // (bis zur Mitte zum Nachbarn), deckungsgleich mit den echten Slot-
    // Grenzen, SOFERN alle Slots gleich lang sind (bei uns immer der Fall -
    // entweder durchgehend stuendlich oder durchgehend viertelstuendlich).
    // Vorherige Fassung schickte Start- UND Endpunkt jedes Slots einzeln -
    // an jeder Slot-Grenze lagen dadurch ZWEI Punkte auf demselben
    // Zeitstempel mit unterschiedlichem Preis, worauf der Tooltip beim
    // Hovern nahe der Grenze mal den einen, mal den anderen zeigte
    // (Dietmars Fund, 28.07.2026: "faengt im 15-Min-Intervall, zeigt 2
    // Strompreise"). Mit gleichmaessig in der Mitte verteilten Punkten faellt
    // die Naechster-Punkt-Grenze der Tooltip-Erkennung exakt auf die echte
    // Slot-Grenze - jede Hover-Position im Slot trifft eindeutig diesen einen
    // Punkt. slotStart/slotEnd bleiben als Zusatzfelder erhalten, damit der
    // Tooltip die tatsaechliche Slot-Startzeit (nicht die Slot-Mitte)
    // anzeigen kann.
    // gridDraw liegt IMMER als [ts, kWh] vor - bei priceUnitKw wird daraus
    // [ts, kW] (Faktor 4, siehe Deklaration von priceUnitKw oben), sonst
    // unveraendert durchgereicht.
    function gridDrawForDisplay(raw) {
      if (!priceUnitKw) { return raw; }
      return raw.map(function (p) { return [p[0], Math.round(p[1] * GRID_KWH_TO_KW * 1000) / 1000]; });
    }
    // Beschriftung der Monats-Spitzenwert-Linie: Leistung + Tag + die
    // Viertelstunde, in der die Spitze auftrat (Dietmars Wunsch,
    // 07.08.2026) - peak.ts liegt wie bei gridDraw in der Slot-MITTE.
    function gridPeakLabel(peak) {
      if (!peak) { return ''; }
      var slotStart = peak.ts - 450000, slotEnd = peak.ts + 450000;
      var dt = new Date(peak.ts);
      var dateStr = ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2) + '.';
      return peak.kw.toFixed(2) + ' kW  ' + dateStr + '  ' + fmtHM(slotStart) + '–' + fmtHM(slotEnd) + ' Uhr';
    }
    function priceStepPoints(d) {
      return ((d && d.price) || []).map(function (slot) {
        var center = slot[0] + (slot[1] - slot[0]) / 2;
        return { value: [center, slot[2]], slotStart: slot[0], slotEnd: slot[1] };
      });
    }

    // Highcharts erwartet Punkte als {x,y,...}, nicht ECharts' {value:[x,y]}
    // - gleiche slotStart/slotEnd-Zusatzfelder, nur andere Punktform.
    function priceStepPointsHC(d) {
      return priceStepPoints(d).map(function (p) {
        return { x: p.value[0], y: p.value[1], slotStart: p.slotStart, slotEnd: p.slotEnd };
      });
    }

    function fmtHM(ms) {
      var dt = new Date(ms);
      return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
    }

    // Findet den Preis-Slot, der einen Zeitpunkt enthaelt - ueber Zeitraum-
    // Enthaltensein, NICHT ueber exakte Punkt-Gleichheit: Strompreis-Slots
    // sind haeufig STUENDLICH, Netzbezugs-Balken dagegen immer 15-Minuten-
    // Buckets (siehe SlotEnergyBars()). Ein reiner Hover-Punkt-Abgleich
    // (beide Serien treffen bei diesem x) funktioniert deshalb nur, wenn
    // zufaellig auch der Strompreis viertelstuendlich aufgeloest ist -
    // dieser Suchweg funktioniert immer, unabhaengig von der Preis-
    // Aufloesung (Dietmars Wunsch, 28.07.2026: "Kosten" je Netzbezugs-Slot).
    function priceSlotAt(d, ms) {
      if (!d || !d.price) { return null; }
      for (var i = 0; i < d.price.length; i++) {
        if (ms >= d.price[i][0] && ms < d.price[i][1]) { return d.price[i]; }
      }
      return null;
    }

    function renderECharts(el, tab, d) {

      if (!chart) {
        // el.innerHTML NUR hier leeren (ein evtl. vorheriger "Keine Daten"-
        // Text) und NUR beim echten Neuanlegen - ein Leeren VOR jedem
        // Wiederverwenden des bestehenden chart-Objekts (frueher in
        // render()) hat dessen internen Canvas aus dem DOM gerissen, ohne
        // die ECharts-Instanz zu entsorgen: setOption() lief danach gegen
        // einen abgehaengten Canvas ins Leere (leerer Wrapper-Div ohne
        // sichtbaren Inhalt) - live beim Bau der Energie-Ansichten
        // gefunden (Balken blieben unsichtbar, obwohl die Daten korrekt

        el.innerHTML = '';
        // devicePixelRatio explizit setzen - ohne dieses Feld faellt ECharts'
        // Canvas-Renderer auf 1 zurueck, wenn der Browser es nicht von sich
        // aus erkennt, wodurch duenne Linien auf Retina-Displays verwaschen
        // und dadurch optisch dicker wirken als in Highcharts' SVG-Rendering
        // (Dietmars Vergleichsscreenshot, 28.07.2026: ECharts-Linien wirkten
        // deutlich kraeftiger als bei Highcharts, obwohl beide dieselbe
        // lineStyle.width nutzen).
        chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 });
        chartEngine = 'echarts';
      }
      var ax = axisConfig(tab);
      // Strompreis: rechte Achse (ct/kWh), Netzbezug (falls vorhanden) als
      // Balken auf der linken Achse (kWh) - analog zu InverterHubMonitors
      // Strompreis-Reiter (Dietmars Wunsch, 28.07.2026, deren Vorbild).
      var allSeries = (tab === 'price')
        ? [{ name: 'Strompreis', data: priceStepPoints(d), color: '#ffb300', axis: 1, dashed: false, step: 'middle' }]
          .concat((lastData.hasGrid && d && d.gridDraw && d.gridDraw.length)
            ? [{ name: priceUnitKw ? 'Netzbezug (Ø kW)' : 'Netzbezug', data: gridDrawForDisplay(d.gridDraw), color: '#4aa3e0', axis: 0, bar: true }] : [])
        : buildSeries(tab, d);
      renderLegend(tab, allSeries.map(function (s) { return { name: s.name, color: s.color }; }));
      // Ausgeblendete Serien werden nicht mitgeschickt, statt sie nur

      var visSeries = allSeries.filter(function (s) { return isVisible(s.name); });
      var series = visSeries.map(function (s) {
        if (s.bar) {

        }
        return { name: s.name, type: 'line', showSymbol: false, step: s.step === 'middle' ? 'middle' : (s.step ? 'end' : false), data: s.data, yAxisIndex: s.axis, color: s.color, lineStyle: Object.assign({ width: 0.7 }, s.dashed ? { type: 'dashed' } : {}) };
      });
      // Strompreis, aktueller Tag: rote vertikale Linie fuer "jetzt"
      // (Dietmars Wunsch, 28.07.2026) - an die erste sichtbare Serie
      // gehaengt, NICHT an eine leere Hilfsserie: eine markLine ohne
      // eigene Werte-Bandbreite (Hilfsserie mit nur einem Nullwert) haengt
      // sich sonst an DEREN Werteumfang und bleibt ein paar Pixel hoher
      // Strich statt ueber die volle Diagrammhoehe zu reichen (live so
      // vorgefunden).
      if (tab === 'price' && d && d.id === fmtDate(new Date()) && series.length > 0) {
        series[0].markLine = { symbol: 'none', silent: true, label: { show: false }, lineStyle: { color: '#ff5252', width: 2, type: 'solid' }, data: [{ xAxis: Date.now() }] };
      }
      // Monats-Spitzenwert der Netzbezugsleistung (Dietmars Wunsch,
      // 07.08.2026) - NUR im "Ø kW"-Anzeigemodus sinnvoll: der Wert ist
      // eine Leistung (kW), die kWh-Achse haette eine voellig andere
      // Groessenordnung und die Linie liefe optisch aus dem Ruder. An die
      // Netzbezug-Balkenserie selbst gehaengt (nicht an eine Hilfsserie),
      // damit sie zuverlaessig auf Achse 0 (links) landet.
      // Achsen-Obergrenze muss den Spitzenwert mit einschliessen - ohne das
      // haette ECharts die Achse nur an den (oft viel niedrigeren) Balken
      // des gerade angezeigten Tages ausgerichtet, die Linie liefe dann
      // ausserhalb des sichtbaren Bereichs (live gefunden, 07.08.2026: bei
      // einem Tag weit unter dem Monats-Rekord blieb von der Linie nichts
      // zu sehen).
      var priceLeftAxisMax = null;
      if (tab === 'price' && priceUnitKw && d && d.gridMonthPeak) {
        var gridSeriesE = series.filter(function (s) { return s.type === 'bar' && s.yAxisIndex === 0; })[0];
        if (gridSeriesE) {
          gridSeriesE.markLine = {
            symbol: 'none', silent: true,
            lineStyle: { color: '#ffd54a', width: 1.5, type: 'solid' },
            label: { show: true, position: 'insideEndTop', color: '#ffd54a', fontSize: 10, formatter: gridPeakLabel(d.gridMonthPeak) },
            data: [{ yAxis: d.gridMonthPeak.kw }]
          };
          var barMaxE = gridSeriesE.data.reduce(function (m, p) { return Math.max(m, p[1] || 0); }, 0);
          if (d.gridMonthPeak.kw > barMaxE) { priceLeftAxisMax = Math.ceil(d.gridMonthPeak.kw * 1.08 * 10) / 10; }
        }
      }
      chart.setOption({
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        // bottom:32 statt 12 - bei 12 wurden die Uhrzeit-Beschriftungen der
        // x-Achse unten abgeschnitten (Dietmar, 28.07.2026).
        // bottom:52 statt 32 - Platz fuer den Zoom-Slider unter der
        // Zeitachsen-Beschriftung (Dietmars Wunsch, 28.07.2026).
        grid: { left: 46, right: (ax.showRight || tab === 'price') ? 46 : 12, top: 28, bottom: 52 },
        legend: { show: false },
        // Dunkler Tooltip passend zu Highcharts (dessen useHTML-Tooltip vom
        // Browser/OS automatisch dunkel dargestellt wird) - ECharts' Tooltip
        // ist standardmaessig hell und wirkte dadurch im Vergleich fremd
        // (Dietmars Screenshot-Vergleich, 28.07.2026).
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(30,32,36,0.92)',
          borderWidth: 0,
          textStyle: { color: '#e8e8e8' },
          extraCssText: 'box-shadow:0 2px 10px rgba(0,0,0,.4);',
          // Werte im Tooltip auf 2 Nachkommastellen begrenzen (Dietmars
          // Wunsch, 28.07.2026) statt der vollen Fliesskomma-Genauigkeit.
          // Strompreis-Reiter: eigener Zweig, da der Datenpunkt in der Mitte
          // des Slots liegt (siehe priceStepPoints()) - der Tooltip soll
          // aber den tatsaechlichen Slot-Zeitraum (Start-Ende) zeigen, nicht
          // die Slot-Mitte, plus den Preis explizit als "ct/kWh" beschriftet
          // (Dietmars Wunsch, 28.07.2026).
          formatter: function (params) {
            if (tab === 'price') {
              // Preis- und Netzbezugs-Punkt liegen auf unterschiedlichen
              // Zeitrastern (Strompreis oft stuendlich, Netzbezug immer
              // viertelstuendlich) - der Preis fuer die "Kosten"-Zeile wird
              // deshalb NICHT ueber einen gemeinsamen Hover-Treffer bezogen,
              // sondern per priceSlotAt() ueber den Zeitpunkt gesucht (robust
              // unabhaengig von der Preis-Aufloesung).
              // Strompreis wird IMMER ueber priceSlotAt() (Zeitraum-Suche)
              // bezogen, nicht ueber einen zufaelligen gemeinsamen Hover-
              // Treffer der beiden Serien - sonst zeigt der Tooltip alle drei
              // Werte nur dann zusammen, wenn Strompreis- und Netzbezugs-
              // Punkt gerade auf demselben Zeitstempel liegen (bei "heute"
              // meist zufaellig der Fall, bei rekonstruierten vergangenen
              // Tagen mit laengeren/unregelmaessigen Preis-Slots aber nicht -
              // Dietmars Fund, 29.07.2026: "sollte zu jedem Zeitpunkt so
              // sein, nicht nur bei Heute").
              var priceP = params.filter(function (p) { return p.data && p.data.slotStart !== undefined; })[0];
              var gridP = params.filter(function (p) { return !(p.data && p.data.slotStart !== undefined); })[0];
              var refX = gridP ? gridP.value[0] : (priceP ? priceP.value[0] : null);
              var slot = (refX !== null) ? priceSlotAt(d, refX) : null;
              var head = slot ? ('<div style="font-weight:600;margin-bottom:2px">' + fmtHM(slot[0]) + '–' + fmtHM(slot[1]) + ' Uhr</div>')
                : (priceP ? ('<div style="font-weight:600;margin-bottom:2px">' + fmtHM(priceP.data.slotStart) + '–' + fmtHM(priceP.data.slotEnd) + ' Uhr</div>') : '');
              var lines = [];
              var priceVal = slot ? slot[2] : (priceP ? priceP.value[1] : null);
              if (priceVal !== null && priceVal !== undefined) {
                lines.push('<div><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb300;margin-right:4px"></span>Strompreis: <b>' + Number(priceVal).toFixed(2) + ' ct/kWh</b></div>');
              }
              var gridV = null;
              if (gridP) {
                gridV = (gridP.value && gridP.value[1] !== undefined) ? gridP.value[1] : gridP.value;
                if (gridV !== null && gridV !== undefined) {
                  var gridLabel = priceUnitKw ? 'Ø Leistung' : 'Netzbezug';
                  var gridUnit = priceUnitKw ? 'kW' : 'kWh';
                  lines.push('<div>' + gridP.marker + ' ' + gridLabel + ': <b>' + Number(gridV).toFixed(2) + ' ' + gridUnit + '</b></div>');
                }
              }
              // Kosten = Netzbezug (kWh) x Strompreis (ct/kWh) = ct fuer
              // diesen Slot (Dietmars Wunsch, 28.07.2026) - IMMER mit der
              // echten kWh gerechnet, auch wenn gridV gerade als kW
              // angezeigt wird (Faktor 4 zurueckgerechnet).
              var gridKwh = (gridV !== null && gridV !== undefined) ? (priceUnitKw ? gridV / GRID_KWH_TO_KW : gridV) : null;
              if (gridKwh !== null && gridKwh !== undefined && priceVal !== null && priceVal !== undefined) {
                lines.push('<div>Kosten: <b>' + formatCost(gridKwh * priceVal) + '</b></div>');
              }
              return head + lines.join('');
            }
            return params.map(function (p, i) {
              var v = (p.value && p.value[1] !== undefined) ? p.value[1] : p.value;
              var head = i === 0 ? '<div style="font-weight:600;margin-bottom:2px">' + new Date(p.value[0]).toLocaleString('de-DE') + '</div>' : '';
              return head + '<div>' + p.marker + ' ' + p.seriesName + ': <b>' + (v === null || v === undefined ? '–' : Number(v).toFixed(2)) + '</b></div>';
            }).join('');
          }
        },
        // "PV & Einstrahlung": nur Sonnenaufgang-1h bis Sonnenuntergang+1h
        // zeigen (Dietmars Wunsch) - Nachtstunden ohne jede Erzeugung sollen
        // nicht die halbe Diagrammbreite einnehmen. Andere Reiter zeigen
        // weiterhin den vollen Tag.
        // Zarte Hintergrund-Gitterlinien fuer Zeit (x-Achse) und die linke
        // Achse (PV-Leistung/kW) - die rechte Achse (Einstrahlung) bekommt
        // bewusst keine eigenen, sonst ueberlagern sich zwei Gitter mit
        // unterschiedlicher Teilung (Dietmars Wunsch, 28.07.2026).
        // minInterval/maxInterval auf exakt 1 Stunde erzwungen - ohne das
        // waehlt ECharts bei einer Zeitachse selbst eine "schoene" Anzahl
        // Teilstriche (hier: alle 2 Stunden), Highcharts kam dagegen von
        // sich aus auf stuendliche Beschriftung (Dietmars Vergleich,
        // 28.07.2026).
        xAxis: Object.assign(
          { type: 'time' }, xAxisRange(tab, d) || {},
          { splitLine: { show: true, lineStyle: { color: GRID_COLOR } }, minInterval: 3600 * 1000, maxInterval: 3600 * 1000, axisLabel: themeAxisStyle() }
        ),
        yAxis: (tab === 'price')
          ? [
              { type: 'value', name: priceUnitKw ? 'kW' : 'kWh', position: 'left', max: priceLeftAxisMax, nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: true, lineStyle: { color: GRID_COLOR } } },
              { type: 'value', name: 'ct/kWh', position: 'right', nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: false } }
            ]
          : [
              { type: 'value', name: ax.leftName, position: 'left', interval: ax.leftInterval || null, nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: true, lineStyle: { color: GRID_COLOR } } },
              { type: 'value', name: ax.rightName, position: 'right', show: ax.showRight, nameTextStyle: themeAxisStyle(), axisLabel: themeAxisStyle(), splitLine: { show: false }, min: (ax.rightMin !== undefined) ? ax.rightMin : null, max: (ax.rightMax !== undefined) ? ax.rightMax : null }
            ],
        // Zoom in allen Charts (Dietmars Wunsch, 28.07.2026) - Mausrad/
        // Pinch/Ziehen auf der Zeitachse, kein sichtbarer Slider (spart
        // Platz in der Kachel), Doppelklick setzt zurueck (ECharts-Standard
        // bei type:'inside').
        dataZoom: DATA_ZOOM_INSIDE,
        series: series
      }, true);
    }

    function renderHighcharts(el, tab, d) {
      if (chart && chartEngine !== 'highcharts') { destroyChart(); }
      var ax = axisConfig(tab);
      // Strompreis: rechte Achse (ct/kWh), Netzbezug (falls vorhanden) als
      // Balken auf der linken Achse (kWh) - analog zu InverterHubMonitors
      // Strompreis-Reiter (Dietmars Wunsch, 28.07.2026, deren Vorbild).
      var allSeries = (tab === 'price')
        ? [{ name: 'Strompreis', data: priceStepPointsHC(d), color: '#ffb300', axis: 1, dashed: false, step: 'center' }]
          .concat((lastData.hasGrid && d && d.gridDraw && d.gridDraw.length)
            ? [{ name: priceUnitKw ? 'Netzbezug (Ø kW)' : 'Netzbezug', data: gridDrawForDisplay(d.gridDraw), color: '#4aa3e0', axis: 0, bar: true }] : [])
        : buildSeries(tab, d);
      renderLegend(tab, allSeries.map(function (s) { return { name: s.name, color: s.color }; }));
      var visSeries = allSeries.filter(function (s) { return isVisible(s.name); });
      var series = visSeries.map(function (s) {
        if (s.bar) {
          return { name: s.name, type: 'column', data: s.data, yAxis: s.axis, color: s.color, opacity: 0.55, pointPadding: 0.1, groupPadding: 0.05 };
        }
        return { name: s.name, type: 'line', step: (s.step === 'center') ? 'center' : (s.step ? 'right' : undefined), data: s.data, yAxis: s.axis, color: s.color, lineWidth: 0.7, dashStyle: s.dashed ? 'Dash' : 'Solid', marker: { enabled: false } };
      });
      // Achsen-Obergrenze wie beim ECharts-Pendant explizit anheben, falls
      // der Monats-Spitzenwert ueber den Balken des angezeigten Tages
      // liegt - Highcharts' plotLines beeinflussen die Achsen-Extremwerte
      // sonst ebenfalls nicht automatisch.
      var priceLeftAxisMaxHC = null;
      if (tab === 'price' && priceUnitKw && d && d.gridMonthPeak) {
        var gridSeriesHC = series.filter(function (s) { return s.type === 'column' && s.yAxis === 0; })[0];
        if (gridSeriesHC) {
          var barMaxHC = gridSeriesHC.data.reduce(function (m, p) { return Math.max(m, p[1] || 0); }, 0);
          if (d.gridMonthPeak.kw > barMaxHC) { priceLeftAxisMaxHC = Math.ceil(d.gridMonthPeak.kw * 1.08 * 10) / 10; }
        }
      }
      chart = Highcharts.chart(el, {
        // Highcharts formatiert Achsen/Tooltip-Zeiten standardmaessig in
        // UTC statt in der Zeitzone des Browsers (live gefunden: Tooltip
        // zeigte 06:30 fuer einen Messpunkt, der tatsaechlich 08:30 Ortszeit
        // war - exakt die Sommerzeit-Differenz UTC+2 fuer Europe/Berlin).
        // Unsere Zeitstempel sind echte Unix-Millisekunden (UTC-Epoche);
        // useUTC:false laesst Highcharts sie wie ECharts in der lokalen
        // Zeitzone des Browsers anzeigen, statt sie zusaetzlich als UTC zu
        // interpretieren.
        time: { useUTC: false },
        // alignTicks (Highcharts-Standard: true) synchronisiert die
        // Anzahl der Gitterlinien zwischen linker und rechter Achse - dabei
        // wird ein explizites tickInterval auf einer Achse stillschweigend
        // ueberschrieben, damit beide Achsen gleich viele Teilstriche haben.
        // Deshalb hier deaktiviert, sonst wirkt "1-kW-Schritte" nur, wenn es
        // zufaellig zur rechten Achse (W/m^2) passt.
        // zoomType:'x' - Ziehen auf der Zeitachse zoomt, Highcharts zeigt
        // dabei von sich aus einen "Reset zoom"-Knopf (Dietmars Wunsch,
        // 28.07.2026: Zoom in allen Charts, mit erkennbarer Bedienung/
        // Rueckstellung - Pendant zum sichtbaren Slider bei ECharts).
        chart: { backgroundColor: 'transparent', alignTicks: false, zoomType: 'x', style: lastData.font ? { fontFamily: lastData.font } : {} },
        title: { text: null },
        // Zarte Gitterlinien fuer Zeit (x-Achse) und die linke Achse (PV-
        // Leistung/kW) - die rechte Achse (Einstrahlung) bekommt bewusst
        // keine eigenen, sonst ueberlagern sich zwei Gitter mit
        // unterschiedlicher Teilung (Dietmars Wunsch, 28.07.2026, Pendant
        // zur gleichen Regelung bei ECharts).
        // crosshair: gestrichelte Vertikale beim Hovern, wie ECharts das
        // ueber axisPointer standardmaessig zeigt - Highcharts zeigt ohne
        // explizites crosshair gar keine (Dietmars Vergleich, 28.07.2026).
        // tickInterval fest auf 1 Stunde - ohne das waehlt Highcharts bei
        // einem laengeren, nicht auf Sonnenauf-/-untergang eingeschraenkten
        // Zeitfenster (z.B. der volle 24h-Tag im Batterie-Reiter) von sich
        // aus ein groeberes Raster (hier: alle 2 Stunden), um die Beschriftung
        // nicht zu ueberladen - dasselbe Pendant zu ECharts' minInterval/
        // maxInterval oben, nur hier zusaetzlich noetig, weil Highcharts das
        // Raster je nach sichtbarem Zeitfenster unterschiedlich waehlt
        // (Dietmars Fund, 28.07.2026, Batterie-Reiter).
        // Strompreis, aktueller Tag: rote vertikale Linie fuer "jetzt"
        // (Dietmars Wunsch, 28.07.2026) - Pendant zu ECharts' markLine oben.
        xAxis: Object.assign(
          { type: 'datetime' }, xAxisRange(tab, d) || {},
          {
            gridLineWidth: 1, gridLineColor: GRID_COLOR, tickInterval: 3600 * 1000,
            crosshair: { width: 1, color: 'rgba(255,255,255,.4)', dashStyle: 'Dash' },
            labels: { style: themeAxisStyle() },
            plotLines: (tab === 'price' && d && d.id === fmtDate(new Date()))
              ? [{ value: Date.now(), color: '#ff5252', width: 2, zIndex: 5 }]
              : []
          }
        ),
        yAxis: (tab === 'price')
          ? [
              {
                title: { text: priceUnitKw ? 'kW' : 'kWh', style: themeAxisStyle() }, labels: { style: themeAxisStyle() }, gridLineWidth: 1, gridLineColor: GRID_COLOR, max: priceLeftAxisMaxHC,
                // Monats-Spitzenwert der Netzbezugsleistung (Dietmars
                // Wunsch, 07.08.2026) - nur im "Ø kW"-Modus, siehe
                // Begruendung beim ECharts-Pendant oben.
                plotLines: (priceUnitKw && d && d.gridMonthPeak)
                  ? [{ value: d.gridMonthPeak.kw, color: '#ffd54a', width: 1.5, zIndex: 5,
                      label: { text: gridPeakLabel(d.gridMonthPeak), align: 'right', style: { color: '#ffd54a', fontSize: '10px' } } }]
                  : []
              },
              { title: { text: 'ct/kWh', style: themeAxisStyle() }, labels: { style: themeAxisStyle() }, opposite: true, gridLineWidth: 0 }
            ]
          : [
              { title: { text: ax.leftName, style: themeAxisStyle() }, labels: { style: themeAxisStyle() }, tickInterval: ax.leftInterval || undefined, gridLineWidth: 1, gridLineColor: GRID_COLOR },
              { title: { text: ax.rightName, style: themeAxisStyle() }, labels: { style: themeAxisStyle() }, opposite: true, visible: ax.showRight, gridLineWidth: 0, min: (ax.rightMin !== undefined) ? ax.rightMin : null, max: (ax.rightMax !== undefined) ? ax.rightMax : null }
            ],
        legend: { enabled: false },
        credits: { enabled: false },
        // shared:true zeigt alle Kurven an der Zeitposition im selben
        // Tooltip statt nur der gerade unter dem Mauszeiger liegenden
        // (Standard bei Highcharts ist false - Dietmars Beobachtung "nur
        // eine Kurve im Tooltip" war genau dieser Highcharts-Standard).
        // useHTML+2 Nachkommastellen: gleiches Muster wie bei den Energie-
        // Ansichten (Dietmars Wunsch, 28.07.2026).
        tooltip: {
          shared: true,
          useHTML: true,
          formatter: function () {
            // Strompreis-Reiter: Datenpunkt liegt in der Slot-Mitte (siehe
            // priceStepPointsHC()) - Tooltip zeigt den tatsaechlichen Slot-
            // Zeitraum (Start-Ende), nicht die Slot-Mitte, plus den Preis
            // explizit als "ct/kWh" beschriftet (Dietmars Wunsch, 28.07.2026).
            if (tab === 'price') {
              // Preis- und Netzbezugs-Punkt liegen auf unterschiedlichen
              // Zeitrastern (Strompreis oft stuendlich, Netzbezug immer
              // viertelstuendlich) - der Preis fuer die "Kosten"-Zeile wird
              // deshalb NICHT ueber einen gemeinsamen Hover-Treffer bezogen,
              // sondern per priceSlotAt() ueber den Zeitpunkt gesucht (robust
              // unabhaengig von der Preis-Aufloesung).
              // Strompreis wird IMMER ueber priceSlotAt() (Zeitraum-Suche)
              // bezogen, nicht ueber einen zufaelligen gemeinsamen Hover-
              // Treffer der beiden Serien - sonst zeigt der Tooltip alle drei
              // Werte nur dann zusammen, wenn Strompreis- und Netzbezugs-
              // Punkt gerade auf demselben Zeitstempel liegen (bei "heute"
              // meist zufaellig der Fall, bei rekonstruierten vergangenen
              // Tagen mit laengeren/unregelmaessigen Preis-Slots aber nicht -
              // Dietmars Fund, 29.07.2026: "sollte zu jedem Zeitpunkt so
              // sein, nicht nur bei Heute").
              var pts = this.points || [this.point];
              var priceQ = pts.filter(function (p) { return p.slotStart !== undefined; })[0];
              var gridQ = pts.filter(function (p) { return p.slotStart === undefined; })[0];
              var refX = gridQ ? gridQ.x : (priceQ ? priceQ.x : null);
              var slot = (refX !== null) ? priceSlotAt(d, refX) : null;
              var head = slot ? ('<div style="font-weight:600;margin-bottom:2px">' + fmtHM(slot[0]) + '–' + fmtHM(slot[1]) + ' Uhr</div>')
                : (priceQ ? ('<div style="font-weight:600;margin-bottom:2px">' + fmtHM(priceQ.slotStart) + '–' + fmtHM(priceQ.slotEnd) + ' Uhr</div>') : '');
              var lines = [];
              var priceVal = slot ? slot[2] : (priceQ ? priceQ.y : null);
              if (priceVal !== null && priceVal !== undefined) {
                lines.push('<div><span style="color:#ffb300">●</span> Strompreis: <b>' + Number(priceVal).toFixed(2) + ' ct/kWh</b></div>');
              }
              if (gridQ && gridQ.y !== null && gridQ.y !== undefined) {
                var gridLabelHc = priceUnitKw ? 'Ø Leistung' : 'Netzbezug';
                var gridUnitHc = priceUnitKw ? 'kW' : 'kWh';
                lines.push('<div><span style="color:' + gridQ.color + '">●</span> ' + gridLabelHc + ': <b>' + Number(gridQ.y).toFixed(2) + ' ' + gridUnitHc + '</b></div>');
              }
              // Kosten = Netzbezug (kWh) x Strompreis (ct/kWh) = ct fuer
              // diesen Slot (Dietmars Wunsch, 28.07.2026) - IMMER mit der
              // echten kWh gerechnet, auch wenn gridQ.y gerade als kW
              // angezeigt wird (Faktor 4 zurueckgerechnet).
              var gridKwhHc = (gridQ && gridQ.y !== null && gridQ.y !== undefined) ? (priceUnitKw ? gridQ.y / GRID_KWH_TO_KW : gridQ.y) : null;
              if (gridKwhHc !== null && gridKwhHc !== undefined && priceVal !== null && priceVal !== undefined) {
                lines.push('<div>Kosten: <b>' + formatCost(gridKwhHc * priceVal) + '</b></div>');
              }
              return head + lines.join('');
            }
            // Highcharts.dateFormat() ist eine GLOBALE Funktion und
            // ignoriert das chart-eigene "time: { useUTC: false }" - genau
            // dieselbe 2-Stunden-UTC-Abweichung wie zuvor bei der Achse,
            // nur diesmal im Tooltip (live gefunden, Dietmar 28.07.2026).
            // Deshalb hier bewusst natives JS-Datum statt Highcharts-API.
            var dt = new Date(this.x);
            var p2 = function (n) { return ('0' + n).slice(-2); };
            var head = '<div style="font-weight:600;margin-bottom:2px">' + p2(dt.getDate()) + '.' + p2(dt.getMonth() + 1) + '.' + dt.getFullYear() + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes()) + '</div>';
            var lines = (this.points || [this]).map(function (p) {
              return '<div><span style="color:' + p.color + '">●</span> ' + p.series.name + ': <b>' + (p.y === null || p.y === undefined ? '–' : Number(p.y).toFixed(2)) + '</b></div>';
            });
            return head + lines.join('');
          }
        },
        series: series
      });
      chartEngine = 'highcharts';
    }

    function renderBarECharts(el, tab) {

      if (!chart) { el.innerHTML = ''; chart = echarts.init(el, null, { renderer: 'canvas', devicePixelRatio: window.devicePixelRatio || 2 }); chartEngine = 'echarts'; }
      var rows = buildEnergyRows(tab);
      renderLegend(tab, rows.series.map(function (s) { return { name: s.name, color: s.color }; }));
      var visSeries = rows.series.filter(function (s) { return isVisible(s.name); });
      chart.setOption({
        backgroundColor: 'transparent',
        textStyle: lastData.font ? { fontFamily: lastData.font } : {},
        // bottom:60 statt 40 - Platz fuer den Zoom-Slider (Dietmars Wunsch,

        grid: { left: 46, right: 12, top: 28, bottom: 60 },

        tooltip: {

            return head + params.map(function (p) {

    function renderBarHighcharts(el, tab) {
      if (chart && chartEngine !== 'highcharts') { destroyChart(); }
      var rows = buildEnergyRows(tab);
      renderLegend(tab, rows.series.map(function (s) { return { name: s.name, color: s.color }; }));
      var visSeries = rows.series.filter(function (s) { return isVisible(s.name); });
      chart = Highcharts.chart(el, {
        time: { useUTC: false },
        // zoomType:'x' - Ziehen auf der Kategorie-Achse zoomt, mit
        // automatischem "Reset zoom"-Knopf (Dietmars Wunsch, 28.07.2026).
        chart: { backgroundColor: 'transparent', alignTicks: false, zoomType: 'x', style: lastData.font ? { fontFamily: lastData.font } : {} },
        title: { text: null },
        // crosshair auf einer Kategorie-Achse zeichnet bei Highcharts von
        // sich aus ein flaechiges Rechteck ueber die volle Kategorie-
        // Breite (kein Strich wie bei einer Zeit-/Werteachse) - genau das
        // Pendant zu ECharts' axisPointer{type:'shadow'} in der Energie-
        // Ansicht (Dietmars Vergleich, 28.07.2026).
        xAxis: { categories: rows.categories, labels: { rotation: rows.categories.length > 12 ? -45 : 0, style: themeAxisStyle() }, crosshair: { color: 'rgba(255,255,255,.08)' } },
        yAxis: [{ title: { text: 'kWh', style: themeAxisStyle() }, labels: { style: themeAxisStyle() } }],
        legend: { enabled: false },
        credits: { enabled: false },
        // Tooltip-Kopf zeigt die volle Bezeichnung statt nur der kurzen
        // Achsen-Kategorie (Dietmars Wunsch, 28.07.2026). useHTML:true ist
        // hier zwingend - ohne das werden die <span>-Farbpunkte als reiner
        // Text ausgegeben und alle Zeilen laufen in eine Reihe statt
        // (wie bei "Tag (Verlauf)") untereinander zu stehen.
        tooltip: {
          shared: true,
          useHTML: true,
          formatter: function () {
            var idx = this.points ? this.points[0].point.index : this.point.index;

            (this.points || [this]).forEach(function (p) {
              lines.push('<div><span style="color:' + p.color + '">●</span> ' + p.series.name + ': <b>' + (p.y === null || p.y === undefined ? '–' : Number(p.y).toFixed(2)) + ' kWh</b></div>');
