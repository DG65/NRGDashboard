        var naEndMs = naStartMs + 86400000;
        np.innerHTML = '<div id="netzampelChart" class="ampelStrip"></div><div id="ampelKeyRow" style="margin-top:4px"></div>';
        renderAmpelChart('netzampelChart', segs, naStartMs, naEndMs, true);
        renderAmpelKey('ampelKeyRow', segs.filter(function (s) { return s.to > naStartMs && s.from < naEndMs; }));
        return;
      }
      if (curTab === 'balance') {
        document.getElementById('balancePanel').style.display = '';
        if (!lastData.hasEnergyFlow) {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Keine InverterHubEnergy-Instanz gefunden - im Formular „Datenquelle“ wählen oder InverterHubEnergy installieren</div>';
          return;
        }
        if (curView === 'custom' && (!customFrom || !customTo)) {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
          return;
        }
        var balBounds, balGran;
        if (curView === 'day') {
          var balDay = (lastData.days || [])[idx];
          if (!balDay) { destroyChart(); el.innerHTML = '<div class="empty">Kein Tag ausgewählt</div>'; return; }
          balBounds = { start: Math.floor(balDay.dayStart / 1000), end: Math.floor(balDay.dayEnd / 1000) };
          balGran = 'day';
        } else {
          balBounds = flowPeriodBounds();
          balGran = (curView === 'week') ? 'month' : curView; // Woche hat keine eigene Bilanz-Granularitaet - Tagesbalken wie Monat
          if (!balBounds) { destroyChart(); el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>'; return; }
        }
        var balKey = 'balance_' + balGran + '_' + balBounds.start + '_' + balBounds.end;
        if (balanceCache[balKey] !== undefined) {
          renderBalance(el, balanceCache[balKey]);
        } else {
          destroyChart();
          document.getElementById('balancePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Lade Bilanz…</div>';
          if (balancePendingKey !== balKey) {
            balancePendingKey = balKey;
            requestAction('balancePeriod', JSON.stringify({ key: balKey, granularity: balGran, start: balBounds.start, end: balBounds.end }));
          }
        }
        return;
      }
      if (curTab === 'yearcompare') {
        document.getElementById('yearComparePanel').style.display = '';
        if (yearCompareCache) {
          renderYearCompare(el, yearCompareCache);
        } else {
          destroyChart();
          document.getElementById('yearComparePanel').innerHTML = '';
          el.innerHTML = '<div class="empty">Lade Jahresvergleich…</div>';
          if (!yearComparePending) {
            yearComparePending = true;
            requestAction('yearCompare', '{}');
          }
        }
        return;
      }
      if (curTab === 'flow') {
        if (!lastData.hasEnergyFlow) {
          destroyChart();
          el.innerHTML = '<div class="empty">Keine InverterHubEnergy-Instanz gefunden - im Formular „Datenquelle“ wählen oder InverterHubEnergy installieren</div>';
          return;
        }
        var flowObj = null;
        if (curView === 'day') {
          // Tag: die passende Kurve liegt bereits im vorab gelieferten
          // Tage-Fenster (siehe module.php::buildPayload()), kein Nachladen
          // noetig.
          var flowDay = (lastData.days || [])[idx];
          flowObj = flowDay ? flowDay.flow : null;
        } else {
          // Woche/Monat/Jahr/Gesamt/Benutzerdefiniert: das Tage-Fenster
          // deckt nur WINDOW_DAYS Tage ab - ein Sankey fuer z.B. "dieses
          // Jahr" braucht einen frischen Archivdurchlauf mit den echten
          // Periodengrenzen, live ueber requestAction() nachgefordert
          // (Dietmars Wunsch, 28.07.2026: Energiebilanz auch fuer laengere
          // Zeitraeume waehlbar, nicht nur Tag).
          var bounds = flowPeriodBounds();
          if (!bounds) {
            destroyChart();
            el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
            return;
          }
          var key = bounds.start + '_' + bounds.end;
          if (flowCache[key] !== undefined) {
            flowObj = flowCache[key];
          } else {
            destroyChart();
            el.innerHTML = '<div class="empty">Lade Energiebilanz…</div>';
            if (flowPendingKey !== key) {
              flowPendingKey = key;
              requestAction('flowPeriod', JSON.stringify(bounds));
            }
            return;
          }
        }
        if (!flowObj || !flowObj.hasData) {
          destroyChart();
          el.innerHTML = '<div class="empty">Keine Energiedaten für diesen Zeitraum</div>';
          return;
        }
        var legendRowEl = document.getElementById('legendRow'); if (legendRowEl) { legendRowEl.innerHTML = ''; }
        var wantEngineFlow = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
        if (wantEngineFlow === 'highcharts') {
          ensureHighchartsSankey(function () { el.innerHTML = ''; renderSankeyHighcharts(el, flowObj); });
        } else {
          // KEIN el.innerHTML-Reset hier - renderSankeyECharts() leert/
          // erstellt intern nur beim tatsaechlichen Neuanlegen (siehe
          // Kommentar bei renderECharts() weiter oben: externes Leeren VOR
          // jeder Wiederverwendung reisst den Canvas ab, setOption() liefe
          // danach ins Leere).
          ensureECharts(function () { renderSankeyECharts(el, flowObj); setTimeout(sizeChart, 60); });
        }
        return;
      }

      // Energie-Ansichten (Woche/Monat/Jahr/Gesamt/Benutzerdefiniert) -
      // Balken statt Verlaufslinie, aus den vorab gelieferten Tages-kWh-
      // Karten gruppiert (siehe buildEnergyRows()), kein erneuter
      // Archivzugriff je Ansichtswechsel.
      if (curView !== 'day') {
        if (curView === 'custom' && (!customFrom || !customTo)) {
          destroyChart();
          el.innerHTML = '<div class="empty">Bitte Von-/Bis-Datum wählen</div>';
          return;
        }
        var wantEngineBar = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
        if (wantEngineBar === 'highcharts') {
          ensureHighcharts(function () { el.innerHTML = ''; renderBarHighcharts(el, curTab); });
        } else {
          ensureECharts(function () { renderBarECharts(el, curTab); setTimeout(sizeChart, 60); });
        }
        return;
      }

      var days = (lastData && lastData.days) || [];
      var d = days[idx];
      if (!d || !d.hasData) {
        destroyChart();
        el.innerHTML = '<div class="empty">Keine Archivdaten für diesen Tag</div>';
        return;
      }
      var wantEngine = (lastData.engine === 'highcharts') ? 'highcharts' : 'echarts';
      if (wantEngine === 'highcharts') {
        ensureHighcharts(function () { el.innerHTML = ''; renderHighcharts(el, curTab, d); });
      } else {
        ensureECharts(function () { renderECharts(el, curTab, d); setTimeout(sizeChart, 60); });
      }
    }

    function handleMessage(raw) {
      var d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!d || !d.ok) { return; }
      // Antwort auf requestAction('flowPeriod', ...) - siehe module.php::
      // RequestAction() - NICHT die volle Nutzlast, nur das nachgeforderte
      // Energiebilanz-Ergebnis fuer einen Zeitraum. In flowCache ablegen und
      // bei Bedarf neu rendern, statt lastData zu ueberschreiben.
      if (d.type === 'flowUpdate') {
        flowCache[d.start + '_' + d.end] = d.flow;
        flowPendingKey = null;
        if (curTab === 'flow') { render(); }
        return;
      }
      // Antwort auf requestAction('balancePeriod', ...) - neuer "Bilanz"-
      // Reiter (30.07.2026), gleiches Nachforder-/Cache-Muster wie flowUpdate.
      if (d.type === 'balanceUpdate') {
        balanceCache[d.key] = d.balance;
        balancePendingKey = null;
        if (curTab === 'balance') { render(); }
        return;
      }
      // Antwort auf requestAction('yearCompare'/'yearCompareConfig', ...) -
      // neuer "Jahresvergleich"-Reiter (31.07.2026), gleiches Nachforder-
      // Muster, aber nur EIN Cache-Slot (kein Zeitraum-Parameter).
      if (d.type === 'yearCompareUpdate') {
        yearCompareCache = d.data;
        yearComparePending = false;
        if (curTab === 'yearcompare') { render(); }
        return;
      }
      // Antwort auf requestAction('dayPlanLoad', ...) - Tagesplan-Reiter
      // (21.08.2026), gleiches Nachforder-Muster wie yearCompareUpdate.
      if (d.type === 'dayPlanUpdate') {
        dayPlanCache = d.dayPlan;
        dayPlanPending = false;
        if (curTab === 'tagesplan') { render(); }
        return;
      }
      // Antwort auf requestAction('stromgedachtLoad', ...) - Netzampel
      // (21.08.2026), genutzt sowohl vom Tagesplan-Reiter (Zusatzleiste)
      // als auch vom eigenen Netzampel-Reiter.
      if (d.type === 'stromgedachtUpdate') {
        stromgedachtCache = d.stromgedacht;
        stromgedachtPending = false;
        if (curTab === 'tagesplan' || curTab === 'netzampel') { render(); }
        return;
      }
      lastData = d;
      visKey = 'nrgdashmon_vis_' + (d.uid || 'x');
      loadVis();
      if (d.bg) { document.body.style.background = d.bg; }
      // Erster Aufruf kommt aus einem <script>-Block direkt beim Laden der
      // Kachel, bevor das Layout sicher fertig ist (WebFront-Rahmen/Flex-
      // Boxen noch nicht final vermessen) - echarts.init() auf einem noch
      // 0x0 grossen Container liefert eine leere Zeichenflaeche, die ein
      // spaeteres resize() nicht zuverlaessig repariert. Deshalb den ersten
      // Render-Aufruf einen Frame verzoegern.
      requestAnimationFrame(function () { render(); });
    }

    document.getElementById('prev').onclick = function () {
      if (curTab === 'tagesplan' || curTab === 'netzampel') {
        if (tagesplanDay > 0) { tagesplanDay--; render(); }
      } else if (curView === 'day') {
        var days = (lastData && lastData.days) || [];
        if (idx < days.length - 1) { idx++; render(); }
      } else if (curView === 'week' || curView === 'month' || curView === 'year') {
        shiftViewRef(-1); render();
      }
    };
    document.getElementById('next').onclick = function () {
      if (curTab === 'tagesplan' || curTab === 'netzampel') {
        if (tagesplanDay < 1) { tagesplanDay++; render(); }
      } else if (curView === 'day') {
        if (idx > 0) { idx--; render(); }
      } else if (curView === 'week' || curView === 'month' || curView === 'year') {
        shiftViewRef(1); render();
      }
    };
    document.getElementById('pick').onchange = function (e) {
      if (curView === 'day') {
        var days = (lastData && lastData.days) || [];
        var i = days.findIndex(function (d) { return d.id === e.target.value; });
        if (i >= 0) { idx = i; render(); }
      } else if (curView === 'custom') {
        customFrom = e.target.value; render();
      } else if (e.target.value) {
        viewRef = new Date(e.target.value + 'T00:00:00'); render();
      }
    };
    document.getElementById('pickTo').onchange = function (e) {
      customTo = e.target.value; render();
    };
    document.getElementById('type').onchange = function (e) {
      curView = e.target.value;
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('#priceUnitRow button'), function (btn) {
      btn.onclick = function () {
        priceUnitKw = (btn.getAttribute('data-unit') === 'kw');
        render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (btn) {
      btn.onclick = function () {
        if (btn.disabled) { return; }
        var leavingBalance = (curTab === 'balance' && btn.getAttribute('data-tab') !== 'balance');
        curTab = btn.getAttribute('data-tab');
        if (leavingBalance) {
          unlockChartHeight();
          // Bilanz haengt eigene Mousemove-Tooltip-Schilder an dieselbe
          // Chart-Instanz (balanceWireHover) - die bleibt beim Wechsel zu
          // "Jahresvergleich" (selbe Engine) bestehen und wuerde sonst
          // weiter stale Bilanz-Tooltips ueber dem neuen Chart zeigen.
          // __balMode=null laesst balanceHoverAt() bei der naechsten Maus-
          // bewegung die Schilder ausblenden - bis dahin (und weil ECharts'
          // Canvas-Instanz beim Reiterwechsel wiederverwendet, nicht neu
          // aufgebaut wird) sofort verstecken, statt auf die naechste
          // Mausbewegung zu warten.
          if (chart) { chart.__balMode = null; }
          Array.prototype.forEach.call(document.querySelectorAll('#chart .balTip'), function (t) { t.style.display = 'none'; });
        }
        Array.prototype.forEach.call(document.querySelectorAll('button.tab'), function (b) { b.classList.toggle('active', b === btn); });
        // Batterie UND Strompreis haben keine Energie-Ansichten (Woche/
        // Monat/Jahr/Gesamt/Benutzerdefiniert) - die Auswahl ist dort ohne
        // Wirkung, deshalb gesperrt und fest auf "Tag" gesetzt (Dietmars
        // Wunsch, 28.07.2026). Energiebilanz (Sankey) dagegen kann seit
        // 28.07.2026 auch fuer diese Zeitraeume dargestellt werden (per
        // requestAction() nachgeforderte Grenzen, siehe flowPeriodBounds()),
        // deshalb hier NICHT gesperrt.
        var dayOnly = (curTab === 'battery' || curTab === 'price');
        var typeSel = document.getElementById('type');
        typeSel.disabled = dayOnly;
        typeSel.style.display = (curTab === 'tagesplan' || curTab === 'netzampel') ? 'none' : '';
        if (dayOnly && curView !== 'day') {
          curView = 'day';
          typeSel.value = 'day';
        }
        // Jahresvergleich zeigt immer "seit Inbetriebnahme" - keine Tag/
        // Woche/Monat/Jahr-Navigation noetig, #bar bleibt komplett
        // ausgeblendet (Dietmar, 31.07.2026). Tagesplan UND Netzampel teilen
        // sich dieselbe einfache Heute/Morgen-Navigation (siehe syncNav()
        // curTab==='tagesplan'||'netzampel'-Zweig; Dietmar 21.08.2026 fuer
        // Tagesplan "jeden der beiden Tage einzeln sehen", 22.08.2026 fuer
        // Netzampel "wie beim Strompreis mit heute und morgen" statt beider
        // Tage in einer Ansicht) - #bar bleibt dafuer sichtbar, nur die
        // Ansichts-Auswahl (Tag/Woche/...) ist ausgeblendet, da hier
        // wirkungslos.
        document.getElementById('bar').style.display = (curTab === 'yearcompare') ? 'none' : '';
        if (lastData.hasStromGedacht && (curTab === 'netzampel' || curTab === 'tagesplan')) { ensureStromGedacht(); }
        render();
      };
    });
    function sizeAmpelChart(containerId) {
      var el = document.getElementById(containerId);
      var inst = el && el._ampelChart;
      if (!inst) { return; }
      if (inst.reflow) { inst.reflow(); } else { inst.resize(); }
    }
    window.addEventListener('resize', function () {
      if (chart) { setTimeout(sizeChart, 60); }
      setTimeout(function () { sizeAmpelChart('ampelStrip'); sizeAmpelChart('netzampelChart'); }, 60);
    });
  </script>
</body>
</html>
