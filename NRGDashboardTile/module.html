function renderTour() {
  const dots = document.getElementById('tourDots');
  dots.innerHTML = '';
  TOUR_STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'tour-dot' + (i === TOUR_STEP ? ' active' : '');
    dots.appendChild(d);
  });
  const step = TOUR_STEPS[TOUR_STEP];
  document.getElementById('tourTitle').textContent = step.title;
  document.getElementById('tourText').textContent = step.text;
  const prevBtn = document.getElementById('tourPrev');
  const nextBtn = document.getElementById('tourNext');
  prevBtn.disabled = TOUR_STEP === 0;
  const isLast = TOUR_STEP === TOUR_STEPS.length - 1;
  nextBtn.style.display = isLast ? 'none' : '';
}

function showTourOverlay() {
  if (TOUR_SHOWN_LOCAL) { return; }
  TOUR_SHOWN_LOCAL = true;
  TOUR_STEP = 0;
  renderTour();
  document.getElementById('tourOverlay').classList.add('show');
}

// Bewusst KEIN X/Escape zum Wegklicken (Dietmar: "nur per Haken
// ausgeblendet werden kann") - dismissTour() ist der EINZIGE Weg, die
// Tour zu schliessen, und meldet das gleichzeitig per WebHook an die
// Instanz zurueck (die Kachel selbst hat als sandboxed HTML-SDK-Tile
// keinen anderen Rueckkanal, siehe module.php Create()).
function dismissTour() {
  document.getElementById('tourOverlay').classList.remove('show');
  if (HOOK_PATH) {
    fetch(HOOK_PATH + '?dismissTour=1').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tourPrev').addEventListener('click', () => {
    if (TOUR_STEP > 0) { TOUR_STEP--; renderTour(); }
  });
  document.getElementById('tourNext').addEventListener('click', () => {
    if (TOUR_STEP < TOUR_STEPS.length - 1) { TOUR_STEP++; renderTour(); }
  });
  document.getElementById('tourDone').addEventListener('click', dismissTour);
});

function toggleDiagPanel() {
  document.getElementById('diagPanel').classList.toggle('open');
}

function renderDiagnostics(entries) {
  const badge = document.getElementById('diagBadge');
  const panel = document.getElementById('diagPanel');
  if (!Array.isArray(entries) || entries.length === 0) {
    badge.classList.remove('show');
    panel.classList.remove('open');
    panel.innerHTML = '';
    return;
  }
  let worst = 'normal';
  entries.forEach(function (e) {
    if (e.level && DIAG_LEVEL_RANK[e.level] > DIAG_LEVEL_RANK[worst]) { worst = e.level; }
  });
  badge.classList.add('show');
  badge.classList.toggle('level-auffaellig', worst === 'auffaellig');
  badge.classList.toggle('level-kritisch', worst === 'kritisch');
  document.getElementById('diagBadgeText').textContent = entries.length;

  panel.innerHTML = entries.map(function (e) {
    const color = e.level ? ({ normal: '#3a3', 'auffaellig': '#c9a227', 'kritisch': '#c33' }[e.level] || '#999') : '#999';
    const levelText = e.level ? (DIAG_LEVEL_LABEL[e.level] || e.level) : 'keine Bewertung';
    return '<div class="diag-row">' +
      '<div class="diag-label"><span style="width:8px;height:8px;border-radius:50%;background:' + color + ';flex:none;"></span>' +
      (e.label || e.type) + '</div>' +
      '<div class="diag-value">' + diagValueText(e) + ' — ' + levelText + '</div>' +
      (e.reason ? '<div class="diag-reason">' + e.reason + '</div>' : '') +
      '</div>';
  }).join('');
}

function handleMessage(raw) {
  const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
  renderStatus(d ? d.renderedAt : 0);
  renderDiagnostics(d ? d.diagnostics : []);

  // Darstellungs-Einstellungen (1:1 InverterHubTile-Muster, module.html:1224-1229)
  if (d) {
    if (d.font) document.documentElement.style.setProperty('--font', d.font);
    if (d.bg)   document.body.style.background = d.bg;
    if (d.transMs !== undefined && d.transMs !== null) {
      document.documentElement.style.setProperty('--trans', (+d.transMs || 0) + 'ms');
    }
    if (d.flowRefW) { FLOW_REF_W = Math.max(500, +d.flowRefW); }
    if (d.hookPath) { HOOK_PATH = d.hookPath; }
    if (d.showTour) { showTourOverlay(); }

    // Netzampel-Farbwaesche (28.08.2026, Dietmar: "alles direkt umsetzen") -
    // sehr dezenter radialer Verlauf von der Ampelfarbe ins Transparente,
    // nur sichtbar wenn eine StromGedacht-Instanz Daten liefert.
    const wash = document.getElementById('ampelWash');
    if (d.gridAmpel && d.gridAmpel.color) {
      wash.style.background = 'radial-gradient(circle at 50% 40%, ' + d.gridAmpel.color + '22 0%, transparent 65%)';
      wash.classList.add('show');
      wash.title = 'Netzampel: ' + (d.gridAmpel.label || '');
    } else {
      wash.classList.remove('show');
    }
  }

  const empty = document.getElementById('nrgdash-empty');
  const devices = (d && Array.isArray(d.devices)) ? d.devices : [];
  if (devices.length === 0) {
    empty.style.display = 'flex';
    document.getElementById('svg').style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  document.getElementById('svg').style.display = '';

  // Zentrum: bevorzugt eine echte Energiebilanz wie bei InverterHubTile
  // (houseBalanceW = pvW - gridW + batW; gridW ist +Einspeisung/-Bezug,
  // von InverterHub bestätigt, 27.07.2026) - NICHT mehr die grobe Summe nur
  // der bekannten Einzelverbraucher (Wallboxen/Wärmepumpe), die die
  // unsichtbare Grundlast (Kühlschrank, Standby-Geräte etc.) komplett
  // ausließ und dadurch strukturell zu niedrig lag. Fällt nur zurück auf die
  // Verbraucher-Summe, wenn keine InverterHub-Instanz (also kein pv/grid)
  // vorhanden ist - reines MeterHub/ChargerHub-Setup ohne Wechselrichter.
  const houseDevice = devices.find(x => x.function === 'house');
  const pvDevice = devices.find(x => x.function === 'pv');
  const gridDevice = devices.find(x => x.function === 'grid');
  const batDevice = devices.find(x => x.function === 'battery');
  let houseW;
  if (houseDevice) {
    houseW = houseDevice.value ?? 0;
  } else if (pvDevice && gridDevice) {
    houseW = (pvDevice.value ?? 0) - (gridDevice.value ?? 0) + (batDevice ? (batDevice.value ?? 0) : 0);
  } else {
    houseW = devices.filter(x => x.category === 'verbraucher').reduce((s, x) => s + (x.value || 0), 0);
  }
  // Farbe wie bei InverterHubTile: Anteil des Netzbezugs am Verbrauch
  // bestimmt Grün (vollständig lokal gedeckt) bis Rot (vollständig aus dem
  // Netz) - value < 0 = Bezug (dieselbe Vorzeichenkonvention wie oben).
  const gridImportW = (gridDevice && (gridDevice.value ?? 0) < 0) ? Math.abs(gridDevice.value) : 0;
  const gridShare = houseW > 0 ? Math.min(1, gridImportW / houseW) : 0;
  const centerColor = lerp(C_GREEN, C_RED, gridShare);
  const centerActive = Math.abs(houseW) > 20;
  const centerG = document.getElementById('node-center');
  applyNodeState(centerG, centerG.querySelector('.node-glow'),
    centerActive ? centerColor : C_GREY, houseW, centerActive, CX, CY, 1);
  setValueText(document.getElementById('lbl-center-val'), houseW, true);
  // Haus-Knoten nur klickbar, wenn es ein ECHTES 'house'-Geraet gibt (also
  // einen Backend-Datensatz mit detailKey) - die reine Naeherung
  // (pv-grid+bat) ist kein Geraet und hat keine eigenen Vertragsfelder zum
  // Anzeigen.
  if (houseDevice && houseDevice.detailKey && !centerG.dataset.clickBound) {
    centerG.dataset.clickBound = '1';
    centerG.style.cursor = 'pointer';
    const tip = el('title', {});
    tip.textContent = 'Details von „Haus“ öffnen';
    centerG.appendChild(tip);
    centerG.addEventListener('click', () => openDeviceDetail(centerG.dataset.detailKey, centerG));
  }
  if (houseDevice && houseDevice.detailKey) {
    centerG.dataset.detailKey = houseDevice.detailKey;
    centerG.style.cursor = 'pointer';
  } else {
    centerG.style.cursor = '';
    delete centerG.dataset.detailKey;
  }

  HIDE_INACTIVE = !!(d && d.hideInactive);
  // "Hinter dem Doppelpfeil" (28.08.2026) - echte Instanz-Variablen, kommen
  // serverseitig im Payload statt aus localStorage, siehe module.php.
  COUPLE_BOLT = !(d && d.coupleBolt === false);
  COUPLE_GLOW = !(d && d.coupleGlow === false);
  EFFECT_INTENSITY = (d && d.effectIntensity != null) ? (d.effectIntensity / 100) : 1;
  const items = buildItems(devices);
  // Chip-Breite des Hausknotens haengt von der Verbraucherzahl ab (siehe
  // CHIP_THRESHOLD/computeLayout()) - VOR ensureNodes() setzen, damit
  // Chip und Speichen im selben Frame konsistent zueinander stehen.
  const chipLayout = computeLayout(items.length);
  layoutCenterChip(chipLayout.hw, chipLayout.hh);

  // Autarkiegrad-Ringsegment - Bogenlaenge = tatsaechlicher Umfang der
  // Pille (identische Formel wie pillPointPair()s perim2, siehe dort),
  // damit die Strichlaenge zur sichtbaren Randform passt (Kreis ODER Chip).
  const autRing = document.querySelector('#node-center .node-autarky-ring');
  if (autRing) {
    const rhw = chipLayout.hw + 7, rhh = chipLayout.hh + 7;
    const perim = 4 * (rhw - rhh) + 2 * Math.PI * rhh;
    autRing.setAttribute('stroke-dasharray', perim.toFixed(1));
    if (houseDevice && houseDevice.autarkyRatio != null) {
      const frac = Math.max(0, Math.min(1, houseDevice.autarkyRatio));
      autRing.setAttribute('stroke-dashoffset', (perim * (1 - frac)).toFixed(1));
      autRing.style.display = '';
    } else {
      autRing.style.display = 'none';
    }
  }
  if (items.length === 0) {
    document.getElementById('nodes-layer').textContent = '';
    document.getElementById('wires-layer').textContent = '';
    builtSig = null;
    return;
  }
  ensureNodes(items);
  items.forEach(item => updateOuterNode(nodeRefs[item.key], item));
}
