<!--NRGDASH_TEXTS-->
<script>
'use strict';
let powerChart = null, energyChart = null, lastPayload = null;
// Texte: PHP liefert die Uebersetzungen (window.NRGDASH_TEXTS), die englischen Quelltexte sind die Schluessel.
function tr(s) { return (window.NRGDASH_TEXTS && window.NRGDASH_TEXTS[s]) || s; }
// sprintf light: ersetzt %s und %d der Reihe nach
function fmt(s) {
  var a = Array.prototype.slice.call(arguments, 1), i = 0;
  return s.replace(/%[sd]/g, function () { return a[i++]; });
}
// Zahlenformat nach Sprache: Muster '1,234.5' (Englisch) bzw. '1.234,5' (Deutsch) steht in der Uebersetzung
const NUMFMT = /1(\D*)234(\D*)5/.exec(tr('Number format 1,234.5')) || [0, ',', '.'];
function decStr(str) { return String(str).replace('.', NUMFMT[2]); }
const NUM_LOCALE = tr('en-US');
// Datum nach Sprache: Muster 'MM/DD' (Englisch) bzw. 'DD.MM.' (Deutsch), ohne Fuehrungsnull 'M/D' bzw. 'D.M.'
function dateTxt(d, pat, pad) {
  const p = n => (pad ? ('0' + n).slice(-2) : String(n));
  return pat.replace('DD', p(d.getDate())).replace('MM', p(d.getMonth() + 1)).replace('D', p(d.getDate())).replace('M', p(d.getMonth() + 1));
}
// Statische Texte der Seite uebersetzen
(function () {
  function txt(id, s) { const e = document.getElementById(id); if (e) { e.textContent = s; } }
  function htm(id, s) { const e = document.getElementById(id); if (e) { e.innerHTML = s; } }
  document.title = tr('Device details');
  txt('closeTxt', tr('Close'));
  txt('ctlEnableTxt', tr('Charging enable'));
  txt('ctlLimitLbl', tr('Current limit'));
  txt('ctlStart', tr('▶ Start charging'));
  txt('ctlStop', tr('■ Stop charging'));
  txt('ctlOverride', tr('⚡ Fully charge today (override)'));
  txt('switchLabel', tr('Switch'));
  txt('curSessTitle', tr('Charging session'));
  htm('wbInfoH', tr('Control &amp; plan'));
  txt('sessH', tr('Charging sessions (last 7 days)'));
  txt('subMeterH', tr('Cascaded meters'));
  txt('valH', tr('Current values'));
  txt('powerH', tr('Power'));
  txt('todayBtn', tr('Today'));
  txt('energyH', tr('Energy per day'));
  txt('energyNote', tr('Approximation: integrated from the daily average of the power (no energy counter in the device\'s contract).'));
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtW(w) {
  if (w === null || w === undefined) return '';
  const a = Math.abs(w);
  return a >= 10000 ? (w / 1000).toFixed(1) + ' kW' : Math.round(w).toLocaleString(NUM_LOCALE) + ' W';
}

// L1-L3-Gruppierung rein anhand des Variablennamens (Anbieter benennt) -
// "Spannung L1"/"Strom L2 "/"cos φ L3" usw. landen in einer Phasentabelle,
// alles andere in der einfachen Werteliste.
// Erkennt WIEDERHOLTE Werte-Gruppen rein am Variablennamen (Anbieter
// benennt) und baut daraus Tabellen mit einer Spalte je Index - ohne
// jeden Geraetetyp/Hersteller zu kennen (CLAUDE.md Kernprinzip 2). Deckt
// zwei Namensmuster ab: Index NACH der Messgroesse ("Spannung L1", die
// urspruengliche Drehstrom-Phasentabelle) und Index VOR der Messgroesse
// ("MPPT1 Leistung", "Bat.1 Temperatur" - Batterie-Bloecke/MPPT-Straenge).
// Mehrere Gruppentypen auf demselben Geraet sind moeglich (je eigene
// Tabelle); Gruppen mit nur einem Treffer wandern zurueck in die
// einfache Werteliste, damit ein Einzelwert nicht als "Tabelle mit einer
// Spalte" erscheint.
const GROUP_PATTERNS = [
  { key: 'phase', heading: tr('Phases'), re: /^(.*?)[\s\-_]*L([123])\s*$/i, col: m => 'L' + m[2], base: m => m[1].trim() },
  { key: 'mppt', heading: tr('MPPT strings'), re: /^MPPT\s*[-.]?\s*(\d+)[\s.:_-]*(.+)$/i, col: m => fmt(tr('String %s'), m[1]), base: m => m[2].trim() },
  { key: 'block', heading: tr('Battery blocks'), re: /^(?:Bat\.?|Batterie|Turm)\s*[-.]?\s*(\d+)[\s.:_-]*(.+)$/i, col: m => fmt(tr('Block %s'), m[1]), base: m => m[2].trim() },
];

function splitGroups(rows) {
  const byType = new Map(); // key -> { heading, groups: Map(base -> {col: row}) }
  const rest = [];
  rows.forEach(r => {
    const name = r.name || '';
    let matched = false;
    for (const p of GROUP_PATTERNS) {
      const m = p.re.exec(name);
      if (m) {
        const base = p.base(m) || r.field;
        if (!byType.has(p.key)) byType.set(p.key, { heading: p.heading, groups: new Map() });
        const g = byType.get(p.key).groups;
        if (!g.has(base)) g.set(base, {});
        g.get(base)[p.col(m)] = r;
        matched = true;
        break;
      }
    }
    if (!matched) rest.push(r);
  });
  const tables = [];
  byType.forEach(({ heading, groups }) => {
    const rowsOut = [];
    groups.forEach((g, base) => {
      if (Object.keys(g).length >= 2) rowsOut.push({ base, g }); else Object.values(g).forEach(r => rest.push(r));
    });
    if (rowsOut.length) {
      const cols = [...new Set(rowsOut.flatMap(({ g }) => Object.keys(g)))].sort();
      tables.push({ heading, cols, rows: rowsOut });
    }
  });
  return { tables, rest };
}

function staleCls(ts, renderedAt) {
  // Aelter als 1 h -> gedimmt (reines Sekundendelta, kein Kalenderbezug).
  return (renderedAt - ts) > 3600 ? ' class="v stale"' : ' class="v"';
}

function renderValues(p) {
  const { tables, rest } = splitGroups(p.values || []);
  document.getElementById('groupWrap').innerHTML = tables.map(t => {
    let h = '<h2>' + esc(t.heading) + '</h2><table><tr><th></th>' + t.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
    t.rows.forEach(({ base, g }) => {
      h += '<tr><th>' + esc(base) + '</th>';
      t.cols.forEach(c => {
        h += g[c] ? '<td' + staleCls(g[c].ts, p.renderedAt) + '>' + esc(g[c].value) + '</td>' : '<td></td>';
      });
      h += '</tr>';
    });
    return '<div>' + h + '</table></div>';
  }).join('');

  const vw = document.getElementById('valWrap');
  if (rest.length) {
    let h = '<table>';
    rest.forEach(r => {
      h += '<tr><th>' + esc(r.name) + '</th><td' + staleCls(r.ts, p.renderedAt) + '>' + esc(r.value) + '</td></tr>';
    });
    document.getElementById('valT').innerHTML = h + '</table>';
    vw.style.display = '';
  } else vw.style.display = 'none';
}

const AXIS = { axisLabel: { color: '#9aa0a6' }, axisLine: { lineStyle: { color: '#4a5058' } } };
function renderPower(p) {
  const wrap = document.getElementById('powerWrap');
  const note = document.getElementById('powerNote');
  document.getElementById('dayLabel').textContent = p.dayLabel || '';
  document.getElementById('nextDay').disabled = !!p.isToday;
  if (!p.power || !p.power.length) {
    wrap.style.display = (p.day ? '' : 'none');
    // Archivierung (Store-Review 30.10.2026): die Visualisierung schaltet das Logging fremder Variablen nie selbst ein, das macht der
    // Benutzer ausdruecklich ueber den Knopf im Formular der Kachel.
    note.textContent = p.archivingActive
      ? tr('There is no archive data for this day yet.')
      : tr('There is no archive data for the power of this device, the variable is not archived. In the tile\'s configuration you can switch archiving on with “Enable archiving of device power values”.');
    note.style.display = '';
    if (powerChart) powerChart.clear();
    return;
  }
  note.style.display = 'none';
  wrap.style.display = '';
  if (!powerChart) powerChart = echarts.init(document.getElementById('powerChart'));
  powerChart.setOption({
    animation: false,
    grid: { left: 58, right: 20, top: 20, bottom: 40 },
    tooltip: { trigger: 'axis', valueFormatter: v => fmtW(v) },
    xAxis: Object.assign({ type: 'time' }, AXIS),

      '<td>' + eur(x.costEur === null ? null : x.costEur + (x.batteryCostEur || 0)) + (x.priceGap ? ' <span title="' + esc(tr('No price was available for part of the session')) + '">*</span>' : '') + '</td>' +
      '<td>' + (x.avgCt === null ? '–' : decStr(x.avgCt.toFixed(1)) + ' ct/kWh') + '</td>' +

        ? ' <span title="' + esc(tr('of which from the battery')) + '">(🔋 ' + kwh(x.batteryKwh) + (x.batteryCostEur !== null ? ', ' + eur(x.batteryCostEur) : '') + ')</span>'
        : '') + '</td>' +

    (batPriced ? ' ' + tr('plus battery share × cost basis of the stored power (from the EMS)') : '') +
    tr('. Grid and battery share are distributed proportionally across all consumers of the house, solar power counts as 0 €.'));
  if (lost) notes.push(tr('“Lost feed-in tariff”: what the directly used solar power would have earned if fed in.'));
  if (batPriced && s.batterySettled === false) notes.push(tr('The battery\'s cost basis has not settled yet (the initial stock counts as solar power until the battery has been fully cycled once) – until then the battery share tends to be valued too cheaply.'));

  if (s.list.some(x => x.gridMissing)) notes.push(tr('Grid data was missing for part of a session – as a precaution this share is counted entirely as grid import.'));

function emsWbSend(powerId, field, value, confirmText) {
  const lockKey = powerId + ':' + field;
  if (EMS_LOCK[lockKey] && Date.now() < EMS_LOCK[lockKey]) return;
  if (confirmText && !window.confirm(confirmText)) { loadDay(''); return; }
  EMS_LOCK[lockKey] = Date.now() + 6000;
  const st = document.querySelector('.wbCtlStatus[data-wb="' + powerId + '"]');
  if (st) st.textContent = tr('Sending …');
  const u = new URL(window.location.href);
  u.search = '';
  u.searchParams.set(field === 'managedBy' ? 'wbManagedBy' : 'emsWbAction', field === 'managedBy' ? 'set' : field);
  u.searchParams.set('key', lastPayload.key);
  u.searchParams.set('powerId', String(powerId));
  u.searchParams.set('value', String(value));
  fetch(u.toString()).then(r => r.json()).then(res => {
    const mb = (field === 'managedBy');
    if (st) st.textContent = (res && res.ok)
      ? (mb ? tr('Switched. The display of controller and plan updates at the next read cycle of the wallbox, this may take a moment.') : tr('Sent. The EMS recalculates, the plan appears in a few seconds.'))
      : ((res && res.error) || tr('Failed.'));
    if (res && res.ok) { setTimeout(() => loadDay(''), mb ? 8000 : 2500); } else EMS_LOCK[lockKey] = 0;
  }).catch(() => { if (st) st.textContent = tr('No connection.'); EMS_LOCK[lockKey] = 0; });
}
function wbInput(pid, f) { return document.querySelector('input[data-wb="' + pid + '"][data-f="' + f + '"]'); }
function wbMarkDirty(pid, f) {
  const inp = wbInput(pid, f + '-in'), btn = document.querySelector('button[data-wb="' + pid + '"][data-f="' + f + '"]');
  if (inp && btn) btn.disabled = (String(inp.value) === String(inp.dataset.orig));
}
function wkInputs(pid) { return Array.from(document.querySelectorAll('input[data-wk="' + pid + '"]')); }
function wkMarkDirty(pid) {
  const dirty = wkInputs(pid).some(i => String(i.value) !== String(i.dataset.orig));
  const b = document.querySelector('button[data-wb="' + pid + '"][data-f="wk-save"]');
  if (b) b.disabled = !dirty;
}
function wkSave(pid) {
  const lockKey = pid + ':week';
  if (EMS_LOCK[lockKey] && Date.now() < EMS_LOCK[lockKey]) return;
  const days = [];
  for (let i = 0; i < 7; i++) {
    const t = document.querySelector('input[data-wk="' + pid + '"][data-i="' + i + '"][data-f="wk-time"]');
    const k = document.querySelector('input[data-wk="' + pid + '"][data-i="' + i + '"][data-f="wk-kwh"]');
    days.push({ day: i + 1, time: t ? t.value : '', kwh: k ? Number(k.value) || 0 : 0 });
  }
  const tbl = document.querySelector('table.wkTbl[data-wb="' + pid + '"]');
  const errEl = document.querySelector('.wkErr[data-wkerr="' + pid + '"]'), st = document.querySelector('.wbCtlStatus[data-wb="' + pid + '"]');
  if (!window.confirm(tr('Save weekly deadline? It applies from the next plug-in on, the EMS reloads for it.'))) return;
  EMS_LOCK[lockKey] = Date.now() + 6000;
  if (errEl) errEl.textContent = '';
  wkInputs(pid).forEach(i => i.classList.remove('bad'));
  if (st) st.textContent = tr('Sending …');
  const u = new URL(window.location.href); u.search = '';
  u.searchParams.set('emsWeekSave', '1'); u.searchParams.set('key', lastPayload.key); u.searchParams.set('powerId', String(pid));
  u.searchParams.set('days', JSON.stringify(days)); if (tbl && tbl.dataset.rev) u.searchParams.set('revision', tbl.dataset.rev);
  fetch(u.toString()).then(r => r.json()).then(res => {
    if (res && res.ok) {
      if (st) st.textContent = tr('Weekly deadline saved. The EMS reloads, the plan updates in a few seconds.');
      setTimeout(() => loadDay(''), 2500);
    } else {
      EMS_LOCK[lockKey] = 0;
      const errs = (res && res.errors) || [];
      errs.forEach(e => { const m = /^days\[(\d+)\]\.(time|kwh)/.exec(String(e.field || '')); if (m) { const inp = document.querySelector('input[data-wk="' + pid + '"][data-i="' + m[1] + '"][data-f="wk-' + m[2] + '"]'); if (inp) inp.classList.add('bad'); } });
      const rev = errs.some(e => String(e.field) === 'revision');
      if (errEl) errEl.textContent = rev ? tr('The weekly deadline has been changed in the meantime – please reload and enter it again.') : (errs.length ? errs.map(e => e.message).join(' ') : ((res && res.error) || tr('Not saved.')));
      if (st) st.textContent = '';
      if (rev) setTimeout(() => loadDay(''), 800);
    }
  }).catch(() => { EMS_LOCK[lockKey] = 0; if (st) st.textContent = tr('No connection.'); });
}
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t && t.dataset && t.dataset.wk) wkMarkDirty(Number(t.dataset.wk));
});
document.addEventListener('input', ev => {
  const t = ev.target;

});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t && t.matches && t.matches('select[data-f="managedBy"]')) {
    const txt = t.options[t.selectedIndex].text;
    emsWbSend(Number(t.dataset.wb), 'managedBy', t.value, fmt(tr('Switch control authority to “%s”? This decides who controls this wallbox (the EMS only charges if it has the authority).'), txt));
  }
});
document.addEventListener('click', ev => {
  const b = ev.target && ev.target.closest ? ev.target.closest('button[data-wb]') : null;
  if (!b) return;
  const pid = Number(b.dataset.wb), f = b.dataset.f;
  if (f === 'wk-copy') {
    const pidW = pid, rows = [0, 1, 2, 3, 4, 5, 6];
    const src = { t: document.querySelector('input[data-wk="' + pidW + '"][data-i="0"][data-f="wk-time"]'), k: document.querySelector('input[data-wk="' + pidW + '"][data-i="0"][data-f="wk-kwh"]') };
    const target = b.dataset.v === 'all' ? rows.slice(1) : (b.dataset.v === 'work' ? [1, 2, 3, 4] : [5, 6]);
    target.forEach(i => {
      const t = document.querySelector('input[data-wk="' + pidW + '"][data-i="' + i + '"][data-f="wk-time"]');
      const k = document.querySelector('input[data-wk="' + pidW + '"][data-i="' + i + '"][data-f="wk-kwh"]');
      if (t && src.t) t.value = src.t.value; if (k && src.k) k.value = src.k.value;
    });
    wkMarkDirty(pidW); return;
  }
  if (f === 'wk-save') { wkSave(pid); return; }
  if (f === 'mode') {
    const v = b.dataset.v, aus = ['aus', 'off'].includes(b.textContent.trim().toLowerCase()); // Text kommt vom EMS (Partnermodul), dort je nach Sprache
    emsWbSend(pid, 'mode', v, aus ? tr('Set charging mode to “Off”? The EMS will then no longer charge this wallbox.') : null);
  } else if (f === 'kwh-dec' || f === 'kwh-inc') {
    const inp = wbInput(pid, 'kwh-in'); if (!inp) return;
    const st = Number(inp.step) || 0.5, mn = Number(inp.min), mx = Number(inp.max);
    inp.value = String(Math.max(mn, Math.min(mx, Math.round((Number(inp.value) + (f === 'kwh-inc' ? st : -st)) * 100) / 100)));
    wbMarkDirty(pid, 'kwh');
  } else if (f === 'kwh-q') {
    const inp = wbInput(pid, 'kwh-in'); if (!inp) return;
    inp.value = b.dataset.v; wbMarkDirty(pid, 'kwh');
  } else if (f === 'time-q') {
    const inp = wbInput(pid, 'time-in'); if (!inp) return;
    inp.value = b.dataset.v; wbMarkDirty(pid, 'time');
  } else if (f === 'kwh') {
    emsWbSend(pid, 'kwh', wbInput(pid, 'kwh-in').value, null);
  } else if (f === 'time') {
    emsWbSend(pid, 'time', wbInput(pid, 'time-in').value, null);
  } else if (f === 'command') {
    const jetzt = (b.dataset.v === '1');
    emsWbSend(pid, 'command', b.dataset.v, jetzt ? tr('Charge this wallbox for one hour now? This overrides the EMS plan.') : null);
  }
});

}

// Aktuelle/letzte Ladesitzung als Kartenreihe (05.10.2026). Alle Werte kommen
// aus der bereits berechneten Sitzungsliste (ChargingSessions()), die Zeiten
// sind deshalb aus der Ladeleistung abgeleitet, nicht aus dem Steckerstatus
// der Wallbox (den liefert nicht jede Wallbox mit Uhrzeit).
function renderCurrentSession(p) {
  const wrap = document.getElementById('curSessWrap');
  const s = p.sessions;
  if (!s || !s.list) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const grid = document.getElementById('curSessGrid');
  const two = n => ('0' + n).slice(-2);
  const hm = ts => { const d = new Date(ts * 1000); return two(d.getHours()) + ':' + two(d.getMinutes()); };
  const sameDay = ts => new Date(ts * 1000).toDateString() === new Date().toDateString();
  const when = ts => (sameDay(ts) ? '' : dateTxt(new Date(ts * 1000), tr('MM/DD'), true) + ' ') + hm(ts);
  const dur = sec => { const m = Math.max(0, Math.round(sec / 60)); return Math.floor(m / 60) + ':' + two(m % 60) + ' h'; };
  const x = s.list.length ? s.list[0] : null;
  const running = !!(x && x.ongoing);
  document.getElementById('curSessTitle').textContent = running ? tr('Current charging session') : tr('Last charging session');
  const card = (label, value, cls) => '<div class="hl-card' + (cls ? ' ' + cls : '') + '"><div class="hl-label">' + esc(label) + '</div><div class="hl-value">' + esc(value) + '</div></div>';
  let h = card(tr('Status'), running ? tr('Is charging') : tr('Not charging'), running ? 'cs-on' : '');
  // Echte Stecker-Zeiten (ChargerHub-Vertrag 1.7), sonst die aus der
  // Ladeleistung abgeleiteten Zeiten.
  const pi = p.plugInfo;
  const usePlug = !!(pi && pi.hasPlug);
  if (usePlug) {
    h += card(tr('Connected at'), pi.inAt ? when(pi.inAt) : '–');
    const stillIn = pi.inAt && (!pi.outAt || pi.outAt < pi.inAt);
    h += card(tr('Unplugged at'), stillIn ? tr('still plugged in') : (pi.outAt ? when(pi.outAt) : '–'));
  } else if (x) {
    h += card(tr('Start of charging'), when(x.start));
    h += card(tr('End of charging'), running ? tr('still running') : when(x.end));
  }
  if (pi && pi.chargeSec) {
    h += card(tr('Charging time'), dur(pi.chargeSec));
  } else if (x) {
    h += card(tr('Charging time'), dur(x.end - x.start));
  }
  if (x) {
    h += card(tr('Energy charged'), decStr(x.kwh.toFixed(1)) + ' kWh');
    const cost = x.costEur === null ? null : x.costEur + (x.batteryCostEur || 0);
    if (cost !== null) h += card(tr('Cost'), decStr(cost.toFixed(2)) + ' €');
  }
  h += card(tr('Charging power now'), fmtW(p.powerNow));
  const c = p.control;
  // Boost nur, wenn das Limit zum gemeldeten Bereich passt: liegt der Ist-Wert
  // ueber dem Maximum (z. B. andere Einheit/Skala im Partnermodul), wuerde
  // "Volle Leistung" das Limit eher absenken als anheben.
  if (c && c.instanceID && c.limitID && Number(c.limitValue) <= Number(c.maxCurrent)) {
    const atMax = !c.limitID || Number(c.limitValue) >= Number(c.maxCurrent);
    const on = !c.enableID || !!c.enableValue;
    const active = on && atMax;
    h += '<div class="hl-card"><div class="hl-label">' + tr('Boost') + '</div><div class="cs-boost"><button id="csBoost" class="ctlBtn' +
      (active ? ' cs-boost-active' : '') + '">⚡ ' + (active ? tr('Boost active') : tr('Full power')) + '</button></div></div>';
  }
  grid.innerHTML = h;
  const b = document.getElementById('csBoost');
  if (b) b.addEventListener('click', boostCharging);
  document.getElementById('curSessNote').textContent = (x || usePlug)
    ? (usePlug
        ? tr('Connected/unplugged from the change of the plug status (accuracy = read interval of the wallbox).')
        : tr('Times derived from the charging power (pauses of up to 30 minutes belong to the session), not from the plug status of the wallbox.')) +
      (c && c.limitID && Number(c.limitValue) <= Number(c.maxCurrent) ? ' ' + tr('“Full power” switches the charging enable on and sets the current limit to the maximum; go back with the current limit slider.') : '')
    : tr('No charging in the last 7 days.');
}

// Boost: Ladefreigabe an, Stromlimit auf das Geraetemaximum - nutzt dieselben
// Aktionen wie die Schalter weiter unten (wallboxAction), also auch dieselben
// Sperren (keine Bedienung bei fremder Regelhoheit).
function boostCharging() {
  const c = lastPayload && lastPayload.control;
  if (!c || !c.instanceID) return;
  const steps = [];
  if (c.enableID && !c.enableValue) steps.push(() => wallboxAction('setEnable', { active: '1' }));
  if (c.limitID && Number(c.limitValue) < Number(c.maxCurrent)) steps.push(() => wallboxAction('setCurrent', { amps: String(c.maxCurrent) }));
  steps.reduce((pr, f) => pr.then(f), Promise.resolve()).then(() => setTimeout(() => loadDay(''), 1500));
}

function renderSubMeters(p) {
  const wrap = document.getElementById('subMeterWrap');
  const sub = p.subMeters || [];
  if (!sub.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  let h = '<table>';
  sub.forEach(s => {
    h += '<tr><th>' + esc(s.label) + '</th><td class="v">' + esc(s.value) + '</td></tr>';
  });
  document.getElementById('subMeterT').innerHTML = h + '</table>';
}

function handleDetail(p) {
  lastPayload = p;
  if (!p || !p.ok) {
    document.getElementById('err').textContent = (p && p.error) || tr('Data could not be loaded.');
    document.getElementById('err').style.display = '';
    return;
  }
  document.getElementById('err').style.display = 'none';
  if (p.font) document.documentElement.style.setProperty('--font', p.font);
  if (p.bg) document.body.style.background = p.bg;
  document.title = p.label + ' — ' + tr('Device details');
  document.getElementById('title').textContent = (/^NRG-Stack\s+\S+\s+(.+)$/.exec(p.label || '') || [null, p.label])[1];
  document.getElementById('powerNow').textContent = fmtW(p.powerNow);
  document.getElementById('source').textContent = p.source || '';
  renderHighlights(p);
  renderWbInfo(p);
  renderCurrentSession(p);
  renderSessions(p);
  renderControl(p);
  renderSwitchControl(p);
  renderSubMeters(p);
  renderValues(p);
  renderPower(p);
  renderEnergy(p);
  document.getElementById('stamp').textContent = fmt(tr('As of: %s'), new Date(p.renderedAt * 1000).toLocaleTimeString(NUM_LOCALE));
}

// Stromlimit-Einordnung (31.08.2026, Dietmar: "bevor Du ein Stromlimit
// darstellst, solltest Du zuerst ueberpruefen welche Leistung die Wallbox
// kann") - min/maxCurrent kommen bereits vom Vertrag (echte Geraetegrenzen,
// kein geratener Default), die Prozentanzeige macht sie am Schieberegler
// selbst sichtbar, statt nur eine nackte Amperezahl zu zeigen.
function limitLabel(amps, max) {
  const pct = max > 0 ? Math.round((amps / max) * 100) : null;
  return amps + ' A' + (pct !== null ? ' (' + pct + ' %)' : '');
}
// Raster + Halbierungs-Kennung auf dem Schieberegler (Dietmar: "den
// Schieberegler bei 16A mit einer Kennung halbieren und auch mit einem
// Raster versehen") - <datalist> lässt den Browser native Tick-Striche
// zeichnen. Die Mitte (halbe Leistung, bei 6-32 A z.B. 16 A) wird IMMER
// als eigener Tick erzwungen, auch wenn sie nicht exakt auf das Raster
// faellt - Grenzen sind geraeteabhaengig (Vertrag), nicht fest verdrahtet.
function populateLimitTicks(min, max) {
  const dl = document.getElementById('ctlLimitTicks');
  dl.innerHTML = '';
  const span = max - min;
  const step = span <= 20 ? 2 : (span <= 40 ? 4 : 8);
  for (let v = min; v <= max; v += step) {
    const o = document.createElement('option');
    o.value = v;
    dl.appendChild(o);
  }
  const half = Math.round((min + max) / 2);
  if (![...dl.options].some(o => Number(o.value) === half)) {
    const o = document.createElement('option');
    o.value = half;
    o.label = tr('half power');
    dl.appendChild(o);
  }
}

// Wallbox-Steuerung (30.08.2026) - der iframe hat keinen direkten PHP-
// Rueckkanal, deshalb per fetch() auf denselben WebHook wie die restliche
// Detailseite (?wallboxAction=..., siehe ProcessHookData() in module.php).
// key+instanceId werden serverseitig gegeneinander geprueft (FindDeviceByKey()),
// ein Aufrufer kann also keine fremde Instanz unterschieben.
function renderControl(p) {
  const wrap = document.getElementById('controlWrap');
  const enableRow = document.getElementById('ctlEnableRow');
  const limitRow = document.getElementById('ctlLimitRow');
  const ocppRow = document.getElementById('ctlOcppRow');
  if (!p.control || !p.control.instanceID) {
    wrap.style.display = 'none';
    return;
  }
  const c = p.control;
  wrap.style.display = 'flex';

  enableRow.style.display = c.enableID ? 'flex' : 'none';
  if (c.enableID) {
    document.getElementById('ctlEnable').checked = !!c.enableValue;
  }

  limitRow.style.display = c.limitID ? 'flex' : 'none';
  if (c.limitID) {
    const range = document.getElementById('ctlLimit');
    range.min = c.minCurrent;
    range.max = c.maxCurrent;
    range.value = c.limitValue;
    populateLimitTicks(c.minCurrent, c.maxCurrent);
    document.getElementById('ctlLimitVal').textContent = limitLabel(c.limitValue, c.maxCurrent);
  }

  ocppRow.style.display = c.ocppActions ? 'flex' : 'none';

  const reasonEl = document.getElementById('ctlBlockReason');
  if (c.blockReason) {
    reasonEl.textContent = '⚠ ' + c.blockReason;
    reasonEl.style.display = '';
  } else {
    reasonEl.style.display = 'none';
  }
}

// Schaltgruppen (09.09.2026) - siehe Markup-Kommentar bei #switchWrap.
// stateValue (0 aus/1 teilweise/2 an) ist rein informativ, wenn KEINE
// eigene switchID vorliegt (Gruppen-Summe ohne eigenes schaltbares Ganzes,
// gleiche Unterscheidung wie am Knoten selbst) - dann keine Checkbox,
// sondern nur ein farbiger Statustext.
const SWITCH_STATE_TEXT = { 0: tr('off'), 1: tr('partially on'), 2: tr('on') };
const SWITCH_STATE_COLOR = { 0: '#9e9e9e', 1: '#c9a227', 2: '#43a047' };
function renderSwitchControl(p) {
  const wrap = document.getElementById('switchWrap');
  const row = document.getElementById('switchRow');
  const stateRow = document.getElementById('switchStateRow');
  if (!p.switchControl) {
    wrap.style.display = 'none';
    return;
  }
  const s = p.switchControl;
  wrap.style.display = 'flex';
  row.style.display = s.switchID ? 'flex' : 'none';
  if (s.switchID) {
    document.getElementById('ctlSwitch').checked = !!s.switchValue;
    document.getElementById('switchLabel').textContent = s.switchValue ? tr('On') : tr('Off');
  }
  if (!s.switchID && s.stateValue !== undefined && s.stateValue !== null) {
    stateRow.style.display = '';
    stateRow.textContent = 'Zustand: ' + (SWITCH_STATE_TEXT[s.stateValue] || '–');
    stateRow.style.color = SWITCH_STATE_COLOR[s.stateValue] || '';
  } else {
    stateRow.style.display = 'none';
  }
}
function setSwitchStatus(text, kind) {
  const el = document.getElementById('switchStatus');
  el.textContent = text;
  el.className = kind || '';
}
function switchAction(on) {
  if (!lastPayload || !lastPayload.switchControl || !lastPayload.switchControl.switchID) return;
  const u = new URL(window.location.href);
  u.search = '';
  u.searchParams.set('switchAction', '1');
  u.searchParams.set('key', lastPayload.key);
  u.searchParams.set('value', on ? '1' : '0');
  setSwitchStatus(tr('Sending command …'), 'pending');
  fetch(u.toString()).then(r => r.json()).then(res => {
    if (!res || !res.ok) {
      setSwitchStatus((res && res.error) || tr('Action failed.'), 'err');
      return;
    }
    document.getElementById('switchLabel').textContent = on ? tr('On') : tr('Off');
    setSwitchStatus(tr('Command sent ✓'), 'ok');
    setTimeout(() => document.getElementById('switchStatus').classList.add('fade'), 3000);
  }).catch(() => setSwitchStatus(tr('Action failed (no connection).'), 'err'));
}
document.getElementById('ctlSwitch').addEventListener('change', (e) => { switchAction(e.target.checked); });

// Rueckmeldung (31.08.2026, Dietmar: "das ueberhaupt keine Rueckmeldungen
// kommen ist echt schlecht") - unser eigener Request meldet nur, dass der
// PHP-Aufruf durchging (ok:true), nicht ob die Wallbox den Befehl real
// angenommen hat (siehe go-e-Rejected-Fall, den OCPPHub erst per Debug-Dump
// fand). Deshalb bei Start/Stop/Override zusaetzlich kurz danach den echten
// Leistungswert nachladen (loadDay()) statt uns auf das stumme ok:true zu
// verlassen - der Statustext bleibt bis zur naechsten Aktion sichtbar,
// solange sie noch nicht sichtbar gewirkt hat.
function setCtlStatus(text, kind) {
  const el = document.getElementById('ctlStatus');
  el.textContent = text;
  el.className = kind || '';
}
function wallboxAction(action, extra) {
  if (!lastPayload || !lastPayload.control) return;
  const u = new URL(window.location.href);
  u.search = '';
  u.searchParams.set('wallboxAction', action);
  u.searchParams.set('key', lastPayload.key);
  u.searchParams.set('instanceId', lastPayload.control.instanceID);
  if (extra) { Object.keys(extra).forEach(k => u.searchParams.set(k, extra[k])); }
  setCtlStatus(tr('Sending command …'), 'pending');
  return fetch(u.toString()).then(r => r.json()).then(res => {
    if (!res || !res.ok) {
      setCtlStatus((res && res.error) || tr('Action failed.'), 'err');
      return res;
    }
    if (action === 'start' || action === 'stop') {
      setCtlStatus(tr('Command sent, checking wallbox …'), 'pending');
      setTimeout(() => {
        loadDay('');
        setTimeout(() => {
          const stillZero = action === 'start' && lastPayload && !lastPayload.powerNow;
          if (stillZero) {
            // blockReason (frisch nachgeladen via loadDay()->renderControl())
            // ist die vom Anbieter gelieferte echte Ablehnungsursache - die
            // steht bereits prominent in #ctlBlockReason, hier nur kurz
            // darauf verweisen statt sie zu duplizieren.
            const reason = lastPayload && lastPayload.control && lastPayload.control.blockReason;
            setCtlStatus(reason ? fmt(tr('Rejected: %s'), reason) : tr('Command sent, but the wallbox is not charging yet - possibly rejected (see the system log of the partner module).'), 'err');
          } else {
            setCtlStatus(tr('Command accepted ✓'), 'ok');
            setTimeout(() => document.getElementById('ctlStatus').classList.add('fade'), 3000);
          }
        }, 300);
      }, 4000);
    } else {
      setCtlStatus(tr('Command sent ✓'), 'ok');
      setTimeout(() => document.getElementById('ctlStatus').classList.add('fade'), 3000);
    }
    return res;
  }).catch(() => setCtlStatus(tr('Action failed (no connection).'), 'err'));
}

document.getElementById('ctlEnable').addEventListener('change', (e) => {
  wallboxAction('setEnable', { active: e.target.checked ? '1' : '0' });
});
document.getElementById('ctlLimit').addEventListener('input', (e) => {
  document.getElementById('ctlLimitVal').textContent = limitLabel(Number(e.target.value), Number(e.target.max));
});
document.getElementById('ctlLimit').addEventListener('change', (e) => {
  wallboxAction('setCurrent', { amps: e.target.value });
});
document.getElementById('ctlStart').addEventListener('click', () => wallboxAction('start'));
document.getElementById('ctlStop').addEventListener('click', () => wallboxAction('stop'));
document.getElementById('ctlOverride').addEventListener('click', () => {
  const btn = document.getElementById('ctlOverride');
  const nowActive = btn.classList.toggle('active');
  wallboxAction('override', { active: nowActive ? '1' : '0' });
});

function loadDay(dayStr) {
  const u = new URL(window.location.href);
  if (dayStr) u.searchParams.set('day', dayStr); else u.searchParams.delete('day');
  u.searchParams.set('json', '1');
  fetch(u.toString()).then(r => r.json()).then(handleDetail).catch(() => {});
}
function shiftDay(delta) {
  if (!lastPayload || !lastPayload.day) return;
  // DST-Regel: Date-Feldmutation statt ±86400000.
  const d = new Date(lastPayload.day + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  loadDay(s);
}
// Schliessen: laeuft die Seite im Overlay-<iframe> der Kachel (Regelfall,
// 28.08.2026), meldet sich die Seite per postMessage beim Elternfenster ab
// - das spielt dort die Einsaug-Animation rueckwaerts ab. Bei einem echten
// eigenen Tab/Fenster (Direktaufruf der Hook-URL, z.B. IPSView-Popup oder
// Lesezeichen - kein iframe-Parent) faellt der Klick auf window.close()
// zurueck; ohne Skript-Opener bleibt er dann wirkungslos, ein bewusster
// Normalfall.
function closeOrCloseTab() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('nrgdash-detail-close', window.location.origin);
  } else {
    window.close();
  }
}
document.getElementById('closeBtn').onclick = closeOrCloseTab;
// Escape schliesst auch dann, wenn der Fokus (z.B. nach einem Klick ins
// Diagramm) im iframe liegt - ein Escape-Listener am Elternfenster wuerde
// hier NICHT feuern, da Tastaturereignisse bei iframe-Fokus nicht zum
// Elterndokument durchgereicht werden.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOrCloseTab(); });
document.getElementById('prevDay').onclick = () => shiftDay(-1);
document.getElementById('nextDay').onclick = () => shiftDay(1);
document.getElementById('todayBtn').onclick = () => loadDay('');
window.addEventListener('resize', () => {
  if (powerChart) powerChart.resize();
  if (energyChart) energyChart.resize();
});
// Auto-Aktualisierung alle 30 s - nur solange der heutige Tag angezeigt
// wird (historische Tage aendern sich nicht mehr).
setInterval(() => { if (lastPayload && lastPayload.ok && lastPayload.isToday) loadDay(''); }, 30000);
